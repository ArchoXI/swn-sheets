nhabitants away or killed them off. The colony might have been mercantile in nature, an expedition to extract valuable local resources, or it might have been a reclusive cabal of zealots. The remains of the colony are usually in ruins, and might still be dangerous from the aftermath of whatever destroyed it in the first place.", "E": "Crazed survivors, Ruthless plunderers of the ruins, Automated defense system", "F": "Inquisitive stellar archaeologist, Heir to the colony’s property, Local wanting the place cleaned out and made safe", "C": "The local government wants the ruins to remain a secret, The locals claim ownership of it, The colony is crumbling and dangerous to navigate", "T": "Long-lost property deeds, Relic stolen by the colonists when they left, Historical record of the colonization attempt", "P": "Decaying habitation block, Vine-covered town square, Structure buried by an ancient landslide"}, {"n": 2, "name": "Alien Ruins", "desc": "The world has significant alien ruins present. The locals may or may not permit others to investigate the ruins, and may make it difficult to remove any objects of value without substantial payment. Any surviving ruins with worthwhile salvage almost certainly have some defense or hazard to explain their unplundered state.", "E": "Customs inspector, Worshipper of the ruins, Hidden alien survivor", "F": "Curious scholar, Avaricious local resident, Interstellar smuggler", "C": "Traps in the ruins, Remote location, Paranoid customs officials", "T": "Precious alien artifacts, Objects left with the remains of a prior unsuccessful expedition, Untranslated alien texts, Untouched hidden ruins", "P": "Undersea ruin, Orbital ruin, Perfectly preserved alien building, Alien mausoleum"}, {"n": 3, "name": "Altered Humanity", "desc": "The humans on this world are visibly and drastically different from normal humanity. They may have additional limbs, new sensory organs, or other significant changes. Were these from ancestral eugenic manipulation, strange stellar mutations, or from an environmental toxin unique to this world?", "E": "Biochauvinist local, Local experimenter, Mentally unstable mutant", "F": "Local seeking a “cure”, Curious xenophiliac, Anthropological researcher", "C": "Alteration is contagious, Alteration is necessary for long-term survival, Locals fear and mistrust non-local humans", "T": "Original pretech mutagenic equipment, Valuable biological byproduct from the mutants, “Cure” for the altered genes, Record of the original colonial genotypes", "P": "Abandoned eugenics laboratory, An environment requiring the mutation for survival, A sacred site where the first local was transformed"}, {"n": 4, "name": "Anarchists", "desc": "Rather than being an incidental anarchy of struggling tribes and warring factions, this world actually has a functional society with no centralized authority. Authority might be hyper-localized to extended families, specific religious parishes, or voluntary associations. Some force is preventing an outside group or internal malcontents from coalescing into a power capable of imposing its rule on the locals; this force might be an ancient pretech defense system, a benevolent military AI, or the sheer obscurity and isolation of the culture.", "E": "Offworlder imperialist, Reformer seeking to impose “good government”, Exploiter taking advantage of the lack of centralized resistance", "F": "Proud missionary for anarchy, Casual local free spirit, Curious offworlder political scientist", "C": "The anarchistic structure is compelled by an external power, The anarchy is enabled by currently abundant resources, The protecting force that shelters the anarchy is waning", "T": "A macguffin that would let the possessor enforce their rule on others, A vital resource needed to preserve general liberty, Tech forbidden as disruptive to the social order", "P": "Community of similar-sized homes, Isolated clan homestead, Automated mining site"}, {"n": 5, "name": "Anthropomorphs", "desc": "The locals were originally human, but at some point became anthropomorphic, either as an ancient furry colony, a group of animal-worshiping sectarians, or gengineers who just happened to find animal elements most convenient for surviving on the world. Depending on the skill of the original gengineers, their feral forms may or may not work as well as their original human bodies, or may come with drawbacks inherited from their animal elements.", "E": "Anthro-supremacist local, Native driven by feral urges, Outside exploiter who sees the locals as subhuman creatures", "F": "Fascinated genetic researcher, Diplomat trained to deal with normals, Local needing outside help", "C": "The locals consider their shapes a curse from their foolish ancestors, Society is ordered according to animal forms, The locals view normal humans as repulsive or inferior", "T": "Pretech gengineering tech, A “cure” that may not be wanted, Sacred feral totem", "P": "Shrine to a feral deity, Nature preserve suited to an animal type, Living site built to take advantage of animal traits"}, {"n": 6, "name": "Area 51", "desc": "The world’s government is fully aware of their local stellar neighbors, but the common populace has no idea about it- and the government means to keep it that way. Trade with government officials in remote locations is possible, but any attempt to clue the commoners in on the truth will be met with lethal reprisals.", "E": "Suspicious government minder, Free merchant who likes his local monopoly, Local who wants a specimen for dissection", "F": "Crusading offworld investigator, Conspiracy-theorist local, Idealistic government reformer", "C": "The government has a good reason to keep the truth concealed, The government ruthlessly oppresses the natives, The government is actually composed of offworlders", "T": "Elaborate spy devices, Memory erasure tech, Possessions of the last offworlder who decided to spread the truth", "P": "Desert airfield, Deep subterranean bunker, Hidden mountain valley"}, {"n": 7, "name": "Badlands World", "desc": "Whatever the original climate and atmosphere type, something horrible happened to this world. Biological, chemical, or nanotechnical weaponry has reduced it to a wretched hellscape. Some local life might still be able to survive on its blasted surface, usually at some dire cost in health or humanity.", "E": "Mutated badlands fauna, Desperate local, Badlands raider chief", "F": "Native desperately wishing to escape the world, Scientist researching ecological repair methods, Ruin scavenger", "C": "Radioactivity, Bioweapon traces, Broken terrain, Sudden local plague", "T": "Maltech research core, Functional pretech weaponry, An uncontaminated well", "P": "Untouched oasis, Ruined city, Salt flat"}, {"n": 8, "name": "Battleground", "desc": "The world is a battleground for two or more outside powers. They may be interstellar rivals, or groups operating out of orbitals or other system bodies. Something about the planet is valuable enough for them to fight over, but the natives are too weak to be anything but animate obstacles to the fight.", "E": "Ruthless military commander, Looter pack chieftain, Traitorous collaborator", "F": "Native desperately seeking protection, Pragmatic military officer, Hapless war orphan", "C": "The war just ended as both sides are leaving, The natives somehow brought this on themselves, A small group of natives profit tremendously from the fighting", "T": "A cache of the resource the invaders seek, Abandoned prototype military gear, Precious spy intelligence lost by someone", "P": "Artillery-pocked wasteland, Reeking refugee camp, Burnt-out shell of a city"}, {"n": 9, "name": "Beastmasters", "desc": "The natives have extremely close bonds with the local fauna, possibly having special means of communication and control through tech or gengineering. Local animal life plays a major role in their society, industry, or warfare, and new kinds of beasts may be bred to suit their purposes.", "E": "Half-feral warlord of a beast swarm, Coldly inhuman scientist, Altered beast with human intellect and furious malice", "F": "Native bonded with an adorable animal, Herder of very useful beasts, Animal-revering mystic", "C": "The “animals” are very heavily gengineered humans, The animals actually run the society, The animals have the same rights as humans", "T": "Tech used to alter animal life, A plague vial that could wipe out the animals, A pretech device that can perform a wonder if operated by a beast", "P": "Park designed as a comfortable home for beasts, Public plaza designed to accommodate animal companions, Factory full of animal workers"}, {"n": 10, "name": "Bubble Cities", "desc": "Whether due to a lack of atmosphere or an uninhabitable climate, the world’s cities exist within domes or pressurized buildings. In such sealed environments, techniques of surveillance and control can grow baroque and extreme.", "E": "Native dreading outsider contamination, Saboteur from another bubble city, Local official hostile to outsider ignorance of laws", "F": "Local rebel against the city officials, Maintenance chief in need of help, Surveyor seeking new building sites", "C": "Bubble rupture, Failing atmosphere reprocessor, Native revolt against officials, All-seeing surveillance cameras", "T": "Pretech habitat technology, Valuable industrial products, Master key codes to a city’s security system", "P": "City power core, Surface of the bubble, Hydroponics complex, Warren-like hab block"}, {"n": 11, "name": "Cheap Life", "desc": "Human life is near-worthless on this world. Ubiquitous cloning, local conditions that ensure early death, a culture that reveres murder, or a social structure that utterly discounts the value of most human lives ensures that death is the likely outcome for any action that irritates someone consequential.", "E": "Master assassin, Bloody-handed judge, Overseer of disposable clones", "F": "Endearing local whose life the PCs accidentally bought, Escapee from death seeking outside help, Reformer trying to change local mores", "C": "Radiation or local diseases ensure all locals die before twenty-five years of age, Tech ensures that death is just an annoyance, Locals are totally convinced of a blissful afterlife", "T": "Device that revives or re-embodies the dead, Maltech engine fueled by human life, Priceless treasure held by a now-dead owner", "P": "Thronging execution ground, extremely cursory cemetery, Factory full of lethal dangers that could be corrected easily"}, {"n": 12, "name": "Civil War", "desc": "The world is currently torn between at least two opposing factions, all of which claim legitimacy. The war may be the result of a successful rebel uprising against tyranny, or it might just be the result of schemers who plan to be the new masters once the revolution is complete.", "E": "Faction commissar, Angry native, Conspiracy theorist who blames offworlders for the war, Deserter looking out for himself, Guerrilla bandit chieftain", "F": "Faction loyalist seeking aid, Native caught in the crossfire, Offworlder seeking passage off the planet", "C": "The front rolls over the group, Famine strikes, Bandit infestations are in the way", "T": "Ammo dump, Military cache, Treasure buried for after the war, Secret war plans", "P": "Battle front, Bombed-out town, Rear-area red light zone, Propaganda broadcast tower"}, {"n": 13, "name": "Cold War", "desc": "Two or more great powers control the planet, and they have a hostility to each other that’s just barely less than open warfare. The hostility might be ideological in nature, or it might revolve around control of some local resource.", "E": "Suspicious chief of intelligence, Native who thinks the outworlders are with the other side, Femme fatale", "F": "Apolitical information broker, Spy for the other side, Unjustly accused innocent, “He’s a bastard, but he’s our bastard” official", "C": "Police sweep, Low-level skirmishing, “Red scare”", "T": "List of traitors in government, secret military plans, Huge cache of weapons built up in preparation for war", "P": "Seedy bar in a neutral area, Political rally, Isolated area where fighting is underway"}, {"n": 14, "name": "Colonized Population", "desc": "A neighboring world has successfully colonized this less-advanced or less-organized planet, and the natives aren’t happy about it. A puppet government may exist, but all real decisions are made by the local viceroy.", "E": "Suspicious security personnel, Offworlder-hating natives, Local crime boss preying on rich offworlders", "F": "Native resistance leader, Colonial official seeking help, Native caught between the two sides", "C": "Natives won’t talk to offworlders, Colonial repression, Misunderstood local customs", "T": "Relic of the resistance movement, List of collaborators, Precious substance extracted by colonial labor", "P": "Deep wilderness resistance camp, City district off-limits to natives, Colonial labor site"}, {"n": 15, "name": "Cultural Power", "desc": "The world is a considerable cultural power in the sector, producing music, art, philosophy, or some similar intangible that their neighbors find irresistibly attractive. Other worlds might have a profound degree of cultural cachet as the inheritor of some venerable artistic tradition.", "E": "Murderously eccentric artist, Crazed fan, Failed artist with an obsessive grudge, Critic with a crusade to enact", "F": "Struggling young artist, Pupil of the artistic tradition, Scholar of the art, Offworlder hating the source of corrupting alien ways", "C": "The art is slowly lethal to its masters, The art is mentally or physically addictive, The art is a fragment of ancient technical or military science", "T": "The instrument of a legendary master, The only copy of a dead master’s opus, Proof of intellectual property ownership", "P": "Recording or performance studio, Public festival choked with tourists, Monument to a dead master of the art"}, {"n": 16, "name": "Cybercommunists", "desc": "On this world communism actually works, thanks to pretech computing devices and greater or lesser amounts of psychic precognition. Central planning nodes direct all production and employment on the world. Citizens in good standing have access to ample amounts of material goods for all needs and many wants. Instead of strife over wealth, conflicts erupt over political controls, cultural precepts, or control over the planning nodes. Many cybercommunist worlds show a considerable bias toward the private interests of those who run the planning nodes.", "E": "Embittered rebel against perceived unfairness, Offworlder saboteur, Aspiring Stalin-figure", "F": "Idealistic planning node tech, Cynical anti-corruption cop, Precognitive economist", "C": "The pretech planning computers are breaking down, The planning only works because the locals have been mentally or physically altered, The planning computers can’t handle the increasing population within the system", "T": "Planning node computer, Wildly destabilizing commodity that can’t be factored into plans, A tremendous store of valuables made by accident", "P": "Humming factory, Apartment block of perfectly equal flats, Mass demonstration of unity"}, {"n": 17, "name": "Cyborgs", "desc": "The planet’s population makes heavy use of cybernetics, with many of the inhabitants possessing at least a cosmetic amount of chrome. This may be the result of a strong local cyber tech base, a religious injunction, or simply a necessary measure to survive the local conditions.", "E": "Ambitious hacker of cyber implants, Cybertech oligarch, Researcher craving fresh offworlders, Cybered-up gang boss", "F": "Charity-working implant physician, Idealistic young cyber researcher, Avant-garde activist", "C": "The powerful and dangerous come here often for cutting-edge implants, The cyber has some universal negative side-effect, Cyber and those implanted with it are forbidden to leave the planet as a tech security measure", "T": "Unique prototype cyber implant, Secret research files, A virus that debilitates cyborgs, A cache of critically-needed therapeutic cyber", "P": "Grimy slum chop-shop, Bloody lair of implant rippers, Stark plaza where everyone is seeing things through their augmented-reality cyber"}, {"n": 18, "name": "Cyclical Doom", "desc": "The world regularly suffers some apocalyptic catastrophe that wipes out organized civilization on it. The local culture is aware of this cycle and has traditions to ensure a fragment of civilization survives into the next era, but these traditions don’t always work properly, and sometimes dangerous fragments of the past emerge.", "E": "Offworlder seeking to trigger the apocalypse early for profit, Local recklessly taking advantage of preparation stores, Demagogue claiming the cycle is merely a myth of the authorities", "F": "Harried official working to prepare, Offworlder studying the cycles, Local threatened by perils of the cycle’s initial stages", "C": "The cycles really are a myth of the authorities, The cycles are controlled by alien constructs, An outside power is interfering with preparation", "T": "A lost cache of ancient treasures, Tech or archives that will pinpoint the cycle’s timing, Keycodes to bypass an ancient vault’s security", "P": "Lethally-defended vault of forgotten secrets, Starport crowded with panicked refugees, Town existing in the shadow of some monstrous monument to a former upheaval"}, {"n": 19, "name": "Desert World", "desc": "The world may have a breathable atmosphere and a human-tolerable temperature range, but it is an arid, stony waste outside of a few places made habitable by human effort. The deep wastes are largely unexplored and inhabited by outcasts and worse.", "E": "Raider chieftain, Crazed hermit, Angry isolationists, Paranoid mineral prospector, Strange desert beast", "F": "Native guide, Research biologist, Aspiring terraformer", "C": "Sandstorms, Water supply failure, Native warfare over water rights", "T": "Enormous water reservoir, Map of hidden wells, Pretech rainmaking equipment", "P": "Oasis, “The Empty Quarter” of the desert, Hidden underground cistern"}, {"n": 20, "name": "Doomed World", "desc": "The world is doomed, and the locals may or may not know it. Some cosmic catastrophe looms before them, and the locals have no realistic way to get everyone to safety. To the extent that the public is aware, society is disintegrating into a combination of religious fervor, abject hedonism, and savage violence.", "E": "Crazed prophet of a false salvation, Ruthless leader seeking to flee with their treasures, Cynical ship captain selling a one-way trip into hard vacuum as escape to another world", "F": "Appealing waif or family head seeking escape, Offworld relief coordinator, Harried law officer", "C": "The doom is false or won’t actually kill everyone, The doom was intentionally triggered by someone, Mass escape is possible if warring groups can somehow be brought to cooperate", "T": "Clearance for a ship to leave the planet, A cache of priceless cultural artifacts, The life savings of someone trying to buy passage out, Data that would prove to the public the end is nigh", "P": "Open square beneath a sky angry with a foretaste of th impending ruin, Orgiastic celebration involving sex and murder in equal parts, Holy site full of desperate petitioners to the divine"}, {"n": 21, "name": "Dying Race", "desc": "The inhabitants of this world are dying out, and they know it. Through environmental toxins, hostile bio-weapons, or sheer societal despair, the culture cannot replenish its numbers. Members seek meaning in their own strange goals or peculiar faiths, though a few might struggle to find some way to reverse their slow yet inevitable doom.", "E": "Hostile outsider who wants the locals dead, Offworlder seeking to take advantage of their weakened state, Invaders eager to push the locals out of their former lands", "F": "One of the few youth among the population, Determined and hopeful reformer, Researcher seeking a new method of reproduction", "C": "The dying culture’s values were monstrous, The race’s death is somehow necessary to prevent some grand catastrophe, The race is somehow convinced they deserve this fate", "T": "Extremely valuable reproductive tech, Treasured artifacts of the former age, Bioweapon used on the race", "P": "City streets devoid of pedestrians, Mighty edifice now crumbling with disrepair, Small dwelling full of people in a town now otherwise empty"}, {"n": 22, "name": "Eugenic Cult", "desc": "Even in the days before the Silence, major improvement of the human genome always seemed to come with unacceptable side-effects. Some worlds host secret cults that perpetuate these improvements regardless of the cost, and a few planets have been taken over entirely by the cults.", "E": "Eugenic superiority fanatic, Mentally unstable homo superior, Mad eugenic scientist", "F": "Eugenic propagandist, Biotechnical investigator, Local seeking revenge on cult", "C": "The altered cultists look human, The locals are terrified of any unusual physical appearance, The genetic modifications- and drawbacks- are contagious with long exposure", "T": "Serum that induces the alteration, Elixir that reverses the alteration, Pretech biotechnical databanks, List of secret cult sympathizers", "P": "Eugenic breeding pit, Isolated settlement of altered humans, Public place infiltrated by cult sympathizers"}, {"n": 23, "name": "Exchange Consulate", "desc": "The Exchange of Light once served as the largest, most trusted banking and diplomatic service in human space. Even after the Silence, some worlds retain a functioning Exchange Consulate where banking services and arbitration can be arranged.", "E": "Corrupt Exchange official, Indebted native who thinks the players are Exchange agents, Exchange official dunning the players for debts incurred", "F": "Consul in need of offworld help, Local banker seeking to hurt his competition, Exchange diplomat", "C": "The local Consulate has been corrupted, the Consulate is cut off from its funds, A powerful debtor refuses to pay", "T": "Exchange vault codes, Wealth hidden to conceal it from a bankruptcy judgment, Location of forgotten vault", "P": "Consulate meeting chamber, Meeting site between fractious disputants, Exchange vault"}, {"n": 24, "name": "Fallen Hegemon", "desc": "At some point in the past, this world was a hegemonic power over some or all of the sector, thanks to superior tech, expert diplomacy, the weakness of their neighbors, or inherited Mandate legitimacy. Some kind of crash or revolt broke their power, however, and now the world is littered with the wreckage of former glory.", "E": "Bitter pretender to a meaningless throne, Resentful official dreaming of empire, Vengeful offworlder seeking to punish their old rulers", "F": "Realistic local leader trying to hold things together, Scholar of past glories, Refugee from an overthrown colonial enclave", "C": "The hegemon’s rule was enlightened and fair, It collapsed due to its own internal strife rather than external resistance, It pretends that nothing has happened to its power, It’s been counter-colonized by vengeful outsiders", "T": "Precious insignia of former rule, Relic tech important to its power, Plundered colonial artifact", "P": "Palace far too grand for its current occupant, Oversized spaceport now in disrepair, Boulevard lined with monuments to past glories"}, {"n": 25, "name": "Feral World", "desc": "In the long, isolated night of the Silence, some worlds have experienced total moral and cultural collapse. Whatever remains has been twisted beyond recognition into assorted death cults, xenophobic fanaticism, horrific cultural practices, or other behavior unacceptable on more enlightened worlds. These worlds are almost invariably quarantined by other planets.", "E": "Decadent noble, Mad cultist, Xenophobic local, Cannibal chief, Maltech researcher", "F": "Trapped outworlder, Aspiring reformer, Native wanting to avoid traditional flensing", "C": "Horrific local “celebration”, Inexplicable and repugnant social rules, Taboo zones and people", "T": "Terribly misused piece of pretech, Wealth accumulated through brutal evildoing, Valuable possession owned by luckless outworlder victim", "P": "Atrocity amphitheater, Traditional torture parlor, Ordinary location twisted into something terrible."}, {"n": 26, "name": "Flying Cities", "desc": "Perhaps the world is a gas giant, or plagued with unendurable storms at lower levels of the atmosphere. For whatever reason, the cities of this world fly above the surface of the planet. Perhaps they remain stationary, or perhaps they move from point to point in search of resources.", "E": "Rival city pilot, Tech thief attempting to steal outworld gear, Saboteur or scavenger plundering the city’s tech", "F": "Maintenance tech in need of help, City defense force pilot, Meteorological researcher", "C": "Sudden storms, Drastic altitude loss, Rival city attacks, Vital machinery breaks down", "T": "Precious refined atmospheric gases, Pretech grav engine plans, Meteorological codex predicting future storms", "P": "Underside of the city, The one calm place on the planet’s surface, Catwalks stretching over unimaginable gulfs below."}, {"n": 27, "name": "Forbidden Tech", "desc": "Some group on this planet fabricates or uses maltech. Unbraked AIs doomed to metastasize into insanity, nation-destroying nanowarfare particles, slow-burn DNA corruptives, genetically engineered slaves, or something worse still. The planet’s larger population may or may not be aware of the danger in their midst.", "E": "Mad scientist, Maltech buyer from offworld, Security enforcer", "F": "Victim of maltech, Perimeter agent, Investigative reporter, Conventional arms merchant", "C": "The maltech is being fabricated by an unbraked AI, The government depends on revenue from maltech sales to offworlders, Citizens insist that it’s not really maltech", "T": "Maltech research data, The maltech itself, Precious pretech equipment used to create it", "P": "Horrific laboratory, Hellscape sculpted by the maltech’s use, Government building meeting room"}, {"n": 28, "name": "Former Warriors", "desc": "The locals of this world were once famed for their martial prowess. They may have simply had a very militaristic culture, or were genetically engineered for combat, or developed high-tech weaponry, or had brilliant leadership. Those days are past, however, either due to crushing defeat, external restrictions, or a cultural turn toward peace.", "E": "Unreformed warlord leader, Bitter mercenary chief, Victim of their warfare seeking revenge", "F": "Partisan of the new peaceful ways, Outsider desperate for military aid, Martial genius repressed by the new dispensation", "C": "Neighboring worlds want them pacified or dead, They only ever used their arts in self-defense, The source of their gifts has been “turned off” in a reversible way", "T": "War trophy taken from a defeated foe, Key to re-activating their martial ways, Secret cache of high-tech military gear", "P": "Cemetery of dead heroes, Memorial hall now left to dust and silence, Monument plaza dedicated to the new culture"}, {"n": 29, "name": "Freak Geology", "desc": "The geology or geography of this world is simply freakish. Perhaps it’s composed entirely of enormous mountain ranges, or regular bands of land and sea, or the mineral structures all fragment into perfect cubes. The locals have learned to deal with it and their culture will be shaped by its requirements.", "E": "Crank xenogeologist, Cultist who believes it the work of aliens", "F": "Research scientist, Prospector, Artist", "C": "Local conditions that no one remembers to tell outworlders about, Lethal weather, Seismic activity", "T": "Unique crystal formations, Hidden veins of a major precious mineral strike, Deed to a location of great natural beauty", "P": "Atop a bizarre geological formation, Tourist resort catering to offworlders"}, {"n": 30, "name": "Freak Weather", "desc": "The planet is plagued with some sort of bizarre or hazardous weather pattern. Perhaps city-flattening storms regularly scourge the surface, or the world’s sun never pierces its thick banks of clouds.", "E": "Criminal using the weather as a cover, Weather cultists convinced the offworlders are responsible for some disaster, Native predators dependent on the weather", "F": "Meteorological researcher, Holodoc crew wanting shots of the weather", "C": "The weather itself, Malfunctioning pretech terraforming engines that cause the weather", "T": "Wind-scoured deposits of precious minerals, Holorecords of a spectacularly and rare weather pattern, Naturally-sculpted objects of intricate beauty", "P": "Eye of the storm, The one sunlit place, Terraforming control room"}, {"n": 31, "name": "Friendly Foe", "desc": "Some hostile alien race or malevolent cabal has a branch or sect on this world that is actually quite friendly toward outsiders. For whatever internal reason, they are willing to negotiate and deal honestly with strangers, and appear to lack the worst impulses of their fellows.", "E": "Driven hater of all their kind, Internal malcontent bent on creating conflict, Secret master who seeks to lure trust", "F": "Well-meaning bug-eyed monster, Principled eugenics cultist, Suspicious investigator", "C": "The group actually is as harmless and benevolent as they seem, The group offers a vital service at the cost of moral compromise, The group still feels bonds of affiliation with their hostile brethren", "T": "Forbidden xenotech, Eugenic biotech template, Evidence to convince others of their kind that they are right", "P": "Repurposed maltech laboratory, Alien conclave building, Widely-feared starship interior"}, {"n": 32, "name": "Gold Rush", "desc": "Gold, silver, and other conventional precious minerals are common and cheap now that asteroid mining is practical for most worlds. But some minerals and compounds remain precious and rare, and this world has recently been discovered to have a supply of them. People from across the sector have come to strike it rich.", "E": "Paranoid prospector, Aspiring mining tycoon, Rapacious merchant", "F": "Claim-jumped miner, Native alien, Curious tourist", "C": "The strike is a hoax, The strike is of a dangerous toxic substance, Export of the mineral is prohibited by the planetary government, The native aliens live around the strike’s location", "T": "Cases of the refined element, Pretech mining equipment, A dead prospector’s claim deed", "P": "Secret mine, Native alien village, Processing plant, Boom town"}, {"n": 33, "name": "Great Work", "desc": "The locals are obsessed with completing a massive project, one that has consumed them for generations. It might be the completion of a functioning spaceyard, a massive solar power array, a network of terraforming engines, or the universal conversion of their neighbors to their own faith. The purpose of their entire civilization is to progress and some day complete the work.", "E": "Local planning to sacrifice the PCs for the work, Local who thinks the PCs threaten the work, Obsessive zealot ready to destroy someone or something important to the PCs for the sake of the work", "F": "Outsider studying the work, Local with a more temperate attitude, Supplier of work materials", "C": "The work is totally hopeless, Different factions disagree on what the work is, An outside power is determined to thwart the work", "T": "Vital supplies for the work, Plans that have been lost, Tech that greatly speeds the work", "P": "A bustling work site, Ancestral worker housing, Local community made only semi-livable by the demands of the work"}, {"n": 34, "name": "Hatred", "desc": "For whatever reason, this world’s populace has a burning hatred for the inhabitants of a neighboring system. Perhaps this world was colonized by exiles, or there was a recent interstellar war, or ideas of racial or religious superiority have fanned the hatred. Regardless of the cause, the locals view their neighbor and any sympathizers with loathing.", "E": "Native convinced that the offworlders are agents of Them, Cynical politician in need of scapegoats", "F": "Intelligence agent needing catspaws, Holodoc producers needing “an inside look”, Unlucky offworlder from the hated system", "C": "The characters are wearing or using items from the hated world, The characters are known to have done business there, The characters “look like” the hated others", "T": "Proof of Their evildoing, Reward for turning in enemy agents, Relic stolen by Them years ago", "P": "War crimes museum, Atrocity site, Captured and decommissioned spaceship kept as a trophy"}, {"n": 35, "name": "Heavy Industry", "desc": "With interstellar transport so limited in the bulk it can move, worlds have to be largely self-sufficient in industry. Some worlds are more sufficient than others, however, and this planet has a thriving manufacturing sector capable of producing large amounts of goods appropriate to its tech level. The locals may enjoy a correspondingly higher lifestyle, or the products might be devoted towards vast projects for the aggrandizement of the rulers.", "E": "Tycoon monopolist, Industrial spy, Malcontent revolutionary", "F": "Aspiring entrepreneur, Worker union leader, Ambitious inventor", "C": "The factories are toxic, The resources extractable at their tech level are running out, The masses require the factory output for survival, The industries’ major output is being obsoleted by offworld tech", "T": "Confidential industrial data, Secret union membership lists, Ownership shares in an industrial complex", "P": "Factory floor, Union meeting hall, Toxic waste dump, R&D complex"}, {"n": 36, "name": "Heavy Mining", "desc": "This world has large stocks of valuable minerals, usually necessary for local industry, life support, or refinement into loads small enough to export offworld. Major mining efforts are necessary to extract the minerals, and many natives work in the industry.", "E": "Mine boss, Tunnel saboteur, Subterranean predators", "F": "Hermit prospector, Offworld investor, Miner’s union representative", "C": "The refinery equipment breaks down, Tunnel collapse, Silicate life forms growing in the miners’ lungs", "T": "The mother lode, Smuggled case of refined mineral, Faked crystalline mineral samples", "P": "Vertical mine face, Tailing piles, Roaring smelting complex"}, {"n": 37, "name": "Hivemind", "desc": "Natives of this world exist in a kind of mental gestalt, sharing thoughts and partaking of a single identity. Powerful pretech, exotic psionics, alien influence, or some other cause has left the world sharing one identity. Individual members may have greater or lesser degrees of effective coordination with the whole.", "E": "A hivemind that wants to assimilate outsiders, A hivemind that has no respect for unjoined life, A hivemind that fears and hates unjoined life", "F": "A scholar studying the hivemind, A person severed from the gestalt, A relative of someone who has been assimilated", "C": "The hivemind only functions on this world, The hivemind has strict range limits, The hivemind has different personality factions, The hivemind only happens at particular times, The world is made of semi-sentient drones and a single AI", "T": "Vital tech for maintaining the mind, Precious treasure held by now-assimilated outsider, Tech that “blinds” the hivemind to the tech’s users", "P": "Barely tolerable living cells for individuals, Workside where individuals casually die in their labors, Community with absolutely no social or group-gathering facilities"}, {"n": 38, "name": "Holy War", "desc": "A savage holy war is raging on this world, either between factions of locals or as a united effort against the pagans of some neighboring world. This war might involve a conventional religion, or it might be the result of a branding campaign, political ideology, artistic movement, or any other cause that people use as a substitute for traditional religion.", "E": "Blood-mad pontiff, Coldly cynical secular leader, Totalitarian political demagogue", "F": "Desperate peacemaker, Hard-pressed refugee of the fighting, Peaceful religious leader who lost the internal debate", "C": "The targets of the war really are doing something diabolically horrible, The holy war is just a mask for a very traditional casus belli, The leaders don’t want the war won but only prolonged, Both this world and the target of the war are religion-obsessed", "T": "Sacred relic of the faith, A captured blasphemer under a death sentence, Plunder seized in battle", "P": "Massive holy structure, Razed community of infidels, Vast shrine to the martyrs dead in war"}, {"n": 39, "name": "Hostile Biosphere", "desc": "The world is teeming with life, and it hates humans. Perhaps the life is xenoallergenic, forcing filter masks and tailored antiallergens for survival. It could be the native predators are huge and fearless, or the toxic flora ruthlessly outcompetes earth crops.", "E": "Local fauna, Nature cultist, Native aliens, Callous labor overseer", "F": "Xenobiologist, Tourist on safari, Grizzled local guide", "C": "Filter masks fail, Parasitic alien infestation, Crop greenhouses lose bio-integrity", "T": "Valuable native biological extract, Abandoned colony vault, Remains of an unsuccessful expedition", "P": "Deceptively peaceful glade, Steaming polychrome jungle, Nightfall when surrounded by Things"}, {"n": 40, "name": "Hostile Space", "desc": "The system in which the world exists is a dangerous neighborhood. Something about the system is perilous to inhabitants, either through meteor swarms, stellar radiation, hostile aliens in the asteroid belt, or periodic comet clouds.", "E": "Alien raid leader, Meteor-launching terrorists, Paranoid local leader", "F": "Astronomic researcher, Local defense commander, Early warning monitor agent", "C": "The natives believe the danger is divine chastisement, The natives blame outworlders for the danger, The native elite profit from the danger in some way", "T": "Early warning of a raid or impact, Abandoned riches in a disaster zone, Key to a secure bunker", "P": "City watching an approaching asteroid, Village burnt in an alien raid, Massive ancient crater"}, {"n": 41, "name": "Immortals", "desc": "Natives of this world are effectively immortal. They may have been gengineered for tremendous lifespans, or have found some local anagathic, or be cyborg life forms, or be so totally convinced of reincarnation that death is a cultural irrelevance. Any immortality technique is likely applicable only to them, or else it’s apt to be a massive draw to outside imperialists.", "E": "Outsider determined to steal immortality, Smug local convinced of their immortal wisdom to rule all, Offworlder seeking the world’s ruin before it becomes a threat to all", "F": "Curious longevity researcher, Thrill-seeking local,", "C": "Immortality requires doing something that outsiders can’t or won’t willingly do, The immortality ends if they leave the world, Death is the punishment for even minor crimes, Immortals must die or go offworld after a certain span, Immortality has brutal side-effects", "T": "Immortality drug, Masterwork of an ageless artisan, Toxin that only affects immortals", "P": "Community with no visible children, Unchanging structure of obvious ancient age, Cultural performance relying on a century of in-jokes"}, {"n": 42, "name": "Local Specialty", "desc": "The world may be sophisticated or barely capable of steam engines, but either way it produces something rare and precious to the wider galaxy. It might be some pharmaceutical extract produced by a secret recipe, a remarkably popular cultural product, or even gengineered humans uniquely suited for certain work.", "E": "Monopolist, Offworlder seeking prohibition of the specialty, Native who views the specialty as sacred", "F": "Spy searching for the source, Artisan seeking protection, Exporter with problems", "C": "The specialty is repugnant in nature, The crafters refuse to sell to offworlders, The specialty is made in a remote, dangerous place, The crafters don’t want to make the specialty any more", "T": "The specialty itself, The secret recipe, Sample of a new improved variety", "P": "Secret manufactory, Hidden cache, Artistic competition for best artisan"}, {"n": 43, "name": "Local Tech", "desc": "The locals can create a particular example of extremely high tech, possibly even something that exceeds pretech standards. They may use unique local resources to do so, or have stumbled on a narrow scientific breakthrough, or still have a functional experimental manufactory.", "E": "Keeper of the tech, Offworld industrialist, Automated defenses that suddenly come alive, Native alien mentors", "F": "Curious offworld scientist, Eager tech buyer, Native in need of technical help", "C": "The tech is unreliable, The tech only works on this world, The tech has poorly-understood side effects, The tech is alien in nature.", "T": "The tech itself, An unclaimed payment for a large shipment, The secret blueprints for its construction, An ancient alien R&D database", "P": "Alien factory, Lethal R&D center, Tech brokerage vault"}, {"n": 44, "name": "Major Spaceyard", "desc": "Most worlds of tech level 4 or greater have the necessary tech and orbital facilities to build spike drives and starships. This world is blessed with a major spaceyard facility, either inherited from before the Silence or painstakingly constructed in more recent decades. It can build even capital-class hulls, and do so more quickly and cheaply than its neighbors.", "E": "Enemy saboteur, Industrial spy, Scheming construction tycoon, Aspiring ship hijacker", "F": "Captain stuck in drydock, Maintenance chief, Mad innovator", "C": "The spaceyard is an alien relic, The spaceyard is burning out from overuse, The spaceyard is alive, The spaceyard relies on maltech to function", "T": "Intellectual property-locked pretech blueprints, Override keys for activating old pretech facilities, A purchased but unclaimed spaceship.", "P": "Hidden shipyard bay, Surface of a partially-completed ship, Ship scrap graveyard"}, {"n": 45, "name": "Mandarinate", "desc": "The planet is ruled by an intellectual elite chosen via ostensibly neutral examinations or tests. The values this system selects for may or may not have anything to do with actual practical leadership skills, and the examinations may be more or less corruptible.", "E": "Corrupt test administrator, Incompetent but highly-rated graduate, Ruthless leader of a clan of high-testing relations", "F": "Crusader for test reform, Talented but poorly-connected graduate, Genius who tests badly", "C": "The test is totally unrelated to necessary governing skills, The test was very pertinent in the past but tech or culture has changed, The test is for a skill that is vital to maintaining society but irrelevant to day-to-day governance, The test is a sham and passage is based on wealth or influence", "T": "Answer key to the next test, Lost essay of incredible merit, Proof of cheating", "P": "Massive structure full of test-taking cubicles, School filled with desperate students, Ornate government building decorated with scholarly quotes and academic images"}, {"n": 46, "name": "Mandate Base", "desc": "The Terran Mandate retained its control over this world for much longer than usual, and the world may still consider itself a true inheritor of Mandate legitimacy. Most of these worlds have or had superior technology, but they may still labor under the burden of ancient restrictive tech or monitoring systems designed to prevent them from rebelling.", "E": "Deranged Mandate monitoring AI, Aspiring sector ruler, Demagogue preaching local superiority over “traitorous rebel worlds”.", "F": "Idealistic do-gooder local, Missionary for advanced Mandate tech, Outsider seeking lost data from Mandate records", "C": "The monitoring system forces the locals to behave in aggressive ways toward “rebel” worlds, The monitoring system severely hinders offworld use of their tech, The original colonists are all dead and have been replaced by outsiders who don’t understand all the details", "T": "Ultra-advanced pretech, Mandate military gear, Databank containing precious tech schematics", "P": "Faded Mandate offices still in use, Vault containing ancient pretech, Carefully-maintained monument to Mandate glory"}, {"n": 47, "name": "Maneaters", "desc": "The locals are cannibals, either out of necessity or out of cultural preference. Some worlds may actually eat human flesh, while others simply require the rendering of humans into important chemicals or pharmaceutical compounds, perhaps to prolong the lives of ghoul overlords. This cannibalism plays a major role in their society.", "E": "Ruthless ghoul leader, Chieftain of a ravenous tribe, Sophisticated degenerate preaching the splendid authenticity of cannibalism", "F": "Sympathetic local fleeing the fork, Escapee from a pharmaceutical rendering plant, Outsider chosen for dinner, Reformer seeking to break the custom or its necessity", "C": "Local food or environmental conditions make human consumption grimly necessary, The locals farm human beings, Outsiders are expected to join in the custom, The custom is totally unnecessary but jealously maintained by the people", "T": "Belongings of a recent meal, An offworlder VIP due for the menu, A toxin that makes human flesh lethal to consumers", "P": "Hideous human abattoir, Extremely civilized restaurant, Funeral-home-cum-kitchen"}, {"n": 48, "name": "Megacorps", "desc": "The world is dominated by classic cyberpunk-esque megacorporations, each one far more important than the vestigial national remnants that encompass them. These megacorps are usually locked in a cold war, trading and dealing with each other even as they try to strike in deniable ways. An over-council of corporations usually acts to bring into line any that get excessively overt in their activities.", "E": "Megalomaniacal executive, Underling looking to use the PCs as catspaws, Ruthless mercenary who wants what the PCs have", "F": "Victim of megacorp scheming, Offworlder merchant in far over their head, Local reformer struggling to cope with megacorp indifference", "C": "The megacorps are the only source of something vital to life on this world, An autonomous Mandate system acts to punish excessively overt violence, The megacorps are struggling against much more horrible national governments", "T": "Blackmail on a megacorp exec, Keycodes to critical corp secrets, Proof of corp responsibility for a heinously unacceptable public atrocity, Data on a vital new product line coming out soon", "P": "A place plastered in megacorp ads, A public plaza discreetly branded, Private corp military base"}, {"n": 49, "name": "Mercenaries", "desc": "The world is either famous for its mercenary bands or it is plagued by countless groups of condottieri in service to whatever magnate can afford to pay or bribe them adequately.", "E": "Amoral mercenary leader, Rich offworlder trying to buy rule of the world, Mercenary press gang chief forcing locals into service", "F": "Young and idealistic mercenary chief, Harried leader of enfeebled national army, Offworlder trying to hire help for a noble cause", "C": "The mercenaries are all that stand between the locals and a hungry imperial power, The mercenaries are remnants of a former official army, The mercenaries hardly ever actually fight as compared to taking bribes to walk away", "T": "Lost mercenary payroll shipment, Forbidden military tech, Proof of a band’s impending treachery against their employers", "P": "Shabby camp of undisciplined mercs, Burnt-out village occupied by mercenaries, Luxurious and exceedingly well-defended merc leader villa"}, {"n": 50, "name": "Minimal Contact", "desc": "The locals refuse most contact with offworlders. Only a small, quarantined treaty port is provided for offworld trade, and ships can expect an exhaustive search for contraband. Local governments may be trying to keep the very existence of interstellar trade a secret from their populations, or they may simply consider offworlders too dangerous or repugnant to be allowed among the population.", "E": "Customs official, Xenophobic natives, Existing merchant who doesn’t like competition", "F": "Aspiring tourist, Anthropological researcher, Offworld thief, Religious missionary", "C": "The locals carry a disease harmless to them and lethal to outsiders, The locals hide dark purposes from offworlders, The locals have something desperately needed but won’t bring it into the treaty port", "T": "Contraband trade goods, Security perimeter codes, Black market local products", "P": "Treaty port bar, Black market zone, Secret smuggler landing site"}, {"n": 51, "name": "Misandry/Misogyny", "desc": "The culture on this world holds a particular gender in contempt. Members of that gender are not permitted positions of formal power, and may be restricted in their movements and activities. Some worlds may go so far as to scorn both traditional genders, using gengineering techniques to hybridize or alter conventional human biology.", "E": "Cultural fundamentalist, Cultural missionary to outworlders, Local rebel driven to pointless and meaningless violence", "F": "Oppressed native, Research scientist, Offworld emancipationist, Local reformer", "C": "The oppressed gender is restive against the customs, The oppressed gender largely supports the customs, The customs relate to some physical quality of the world, The oppressed gender has had maltech gengineering done to “tame” them.", "T": "Aerosol reversion formula for undoing gengineered docility, Hidden history of the world, Pretech gengineering equipment", "P": "Shrine to the virtues of the favored gender, Security center for controlling the oppressed, Gengineering lab"}, {"n": 52, "name": "Night World", "desc": "The world is plunged into eternal darkness. The only life on this planet derives its energy from other sources, such as geothermal heat, extremely volatile chemical reactions in the planet’s soil, or light in a non-visible spectrum. Most flora and fauna is voraciously eager to consume other life.", "E": "Monstrous thing from the night, Offworlder finding the obscurity of the world convenient for dark purposes, Mad scientist experimenting with local life", "F": "Curious offworlder researcher, Hard-pressed colony leader, High priest of a sect that finds religious significance in the night", "C": "Daylight comes as a cataclysmic event at very long intervals, Light causes very dangerous reactions in native life or chemicals here, The locals have been gengineered to exist without sight", "T": "Rare chemicals created in the darkness, Light source usable on this world, Smuggler cache hidden here in ages past", "P": "Formlessly pitch-black wilderness, Sea without a sun, Location defined by sounds or smells"}, {"n": 53, "name": "Nomads", "desc": "Most of the natives of this world are nomadic, usually following a traditional cycle of movement through the lands they possess. Promises of rich plunder or local environmental perils can force these groups to strike out against neighbors. Other groups are forced to move constantly due to unpredictable dangers that crop up on the planet.", "E": "Desperate tribal leader who needs what the PCs have, Ruthless raider chieftain, Leader seeking to weld the nomads into an army", "F": "Free-spirited young nomad, Dreamer imagining a stable life, Offworlder enamored of the life", "C": "An irresistibly lethal swarm of native life forces locals to move regularly, Ancient defense systems destroy too-long-stationary communities, Local chemical patches require careful balancing of exposure times to avoid side effects", "T": "Cache of rare and precious resource, Plunder seized by a tribal raid, Tech that makes a place safe for long-term inhabitation", "P": "Temporary nomad camp, Oasis or resource reserve, Trackless waste that kills the unprepared"}, {"n": 54, "name": "Oceanic World", "desc": "The world is entirely or almost entirely covered with liquid water. Habitations might be floating cities, or might cling precariously to the few rocky atolls jutting up from the waves, or are planted as bubbles on promontories deep beneath the stormy surface. Survival depends on aquaculture. Planets with inedible alien life rely on gengineered Terran sea crops.", "E": "Pirate raider, Violent “salvager” gang, Tentacled sea monster", "F": "Daredevil fisherman, Sea hermit, Sapient native life", "C": "The liquid flux confuses grav engines too badly for them to function on this world, Sea is corrosive or toxic, The seas are wracked by regular storms", "T": "Buried pirate treasure, Location of enormous schools of fish, Pretech water purification equipment", "P": "The only island on the planet, Floating spaceport, Deck of a storm-swept ship, Undersea bubble city"}, {"n": 55, "name": "Out of Contact", "desc": "The natives have been entirely out of contact with the greater galaxy for centuries or longer. Perhaps the original colonists were seeking to hide from the rest of the universe, or the Silence destroyed any means of communication. It may have been so long that human origins on other worlds have regressed into a topic for legends. The players might be on the first offworld ship to land since the First Wave of colonization a thousand years ago.", "E": "Fearful local ruler, Zealous native cleric, Sinister power that has kept the world isolated", "F": "Scheming native noble, Heretical theologian, UFO cultist native", "C": "Automatic defenses fire on ships that try to take off, The natives want to stay out of contact, The natives are highly vulnerable to offworld diseases, The native language is completely unlike any known to the group", "T": "Ancient pretech equipment, Terran relic brought from Earth, Logs of the original colonists", "P": "Long-lost colonial landing site, Court of the local ruler, Ancient defense battery controls"}, {"n": 56, "name": "Outpost World", "desc": "The world is only a tiny outpost of human habitation planted by an offworld corporation or government. Perhaps the staff is there to serve as a refueling and repair stop for passing ships, or to oversee an automated mining and refinery complex. They might be there to study ancient ruins, or simply serve as a listening and monitoring post for traffic through the system. The outpost is likely well-equipped with defenses against casual piracy.", "E": "Space-mad outpost staffer, Outpost commander who wants it to stay undiscovered, Undercover saboteur", "F": "Lonely staffer, Fixated researcher, Overtaxed maintenance chief", "C": "The alien ruin defense systems are waking up, Atmospheric disturbances trap the group inside the outpost for a month, Pirates raid the outpost, The crew have become converts to a strange set of beliefs", "T": "Alien relics, Vital scientific data, Secret corporate exploitation plans", "P": "Grimy recreation room, Refueling station, The only building on the planet, A “starport” of swept bare rock."}, {"n": 57, "name": "Perimeter Agency", "desc": "Before the Silence, the Perimeter was a Terran-sponsored organization charged with rooting out use of maltech, technology banned in human space as too dangerous for use or experimentation. Unbraked AIs, gengineered slave species, nanotech replicators, weapons of planetary destruction… the Perimeter hunted down experimenters with a great indifference to planetary laws. Most Perimeter Agencies collapsed during the Silence, but a few managed to hold on to their mission, though modern Perimeter agents often find more work as conventional spies.", "E": "Renegade Agency Director, Maltech researcher, Paranoid intelligence chief", "F": "Agent in need of help, Support staffer, “Unjustly” targeted researcher", "C": "The local Agency has gone rogue and now uses maltech, The Agency archives have been compromised, The Agency has been targeted by a maltech-using organization, The Agency’s existence is unknown to the locals", "T": "Agency maltech research archives, Agency pretech spec-ops gear, File of blackmail on local politicians", "P": "Interrogation room, Smoky bar, Maltech laboratory, Secret Agency base"}, {"n": 58, "name": "Pilgrimage Site", "desc": "The world is noted for an important spiritual or historical location, and might be the sector headquarters for a widespread religion or political movement. The site attracts wealthy pilgrims from throughout nearby space, and those with the money necessary to manage interstellar travel can be quite generous to the site and its keepers. The locals tend to be fiercely protective of the place and its reputation, and some places may forbid the entrance of those not suitably pious or devout.", "E": "Saboteur devoted to a rival belief, Bitter reformer who resents the current leadership, Swindler conning the pilgrims", "F": "Protector of the holy site, Naive offworlder pilgrim, Outsider wanting to learn the sanctum’s inner secrets", "C": "The site is actually a fake, The site is run by corrupt and venal keepers, A natural disaster threatens the site", "T": "Ancient relic guarded at the site, Proof of the site’s inauthenticity, Precious offering from a pilgrim", "P": "Incense-scented sanctum, Teeming crowd of pilgrims, Imposing holy structure"}, {"n": 59, "name": "Pleasure World", "desc": "This world provides delights either rare or impermissible elsewhere. Matchless local beauty, stunningly gengineered natives, a wide variety of local drugs, carnal pleasures unacceptable on other worlds, or some other rare delight is readily available here. Most worlds are fully aware of the value of their offerings, and the prices they demand can be in credits or in less tangible recompense.", "E": "Purveyor of evil delights, Local seeking to control others with addictions, Offworlder exploiter of native resources", "F": "Tourist who’s in too deep, Native seeking a more meaningful life elsewhere, Offworld entertainer looking for training here", "C": "A deeply repugnant pleasure is offered here by a culture that sees nothing wrong with it, Certain pleasures here are dangerously addictive, The prices here can involve enslavement or death, The world has been seized and exploited by an imperial power", "T": "Forbidden drug, A contract for some unspeakable payment, Powerful tech repurposed for hedonistic ends", "P": "Breathtaking natural feature, Artful but decadent salon, Grimy den of desperate vice"}, {"n": 60, "name": "Police State", "desc": "The world is a totalitarian police state. Any sign of disloyalty to the planet’s rulers is punished severely, and suspicion riddles society. Some worlds might operate by Soviet-style informers and indoctrination, while more technically sophisticated worlds might rely on omnipresent cameras or braked AI “guardian angels”. Outworlders are apt to be treated as a necessary evil at best, and “disappeared” if they become troublesome.", "E": "Secret police chief, Scapegoating official, Treacherous native informer", "F": "Rebel leader, Offworld agitator, Imprisoned victim, Crime boss", "C": "The natives largely believe in the righteousness of the state, The police state is automated and its “rulers” can’t shut it off, The leaders foment a pogrom against “offworlder spies”.", "T": "List of police informers, Wealth taken from “enemies of the state”, Dear Leader’s private stash", "P": "Military parade, Gulag, Gray concrete housing block, Surveillance center"}, {"n": 61, "name": "Post-Scarcity", "desc": "The locals have maintained sufficient Mandate-era tech to be effectively post-scarcity in their economic structure. Everyone has all the necessities and most of the desires they can imagine. Conflict now exists over the apportionment of services and terrestrial space, since anything else can be had in abundance. Military goods and items of mass destruction may still be restricted, and there is probably some reason that the locals do not export their vast wealth.", "E": "Frenzied ideologue fighting over an idea, Paranoid local fearing offworlder influence, Grim reformer seeking the destruction of the “enfeebling” productive tech", "F": "Offworlder seeking something available only here, Local struggling to maintain the production tech, Native missionary seeking to bring abundance to other worlds", "C": "The tech causes serious side-effects on those who take advantage of it, The tech is breaking down, The population is growing too large, The tech produces only certain things in abundance", "T": "A cornucopia device, A rare commodity that cannot be duplicated, Contract for services", "P": "Tiny but richly-appointed private quarters, Market for services, Hushed non-duped art salon"}, {"n": 62, "name": "Preceptor Archive", "desc": "The Preceptors of the Great Archive were a pre-Silence organization devoted to ensuring the dissemination of human culture, history, and basic technology to frontier worlds that risked losing this information during the human expansion. Most frontier planets had an Archive where natives could learn useful technical skills in addition to human history and art. Those Archives that managed to survive the Silence now strive to send their missionaries of knowledge to new worlds in need of their lore.", "E": "Luddite native, Offworld merchant who wants the natives kept ignorant, Religious zealot, Corrupted First Speaker who wants to keep a monopoly on learning", "F": "Preceptor Adept missionary, Offworld scholar, Reluctant student, Roving Preceptor Adept", "C": "The local Archive has taken a very religious and mystical attitude toward their teaching, The Archive has maintained some replicable pretech science, The Archive has been corrupted and their teaching is incorrect", "T": "Lost Archive database, Ancient pretech teaching equipment, Hidden cache of unacceptable tech", "P": "Archive lecture hall, Experimental laboratory, Student-local riot"}, {"n": 63, "name": "Pretech Cultists", "desc": "The capacities of human science before the Silence vastly outmatch the technology available since the Scream. The Jump Gates alone were capable of crossing hundreds of light years in a moment, and they were just one example of the results won by blending psychic artifice with pretech science. Some worlds outright worship the artifacts of their ancestors, seeing in them the work of more enlightened and perfect humanity. These cultists may or may not understand the operation or replication of these devices, but they seek and guard them jealously.", "E": "Cult leader, Artifact supplier, Pretech smuggler", "F": "Offworld scientist, Robbed collector, Cult heretic", "C": "The cultists can actually replicate certain forms of pretech, The cultists abhor use of the devices as “presumption on the holy”, The cultists mistake the party’s belongings for pretech", "T": "Pretech artifacts both functional and broken, Religious-jargon laced pretech replication techniques, Waylaid payment for pretech artifacts", "P": "Shrine to nonfunctional pretech, Smuggler’s den, Public procession showing a prized artifact"}, {"n": 64, "name": "Primitive Aliens", "desc": "The world is populated by a large number of sapient aliens that have yet to develop advanced technology. The human colonists may have a friendly or hostile relationship with the aliens, but a certain intrinsic tension is likely. Small human colonies might have been enslaved or otherwise subjugated.", "E": "Hostile alien chief, Human firebrand, Dangerous local predator, Alien religious zealot", "F": "Colonist leader, Peace-faction alien chief, Planetary frontiersman, Xenoresearcher", "C": "The alien numbers are huge and can overwhelm the humans whenever they so choose, One group is trying to use the other to kill their political opponents, The aliens are incomprehensibly strange, One side commits an atrocity", "T": "Alien religious icon, Ancient alien-human treaty, Alien technology", "P": "Alien village, Fortified human settlement, Massacre site"}, {"n": 65, "name": "Prison Planet", "desc": "This planet is or was intended as a prison. Some such prisons were meant for specific malefactors of the Terran Mandate, while others were to contain entire “dangerous” ethnic groups or alien races. Some may still have warden AIs or automatic systems to prevent any unauthorized person from leaving, and any authorization permits have long since expired.", "E": "Crazed warden AI, Brutal heir to gang leadership, Offworlder who’s somehow acquired warden powers and exploits the locals", "F": "Innocent local born here, Native technician forced to maintain the very tech that imprisons them, Offworlder trapped here by accident", "C": "Departure permits are a precious currency, The prison industry still makes valuable pretech devices, Gangs have metamorphosed into governments, The local nobility descended from the prison staff", "T": "A pass to get offworld, A key to bypass ancient security devices, Contraband forbidden by the security scanners", "P": "Mandate-era prison block converted to government building, Industrial facility manned by mandatory numbers of prisoners, Makeshift shop where contraband is assembled"}, {"n": 66, "name": "Psionics Academy", "desc": "This world is one of the few that have managed to redevelop the basics of psychic training. Without this education, a potential psychic is doomed to either madness or death unless they refrain from using their abilities. Psionic academies are rare enough that offworlders are often sent there to study by wealthy patrons. The secrets of psychic mentorship, the protocols and techniques that allow a psychic to successfully train another, are carefully guarded at these academies. Most are closely affiliated with the planetary government.", "E": "Corrupt psychic instructor, Renegade student, Mad psychic researcher, Resentful townie", "F": "Offworld researcher, Aspiring student, Wealthy tourist", "C": "The academy curriculum kills a significant percentage of students, The faculty use students as research subjects, The students are indoctrinated as sleeper agents, The local natives hate the academy, The academy is part of a religion.", "T": "Secretly developed psitech, A runaway psychic mentor, Psychic research prize", "P": "Training grounds, Experimental laboratory, School library, Campus hangout"}, {"n": 67, "name": "Psionics Fear", "desc": "The locals are terrified of psychics. Perhaps their history is studded with feral psychics who went on murderous rampages, or perhaps they simply nurse an unreasoning terror of those “mutant freaks”. Psychics demonstrate their powers at risk of their lives.", "E": "Mental purity investigator, Suspicious zealot, Witch-finder", "F": "Hidden psychic, Offworlder psychic trapped here, Offworld educator", "C": "Psychic potential is much more common here, Some tech is mistaken as psitech, Natives believe certain rituals and customs can protect them from psychic powers", "T": "Hidden psitech cache, Possessions of convicted psychics, Reward for turning in a psychic", "P": "Inquisitorial chamber, Lynching site, Museum of psychic atrocities"}, {"n": 68, "name": "Psionics Worship", "desc": "These natives view psionic powers as a visible gift of god or sign of superiority. If the world has a functional psychic training academy, psychics occupy almost all major positions of power and are considered the natural and proper rulers of the world. If the world lacks training facilities, it is likely a hodgepodge of demented cults, with each one dedicated to a marginally-coherent feral prophet and their psychopathic ravings.", "E": "Psychic inquisitor, Haughty mind-noble, Psychic slaver, Feral prophet", "F": "Offworlder psychic researcher, Native rebel, Offworld employer seeking psychics", "C": "The psychic training is imperfect, and the psychics all show significant mental illness, The psychics have developed a unique discipline, The will of a psychic is law, Psychics in the party are forcibly kidnapped for “enlightening”.", "T": "Ancient psitech, Valuable psychic research records, Permission for psychic training", "P": "Psitech-imbued council chamber, Temple to the mind, Sanitarium-prison for feral psychics"}, {"n": 69, "name": "Quarantined World", "desc": "The world is under a quarantine, and space travel to and from it is strictly forbidden. This may be enforced by massive ground batteries that burn any interlopers from the planet’s sky, or it may be that a neighboring world runs a persistent blockade.", "E": "Defense installation commander, Suspicious patrol leader, Crazed asteroid hermit", "F": "Relative of a person trapped on the world, Humanitarian relief official, Treasure hunter", "C": "The natives want to remain isolated, The quarantine is enforced by an ancient alien installation, The world is rife with maltech abominations, The blockade is meant to starve everyone on the barren world.", "T": "Defense grid key, Bribe for getting someone out, Abandoned alien tech", "P": "Bridge of a blockading ship, Defense installation control room, Refugee camp"}, {"n": 70, "name": "Radioactive World", "desc": "Whether due to a legacy of atomic warfare unhindered by nuke snuffers or a simple profusion of radioactive elements, this world glows in the dark. Even heavy vacc suits can filter only so much of the radiation, and most natives suffer a wide variety of cancers, mutations and other illnesses without the protection of advanced medical treatments.", "E": "Bitter mutant, Relic warlord, Desperate wouldbe escapee", "F": "Reckless prospector, Offworld scavenger, Biogenetic variety seeker", "C": "The radioactivity is steadily growing worse, The planet’s medical resources break down, The radioactivity has inexplicable effects on living creatures, The radioactivity is the product of a malfunctioning pretech manufactory.", "T": "Ancient atomic weaponry, Pretech anti-radioactivity drugs, Untainted water supply", "P": "Mutant-infested ruins, Scorched glass plain, Wilderness of bizarre native life, Glowing barrens"}, {"n": 71, "name": "Refugees", "desc": "The world teems with refugees, either exiles from another planet who managed to get here, or the human detritus of some local conflict that have fled to the remaining stable states. The natives usually regard the refugees with hostility, an attitude returned by many among their unwilling guests.", "E": "Xenophobic native leader, Refugee chief aspiring to seize the host nation, Politician seeking to use the refugees as a weapon", "F": "Sympathetic refugee waif, Local hard-pressed by refugee gangs, Clergy seeking peace", "C": "The xenophobes are right that the refugees are taking over, The refugees are right that the xenophobes want them out or dead, Both are right, Outside powers are using the refugees to destabilize an enemy government, Refugee and local cultures are extremely incompatible", "T": "Treasures brought out by fleeing refugees, Citizenship papers, Cache of vital refugee supplies, Hidden arms for terrorists", "P": "Hopeless refugee camp, City swarming with confused strangers, Festival full of angry locals"}, {"n": 72, "name": "Regional Hegemon", "desc": "This world has the technological sophistication, natural resources, and determined polity necessary to be a regional hegemon for the sector. Nearby worlds are likely either directly subservient to it or tack carefully to avoid its anger. It may even be the capital of a small stellar empire.", "E": "Ambitious general, Colonial official, Contemptuous noble", "F": "Diplomat, Offworld ambassador, Foreign spy", "C": "The hegemon’s influence is all that’s keeping a murderous war from breaking out on nearby worlds, The hegemon is decaying and losing its control, The government is riddled with spies, The hegemon is genuinely benign", "T": "Diplomatic carte blanche, Deed to an offworld estate, Foreign aid grant", "P": "Palace or seat of government, Salon teeming with spies, Protest rally, Military base"}, {"n": 73, "name": "Restrictive Laws", "desc": "A myriad of laws, customs, and rules constrain the inhabitants of this world, and even acts that are completely permissible elsewhere are punished severely here. The locals may provide lists of these laws to offworlders, but few non-natives can hope to master all the important intricacies.", "E": "Law enforcement officer, Outraged native, Native lawyer specializing in peeling offworlders, Paid snitch", "F": "Frustrated offworlder, Repressed native, Reforming crusader", "C": "The laws change regularly in patterns only natives understand, The laws forbid some action vital to the party, The laws forbid the simple existence of some party members, The laws are secret to offworlders", "T": "Complete legal codex, Writ of diplomatic immunity, Fine collection vault contents", "P": "Courtroom, Mob scene of outraged locals, Legislative chamber, Police station"}, {"n": 74, "name": "Revanchists", "desc": "The locals formerly owned another world, or a major nation on the planet formerly owned an additional region of land. Something happened to take away this control or drive out the former rulers, and they’ve never forgotten it. The locals are obsessed with reclaiming their lost lands, and will allow no questions of practicality to interfere with their cause.", "E": "Demagogue whipping the locals on to a hopeless war, Politician seeking to use the resentment for their own ends, Local convinced the PCs are agents of the “thieving” power, Refugee from the land bitterly demanding it be reclaimed", "F": "Realist local clergy seeking peace, Politician trying to calm the public, Third-party diplomat trying to stamp out the fire", "C": "The revanchists’ claim is completely just and reasonable, The land is now occupied entirely by heirs of the conquerors, Both sides have seized lands the other thinks are theirs", "T": "Stock of vital resource produced by the taken land, Relic carried out of it, Proof that the land claim is justified or unjustified", "P": "Memorial monument to the loss, Cemetery of those who died in the conquest, Public ceremony commemorating the disaster"}, {"n": 75, "name": "Revolutionaries", "desc": "The world is convulsed by one or more bands of revolutionaries, with some nations perhaps in the grip of a current revolution. Most of these upheavals can be expected only to change the general flavor of problems in the polity, but the process of getting there usually produces a tremendous amount of suffering.", "E": "Blood-drenched revolutionary leader, Blooddrenched secret police chief, Hostile foreign agent seeking further turmoil", "F": "Sympathetic victim accused of revolutionary sympathies or government collaboration, Revolutionary or state agent who now repents, Agent of a neutral power that wants peace", "C": "The revolutionaries actually do seem likely to put in better rulers, The revolutionaries are client groups that got out of hand, The revolutionaries are clearly much worse than the government, The revolutionaries have no real ideals beyond power and merely pretend to ideology", "T": "List of secret revolutionary sympathizers, Proof of rebel hypocrisy, Confiscated wealth", "P": "Festival that explodes into violence, Heavily-fortified police station, Revolutionary base hidden in the wilderness"}, {"n": 76, "name": "Rigid Culture", "desc": "The local culture is extremely rigid. Certain forms of behavior and belief are absolutely mandated, and any deviation from these principles is punished, or else society may be strongly stratified by birth with limited prospects for change. Anything which threatens the existing social order is feared and shunned.", "E": "Rigid reactionary, Wary ruler, Regime ideologue, Offended potentate", "F": "Revolutionary agitator, Ambitious peasant, Frustrated merchant", "C": "The cultural patterns are enforced by technological aids, The culture is run by a secret cabal of manipulators, The culture has explicit religious sanction, The culture evolved due to important necessities that have since been forgotten", "T": "Precious traditional regalia, Peasant tribute, Opulent treasures of the ruling class", "P": "Time-worn palace, Low-caste slums, Bandit den, Reformist temple"}, {"n": 77, "name": "Rising Hegemon", "desc": "This world is not yet a dominant power in the sector, but it’s well on its way there. Whether through newly-blossoming economic, military, or cultural power, they’re extending their influence over their neighbors and forging new arrangements between their government and the rulers of nearby worlds.", "E": "Jingoistic supremacist, Official bent on glorious success, Foreign agent saboteur", "F": "Friendly emissary to the benighted, Hardscrabble local turned great success, Foreign visitor seeking contacts or knowledge", "C": "They’re only strong because their neighbors have been weakened, Their success is based on a fluke resource or pretech find, They bitterly resent their neighbors as former oppressors", "T": "Tribute shipment, Factory or barracks emblematic of their power source, Tech or data that will deal a blow to their rise", "P": "Rustic town being hurled into prosperity, Government building being expanded, Starport struggling under the flow of new ships"}, {"n": 78, "name": "Ritual Combat", "desc": "The locals favor some form of stylized combat to resolve disputes, provide entertainment, or settle religious differences. This combat is probably not normally lethal unless it’s reserved for a specific disposable class of slaves or professionals. Some combat may involve mastery of esoteric weapons and complex arenas, while other forms might require nothing more than a declaration in the street and a drawn gun.", "E": "Bloodthirsty local champion, Ambitious gladiator stable owner, Xenophobic master fighter", "F": "Peace-minded foreign missionary, Temperate defender of the weak, Local eager to learn of offworld fighting styles", "C": "The required weapons are strange pretech artifacts, Certain classes are forbidden from fighting and require champions, Loss doesn’t mean death but it does mean ritual scarring or property loss", "T": "Magnificent weapon, Secret book of martial techniques, Token signifying immunity to ritual combat challenges, Prize won in bloody battle", "P": "Area full of cheering spectators, Dusty street outside a saloon, Memorial for fallen warriors"}, {"n": 79, "name": "Robots", "desc": "The world has a great many robots on it. Most bots are going to be non-sentient expert systems, though an AI with enough computing resources can control many bots at once, and some worlds may have developed VIs to a degree that individual bots can seem (or be) sentient. Some worlds might even be ruled by metal overlords, ones which do not need to be sentient so long as they have overwhelming force.", "E": "Hostile robot master, Robot greedy to seize offworld tech, Robot fallen in love with the PC’s ship, Oligarch whose factories build robots", "F": "Data-seeking robot, Plucky young robot tech, Local being pushed out of a job by robots", "C": "The robots are only partially controlled, The robots are salvaged and originally meant for a much darker use, The robots require a rare material that the locals fight over, The robots require the planet’s specific infrastructure so cannot be exported", "T": "Prototype robot, Secret robot override codes, Vast cache of robot-made goods, Robot-destroying pretech weapon", "P": "Humming robotic factory, Stark robotic “barracks”, House crowded with robot servants and only one human owner"}, {"n": 80, "name": "Seagoing Cities", "desc": "Either the world is entirely water or else the land is simply too dangerous for most humans. Human settlement on this world consists of a number of floating cities that follow the currents and the fish. These city-ships might have been purpose-built for their task, or they could be jury-rigged conglomerations
