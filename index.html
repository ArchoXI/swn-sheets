<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SWN Party Sheets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: D&D Beyond-style sheet — attribute row + combat strip on top, saves/skills left, tabbed actions right, game log drawer. Sci-fi HUD frames. */
  --ink:#0d1016; --panel:#161b24; --panel-2:#1d2430; --raised:#252e3d; --line:#334055; --line-soft:#263042;
  --text:#e7eaf0; --muted:#8e98ac; --faint:#5f6a80;
  --accent:#e8693a; --accent-ink:#1a0d06; --accent-soft:rgba(232,105,58,.14);
  --info:#55b6cc; --good:#5cc489; --bad:#e35d5d; --warn:#e3b04b;
  --display:"Saira Condensed","Arial Narrow",sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink);color:var(--text);font-family:var(--body);font-size:14px;line-height:1.45}
body{background:radial-gradient(1200px 500px at 70% -10%,#1b2433 0,transparent 60%),var(--ink);min-height:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--info);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:.02em}
.lbl{font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:10px 18px;background:rgba(13,16,22,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:.06em;text-transform:uppercase}
.brand .mark{width:26px;height:26px}
.nav{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.chip{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border:1px solid var(--line);background:var(--panel);border-radius:999px;font-weight:500;white-space:nowrap}
.chip:hover{border-color:var(--faint)}
.chip.on{border-color:var(--accent);background:var(--accent-soft)}
.chip .av{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--raised);font-family:var(--display);font-weight:700;font-size:12px}
.chip .hpmini{width:34px;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.chip .hpmini i{display:block;height:100%;background:var(--good)}
.navbtn{padding:6px 12px;border:1px solid transparent;background:none;border-radius:6px;font-family:var(--display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:13px;color:var(--muted)}
.navbtn:hover{color:var(--text)}
.navbtn.on{color:var(--text);border-color:var(--line)}
.role{font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.14em;padding:3px 8px;border-radius:4px;border:1px solid var(--line);color:var(--muted);text-transform:uppercase}
.role.gm{color:var(--accent);border-color:var(--accent)}

.notice{margin:12px 18px 0;padding:10px 14px;border:1px solid var(--line);border-left:3px solid var(--warn);background:var(--panel);border-radius:4px;color:var(--muted)}
.notice b{color:var(--text)}
main{padding:16px 18px 120px;max-width:1360px;margin:0 auto}

/* HUD frame */
.frame{position:relative;background:var(--panel);border:1px solid var(--line-soft);border-radius:3px}
.frame::before,.frame::after{content:"";position:absolute;width:10px;height:10px;border-color:var(--faint);border-style:solid;pointer-events:none}
.frame::before{top:-1px;left:-1px;border-width:2px 0 0 2px}
.frame::after{bottom:-1px;right:-1px;border-width:0 2px 2px 0}
.frame-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line-soft)}
.frame-h h3{font-size:14px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.frame-b{padding:10px 12px}

/* header banner */
.banner{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;padding:16px 18px;margin-bottom:14px;background:linear-gradient(100deg,#1f2a3b 0%,#171d28 55%,#1a1714 100%);border:1px solid var(--line-soft);border-radius:3px;position:relative;overflow:hidden}
.banner::after{content:"";position:absolute;right:-40px;top:-60px;width:320px;height:220px;background:repeating-linear-gradient(135deg,rgba(232,105,58,.08) 0 2px,transparent 2px 10px);transform:rotate(8deg);pointer-events:none}
.portrait{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:32px;font-weight:800;background:var(--raised);border:2px solid var(--accent);box-shadow:0 0 0 4px rgba(232,105,58,.12)}
.cname{font-size:30px;font-weight:800;line-height:1.05}
.cname input{font-family:var(--display);font-size:28px;font-weight:800;background:transparent;border:0;border-bottom:1px dashed var(--line);width:100%;max-width:420px;padding:0}
.csub{color:var(--muted);margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 14px}
.csub b{color:var(--text);font-weight:600}
.xp{margin-top:8px;display:flex;align-items:center;gap:10px;max-width:420px}
.xpbar{flex:1;height:6px;background:var(--line-soft);border-radius:3px;overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--info),#8fd6e6)}
.bactions{display:flex;flex-direction:column;gap:6px;align-items:flex-end;position:relative;z-index:1}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 12px;border:1px solid var(--line);background:var(--panel-2);border-radius:4px;font-family:var(--display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:12.5px}
.btn:hover{border-color:var(--faint);background:var(--raised)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{background:none}
.btn.sm{padding:4px 8px;font-size:11.5px}
.btn.danger{color:var(--bad);border-color:rgba(227,93,93,.5)}
.btn.on{border-color:var(--accent);color:var(--accent)}
.iconbtn{width:26px;height:26px;display:inline-grid;place-items:center;border:1px solid var(--line);background:var(--panel-2);border-radius:4px;padding:0;font-weight:700;line-height:1}
.iconbtn:hover{background:var(--raised)}

/* top row */
.toprow{display:grid;grid-template-columns:repeat(6,minmax(0,1fr)) 1.1fr;gap:10px;margin-bottom:14px}
.attr{position:relative;text-align:center;padding:10px 6px 18px;background:var(--panel);border:1px solid var(--line-soft);border-radius:3px}
.attr .lbl{display:block;font-size:10.5px;cursor:help}
.attr .lbl:hover{color:var(--text)}
.attr .mod{font-family:var(--display);font-size:34px;font-weight:700;line-height:1.05;margin-top:2px}
.attr .score{position:absolute;left:50%;bottom:-11px;transform:translateX(-50%);min-width:46px;height:24px;padding:0 8px;display:grid;place-items:center;background:var(--ink);border:1px solid var(--line);border-radius:12px;font-weight:600}
.attr .score input{width:34px;text-align:center;background:transparent;border:0;padding:0;font-weight:600}
.attr .boost{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--info)}
.ac{display:grid;place-items:center;background:none;border:0;cursor:help;padding:0}
.ac svg{width:100%;max-width:112px;height:auto}

.vitals{display:grid;grid-template-columns:1.6fr repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.vital{padding:10px 12px;background:var(--panel);border:1px solid var(--line-soft);border-radius:3px;display:flex;flex-direction:column;gap:4px}
.vital .big{font-family:var(--display);font-size:28px;font-weight:700;line-height:1}
.vital .big small{font-size:16px;color:var(--muted);font-weight:600}
.vital .row{display:flex;align-items:center;gap:6px;justify-content:space-between}
.vital .lbl{cursor:help}
.hpwrap{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.hpctl{display:grid;grid-template-columns:1fr;gap:4px;width:84px}
.hpctl input{width:100%;text-align:center;padding:4px;background:var(--ink);border:1px solid var(--line);border-radius:3px}
.hpctl .h{color:var(--good);border-color:rgba(92,196,137,.5)}
.hpctl .d{color:var(--bad);border-color:rgba(227,93,93,.5)}
.hpnums{display:flex;align-items:baseline;gap:6px}
.hpbar{height:6px;background:var(--line-soft);border-radius:3px;overflow:hidden;margin-top:6px}
.hpbar i{display:block;height:100%;background:var(--good);transition:width .3s}
.pipline{display:flex;gap:3px;flex-wrap:wrap}
.pipline i{width:10px;height:10px;border:1px solid var(--faint);border-radius:2px}
.pipline i.f{background:var(--warn);border-color:var(--warn)}
.pipline i.p{background:var(--bad);border-color:var(--bad)}
.pipline i.e{background:var(--info);border-color:var(--info)}

/* roll options */
.ropts{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:8px 12px;margin-bottom:14px;background:var(--panel);border:1px solid var(--line-soft);border-radius:3px}
.ropts .grp{display:flex;align-items:center;gap:6px}
.ropts select,.ropts input{background:var(--ink);border:1px solid var(--line);border-radius:3px;padding:3px 6px}
.toggle{display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
.toggle input{accent-color:var(--accent)}

/* body grid */
.body{display:grid;grid-template-columns:230px 290px minmax(0,1fr);gap:14px;align-items:start}
.stack{display:grid;gap:14px}
.saves{display:grid;grid-template-columns:1fr;gap:6px}
.save{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:7px 8px;background:var(--panel-2);border:1px solid var(--line-soft);border-radius:3px}
.save .lbl{cursor:help;font-size:11px}
.rollbtn{min-width:44px;padding:3px 8px;border:1px solid var(--line);background:var(--ink);border-radius:4px;font-weight:600;font-variant-numeric:tabular-nums;text-align:center}
.rollbtn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.rollbtn.tgt::before{content:"≥ ";color:var(--faint);font-weight:500}
.skills{list-style:none;margin:0;padding:0}
.skills li{display:grid;grid-template-columns:44px 1fr 32px 48px;align-items:center;gap:6px;padding:4px 2px;border-bottom:1px solid var(--line-soft)}
.skills li:last-child{border-bottom:0}
.pips{display:flex;gap:2px}
.pips i{width:8px;height:8px;border-radius:50%;border:1px solid var(--faint)}
.pips i.f{background:var(--accent);border-color:var(--accent)}
.pips.un i{border-style:dashed;opacity:.5}
.sname{background:none;border:0;padding:0;text-align:left;cursor:help}
.sname:hover{color:var(--accent)}
.sattr{font-size:11px;color:var(--faint);font-family:var(--display);font-weight:600;letter-spacing:.08em}
.skedit{display:flex;align-items:center;gap:3px}
.skedit .iconbtn{width:20px;height:20px;font-size:12px}
.untr{color:var(--faint)}

.enc .row{display:flex;justify-content:space-between;align-items:center;margin:4px 0}
.meter{height:6px;background:var(--line-soft);border-radius:3px;overflow:hidden;margin-bottom:8px}
.meter i{display:block;height:100%;background:var(--info)}
.meter i.over{background:var(--bad)}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line-soft);padding:0 8px;overflow-x:auto}
.tab{padding:10px 12px;background:none;border:0;border-bottom:2px solid transparent;font-family:var(--display);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:13px;color:var(--muted);white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.on{color:var(--text);border-bottom-color:var(--accent)}
.tabbody{padding:12px}
.sect{margin-bottom:16px}
.sect>.lbl{display:block;margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid var(--line-soft);color:var(--accent)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);text-align:left;padding:4px 6px;border-bottom:1px solid var(--line-soft)}
td{padding:6px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
tr:last-child td{border-bottom:0}
.iname{background:none;border:0;padding:0;text-align:left;font-weight:600;cursor:pointer}
.iname:hover{color:var(--accent)}
.isub{display:block;font-size:12px;color:var(--muted);font-weight:400}
.tag{display:inline-block;font-family:var(--display);font-weight:700;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;padding:1px 6px;border-radius:3px;border:1px solid var(--line);color:var(--muted);margin-left:4px;vertical-align:1px}
.tag.hb{color:var(--accent);border-color:rgba(232,105,58,.5)}
.tag.gm{color:var(--warn);border-color:rgba(227,176,75,.5)}
.tag.on{color:var(--good);border-color:rgba(92,196,137,.5)}
.feature{padding:10px 12px;background:var(--panel-2);border:1px solid var(--line-soft);border-left:3px solid var(--accent);border-radius:3px;margin-bottom:8px}
.feature h4{margin:0 0 4px;font-family:var(--display);font-size:16px;font-weight:700;letter-spacing:.02em}
.feature p{margin:0;color:var(--muted);white-space:pre-wrap}
.empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:3px}

/* forms */
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field .lbl{font-size:10px}
.inp,select.inp,textarea.inp{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:3px;padding:5px 7px;min-width:0}
textarea.inp{resize:vertical;min-height:70px}
.inp.n{width:64px;text-align:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.modrow{display:grid;grid-template-columns:1fr 70px 26px;gap:6px;margin-bottom:6px}
.hint{font-size:12px;color:var(--faint)}
.override{position:relative}
.ovr-badge{font-family:var(--display);font-size:9.5px;font-weight:800;letter-spacing:.1em;color:var(--warn);border:1px solid rgba(227,176,75,.6);border-radius:3px;padding:0 4px;margin-left:4px;vertical-align:2px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(5,7,10,.55);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--panel);border-left:1px solid var(--line);z-index:41;display:flex;flex-direction:column;box-shadow:-20px 0 40px rgba(0,0,0,.4)}
.drawer-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line-soft);background:linear-gradient(90deg,var(--accent-soft),transparent)}
.drawer-h h2{font-size:22px;font-weight:800}
.drawer-body{padding:16px;overflow-y:auto;flex:1}
.drawer-body p{margin:0 0 10px;color:#c9cfdb}
.calc{margin:12px 0;border:1px solid var(--line-soft);border-radius:3px;overflow:hidden}
.calc div{display:flex;justify-content:space-between;padding:6px 10px;border-bottom:1px solid var(--line-soft)}
.calc div:last-child{border-bottom:0;background:var(--panel-2);font-weight:600}
.calc span:last-child{font-variant-numeric:tabular-nums}

/* log */
.logbtn{position:fixed;right:18px;bottom:18px;z-index:30;display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;font-family:var(--display);font-weight:700;letter-spacing:.1em;text-transform:uppercase;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.logbtn:hover{border-color:var(--accent)}
.logbtn .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.log{position:fixed;right:18px;bottom:70px;width:min(360px,calc(100% - 36px));max-height:min(560px,calc(100% - 140px));z-index:30;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:4px;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.log-list{overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:6px;flex:1}
.entry{padding:8px 10px;background:var(--panel-2);border:1px solid var(--line-soft);border-radius:3px}
.entry .who{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.entry .who b{color:var(--text);font-weight:600}
.entry .what{font-family:var(--display);font-weight:700;letter-spacing:.04em;margin-top:2px}
.line{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:3px}
.line .f{font-family:var(--mono);font-size:11.5px;color:var(--muted);overflow-wrap:anywhere}
.line .t{font-family:var(--display);font-size:22px;font-weight:800;min-width:38px;text-align:right}
.verdict{font-family:var(--display);font-weight:800;font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:1px 6px;border-radius:3px}
.verdict.ok{color:var(--good);border:1px solid rgba(92,196,137,.5)}
.verdict.no{color:var(--bad);border:1px solid rgba(227,93,93,.5)}
.verdict.crit{color:var(--accent);border:1px solid var(--accent)}
.die{display:inline-block;padding:0 3px;border-radius:2px;background:var(--raised);color:var(--text);margin-right:2px}
.die.drop{opacity:.4;text-decoration:line-through}
.die.max{color:var(--good)}
.die.min{color:var(--bad)}
.log-f{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line-soft)}
.log-f input{flex:1;background:var(--ink);border:1px solid var(--line);border-radius:3px;padding:5px 8px}

/* toasts */
#toasts{position:fixed;right:18px;bottom:70px;z-index:50;display:flex;flex-direction:column;gap:8px;pointer-events:none;width:min(320px,calc(100% - 36px))}
.toast{pointer-events:auto;background:var(--panel);border:1px solid var(--accent);border-radius:4px;padding:10px 12px;box-shadow:0 12px 40px rgba(0,0,0,.55);animation:pop .22s ease-out}
.toast.err{border-color:var(--bad)}
.toast .what{font-family:var(--display);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:13px;color:var(--muted)}
.toast .line .t{font-size:30px}
@keyframes pop{from{transform:translateY(12px) scale(.97);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}.hpbar i{transition:none}}

/* party / compendium */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.pcard{padding:14px;background:var(--panel);border:1px solid var(--line-soft);border-radius:3px;display:flex;flex-direction:column;gap:8px}
.pcard .top{display:flex;gap:10px;align-items:center}
.pcard .top .av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--raised);border:1px solid var(--accent);font-family:var(--display);font-weight:800;font-size:18px}
.pcard h3{font-size:19px;font-weight:800}
.pstats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.pstats div{background:var(--panel-2);border:1px solid var(--line-soft);border-radius:3px;padding:4px}
.pstats b{display:block;font-family:var(--display);font-size:18px}
.comp{display:grid;grid-template-columns:320px minmax(0,1fr);gap:14px;align-items:start}
.clist{max-height:70vh;overflow-y:auto}
.citem{display:block;width:100%;text-align:left;padding:9px 12px;background:none;border:0;border-bottom:1px solid var(--line-soft)}
.citem:hover{background:var(--panel-2)}
.citem.on{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.welcome{max-width:640px;margin:40px auto;padding:28px;text-align:center}
.welcome h1{font-size:34px;font-weight:800;margin-bottom:8px}
.welcome p{color:var(--muted)}

@media (max-width:1180px){
  .body{grid-template-columns:230px minmax(0,1fr)}
  .body .col-actions{grid-column:1 / -1}
  .toprow{grid-template-columns:repeat(6,minmax(0,1fr))}
  .toprow .ac{grid-column:1 / -1;justify-self:center;max-width:120px}
}
@media (max-width:820px){
  .body{grid-template-columns:1fr}
  .vitals{grid-template-columns:1fr 1fr}
  .vitals .vital:first-child{grid-column:1 / -1}
  .toprow{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:22px}
  .banner{grid-template-columns:auto 1fr}
  .bactions{grid-column:1 / -1;flex-direction:row;flex-wrap:wrap;align-items:center}
  .comp{grid-template-columns:1fr}

/* ================= UTIL ================= */
const $ = s=>document.querySelector(s);
const esc = v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sgn = n=>{n=Number(n)||0;return n>=0?"+"+n:"−"+Math.abs(n)};
const clone = o=>JSON.parse(JSON.stringify(o??null));
const rid = ()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const num = (v,d=0)=>{const n=Number(v);return Number.isFinite(n)?n:d};
const fid = (doc,path)=>"f_"+(doc+"|"+path).replace(/[^a-zA-Z0-9]/g,"_");
function attrMod(s){s=num(s,10);if(s<=3)return -2;if(s<=7)return -1;if(s<=13)return 0;if(s<=17)return 1;return 2}
function rand(sides){const a=new Uint32Array(1);crypto.getRandomValues(a);return 1+(a[0]%sides)}
function parseDice(str){
  const out={groups:[],flat:0};const s=String(str||"").replace(/\s+/g,"").toLowerCase();
  const re=/([+-]?)(\d*)d(\d+)|([+-]?)(\d+)/g;let m;
  while((m=re.exec(s))){
    if(m[3]){const n=Math.min(num(m[2]||1,1),50),sd=Math.min(num(m[3],6),1000);out.groups.push({n,s:sd,neg:m[1]==="-"})}
    else if(m[5]){out.flat+=(m[4]==="-"?-1:1)*num(m[5])}
  }
  return out;
}
function rollGroups(p){
  const dice=[];let sum=0;
  p.groups.forEach(g=>{for(let i=0;i<g.n;i++){const v=rand(g.s);dice.push({v,s:g.s});sum+=g.neg?-v:v}});
  return {dice,sum};
}
function initials(n){return (String(n||"?").trim().split(/\s+/).map(w=>w[0]).join("").slice(0,2)||"?").toUpperCase()}
function getPath(obj,path){return path.split(".").reduce((o,k)=>o==null?undefined:o[k],obj)}
function setPathV(obj,path,v){const ks=path.split(".");let o=obj;for(let i=0;i<ks.length-1;i++){if(o[ks[i]]==null)o[ks[i]]=/^\d+$/.test(ks[i+1])?[]:{};o=o[ks[i]]}o[ks[ks.length-1]]=v}
function ago(ts){const s=Math.max(0,(Date.now()-ts)/1000);if(s<60)return "just now";if(s<3600)return Math.floor(s/60)+"m ago";if(s<86400)return Math.floor(s/3600)+"h ago";return Math.floor(s/86400)+"d ago"}

/* ================= STATE ================= */
const S = {

  view:"sheet",current:null,edit:false,tab:"actions",drawer:null,logOpen:false,confirm:null,compSel:null,

try{const v=localStorage.getItem("swn.current");if(v)S.current=v}catch(e){}

function newCharacter(name){
  return {
    name:name||"New Character",class:"Warrior",partials:["Warrior","Expert"],level:1,xp:0,

}
function exampleCharacter(){

    {id:rid(),type:"weapon",name:"Combat Knife",qty:1,location:"readied",equipped:true,enc:1,dmg:"1d4",attr:"STR/DEX",skill:"stab",range:"",mag:0,ammo:0,shock:"1/15",mods:[],description:"Example weapon."},
    {id:rid(),type:"armor",name:"Armored Undersuit",qty:1,location:"readied",equipped:true,enc:0,ac:13,mods:[],description:"Example armor."},

/* ================= DOCS / PERMISSIONS ================= */
const sheetPaths = ()=>Object.keys(S.docs).filter(p=>/^(sheets|local)\//.test(p)).sort((a,b)=>num(S.docs[a].createdAt)-num(S.docs[b].createdAt));
const hbPaths = ()=>Object.keys(S.docs).filter(p=>p.startsWith("homebrew/")).sort((a,b)=>String(S.docs[a].name).localeCompare(String(S.docs[b].name)));
const isMine = p=>!!(S.me&&S.docs[p]&&(S.docs[p].owners||[]).includes(S.me));
const myPaths = ()=>sheetPaths().filter(isMine);
const myPath = ()=>myPaths()[0]||null;
function canEdit(path){
  if(!path||!S.docs[path]||S.denied[path])return false;
  if(S.offline)return true;
  if(S.isGM)return true;
  const d=S.docs[path];
  if(path.startsWith("homebrew/"))return false;
  if(d.locked)return false;
  return isMine(path);
}

/* ================= SAVE QUEUE ================= */
const Q = {}; // path -> {dirty:Set, timer, inflight, inflightKeys:Set}
function q(path){return Q[path]||(Q[path]={dirty:new Set,timer:null,inflight:false,inflightKeys:new Set})}
function markDirty(path,key){
  if(S.offline||path.startsWith("local/"))return;
  const e=q(path);e.dirty.add(key);clearTimeout(e.timer);e.timer=setTimeout(()=>flush(path),550);
}
async function flush(path){
  const e=q(path);if(e.inflight){e.timer=setTimeout(()=>flush(path),300);return}
  if(!e.dirty.size||!S.db)return;
  const keys=[...e.dirty];e.dirty.clear();e.inflight=true;e.inflightKeys=new Set(keys);
  const d=S.docs[path];
  try{
    if(!d){await S.db.doc(path).delete()}
    else if(S.exists[path]){const patch={};keys.forEach(k=>patch[k]=clone(d[k]===undefined?null:d[k]));patch.updatedAt=Date.now();await S.db.doc(path).update(patch)}
    else{await S.db.doc(path).set({...clone(d),updatedAt:Date.now()});S.exists[path]=true}
  }catch(err){
    if(err&&err.code==="permission-denied"){S.denied[path]=true;toastMsg("Couldn't save that change. You don't have permission to edit this sheet. Ask your GM to check your share access.",true);render()}
    else if(err&&err.code==="resource-exhausted"){toastMsg("The free database limit for today was hit. Try again later.",true)}
    else{keys.forEach(k=>e.dirty.add(k));e.timer=setTimeout(()=>flush(path),1500+Math.random()*1000)}
  }finally{e.inflight=false;e.inflightKeys=new Set}
}
function setField(path,field,v){
  const d=S.docs[path];if(!d)return;setPathV(d,field,v);markDirty(path,field.split(".")[0]);
}
async function createDoc(path,data){
  S.docs[path]=data;
  if(S.offline||!S.db){return}
  try{await S.db.doc(path).set(clone(data));S.exists[path]=true}
  catch(err){toastMsg(err&&err.code==="permission-denied"?"You don't have permission to create that.":"Couldn't save. Try again in a moment.",true);delete S.docs[path];render()}
}
async function deleteDoc(path){
  delete S.docs[path];delete S.exists[path];
  if(S.offline||!S.db||path.startsWith("local/"))return;
  try{await S.db.doc(path).delete()}catch(err){toastMsg("Couldn't delete that.",true)}
}
function mergeRemote(path,data){
  const e=Q[path];const local=S.docs[path];
  const merged=clone(data);
  if(e&&local){[...e.dirty,...e.inflightKeys].forEach(k=>{merged[k]=clone(local[k])})}
  S.docs[path]=merged;S.exists[path]=true;
}

/* ================= COMPUTE ================= */
function resolveItem(entry){
  if(entry&&entry.hb){
    const hb=S.docs["homebrew/"+entry.hb];
    if(hb){const r={...clone(hb),id:entry.id,hb:entry.hb,linked:true};["qty","location","equipped","ammo","notes"].forEach(k=>{if(entry[k]!==undefined)r[k]=entry[k]});return r}
    return {...entry,name:(entry.name||"Removed item")+" (removed from compendium)",mods:[],missing:true};
  }
  return entry||{};
}
const isPsy = c=>c.class==="Psychic"||(c.class==="Adventurer"&&(c.partials||[]).includes("Psychic"));
const hasOv = (c,k)=>c.overrides&&c.overrides[k]!==null&&c.overrides[k]!==undefined&&c.overrides[k]!==""&&Number.isFinite(Number(c.overrides[k]));
function compute(c){
  const items=(c.inventory||[]).map(resolveItem);
  const mods=[];
  items.forEach(i=>{if(!i.equipped)return;(i.mods||[]).forEach(m=>{if(i.type==="weapon"&&(m.target==="attack"||m.target==="damage"))return;mods.push({target:m.target,value:num(m.value),src:i.name||"Item"})})});
  (c.effects||[]).forEach(f=>{if(!f.active)return;(f.mods||[]).forEach(m=>mods.push({target:m.target,value:num(m.value),src:(f.name||"Effect")}))});
  const list=t=>mods.filter(m=>m.target===t&&m.value);
  const sum=t=>list(t).reduce((a,m)=>a+m.value,0);
  const br=t=>list(t).map(m=>({l:m.src,v:m.value}));
  const R={items,mods,list,sum,br,score:{},mod:{},skills:{},psy:{},b:{},ov:{}};
  ATTRS.forEach(([k])=>{R.score[k]=num(c.attrs?.[k],10)+sum(k);R.mod[k]=attrMod(R.score[k])});
  const lvl=Math.max(1,Math.min(20,num(c.level,1)));R.level=lvl;
  SKILLS.forEach(([k])=>R.skills[k]=num(c.skills?.[k],-1)+sum("skill:"+k));
  PSY.forEach(([k])=>R.psy[k]=num(c.psy?.[k],-1)+sum("skill:"+k));
  const ovr=(key,auto,parts)=>{if(hasOv(c,key)){R.ov[key]=true;R.b[key]=[...parts,{l:"GM override",v:null,ov:Number(c.overrides[key])}];return Number(c.overrides[key])}R.b[key]=parts;return auto};
  // attack bonus
  const pw=c.class==="Adventurer"&&(c.partials||[]).includes("Warrior");
  let bab, babParts;
  if(c.class==="Warrior"){bab=lvl;babParts=[{l:"Warrior: equals level",v:lvl}]}
  else{bab=Math.floor(lvl/2);babParts=[{l:"Half level, rounded down",v:bab}];if(pw){const x=lvl>=5?2:1;bab+=x;babParts.push({l:"Partial Warrior",v:x})}}
  R.bab=ovr("bab",bab,babParts);
  // saves (target numbers)
  const save=(key,a,b,name)=>{
    const best=a?(R.mod[a]>=R.mod[b]?a:b):null;
    const parts=[{l:"Base",v:16},{l:"Level",v:-lvl}];
    if(best)parts.push({l:"Better of "+a.toUpperCase()+"/"+b.toUpperCase()+" ("+best.toUpperCase()+")",v:-R.mod[best]});
    br("save:"+key).forEach(p=>parts.push({l:p.l,v:-p.v}));br("save:all").forEach(p=>parts.push({l:p.l,v:-p.v}));
    const t=parts.reduce((s,p)=>s+p.v,0);
    return ovr("save_"+key,t,parts);
  };
  R.save={physical:save("physical","str","con"),evasion:save("evasion","dex","int"),mental:save("mental","wis","cha"),luck:save("luck",null,null)};
  // AC
  const armor=items.filter(i=>i.equipped&&i.type==="armor").sort((a,b)=>num(b.ac)-num(a.ac))[0];
  const acParts=[armor?{l:"Armor: "+(armor.name||"armor"),v:num(armor.ac,10)}:{l:"No armor",v:10},{l:"DEX modifier",v:R.mod.dex},...br("ac")];
  R.ac=ovr("ac",acParts.reduce((s,p)=>s+p.v,0),acParts);
  // HP
  const hpParts=[{l:"Rolled max HP",v:num(c.hp?.max)},...br("hpMax")];
  R.hpMax=ovr("hpMax",hpParts.reduce((s,p)=>s+p.v,0),hpParts);
  // strain
  const stParts=[{l:"CON score",v:R.score.con},...br("strainMax")];
  R.strainMax=ovr("strainMax",stParts.reduce((s,p)=>s+p.v,0),stParts);
  R.strainPerm=items.filter(i=>i.type==="cyber"&&i.equipped).reduce((s,i)=>s+num(i.strain)*Math.max(1,num(i.qty,1)),0);
  R.strainTemp=num(c.strain?.temp);R.strainCur=R.strainPerm+R.strainTemp;
  // effort
  R.psychic=isPsy(c);
  if(R.psychic){
    const hi=Math.max(0,...Object.values(R.psy));
    const parts=[{l:"Base",v:1},{l:"Highest psychic skill",v:hi},{l:"Better of WIS/CON",v:Math.max(R.mod.wis,R.mod.con)},...br("effortMax")];
    R.effortMax=Math.max(1,ovr("effortMax",parts.reduce((s,p)=>s+p.v,0),parts));
  }else R.effortMax=0;
  // init
  const inParts=[{l:"DEX modifier",v:R.mod.dex},...br("initiative")];
  R.init=ovr("init",inParts.reduce((s,p)=>s+p.v,0),inParts);
  // encumbrance
  const rParts=[{l:"Half STR score, rounded down",v:Math.floor(R.score.str/2)},...br("readied")];
  const sParts=[{l:"STR score",v:R.score.str},...br("stowed")];
  R.readiedLimit=ovr("readied",rParts.reduce((s,p)=>s+p.v,0),rParts);
  R.stowedLimit=ovr("stowed",sParts.reduce((s,p)=>s+p.v,0),sParts);
  const encOf=loc=>items.filter(i=>(i.location||"stowed")===loc).reduce((s,i)=>s+num(i.enc)*Math.max(0,num(i.qty,1)),0);
  R.readied=encOf("readied");R.stowed=encOf("stowed");
  // xp
  R.nextXp=XP_TABLE[lvl]??null;R.prevXp=XP_TABLE[lvl-1]??0;
  return R;
}
function weaponStats(c,R,w){
  const attrs=String(w.attr||"DEX").split("/").map(s=>s.trim().toLowerCase()).filter(a=>R.mod[a]!==undefined);
  if(!attrs.length)attrs.push("dex");
  let best=attrs[0];attrs.forEach(a=>{if(R.mod[a]>R.mod[best])best=a});
  const am=R.mod[best];
  const sk=w.skill||"shoot";const lv=R.skills[sk]??-1;const sb=lv<0?-2:lv;
  const wAtk=(w.mods||[]).filter(m=>m.target==="attack").reduce((s,m)=>s+num(m.value),0);
  const wDmg=(w.mods||[]).filter(m=>m.target==="damage").reduce((s,m)=>s+num(m.value),0);
  const atkParts=[{l:"Attack bonus",v:R.bab},{l:(SKILL[sk]?.name||sk)+(lv<0?" (untrained)":" "+lv),v:sb},{l:best.toUpperCase()+" modifier",v:am}];
  if(wAtk)atkParts.push({l:"Weapon bonus",v:wAtk});
  R.br("attack").forEach(p=>atkParts.push(p));
  const dmgParts=[{l:best.toUpperCase()+" modifier",v:am}];
  if(wDmg)dmgParts.push({l:"Weapon bonus",v:wDmg});
  R.br("damage").forEach(p=>dmgParts.push(p));
  const atk=atkParts.reduce((s,p)=>s+p.v,0);const dflat=dmgParts.reduce((s,p)=>s+p.v,0);
  let shock=null;const m=/(\d+)\s*\/\s*(?:ac\s*)?(\d+)/i.exec(String(w.shock||""));
  if(m)shock={dmg:Math.max(0,num(m[1])+dflat),ac:num(m[2])};
  const base=String(w.dmg||"1d6");
  const p=parseDice(base);const flatTotal=p.flat+dflat;
  const dmgText=p.groups.map(g=>(g.neg?"-":"")+g.n+"d"+g.s).join("+").replace("+-","-")+(flatTotal?(flatTotal>0?"+":"−")+Math.abs(flatTotal):"");
  return {atk,atkParts,dmgParts,dflat,dmgText:dmgText||String(flatTotal),shock,best,sk,lv};
}

/* ================= ROLLING ================= */
function currentChar(){const p=S.current;return p&&S.docs[p]?{path:p,c:S.docs[p]}:null}
function sitPart(){return S.opts.sit?[{l:"Situational",v:num(S.opts.sit)}]:[]}
function doSkill(key){
  const cur=currentChar();if(!cur)return;const {c}=cur;const R=compute(c);
  const sk=SKILL[key];const lv=R.skills[key];
  const attr=(S.opts.attr==="auto"?sk.attr:S.opts.attr).toLowerCase();
  const n=S.opts.keep3?3:2;const dice=[];for(let i=0;i<n;i++)dice.push({v:rand(6),s:6});
  if(n===3){const lo=dice.reduce((m,d,i)=>d.v<dice[m].v?i:m,0);dice[lo].drop=true}
  const parts=[{l:sk.name+(lv<0?" (untrained)":""),v:lv},{l:attr.toUpperCase(),v:R.mod[attr]},...R.br("skillChecks"),...sitPart()];
  const total=dice.filter(d=>!d.drop).reduce((s,d)=>s+d.v,0)+parts.reduce((s,p)=>s+p.v,0);
  const diff=num(S.opts.diff);
  const line={name:"Check",dice,parts,total,verdict:diff?(total>=diff?["ok","Success"]:["no","Failure"]):null,note:diff?"vs difficulty "+diff:""};
  emitRoll(c,sk.name+" check",[line]);
}
function doSave(key){
  const cur=currentChar();if(!cur)return;const {c}=cur;const R=compute(c);
  const t=R.save[key];const d={v:rand(20),s:20};const parts=sitPart();
  const total=d.v+parts.reduce((s,p)=>s+p.v,0);
  emitRoll(c,key[0].toUpperCase()+key.slice(1)+" save",[{name:"Save",dice:[d],parts,total,verdict:total>=t?["ok","Saved"]:["no","Failed"],note:"needs "+t+"+"}]);
}
function doInit(){
  const cur=currentChar();if(!cur)return;const {c}=cur;const R=compute(c);
  const d={v:rand(8),s:8};const parts=[...R.b.init.filter(p=>!p.ov),...sitPart()];
  const total=R.ov.init?d.v+R.init+num(S.opts.sit):d.v+parts.reduce((s,p)=>s+p.v,0);
  emitRoll(c,"Initiative",[{name:"Initiative",dice:[d],parts:R.ov.init?[{l:"GM override",v:R.init},...sitPart()]:parts,total}]);
}
function doAttack(i,dmgOnly){
  const cur=currentChar();if(!cur)return;const {c}=cur;const R=compute(c);
  const w=R.items[i];if(!w)return;const W=weaponStats(c,R,w);
  const lines=[];
  let crit=false,fumble=false;
  if(!dmgOnly){
    const d={v:rand(20),s:20};crit=d.v===20;fumble=d.v===1;
    const parts=[...W.atkParts,...sitPart()];
    const total=d.v+parts.reduce((s,p)=>s+p.v,0);
    lines.push({name:"To hit",dice:[d],parts,total,verdict:crit?["crit","Natural 20"]:fumble?["no","Natural 1"]:null,note:"vs target AC"});
  }
  const p=parseDice(w.dmg||"1d6");const r=rollGroups(p);
  const dparts=[...(p.flat?[{l:"Weapon",v:p.flat}]:[]),...W.dmgParts];
  lines.push({name:"Damage",dice:r.dice,parts:dparts,total:Math.max(0,r.sum+dparts.reduce((s,x)=>s+x.v,0))});
  if(W.shock&&!dmgOnly)lines.push({name:"Shock",dice:[],parts:[],total:W.shock.dmg,note:"on a miss vs AC "+W.shock.ac+" or lower"});
  emitRoll(c,(w.name||"Weapon")+(dmgOnly?" damage":" attack"),lines);
}
function doCustom(expr){
  const p=parseDice(expr);if(!p.groups.length&&!p.flat){toastMsg("Type dice like 2d6+1 or 1d20.",true);return}
  const r=rollGroups(p);const cur=currentChar();
  emitRoll(cur?cur.c:null,expr,[{name:"Roll",dice:r.dice,parts:p.flat?[{l:"Flat",v:p.flat}]:[],total:r.sum+p.flat}]);
}
function emitRoll(c,label,lines){
  const rec={ts:Date.now(),by:S.me||"",char:c?String(c.name||""):"",player:c?String(c.player||""):"",label,lines};
  showToast(rec);
  if(S.db&&!S.offline){
    S.db.collection("rolls").add(clone(rec)).then(()=>pruneLog()).catch(err=>{toastMsg("Your roll didn't post to the shared game log. Check your connection.",true)});
  }else{S.rolls.unshift({id:rid(),...rec});S.rolls=S.rolls.slice(0,60);render()}
}
let pruneCount=0;
async function pruneLog(){
  if(!S.isGM||++pruneCount%8!==0)return;
  try{const snap=await S.db.collection("rolls").orderBy("ts","desc").limit(400).get();
    const old=snap.docs.slice(150);for(const d of old.slice(0,40)){await S.db.doc("rolls/"+d.id).delete()}}catch(e){}
}

/* ================= TOASTS ================= */
function diceHtml(dice){return dice.map(d=>`<span class="die ${d.drop?"drop":""} ${d.v===d.s&&d.s>2?"max":""} ${d.v===1?"min":""}">${d.v}</span>`).join("")}
function lineHtml(l){
  const f=(l.dice.length?diceHtml(l.dice):"")+l.parts.map(p=>p.ov!=null||!p.v?"":` ${p.v<0?"−":"+"} ${Math.abs(p.v)}`).join("");
  const tip=l.parts.map(p=>p.l+" "+sgn(p.v)).join(", ");
  return `<div class="line"><div><div class="lbl">${esc(l.name)}${l.note?` · <span style="text-transform:none;letter-spacing:0;font-weight:500">${esc(l.note)}</span>`:""}</div><div class="f" title="${esc(tip)}">${f||"&nbsp;"}</div>${l.verdict?`<span class="verdict ${l.verdict[0]}">${esc(l.verdict[1])}</span>`:""}</div><div class="t num">${num(l.total)}</div></div>`;
}
function showToast(rec){
  const el=document.createElement("div");el.className="toast";
  el.innerHTML=`<div class="what">${esc(rec.char?rec.char+" · ":"")}${esc(rec.label)}</div>${(rec.lines||[]).map(lineHtml).join("")}`;
  $("#toasts").appendChild(el);setTimeout(()=>el.remove(),6500);
  while($("#toasts").children.length>3)$("#toasts").firstChild.remove();
}
function toastMsg(msg,err){
  const el=document.createElement("div");el.className="toast"+(err?" err":"");el.innerHTML=`<div>${esc(msg)}</div>`;
  $("#toasts").appendChild(el);setTimeout(()=>el.remove(),7000);
}

      :`<button class="lbl" style="background:none;border:0;padding:0;text-align:left" data-act="rule" data-key="${c.class==="Warrior"||(c.partials||[]).includes("Warrior")&&c.class==="Adventurer"?"bab":"skillcheck"}">${esc(CLASS_TEXT[c.class]?.t||c.class)}</button><span class="hint" style="white-space:pre-wrap">${esc((CLASS_TEXT[c.class]?.d||"").split("\n").pop())}</span>`}</div>
  </section>`;

  const ropts=`<section class="ropts" aria-label="Roll options">
    <span class="lbl">Roll options</span>
    <span class="grp"><span class="hint">Situational</span><button class="iconbtn" data-act="opt-sit" data-d="-1">−</button><span class="num" style="min-width:24px;text-align:center">${sgn(S.opts.sit)}</span><button class="iconbtn" data-act="opt-sit" data-d="1">+</button></span>
    <span class="grp"><label class="hint" for="opt-diff">Difficulty</label><select id="opt-diff" data-opt="diff"><option value="0">None</option>${[6,7,8,9,10,11,12,13,14].map(n=>`<option value="${n}" ${S.opts.diff==n?"selected":""}>${n}${n===6?" (modest)":n===8?" (competent)":n===10?" (hard)":n===12?" (expert)":n===14?" (near impossible)":""}</option>`).join("")}</select></span>
    <span class="grp"><label class="hint" for="opt-attr">Skill attribute</label><select id="opt-attr" data-opt="attr"><option value="auto">Usual</option>${ATTRS.map(a=>`<option value="${a[0].toUpperCase()}" ${S.opts.attr===a[0].toUpperCase()?"selected":""}>${a[0].toUpperCase()}</option>`).join("")}</select></span>
    <label class="toggle"><input type="checkbox" id="opt-keep3" data-opt="keep3" ${S.opts.keep3?"checked":""}>3d6 keep best 2</label>
    <button class="hint" style="background:none;border:0;text-decoration:underline;cursor:help" data-act="rule" data-key="skillcheck">How checks work</button>
  </section>`;

  const saves=`<div class="frame"><div class="frame-h"><h3>Saving Throws</h3><button class="iconbtn" data-act="rule" data-key="saves" aria-label="Saving throw rules">?</button></div><div class="frame-b"><div class="saves">
    ${["physical","evasion","mental","luck"].map(k=>`<div class="save"><button class="lbl" style="background:none;border:0;padding:0" data-act="rule" data-key="save_${k}">${k}${ovBadge(R,"save_"+k)}</button><button class="rollbtn tgt" data-act="roll-save" data-save="${k}" title="Roll 1d20, need ${R.save[k]} or more">${R.save[k]}</button></div>`).join("")}
  </div><p class="hint" style="margin:8px 0 0">Roll 1d20 and meet or beat the number.</p></div></div>`;

  const enc=`<div class="frame enc"><div class="frame-h"><h3>Encumbrance</h3><button class="iconbtn" data-act="rule" data-key="enc" aria-label="Encumbrance rules">?</button></div><div class="frame-b">
    <div class="row"><span>Readied</span><span class="num">${R.readied} / ${R.readiedLimit}${ovBadge(R,"readied")}</span></div><div class="meter"><i class="${R.readied>R.readiedLimit?"over":""}" style="width:${Math.min(100,R.readiedLimit?R.readied/R.readiedLimit*100:100)}%"></i></div>
    <div class="row"><span>Stowed</span><span class="num">${R.stowed} / ${R.stowedLimit}${ovBadge(R,"stowed")}</span></div><div class="meter"><i class="${R.stowed>R.stowedLimit?"over":""}" style="width:${Math.min(100,R.stowedLimit?R.stowed/R.stowedLimit*100:100)}%"></i></div>
    ${R.readied>R.readiedLimit||R.stowed>R.stowedLimit?`<p class="hint" style="color:var(--bad);margin:0">Over your limit: you're slowed.</p>`:""}
  </div></div>`;

  const pips=lv=>`<span class="pips ${lv<0?"un":""}" title="${lv<0?"Untrained":"Level "+lv}">${[1,2,3,4].map(i=>`<i class="${lv>=i?"f":""}"></i>`).join("")}</span>`;
  const skillRow=(k,name,group,attrLbl)=>{
    const lv=group==="psy"?R.psy[k]:R.skills[k];const base=num(c[group]?.[k],-1);
    const a=(S.opts.attr==="auto"?attrLbl:S.opts.attr);
    const tot=group==="psy"?null:lv+R.mod[(a||"int").toLowerCase()]+R.sum("skillChecks")+num(S.opts.sit);
    return `<li>${E?`<span class="skedit"><button class="iconbtn" data-act="skill" data-g="${group}" data-k="${k}" data-d="-1" aria-label="Lower ${name}">−</button><span class="num" style="min-width:16px;text-align:center">${base}</span><button class="iconbtn" data-act="skill" data-g="${group}" data-k="${k}" data-d="1" aria-label="Raise ${name}">+</button></span>`:pips(lv)}
      <button class="sname ${lv<0?"untr":""}" data-act="rule" data-key="skill_${k}">${esc(name)}${lv!==base?` <span class="tag hb" title="Changed by items">${sgn(lv-base)}</span>`:""}</button>
      <span class="sattr">${group==="psy"?"":esc(a)}</span>
      ${group==="psy"?`<span class="num" style="text-align:center">${lv<0?"—":lv}</span>`:`<button class="rollbtn" data-act="roll-skill" data-skill="${k}" title="Roll 2d6 ${sgn(tot)}">${sgn(tot)}</button>`}</li>`;
  };
  const skills=`<div class="frame"><div class="frame-h"><h3>Skills</h3><button class="iconbtn" data-act="rule" data-key="skilllevels" aria-label="Skill level rules">?</button></div><div class="frame-b" style="padding-top:4px">
    <ul class="skills">${SKILLS.map(s=>skillRow(s[0],s[1],"skills",s[2])).join("")}</ul>
    ${R.psychic||E?`<div class="lbl" style="margin:12px 0 4px;color:var(--info)">Psychic disciplines</div><ul class="skills">${PSY.map(s=>skillRow(s[0],s[1],"psy","")).join("")}</ul>`:""}
  </div></div>`;

  const tabs=[["actions","Actions"],["inventory","Inventory"],["features","Foci & Features"],["notes","Notes"]];
  if(S.isGM||S.offline)tabs.push(["gm","GM Tools"]);
  if(!tabs.find(t=>t[0]===S.tab))S.tab="actions";
  const tabBody={actions:()=>renderActions(path,c,R,can),inventory:()=>renderInventory(path,c,R,can),features:()=>renderFeatures(path,c,R,E),notes:()=>renderNotes(path,c,can),gm:()=>renderGM(path,c,R)}[S.tab]();
  const panel=`<div class="frame col-actions"><div class="tabs" role="tablist">${tabs.map(t=>`<button class="tab ${S.tab===t[0]?"on":""}" role="tab" aria-selected="${S.tab===t[0]}" data-act="tab" data-tab="${t[0]}">${t[1]}</button>`).join("")}</div><div class="tabbody">${tabBody}</div></div>`;

  return `${banner}<section class="toprow">${attrs}${acSvg}</section>${vitals}${ropts}
    <section class="body"><div class="stack">${saves}${enc}</div><div class="stack">${skills}</div>${panel}</section>`;
}

function renderActions(path,c,R,can){
  const weapons=R.items.map((w,i)=>({w,i})).filter(x=>x.w.type==="weapon");
  const rows=weapons.map(({w,i})=>{const W=weaponStats(c,R,w);return `<tr>
    <td><button class="iname" data-act="item" data-i="${i}">${esc(w.name||"Weapon")}${w.linked?`<span class="tag hb">Homebrew</span>`:""}${!w.equipped?`<span class="tag">Not equipped</span>`:""}</button><span class="isub">${esc(SKILL[W.sk]?.name||W.sk)} · ${esc(W.best.toUpperCase())}${w.range?" · "+esc(w.range)+" m":""}</span></td>
    <td><button class="rollbtn" data-act="attack" data-i="${i}" title="1d20 ${sgn(W.atk)} — click for to-hit and damage">${sgn(W.atk)}</button></td>
    <td><button class="rollbtn" data-act="damage" data-i="${i}" title="Roll damage only">${esc(W.dmgText)}</button></td>
    <td>${W.shock?`<button class="rollbtn" style="cursor:help" data-act="rule" data-key="shock">${W.shock.dmg}/AC ${W.shock.ac}</button>`:`<span class="hint">—</span>`}</td>
    <td class="num">${num(w.mag)>0?`${can?`<button class="iconbtn" data-act="ammo" data-i="${i}" data-d="-1" aria-label="Use ammo">−</button> `:""}${num(w.ammo)}/${num(w.mag)}${can?` <button class="btn sm ghost" data-act="reload" data-i="${i}">Reload</button>`:""}`:`<span class="hint">—</span>`}</td></tr>`}).join("");
  const cls=CLASS_TEXT[c.class];
  return `<div class="sect"><span class="lbl">Attacks <button class="hint" style="background:none;border:0;cursor:help;text-transform:none;letter-spacing:0" data-act="rule" data-key="attack">how attacks work</button></span>
    ${weapons.length?`<div class="tbl-wrap"><table><thead><tr><th>Weapon</th><th>Hit</th><th>Damage</th><th>Shock</th><th>Ammo</th></tr></thead><tbody>${rows}</tbody></table></div>`:`<div class="empty">No weapons yet. Add one from the Inventory tab.</div>`}
    <p class="hint">Click Hit to roll to-hit and damage together. Natural 20 always hits; natural 1 always misses.</p></div>
    <div class="sect"><span class="lbl">Class abilities</span>
      <div class="feature"><h4>${esc(cls?.t||c.class)}</h4><p>${esc(cls?.d||"")}</p></div>
      ${c.class==="Adventurer"?(c.partials||[]).map(p=>`<div class="feature"><h4>Partial ${esc(p)}</h4><p>${esc(PARTIAL_TEXT[p]||"")}</p></div>`).join(""):""}
    </div>
    <div class="sect"><span class="lbl">In combat</span><p class="hint" style="margin:0">Each round you get one Main Action, one Move Action, and as many Instant actions as the situation allows. Use the game log for anything else: type dice like 2d6+1.</p></div>`;
}

function renderInventory(path,c,R,can){
  const inv=c.inventory||[];
  const rows=inv.map((e,i)=>{const it=R.items[i];return `<tr>
    <td style="width:30px"><input type="checkbox" aria-label="Equipped" id="${fid(path,"inventory."+i+".equipped")}" data-doc="${esc(path)}" data-path="inventory.${i}.equipped" ${e.equipped?"checked":""} ${can?"":"disabled"}></td>
    <td><button class="iname" data-act="item" data-i="${i}">${esc(it.name||"Item")}${it.linked?`<span class="tag hb">Homebrew</span>`:""}${(it.mods||[]).length?`<span class="tag on">${(it.mods||[]).length} bonus${(it.mods||[]).length>1?"es":""}</span>`:""}</button><span class="isub">${esc((ITEM_TYPES.find(t=>t[0]===it.type)||[0,"Gear"])[1])}${it.type==="armor"?" · AC "+num(it.ac,10):""}${it.type==="cyber"?" · strain "+num(it.strain):""}</span></td>
    <td style="width:70px">${can?inp(path,"inventory."+i+".qty",{type:"number",cls:"inp n",min:0}):num(e.qty,1)}</td>
    <td style="width:150px">${can?sel(path,"inventory."+i+".location",LOCATIONS):esc((LOCATIONS.find(l=>l[0]===e.location)||["","Stowed"])[1])}</td>
    <td class="num" style="width:50px">${num(it.enc)}</td>
    <td style="width:40px">${can?`<button class="iconbtn" data-act="inv-remove" data-i="${i}" aria-label="Remove ${esc(it.name)}">${S.confirm==="inv"+i?"!":"×"}</button>`:""}</td></tr>`}).join("");
  const hb=hbPaths();
  return `${can?`<div class="sect" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <select id="hb-pick" class="inp" style="max-width:260px"><option value="">Add from compendium…</option>${hb.map(p=>`<option value="${esc(p.split("/")[1])}">${esc(S.docs[p].name)} (${esc(S.docs[p].type||"gear")})</option>`).join("")}</select>
      <button class="btn" data-act="inv-add-hb">Add</button><button class="btn ghost" data-act="inv-add-custom">+ Custom item</button></div>`:""}
    ${inv.length?`<div class="tbl-wrap"><table><thead><tr><th title="Equipped items apply their bonuses">Eq.</th><th>Item</th><th>Qty</th><th>Carried</th><th>Enc</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`:`<div class="empty">Nothing carried yet.</div>`}
    ${S.confirm&&S.confirm.startsWith("inv")?`<p class="hint" style="color:var(--bad)">Click the ! again to remove that item.</p>`:""}
    <p class="hint">Check Eq. to equip: equipped armor sets your AC, and equipped items apply their bonuses. <button class="hint" style="background:none;border:0;text-decoration:underline;cursor:help" data-act="rule" data-key="mods">How bonuses apply</button></p>`;
}

function renderFeatures(path,c,R,E){
  const foci=(c.foci||[]).map((f,j)=>E?`<div class="feature"><div class="grid3" style="grid-template-columns:1fr 90px 30px;margin-bottom:6px">${inp(path,"foci."+j+".name",{live:true,ph:"Focus name"})}${sel(path,"foci."+j+".level",[[1,"Level 1"],[2,"Level 2"]])}<button class="iconbtn" data-act="focus-remove" data-j="${j}" aria-label="Remove focus">×</button></div>${ta(path,"foci."+j+".text",{ph:"What it does",rows:3})}</div>`
    :(f.name||f.text)?`<div class="feature"><h4>${esc(f.name||"Focus")} <span class="tag">Level ${num(f.level,1)}</span></h4><p>${esc(f.text)}</p></div>`:"").join("");
  const eff=(c.effects||[]).filter(f=>f.active);
  return `<div class="sect"><span class="lbl">Foci <button class="hint" style="background:none;border:0;cursor:help;text-transform:none;letter-spacing:0" data-act="rule" data-key="foci">what are foci?</button></span>${foci||`<div class="empty">No foci written down yet.${canEdit(path)?" Turn on Edit sheet to add them.":""}</div>`}${E?`<button class="btn sm" data-act="focus-add">+ Add focus</button>`:""}</div>
    <div class="sect"><span class="lbl">Other features & techniques</span>${E?ta(path,"features",{ph:"Psychic techniques, background perks, ship role…",rows:6}):c.features?`<div class="feature"><p>${esc(c.features)}</p></div>`:`<p class="hint">Nothing here yet.</p>`}</div>
    <div class="sect"><span class="lbl">Active effects</span>${eff.length?eff.map(f=>`<div class="feature"><h4>${esc(f.name||"Effect")}</h4><p>${(f.mods||[]).map(m=>esc(TARGET_NAME[m.target]||m.target)+" "+sgn(m.value)).join(", ")||"No bonuses"}</p></div>`).join(""):`<p class="hint">None. Your GM can add conditions and temporary bonuses.</p>`}</div>`;
}
function renderNotes(path,c,can){
  return `<div class="sect"><span class="lbl">Goal</span>${can?inp(path,"goal",{live:true,ph:"What does your character want?"}):`<p>${esc(c.goal||"—")}</p>`}</div>
    <div class="sect"><span class="lbl">Notes</span>${can?ta(path,"notes",{rows:12,ph:"Contacts, debts, ship details, session notes…"}):`<div class="feature"><p>${esc(c.notes||"—")}</p></div>`}</div>`;
}
function modsEditor(doc,base,dis){
  const mods=getPath(S.docs[doc],base)||[];
  return `${mods.map((m,j)=>`<div class="modrow">${sel(doc,base+"."+j+".target",TARGETS,{dis})}${inp(doc,base+"."+j+".value",{type:"number",cls:"inp",dis})}${dis?"":`<button class="iconbtn" data-act="mod-remove" data-doc="${esc(doc)}" data-base="${esc(base)}" data-j="${j}" aria-label="Remove bonus">×</button>`}</div>`).join("")||`<p class="hint">No bonuses.</p>`}
    ${dis?"":`<button class="btn sm" data-act="mod-add" data-doc="${esc(doc)}" data-base="${esc(base)}">+ Add bonus</button>`}`;
}
function renderGM(path,c,R){
  const ovs=[["ac","Armor Class",R.b.ac],["bab","Attack bonus",R.b.bab],["init","Initiative bonus",R.b.init],["hpMax","Max HP",R.b.hpMax],["save_physical","Physical save",R.b.save_physical],["save_evasion","Evasion save",R.b.save_evasion],["save_mental","Mental save",R.b.save_mental],["save_luck","Luck save",R.b.save_luck],["strainMax","Max strain",R.b.strainMax],["effortMax","Max Effort",R.b.effortMax||[]],["readied","Readied limit",R.b.readied],["stowed","Stowed limit",R.b.stowed]];
  const autoOf=parts=>(parts||[]).filter(p=>!p.ov&&p.v!=null).reduce((s,p)=>s+p.v,0);
  const hb=hbPaths();
  return `<div class="sect"><span class="lbl">Control</span>
      <div style="display:flex;gap:16px;flex-wrap:wrap;align-items:center">${chk(path,"locked","Lock sheet (players can't edit)")}${chk(path,"npc","NPC (players can't claim it)")}</div>
      <p class="hint" style="margin:8px 0 0">Claimed on ${(c.owners||[]).length} device${(c.owners||[]).length===1?"":"s"}. ${(c.owners||[]).length?`<button class="btn sm" data-act="release">Release claims</button>`:""}</p>
    </div>
    <div class="sect"><span class="lbl">Quick adjust</span><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <input id="gm-xp" class="inp n" type="number" placeholder="XP" aria-label="XP to award"><button class="btn sm" data-act="gm-xp">Award XP</button>
      <input id="gm-cr" class="inp n" type="number" placeholder="Cr" aria-label="Credits"><button class="btn sm" data-act="gm-cr">Give credits</button>
      <select id="gm-item" class="inp" style="max-width:220px"><option value="">Grant item…</option>${hb.map(p=>`<option value="${esc(p.split("/")[1])}">${esc(S.docs[p].name)}</option>`).join("")}</select><button class="btn sm" data-act="gm-grant">Grant</button>
    </div></div>
    <div class="sect"><span class="lbl">Effects & conditions <button class="hint" style="background:none;border:0;cursor:help;text-transform:none;letter-spacing:0" data-act="rule" data-key="mods">how bonuses apply</button></span>
      ${(c.effects||[]).map((f,j)=>`<div class="feature"><div class="grid3" style="grid-template-columns:1fr auto 30px;margin-bottom:8px;align-items:center">${inp(path,"effects."+j+".name",{live:true,ph:"Effect name"})}${chk(path,"effects."+j+".active","Active")}<button class="iconbtn" data-act="effect-remove" data-j="${j}" aria-label="Remove effect">×</button></div>${modsEditor(path,"effects."+j+".mods",false)}</div>`).join("")}
      <button class="btn sm" data-act="effect-add">+ Add effect</button></div>
    <div class="sect"><span class="lbl">Overrides <button class="hint" style="background:none;border:0;cursor:help;text-transform:none;letter-spacing:0" data-act="rule" data-key="overrides">how overrides work</button></span>
      <div class="grid4">${ovs.map(([k,l,parts])=>`<div class="field"><span class="lbl">${l}</span>${inp(path,"overrides."+k,{type:"number",blank:true,ph:"Auto: "+autoOf(parts)})}</div>`).join("")}</div></div>
    <div class="sect"><span class="lbl">Sheet</span><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-act="dup">Copy as GM sheet</button><button class="btn danger" data-act="del-sheet">${S.confirm==="del"?"Click again to delete":"Delete sheet"}</button></div></div>`;
}

/* ================= PARTY / COMPENDIUM ================= */
function renderParty(){
  const ps=sheetPaths();
  if(!ps.length)return `<div class="empty">No sheets yet.</div>`;
  return `<h2 style="font-size:24px;margin-bottom:12px">Party</h2><div class="pgrid">${ps.map(p=>{const c=S.docs[p];const R=compute(c);const pct=R.hpMax>0?Math.max(0,Math.min(100,num(c.hp?.cur)/R.hpMax*100)):0;
    const owner=c.npc?"NPC":(c.player||"");
    return `<div class="pcard"><div class="top"><span class="av">${esc(initials(c.name))}</span><div style="min-width:0;flex:1"><h3>${esc(c.name||"Unnamed")}</h3><span class="hint">Lv ${R.level} ${esc(c.class)}${owner?" · "+esc(owner):""}</span></div><button class="btn sm" data-act="open" data-doc="${esc(p)}">Open</button></div>
      <div><div class="row" style="display:flex;justify-content:space-between"><span class="lbl">HP</span><span class="num">${num(c.hp?.cur)} / ${R.hpMax}</span></div><div class="hpbar"><i style="width:${pct}%;background:${pct<34?"var(--bad)":pct<67?"var(--warn)":"var(--good)"}"></i></div></div>
      <div class="pstats"><div><span class="lbl">AC</span><b class="num">${R.ac}</b></div><div><span class="lbl">Phys</span><b class="num">${R.save.physical}</b></div><div><span class="lbl">Evas</span><b class="num">${R.save.evasion}</b></div><div><span class="lbl">Ment</span><b class="num">${R.save.mental}</b></div></div>
      <div class="hint">Strain ${R.strainCur}/${R.strainMax}${R.psychic?" · Effort "+Math.max(0,R.effortMax-num(c.effort?.scene)-num(c.effort?.day))+"/"+R.effortMax:""} · ${num(c.credits)} cr</div>
      ${S.isGM||S.offline?`<div style="display:flex;gap:6px"><button class="btn sm d" style="color:var(--bad)" data-act="party-hp" data-doc="${esc(p)}" data-d="-1">−1 HP</button><button class="btn sm" style="color:var(--good)" data-act="party-hp" data-doc="${esc(p)}" data-d="1">+1 HP</button><button class="btn sm" data-act="party-hp" data-doc="${esc(p)}" data-d="full">Full HP</button></div>`:""}
    </div>`}).join("")}</div>`;
}
function itemFields(doc,b,dis){
  const d=getPath(S.docs[doc],b.replace(/\.$/,""))||S.docs[doc];const t=(b?getPath(S.docs[doc],b+"type"):S.docs[doc].type)||"gear";
  const f=(k,l,o={})=>`<div class="field"><span class="lbl">${l}</span>${inp(doc,b+k,{dis,...o})}</div>`;
  return `<div class="grid2">${f("name","Name",{live:true})}<div class="field"><span class="lbl">Type</span>${sel(doc,b+"type",ITEM_TYPES,{dis})}</div></div>
    <div class="grid3" style="margin-top:8px">${f("enc","Encumbrance",{type:"number",min:0})}${f("cost","Cost (cr)",{type:"number",min:0})}${f("tl","Tech level",{type:"number",min:0})}</div>

      ${f("shock","Shock",{live:true,ph:"2/15"})}${f("range","Range (m)",{live:true,ph:"100/300"})}${f("mag","Magazine",{type:"number",min:0})}</div>`:""}

    <div class="field" style="margin-top:10px"><span class="lbl">Automatic bonuses ${t==="weapon"?"(attack/damage apply to this weapon only)":"(apply while equipped)"}</span>${modsEditor(doc,b+"mods",dis)}</div>`;

function itemSummary(it){
  const bits=[];
  if(it.type==="weapon"){bits.push("Damage "+(it.dmg||"—"));if(it.shock)bits.push("Shock "+it.shock);if(it.range)bits.push("Range "+it.range);if(num(it.mag))bits.push("Mag "+it.mag);bits.push((it.attr||"DEX")+" · "+(SKILL[it.skill]?.name||"Shoot"))}
  if(it.type==="armor")bits.push("AC "+num(it.ac,10));
  if(it.type==="cyber")bits.push("System strain "+num(it.strain));
  if(num(it.enc))bits.push("Enc "+it.enc);if(num(it.cost))bits.push(it.cost+" cr");if(num(it.tl))bits.push("TL"+it.tl);
  return bits.join(" · ");
}

function calcHtml(parts,total,neg){
  if(!parts)return "";

  return `<div class="calc">${parts.map((p,i)=>`<div><span>${esc(p.l)}</span><span>${p.ov!=null?p.ov:(plain&&i===0?p.v:sgn(p.v))}</span></div>`).join("")}<div><span>Total</span><span>${total}</span></div></div>`;
}

function applyInput(el){
  const doc=el.dataset.doc,path=el.dataset.path;if(!canEdit(doc))return;
  let v;

  else if(el.dataset.num!==undefined){v=el.value===""?(el.dataset.blank==="null"?null:0):num(el.value)}

    case "hb-del":{const p=t.dataset.doc;if(S.confirm!=="hb"+p){S.confirm="hb"+p;render();break}S.confirm=null;deleteDoc(p);S.compSel=null;render();break}
    case "hb-give":{const p=t.dataset.doc;const gm=S.isGM||S.offline;const target=gm?(cur?cur.path:null):(cur&&isMine(cur.path)?cur.path:myPath());if(!target||!canEdit(target))break;addHb(S.docs[target],target,p.split("/")[1]);toastMsg("Added "+(S.docs[p]?.name||"item")+" to "+(S.docs[target].name||"sheet"));render();break}
    case "claim":{if(!cur||!S.me)break;const owners=[...(cur.c.owners||[])];if(owners.includes(S.me))break;owners.push(S.me);
      S.db.doc(cur.path).update({owners}).then(()=>{cur.c.owners=owners;S.edit=true;render()}).catch(err=>toastMsg(err&&err.code==="permission-denied"?"You can't claim that sheet. It may be locked or an NPC.":"Couldn't claim the sheet. Try again.",true));break}
    case "release":{if(!cur||!S.isGM)break;setField(cur.path,"owners",[]);render();break}
    case "gm-login":S.drawer={kind:"gm"};render();break;
    case "gm-submit":gmSubmit();break;
    case "clear-log":{if(S.confirm!=="log"){S.confirm="log";render();break}S.confirm=null;const ids=S.rolls.map(r=>r.id);S.rolls=[];render();(async()=>{for(const id of ids){try{await S.db.doc("rolls/"+id).delete()}catch(e){}}})();break}
  }
});
function addHb(c,p,id){
  const hb=S.docs["homebrew/"+id];if(!hb)return;
  const inv=c.inventory||[];
  inv.push({id:rid(),hb:id,name:hb.name,qty:1,location:hb.type==="armor"||hb.type==="weapon"||hb.type==="cyber"?"readied":"stowed",equipped:hb.type!=="gear",ammo:num(hb.mag)});
  setField(p,"inventory",inv);
}

/* ================= BOOT ================= */
async function gmSubmit(){
  const k=($("#gm-pass")?.value||"").trim();
  if(!/^[A-Za-z0-9_-]{6,64}$/.test(k)){toastMsg("Use at least 6 letters, numbers, dashes or underscores.",true);return}
  if(!S.db||!S.me){toastMsg("Not connected yet. Try again in a moment.",true);return}
  try{
    if(S.setupDone===false){
      if(($("#gm-pass2")?.value||"").trim()!==k){toastMsg("The two passcodes don't match.",true);return}
      const b=S.db.batch();
      b.set(S.db.doc("config/setup"),{done:true,at:Date.now()});
      b.set(S.db.doc("gmKeys/"+k),{at:Date.now()});
      b.set(S.db.doc("gms/"+S.me),{key:k,at:Date.now()});
      await b.commit();S.setupDone=true;
    }else{
      await S.db.doc("gms/"+S.me).set({key:k,at:Date.now()});
    }
    S.isGM=true;S.drawer=null;toastMsg("GM tools unlocked on this device.");render();
  }catch(err){toastMsg(err&&err.code==="permission-denied"?"That passcode didn't work.":"Couldn't reach the database. Try again.",true)}
}
function startPreview(){
  S.offline=true;S.loading=false;S.isGM=true;
  const ex=exampleCharacter();S.docs["local/example"]=ex;S.exists["local/example"]=true;S.current="local/example";
  S.docs["homebrew/local-ex1"]={name:"Kestrel Mk II Pistol",type:"weapon",dmg:"1d8",attr:"DEX",skill:"shoot",range:"50/150",mag:8,enc:1,cost:350,tl:4,description:"Example homebrew sidearm with a smart-grip. +1 to hit.",mods:[{target:"attack",value:1}]};
  S.docs["homebrew/local-ex2"]={name:"Neural Reflex Wiring",type:"cyber",strain:1,enc:0,cost:15000,tl:5,description:"Example homebrew cyberware.",mods:[{target:"initiative",value:2},{target:"save:evasion",value:1}]};
  render();
}
render();
(async function boot(){
  if(!window.firebase){startPreview();return}
  let db;
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    db=firebase.firestore();
    const cred=await firebase.auth().signInAnonymously();
    S.me=cred.user.uid;
  }catch(e){console.error(e);startPreview();toastMsg("Couldn't connect to the party database, so this is a preview. Check that Anonymous sign-in is turned on in Firebase.",true);return}
  S.db=db;
  try{const g=await db.doc("gms/"+S.me).get();S.isGM=g.exists}catch(e){}
  try{const st=await db.doc("config/setup").get();S.setupDone=st.exists}catch(e){S.setupDone=null}
  render();
  const slowTimer=setTimeout(()=>{S.slow=true;render()},10000);
  let pending=3;const done=snap=>{if(snap&&snap.metadata&&!snap.metadata.fromCache){clearTimeout(slowTimer);S.slow=false}if(pending>0&&--pending===0)S.loading=false};
  const onErr=err=>{clearTimeout(slowTimer);S.loading=false;console.error(err);toastMsg(err&&err.code==="permission-denied"?"The database refused access. Check that the security rules were published.":"Lost the live connection to the party data. Reload the page to reconnect.",true);render()};
  const watch=(coll)=>db.collection(coll).onSnapshot(snap=>{
    const seen=new Set();
    snap.docs.forEach(d=>{const p=coll+"/"+d.id;seen.add(p);mergeRemote(p,d.data())});
    Object.keys(S.docs).forEach(p=>{if(p.startsWith(coll+"/")&&!seen.has(p)&&S.exists[p]&&!(Q[p]&&Q[p].inflight)){delete S.docs[p];delete S.exists[p]}});
    done(snap);render();
  },onErr);
  watch("sheets");watch("homebrew");
  db.collection("rolls").orderBy("ts","desc").limit(60).onSnapshot(snap=>{
    const before=new Set(S.rolls.map(r=>r.id));const first=!S.rollsInit;S.rollsInit=true;
    S.rolls=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(!first){snap.docChanges().forEach(ch=>{if(ch.type==="added"&&!before.has(ch.doc.id)){const r=ch.doc.data();if(r&&r.by!==S.me&&Date.now()-num(r.ts)<15000)showToast(r)}})}
    done(snap);render();
  },onErr);
})();
setInterval(()=>{if(S.logOpen)render()},30000);
</script>
