const PHYS=["str","dex","con"],MENT=["int","wis","cha"];
const isPsyClass=w=>w.cls==="Psychic"||(w.cls==="Adventurer"&&w.partials.includes("Psychic"));
const hasPartial=(w,p)=>w.cls===p||(w.cls==="Adventurer"&&w.partials.includes(p));
function focusSlots(w){
  const s=[{slot:"general",label:"Your focus (any kind)"}];
  if(hasPartial(w,"Expert"))s.push({slot:"expert",label:(w.cls==="Expert"?"Expert":"Partial Expert")+" bonus (non-combat focus)"});
  if(hasPartial(w,"Warrior"))s.push({slot:"warrior",label:(w.cls==="Warrior"?"Warrior":"Partial Warrior")+" bonus (combat focus)"});
  return s;
}
function allFoci(){
  const list=Object.entries(FOCI).map(([k,f])=>houseAdjust({key:k,...f,hb:false}));
  hbFociPaths().forEach(p=>{const f=S.docs[p];list.push({key:"hb:"+p.split("/")[1],name:f.name||"Unnamed focus",type:f.type||"noncombat",skill:f.skill||null,d:f.d||"",l1:f.l1||"",l2:f.l2||"",hb:true,repeat:false})});
  return list;
}
const HOUSE=()=>S.docs["homebrew/_house"]||{};
function houseAdjust(def){if(def&&def.key==="specialist"&&HOUSE().specialistCombat)return {...def,skill:"specialist_any",d:def.d+" House rule: combat skills (Shoot, Stab, Punch) are allowed too."};return def}
const focusDef=key=>houseAdjust(_focusDef(key));
const _focusDef=key=>key&&key.startsWith("hb:")?(()=>{const f=S.docs["foci/"+key.slice(3)];return f?{key,name:f.name,type:f.type,skill:f.skill||null,d:f.d,l1:f.l1,l2:f.l2,hb:true}:null})():(FOCI[key]?{key,...FOCI[key]}:null);
function focusAllowed(w,slot,f){
  if(w.anyFocus)return true;
  const psy=isPsyClass(w);
  if(f.key==="psychic_training"&&!psy)return false;
  if(f.key==="wild_psychic"&&psy)return false;
  if(slot==="expert")return f.type==="noncombat";
  if(slot==="warrior")return f.type==="combat";
  return true;
}

/* Derive everything from wizard state */
function wizDerive(w){
  const D={issues:{},grants:[],skills:Object.fromEntries(SKILLS.map(s=>[s[0],-1])),psy:Object.fromEntries(PSY.map(s=>[s[0],-1])),attrs:{},statLog:[]};
  const issue=(step,msg)=>{(D.issues[step]=D.issues[step]||[]).push(msg)};
  // attributes
  ATTRS.forEach(([k])=>{
    let v=null;
    if(w.attrMethod==="roll"){v=w.rolls[k];if(w.swap14===k)v=14}
    else v=w.arrayAssign[k];
    D.attrs[k]=v==null||v===""?null:num(v);
  });
  if(ATTRS.some(([k])=>D.attrs[k]==null))issue("attributes",w.attrMethod==="roll"?"Roll or enter all six attributes.":"Assign all six array values.");
  if(w.attrMethod==="roll"&&ATTRS.some(([k])=>w.rolls[k]!=null&&(num(w.rolls[k])<3||num(w.rolls[k])>18)))issue("attributes","Rolled scores must be between 3 and 18.");
  if(w.attrMethod==="array"){const used=ATTRS.map(([k])=>w.arrayAssign[k]).filter(v=>v!=null&&v!=="").map(Number);const pool=[...ARRAY_VALUES];let ok=true;used.forEach(v=>{const i=pool.indexOf(v);if(i<0)ok=false;else pool.splice(i,1)});if(!ok)issue("attributes","Each array value can only be used once.")}
  // grant helpers
  const addSkill=(src,spec,choicePath,altPath,step)=>{
    const g={src,spec,choicePath,altPath,step};
    const opts=specOptions(spec);
    let key=opts?wget(choicePath):spec;
    if(opts&&!key){g.need="choice";issue(step,src+": choose "+specName(spec)+".");D.grants.push(g);return}
    g.skill=key;
    const isP=!!PSYK[key];const map=isP?D.psy:D.skills;
    if(map[key]>=1){
      if(isP){g.need="maxed";issue(step,src+": "+specName(key)+" is already level-1.");D.grants.push(g);return}
      g.maxed=true;const alt=altPath?wget(altPath):"";
      if(!alt||!SKILL[alt]||D.skills[alt]>=1){g.need="alt";issue(step,src+": "+specName(key)+" is already level-1, so pick another skill instead.");D.grants.push(g);return}
      g.alt=alt;D.skills[alt]+=1;D.grants.push(g);return;
    }
    map[key]+=1;D.grants.push(g);
  };
  const addStat=(src,spec,aPath,bPath,step)=>{
    const a=wget(aPath),b=wget(bPath);
    const group=spec==="+2phys"?PHYS:spec==="+2ment"?MENT:ATTRS.map(x=>x[0]);
    const g={src,spec,stat:true,aPath,bPath,step};
    if(spec==="+1any"){if(!a||!group.includes(a)){g.need="stat";issue(step,src+": choose which attribute gets +1.");D.grants.push(g);return}D.statLog.push([a,1,src])}
    else{if(!a||!b||!group.includes(a)||!group.includes(b)){g.need="stat";issue(step,src+": choose where the two points go.");D.grants.push(g);return}D.statLog.push([a,1,src]);D.statLog.push([b,1,src])}
    D.grants.push(g);
  };
  // background
  const bg=BG[w.bg];
  if(!bg)issue("background","Choose a background.");
  else{
    addSkill("Background free skill",bg.free,"freeChoice","freeAlt","skills");
    if(w.bgMethod==="quick"){[1,2].forEach(i=>addSkill("Quick skill",bg.quick[i],"quickChoice."+i,"quickAlt."+i,"skills"))}
    else if(w.bgMethod==="pick"){
      w.picks.forEach((p,i)=>{
        if(p.idx===""||p.idx==null){issue("skills","Pick "+(i+1)+": choose a skill from the Learning table.");return}
        const spec=bg.learning[num(p.idx)];
        if(spec==="any_skill"){issue("skills","Pick "+(i+1)+": \"Any Skill\" can't be picked, only rolled.");return}
        addSkill("Learning pick "+(i+1),spec,"picks."+i+".choice","picks."+i+".alt","skills");
      });
    }else{
      w.rollsBg.forEach((r,i)=>{
        const tbl=r.table==="growth"?bg.growth:bg.learning;const v=num(r.value,0);
        if(!v||v<1||v>tbl.length){issue("skills","Roll "+(i+1)+": roll or enter a result on the "+(r.table==="growth"?"Growth (d6)":"Learning (d8)")+" table.");return}
        const spec=tbl[v-1];const src="Roll "+(i+1)+" ("+(r.table==="growth"?"Growth":"Learning")+" "+v+")";
        if(spec.startsWith("+"))addStat(src,spec,"rollsBg."+i+".a","rollsBg."+i+".b","skills");
        else addSkill(src,spec,"rollsBg."+i+".choice","rollsBg."+i+".alt","skills");
      });
    }
  }
  // class
  if(!w.cls)issue("class","Choose a class.");
  if(w.cls==="Adventurer"&&(!w.partials[0]||!w.partials[1]||w.partials[0]===w.partials[1]))issue("class","Pick two different partial classes.");
  // foci
  const slots=focusSlots(w);
  const seen={};D.foci=[];
  slots.forEach((s,i)=>{
    const e=w.foci[i]||{};const f=focusDef(e.key);
    if(!f){issue("foci",s.label+": choose a focus.");return}
    if(!focusAllowed(w,s.slot,f))issue("foci",s.label+": "+f.name+" isn't allowed in this slot.");
    const id=e.key+(f.key==="specialist"?":"+(e.skill||""):"");
    if(seen[id]!=null){const prev=D.foci[seen[id]];if(prev.level>=2||!(f.l2)){issue("foci",f.name+" can't go past level "+prev.level+".");return}prev.level=2;return}
    seen[id]=D.foci.length;D.foci.push({key:e.key,name:f.name,level:1,skill:"",slotIndex:i,note:e.note||""});
  });
  // psychic
  const psy=isPsyClass(w);
  if(psy){
    const n=w.cls==="Psychic"?2:1;
    for(let i=0;i<n;i++){const d=w.psy.picks[i];if(!d||!DISC[d]){issue("psychic","Choose "+(n===2?"two disciplines":"your discipline")+".");continue}D.psy[d]+=1}
    if(n===2&&w.psy.picks[0]&&w.psy.picks[0]===w.psy.picks[1]&&!w.psy.tech)issue("psychic","You took "+PSYK[w.psy.picks[0]].name+" twice: pick your free level-1 technique.");
  }
  // focus bonus skills (in order)
  D.foci.forEach(f=>{
    const def=focusDef(f.key);if(!def||!def.skill)return;
    const i=f.slotIndex;
    if(def.skill==="any_psychic"){
      const ch=wget("foci."+i+".skill");
      if(!ch){issue("foci",def.name+": choose a psychic skill.");return}
      if(w.cls==="Adventurer"&&w.psy.picks[0]&&ch!==w.psy.picks[0])issue("foci",def.name+": Partial Psychics can only train their own discipline.");
      if(D.psy[ch]>=1){issue("foci",def.name+": "+PSYK[ch].name+" is already level-1.");return}
      D.psy[ch]+=1;f.skill=ch;if(D.psy[ch]===1)f.needsTech=ch;return;
    }
    if(f.key==="specialist"){const ch=wget("foci."+i+".skill");f.skill=ch||""}
    addSkill(def.name+" bonus skill",def.skill,"foci."+i+".skill","foci."+i+".alt","foci");
    if(specOptions(def.skill))f.skill=wget("foci."+i+".skill")||f.skill;
  });
  D.foci.forEach(f=>{if(f.needsTech&&!w.ptTech)issue("foci","Psychic Training raised "+PSYK[f.needsTech].name+" to level-1: pick a free level-1 technique.")});
  // hobby
  if(!w.hobby.choice)issue("hobby","Pick your bonus skill.");
  else if(D.skills[w.hobby.choice]>=1)issue("hobby",SKILL[w.hobby.choice].name+" is already level-1. Pick a different skill.");
  else D.skills[w.hobby.choice]+=1;
  D.hobbyOk=w.hobby.choice&&D.skills[w.hobby.choice]<=1;
  // stats
  D.final={...D.attrs};
  D.statLog.forEach(([a,v])=>{if(D.final[a]!=null)D.final[a]=Math.min(18,D.final[a]+v)});
  D.mods=Object.fromEntries(ATTRS.map(([k])=>[k,D.final[k]==null?0:attrMod(D.final[k])]));
  // hp
  D.hpBonus=hasPartial(w,"Warrior")?2:0;
  const die=num(w.hp.die,0);
  if(!die||die<1||die>6)issue("hp","Roll or enter your hit point die (1–6).");
  D.hp=die?Math.max(1,die+D.mods.con+D.hpBonus):null;
  D.dieHard=D.foci.some(f=>f.key==="die_hard");
  // equipment
  if(w.equip.mode==="package"&&!PACKAGES[w.equip.pkg])issue("equipment","Choose an equipment package.");
  if(w.equip.mode==="credits"){const a=num(w.equip.d1,0),b=num(w.equip.d2,0);if(a<1||a>6||b<1||b>6)issue("equipment","Roll or enter both dice for your starting credits.");else D.credits=(a+b)*100}
  if(!w.name.trim())issue("review","Give your character a name.");
  D.techniques=[];
  if(psy&&w.psy.tech&&w.psy.picks[0]===w.psy.picks[1])D.techniques.push([w.psy.picks[0],w.psy.tech]);
  D.foci.forEach(f=>{if(f.needsTech&&w.ptTech)D.techniques.push([f.needsTech,w.ptTech])});
  return D;
}

function wInp(p,{type="text",ph="",min,max,live=false,cls="inp",style=""}={}){
  const v=wget(p);
  return `<input id="w_${p.replace(/[^a-zA-Z0-9]/g,"_")}" class="${cls}" type="${type}" data-w="${esc(p)}" ${type==="number"?"data-num":""} ${live?"data-wlive":""} value="${esc(v??"")}" placeholder="${esc(ph)}" ${min!=null?`min="${min}"`:""} ${max!=null?`max="${max}"`:""} style="${style}">`;
}
function wSel(p,opts,{blank="Choose…",style=""}={}){
  const v=wget(p);
  return `<select id="w_${p.replace(/[^a-zA-Z0-9]/g,"_")}" class="inp" data-w="${esc(p)}" style="${style}">${blank!=null?`<option value="">${esc(blank)}</option>`:""}${opts.map(o=>{const[val,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(val)}" ${String(v??"")===String(val)?"selected":""}>${esc(l)}</option>`}).join("")}</select>`;
}
const skillOpts=keys=>keys.map(k=>[k,specName(k)]);
function rollBox(p,sides,n,label){
  const det=S.wiz.rollDice[p];
  return `<span class="rollpair"><button class="btn sm" data-act="wroll" data-path="${esc(p)}" data-sides="${sides}" data-n="${n}" title="Roll ${n}d${sides}">🎲 Roll ${n}d${sides}</button>
    ${wInp(p,{type:"number",min:n,max:n*sides,cls:"inp n",ph:"—"})}${det?`<span class="hint">${det.map(d=>`<span class="die">${d}</span>`).join("")}</span>`:`<span class="hint">or type your roll</span>`}</span>`;
}
function grantFix(g,D){
  // inline choice controls for a grant
  let h="";
  const opts=specOptions(g.spec);
  if(g.stat){
    const group=g.spec==="+2phys"?PHYS:g.spec==="+2ment"?MENT:ATTRS.map(x=>x[0]);
    const o=group.map(k=>[k,k.toUpperCase()]);
    h+=g.spec==="+1any"?wSel(g.aPath,o,{blank:"+1 to…",style:"max-width:120px"}):`${wSel(g.aPath,o,{blank:"1st point",style:"max-width:110px"})} ${wSel(g.bPath,o,{blank:"2nd point",style:"max-width:110px"})}<span class="hint"> same twice = +2 to one</span>`;
    return h;
  }
  if(opts)h+=wSel(g.choicePath,skillOpts(opts),{blank:specName(g.spec)+"…",style:"max-width:170px"});
  if(g.maxed||g.need==="alt")h+=` <span class="hint">already level-1 →</span> ${wSel(g.altPath,skillOpts(SKILLS.map(s=>s[0]).filter(k=>D.skills[k]<1||k===wget(g.altPath))),{blank:"pick another",style:"max-width:150px"})}`;
  return h;
}
function grantLine(g,D){
  let result="";
  if(g.stat){const a=wget(g.aPath),b=wget(g.bPath);result=g.spec==="+1any"?(a?"+1 "+a.toUpperCase():""):(a&&b?(a===b?"+2 "+a.toUpperCase():"+1 "+a.toUpperCase()+", +1 "+b.toUpperCase()):"")}
  else if(g.need)result="";
  else if(g.alt)result=specName(g.alt)+" (instead of "+specName(g.skill)+")";
  else if(g.skill)result=specName(g.skill);
  return `<div class="grant ${g.need?"need":""}"><span class="gsrc">${esc(g.src)}</span><span class="gspec">${esc(specName(g.spec))}</span><span class="gfix">${grantFix(g,D)}</span><span class="gres">${result?"→ "+esc(result):""}</span></div>`;
}

function renderWizard(){
  const w=S.wiz;const D=wizDerive(w);const st=WSTEPS[w.step][0];
  const psyOn=isPsyClass(w);
  const steps=WSTEPS.map(([k,l],i)=>{const skip=k==="psychic"&&!psyOn;const bad=(D.issues[k]||[]).length;return `<button class="wstep ${i===w.step?"on":""} ${skip?"skip":""}" data-act="wgo" data-i="${i}"><span class="wnum">${skip?"–":bad?"!":"✓"}</span>${l}</button>`}).join("");
  const body=({concept:wConcept,attributes:wAttributes,background:wBackground,skills:wSkills,class:wClass,foci:wFoci,hobby:wHobby,psychic:wPsychic,hp:wHp,equipment:wEquip,review:wReview}[st])(w,D);
  const iss=(D.issues[st]||[]);
  return `<section class="sheethead"><div class="sheethead-in" style="grid-template-columns:minmax(0,1fr) auto"><div><div class="cname">Create a Character</div><div class="csub"><span>Stars Without Number, step by step. Your progress saves on this device.</span></div></div>
    <div class="bactions"><button class="btn dk" data-act="create-mine" title="Skip the wizard and fill in a blank sheet yourself">Blank sheet instead</button><button class="btn dk" data-act="wreset">${S.confirm==="wreset"?"Click again to start over":"Start over"}</button><button class="btn dk" data-act="view" data-v="sheet">Exit</button></div></div></section>
    <div class="wiz"><nav class="frame wsteps">${steps}</nav>
    <div class="stack"><div class="frame"><div class="frame-b wbody" style="padding:18px 20px">${body}
      ${iss.length&&st!=="review"?`<div class="wissues">${iss.map(x=>`<div>• ${esc(x)}</div>`).join("")}</div>`:""}</div>
      <div class="wnav"><button class="btn" data-act="wprev" ${w.step===0?"disabled":""}>Back</button><span class="hint">Step ${w.step+1} of ${WSTEPS.length}</span>${w.step<WSTEPS.length-1?`<button class="btn pri" data-act="wnext">Next</button>`:`<span></span>`}</div></div></div></div>`;
}
const wh=(t,p)=>`<h2 class="wh">${t}</h2>${p?`<p class="wlead">${p}</p>`:""}`;

function wConcept(w){
  return wh("Who are you playing?","Your hero is an adventurer in the year 3200 who has left their old life behind for the stars. Every character should start with a goal, something that gives them a reason to go out and act.")+
  `<div class="grid2"><div class="field"><span class="lbl">Character name</span>${wInp("name",{live:true,ph:"e.g. Basil Hayes"})}</div><div class="field"><span class="lbl">Player name</span>${wInp("player",{live:true,ph:"Your name"})}</div>
   <div class="field"><span class="lbl">Homeworld</span>${wInp("homeworld",{live:true,ph:"Ask your GM for options"})}</div><div class="field"><span class="lbl">Species</span>${wInp("species",{live:true})}</div></div>
   <div class="field" style="margin-top:8px"><span class="lbl">Goal</span>${wInp("goal",{live:true,ph:"e.g. Be known as the greatest pilot in the sector"})}</div>
   <div class="wport">${w.portrait?`<span class="portrait hasimg"><img src="${esc(w.portrait)}" alt=""></span>`:`<span class="portrait">${esc(initials(w.name||"?"))}</span>`}<label class="btn">${w.portrait?"Change picture":"Add a picture"}<input type="file" accept="image/*" data-wportrait hidden></label>${w.portrait?`<button class="btn ghost" data-act="wset" data-path="portrait" data-v="">Remove</button>`:""}<span class="hint">Optional. The picture is cropped to a square from the center.</span></div>
   <p class="hint" style="margin-top:12px">You can change all of this later. Name is required before you create the sheet.</p>`;
}
function wAttributes(w,D){
  const m=w.attrMethod;
  let h=wh("Attributes","Attributes range from 3 to 18. Rolls use the modifier, not the score: 3 is −2, 4–7 is −1, 8–13 is +0, 14–17 is +1, and 18 is +2.")+
  `<div class="seg"><button class="${m==="roll"?"on":""}" data-act="wset" data-path="attrMethod" data-v="roll">Roll 3d6 in order</button><button class="${m==="array"?"on":""}" data-act="wset" data-path="attrMethod" data-v="array">Use the standard array</button></div>`;
  if(m==="roll"){
    h+=`<p class="hint">Roll 3d6 for each attribute in order (or roll real dice and type the totals). Then you may change any one score to 14.</p><div style="margin:8px 0"><button class="btn sm" data-act="wrollall">🎲 Roll all six</button></div>`;
    h+=`<table class="wtable"><thead><tr><th>Attribute</th><th>Roll</th><th>Set to 14</th><th>Score</th><th>Mod</th></tr></thead><tbody>${ATTRS.map(([k,n])=>`<tr><td><b>${n}</b></td><td>${rollBox("rolls."+k,6,3)}</td><td><label class="toggle"><input type="radio" name="swap14" data-act="wset" data-path="swap14" data-v="${k}" ${w.swap14===k?"checked":""}>14</label></td><td class="num big2">${D.attrs[k]??"—"}</td><td class="num big2">${D.attrs[k]!=null?sgn(attrMod(D.attrs[k])):""}</td></tr>`).join("")}</tbody></table>
    ${w.swap14?`<button class="btn sm ghost" data-act="wset" data-path="swap14" data-v="">Don't change any score to 14</button>`:""}`;
  }else{
    const used=ATTRS.map(([k])=>w.arrayAssign[k]).filter(v=>v!=null&&v!=="").map(Number);
    h+=`<p class="hint">Assign 14, 12, 11, 10, 9 and 7 however you like. (With the array you can't also swap in a 14.)</p><table class="wtable"><thead><tr><th>Attribute</th><th>Value</th><th>Mod</th></tr></thead><tbody>${ATTRS.map(([k,n])=>{const cur=w.arrayAssign[k];const pool=[...ARRAY_VALUES];used.forEach(v=>{const i=pool.indexOf(v);if(i>=0)pool.splice(i,1)});const opts=[...new Set([...(cur!=null&&cur!==""?[Number(cur)]:[]),...pool])].sort((a,b)=>b-a);
      return `<tr><td><b>${n}</b></td><td>${wSel("arrayAssign."+k,opts.map(v=>[v,v]),{blank:"—",style:"max-width:90px"})}</td><td class="num big2">${D.attrs[k]!=null?sgn(attrMod(D.attrs[k])):""}</td></tr>`}).join("")}</tbody></table>`;
  }
  h+=`<div class="wnote"><b>What they do:</b> STR melee and carrying · DEX ranged attacks, AC, initiative · CON hit points, system strain · INT technical and academic skills · WIS perception, psychic Effort · CHA social skills. Background rolls may raise these later.</div>`;
  return h;
}
function wBackground(w){
  const cards=BG_ORDER.map((k,i)=>{const b=BG[k];return `<button class="bgcard ${w.bg===k?"on":""}" data-act="wset" data-path="bg" data-v="${k}"><span class="bgn">${i+1}. ${b.name}</span><span class="isub">${esc(b.tag)}</span><span class="isub">Free skill: <b>${esc(specName(b.free))}</b></span></button>`}).join("");
  return wh("Background","What did your hero do before adventuring? You get that background's free skill at level-0, plus more skills on the next step.")+
  `<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px"><button class="btn sm" data-act="wrollbg">🎲 Roll d20 for a random background</button><span class="hint">or type a d20 result:</span><input class="inp n" type="number" min="1" max="20" id="w_bgnum" data-act-input="bgnum" placeholder="—"></div>
   <div class="bggrid">${cards}</div>`;
}
function wSkills(w,D){
  const bg=BG[w.bg];
  if(!bg)return wh("Background Skills")+`<div class="empty">Choose a background first.</div>`;
  const m=w.bgMethod;
  const tbl=(name,die,arr)=>`<div class="frame" style="padding:10px 12px"><div class="lbl" style="margin-bottom:4px">${name} (${die})</div>${arr.map((s,i)=>`<div class="trow"><span class="num">${i+1}</span><span>${esc(specName(s))}</span></div>`).join("")}</div>`;
  let h=wh(bg.name+" skills",(specOptions(bg.free)?"Your free skill is <b>"+esc(specName(bg.free))+"-0</b> (choose which below).":"You already have <b>"+esc(specName(bg.free))+"-0</b>.")+" Now choose how to get the rest. Taking a skill a second time raises it to level-1; nobody starts above level-1, so a third time lets you pick a different skill instead.")+
  `<div class="seg"><button class="${m==="quick"?"on":""}" data-act="wset" data-path="bgMethod" data-v="quick">Quick skills</button><button class="${m==="pick"?"on":""}" data-act="wset" data-path="bgMethod" data-v="pick">Pick 2 from Learning</button><button class="${m==="roll"?"on":""}" data-act="wset" data-path="bgMethod" data-v="roll">Roll 3 times</button></div>
  <p class="hint">${m==="quick"?"The three skills most important to the profession, all at level-0.":m==="pick"?"Choose exactly the skills you want from the Learning table (you can pick the same one twice). \"Any Skill\" entries can only be rolled.":"Split three rolls between the Growth table (d6, can raise attributes) and the Learning table (d8). Roll here or roll real dice and type the result."}</p>
  <div class="grid2" style="margin:10px 0">${tbl("Growth","d6",bg.growth)}${tbl("Learning","d8",bg.learning)}</div>`;
  if(m==="pick"){
    h+=`<div class="grid2">${w.picks.map((p,i)=>`<div class="field"><span class="lbl">Pick ${i+1}</span>${wSel("picks."+i+".idx",bg.learning.map((s,j)=>[j,(j+1)+". "+specName(s)]).filter(o=>bg.learning[o[0]]!=="any_skill"))}</div>`).join("")}</div>`;
  }
  if(m==="roll"){
    h+=`<div class="stack" style="gap:8px">${w.rollsBg.map((r,i)=>{const sides=r.table==="growth"?6:8;const tb=r.table==="growth"?bg.growth:bg.learning;const v=num(r.value,0);
      return `<div class="rollrow"><b>Roll ${i+1}</b>${wSel("rollsBg."+i+".table",[["growth","Growth (d6)"],["learning","Learning (d8)"]],{blank:null,style:"max-width:150px"})}${rollBox("rollsBg."+i+".value",sides,1)}<span class="gres">${v>=1&&v<=tb.length?"= "+esc(specName(tb[v-1])):""}</span></div>`}).join("")}</div>`;
  }
  const g=D.grants.filter(x=>x.step==="skills");
  h+=`<div class="lbl" style="margin:16px 0 6px">What you get</div><div class="grants">${g.map(x=>grantLine(x,D)).join("")||`<p class="hint">Nothing yet.</p>`}</div>`;
  h+=skillSummary(D);
  return h;
}
function skillSummary(D){
  const have=SKILLS.filter(s=>D.skills[s[0]]>=0).map(s=>`${s[1]}-${D.skills[s[0]]}`);
  const ph=PSY.filter(s=>D.psy[s[0]]>=0).map(s=>`${s[1]}-${D.psy[s[0]]}`);
  const st=D.statLog.length?`<div class="hint" style="margin-top:4px">Attribute boosts: ${D.statLog.map(([a,v,s])=>"+"+v+" "+a.toUpperCase()).join(", ")}</div>`:"";
  return `<div class="wnote"><b>Skills so far:</b> ${have.concat(ph).join(", ")||"none"}${st}</div>`;
}
function wClass(w){
  const cards=[["Warrior","Hardened combatant. Attack bonus +1 at 1st level (equal to level), +2 hit points per level, a bonus combat focus, and once per scene turn a miss into a hit or negate a hit on you."],
    ["Expert","Best at non-combat skills. A bonus non-combat focus, an extra skill point each level, and once per scene reroll a failed skill check."],
    ["Psychic","Trained to control psychic powers. Pick two psychic disciplines and fuel techniques with Effort."],
    ["Adventurer","A mix: choose two partial classes and get a weaker version of each."]];
  let h=wh("Class","Your class is your hero's best set of tools for dealing with problems. It doesn't have to match your background.")+
    `<div class="clsgrid">${cards.map(([k,d])=>`<button class="bgcard ${w.cls===k?"on":""}" data-act="wset" data-path="cls" data-v="${k}"><span class="bgn">${k}</span><span class="isub" style="font-size:13px">${esc(d)}</span></button>`).join("")}</div>`;
  if(w.cls==="Adventurer"){
    const pd={Warrior:"Bonus combat focus, +1 attack bonus at 1st and 5th level, +2 hit points per level.",Expert:"Bonus non-combat focus and an extra non-combat skill point each level.",Psychic:"One psychic discipline at level-0 with Effort; you can't learn other disciplines."};
    h+=`<div class="lbl" style="margin:14px 0 6px">Pick two partial classes</div><div class="clsgrid">${PARTIALS.map(p=>{const on=w.partials.includes(p);return `<button class="bgcard ${on?"on":""}" data-act="wpartial" data-v="${p}"><span class="bgn">Partial ${p}</span><span class="isub">${pd[p]}</span></button>`}).join("")}</div>`;
  }
  return h;
}
function focusOption(w,slot,f){return [f.key,f.name+(f.hb?" (homebrew)":"")+(focusAllowed(w,slot,f)?"":" — not allowed here")]}
function wFoci(w,D){
  const slots=focusSlots(w);
  const list=allFoci();
  let h=wh("Foci","A focus is an extra knack, perk, or aptitude. Everyone picks one level of a focus. Experts get a bonus non-combat focus level and Warriors a bonus combat one (Partial versions too). Spend both on the same focus to start at level 2.")+
    `<label class="toggle" style="margin-bottom:10px"><input type="checkbox" data-w="anyFocus" ${w.anyFocus?"checked":""}>GM approved: allow any focus in any slot</label>`;
  h+=slots.map((s,i)=>{
    const e=w.foci[i]||{};const f=focusDef(e.key);
    const groups=[["combat","Combat"],["noncombat","Non-combat"],["psychic","Psychic"],["special","Special"]];
    const sel=`<select class="inp" data-w="foci.${i}.key" id="w_foci_${i}_key"><option value="">Choose a focus…</option>${groups.map(([t,l])=>`<optgroup label="${l}">${list.filter(x=>x.type===t).map(x=>{const[v,lab]=focusOption(w,s.slot,x);return `<option value="${esc(v)}" ${e.key===v?"selected":""}>${esc(lab)}</option>`}).join("")}</optgroup>`).join("")}</select>`;
    let extra="";
    if(f&&f.skill){
      if(f.skill==="any_psychic")extra=`<div class="field" style="margin-top:6px"><span class="lbl">Psychic skill to train</span>${wSel("foci."+i+".skill",PSY.map(p=>[p[0],p[1]]))}</div>`;
      else if(specOptions(f.skill))extra=`<div class="field" style="margin-top:6px"><span class="lbl">Bonus skill: ${esc(specName(f.skill))}</span>${wSel("foci."+i+".skill",skillOpts(specOptions(f.skill)))}</div>`;
      else extra=`<p class="hint">Bonus skill: ${esc(specName(f.skill))}</p>`;
    }
    if(f&&(f.key==="unique_gift"||f.key==="wild_psychic"||f.hb))extra+=`<div class="field" style="margin-top:6px"><span class="lbl">Notes (what exactly you get)</span>${wInp("foci."+i+".note",{live:true})}</div>`;
    return `<div class="frame" style="padding:12px 14px;margin-bottom:10px"><div class="lbl" style="margin-bottom:6px">${esc(s.label)}</div>${sel}
      ${f?`<div class="feature" style="margin-top:8px"><h4>${esc(f.name)}${f.hb?` <span class="tag hb">Homebrew</span>`:""}</h4><p>${esc(f.d||"")}</p><p style="margin-top:6px"><b>Level 1:</b> ${esc(f.l1||"")}</p>${f.l2?`<p style="margin-top:4px"><b>Level 2:</b> ${esc(f.l2)}</p>`:""}</div>`:""}${extra}</div>`;
  }).join("");
  const ptNeed=D.foci.find(f=>f.needsTech);
  if(ptNeed)h+=`<div class="field"><span class="lbl">Free level-1 technique (${esc(PSYK[ptNeed.needsTech].name)})</span>${wSel("ptTech",DISC[ptNeed.needsTech].t1.map(t=>[t[0],t[0]+" — "+t[1]]))}</div>`;
  const g=D.grants.filter(x=>x.step==="foci");
  if(g.length)h+=`<div class="lbl" style="margin:14px 0 6px">Bonus skills from foci</div><div class="grants">${g.map(x=>grantLine(x,D)).join("")}</div>`;
  if(D.foci.length)h+=`<div class="wnote"><b>Your foci:</b> ${D.foci.map(f=>f.name+" "+f.level).join(", ")}</div>`;
  return h;
}
function wHobby(w,D){
  const opts=SKILLS.map(s=>s[0]);
  return wh("Bonus skill","Pick one more non-psychic skill for your hobbies, side interests, or natural talent. It's level-0, or raises a level-0 skill to level-1. You can't pick one that's already level-1.")+
    `<div class="field" style="max-width:320px">${wSel("hobby.choice",opts.map(k=>[k,SKILL[k].name+(D.skills[k]>=0?" (have "+(D.skills[k]-(w.hobby.choice===k?1:0))+")":"")]))}</div>`+(w.hobby.choice?`<div class="feature" style="margin-top:10px"><h4>${esc(SKILL[w.hobby.choice].name)}</h4><p>${esc(SKILL[w.hobby.choice].text)}</p></div>`:"")+skillSummary(D);
}
function wPsychic(w,D){
  if(!isPsyClass(w))return wh("Psychic Powers")+`<div class="empty">Only Psychics and Partial Psychics get psychic powers. Skip this step.</div>`;
  const full=w.cls==="Psychic";
  let h=wh("Psychic Powers",full?"Pick two psychic disciplines at level-0. Pick the same one twice to start at level-1 in it and get a free level-1 technique.":"As a Partial Psychic, pick one discipline at level-0. It's the only one you can ever learn.")+
    `<div class="grid2">${(full?[0,1]:[0]).map(i=>`<div class="field"><span class="lbl">${full?"Discipline pick "+(i+1):"Your discipline"}</span>${wSel("psy.picks."+i,PSY.map(p=>[p[0],p[1]]))}</div>`).join("")}</div>`;
  const chosen=[...new Set(w.psy.picks.slice(0,full?2:1).filter(Boolean))];
  h+=chosen.map(d=>`<div class="feature" style="margin-top:10px"><h4>${esc(PSYK[d].name)}: ${esc(DISC[d].core)}</h4><p>${esc(PSYK[d].text)}</p><p style="margin-top:6px"><b>Level-0 core power:</b> ${esc(DISC[d].l0)}</p></div>`).join("");
  if(full&&w.psy.picks[0]&&w.psy.picks[0]===w.psy.picks[1]){const d=w.psy.picks[0];h+=`<div class="field" style="margin-top:10px"><span class="lbl">Free level-1 technique</span>${wSel("psy.tech",DISC[d].t1.map(t=>[t[0],t[0]+" — "+t[1]]))}</div>`}
  const hi=Math.max(0,...Object.values(D.psy));const better=Math.max(D.mods.wis,D.mods.con);
  const meta=D.psy.metapsionics>=1?1:0;const pt=D.foci.some(f=>f.key==="psychic_training")?1:0;
  h+=`<div class="wnote"><b>Max Effort:</b> 1 + highest psychic skill (${hi}) + better of WIS/CON (${sgn(better)})${meta?" + Metapsionics (1)":""}${pt?" + Psychic Training (1)":""} = <b>${Math.max(1,1+hi+better+meta+pt)}</b></div>`;
  return h;
}
function wHp(w,D){
  return wh("Hit Points","Roll 1d6 and add your CON modifier"+(D.hpBonus?", plus 2 for your Warrior training":"")+". You always have at least 1 hit point.")+
   `<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">${rollBox("hp.die",6,1)}</div>
   <div class="calc" style="max-width:360px"><div><span>Hit die</span><span>${w.hp.die??"—"}</span></div><div><span>CON modifier</span><span>${sgn(D.mods.con)}</span></div>${D.hpBonus?`<div><span>Warrior bonus</span><span>+2</span></div>`:""}<div><span>Max HP</span><span>${D.hp??"—"}</span></div></div>
   ${D.dieHard?`<p class="hint">Die Hard adds +2 more per level on your sheet automatically.</p>`:""}
   <div class="wnote"><b>Also calculated for you on the sheet:</b> attack bonus (${hasPartial(w,"Warrior")?"+1":"+0"} at 1st level), saving throws (15 minus your best modifier of each pair), Armor Class from your armor + DEX, and system strain (max = CON).</div>`;
}
function wEquip(w,D){

    case "wroll":{const n=num(t.dataset.n,1),s=num(t.dataset.sides,6);const dice=Array.from({length:n},()=>rand(s));wset(t.dataset.path,dice.reduce((a,b)=>a+b,0));w.rollDice[t.dataset.path]=dice;saveWiz();render();return true}
    case "wrollall":{ATTRS.forEach(([k])=>{const d=[rand(6),rand(6),rand(6)];w.rolls[k]=d[0]+d[1]+d[2];w.rollDice["rolls."+k]=d});saveWiz();render();return true}
    case "wrollbg":{const v=rand(20);w.bg=BG_ORDER[v-1];saveWiz();toastMsg("Rolled "+v+": "+BG[w.bg].name);render();return true}
    case "wreset":if(S.confirm!=="wreset"){S.confirm="wreset";render();return true}S.confirm=null;S.wiz=newWiz();saveWiz();render();return true;
    case "wcreate":{const D=wizDerive(w);if(Object.values(D.issues).some(v=>v.length))return true;

      toastMsg((c.name||"Your character")+" is ready!");render();window.scrollTo({top:0});return true}
  }
  return false;

/* ================= LEVEL-UP WIZARD ================= */
const SKILL_MIN_LEVEL=[1,1,3,6,9];      // character level needed for skill level 0..4
const BOOST_MIN_LEVEL=[1,1,3,6,9];      // for the 1st..5th attribute boost
const FOCUS_LEVELS=[2,5,7,10];
const LU_STEPS=[["overview","Overview"],["hp","Hit Points"],["focus","New Focus"],["skills","Skill Points"],["review","Review & Apply"]];
const isCombatSkill=k=>COMBAT_SKILLS.includes(k);
const psyRestricted=c=>c.class==="Adventurer"&&(c.partials||[]).includes("Psychic");
const psyDiscOf=c=>PSY.map(p=>p[0]).find(k=>num(c.psy?.[k],-1)>=0)||"";
const hasPartialC=(c,p)=>c.class===p||(c.class==="Adventurer"&&(c.partials||[]).includes(p));

function newLU(path){return {path,step:0,dice:[],spends:[],freeTechs:{},focus:{mode:"",entry:"",key:"",skill:"",note:""}}}
function luGet(p){return getPath(S.lu,p)}
function luSet(p,v){setPathV(S.lu,p,v)}

function luDerive(c,lu){
  const R=compute(c);const L0=num(c.level,1);const L=L0+1;
  const D={issues:{},R,L0,L,log:[]};
  const issue=(st,m)=>{(D.issues[st]=D.issues[st]||[]).push(m)};
  D.xpNeed=XP_TABLE[L0]??(93+24*(L-10));D.xpOk=num(c.xp)>=D.xpNeed;
  // ---- hit points
  const con=R.mod.con;D.con=con;D.warrior=hasPartialC(c,"Warrior");
  const dice=Array.from({length:L},(_,i)=>lu.dice[i]);
  D.diceMissing=dice.some(d=>!(num(d,0)>=1&&num(d,0)<=6));
  if(D.diceMissing)issue("hp","Roll or enter all "+L+" hit dice.");
  D.dieVals=dice.map(d=>Math.max(1,num(d,0)+con));
  D.hpRoll=D.dieVals.reduce((a,b)=>a+b,0)+(D.warrior?2*L:0);
  D.oldMax=num(c.hp?.max);
  D.newMax=D.diceMissing?null:(D.hpRoll>D.oldMax?D.hpRoll:D.oldMax+1);
  D.hpTook=D.diceMissing?null:D.hpRoll>D.oldMax;
  // ---- working copies
  const W={skills:clone(c.skills||{}),psy:clone(c.psy||{}),attrs:clone(c.attrs||{}),credit:clone(c.skillCredit||{}),boosts:num(c.attrBoosts),techs:clone(c.techniques||[]),foci:clone(c.foci||[])};
  SKILLS.forEach(([k])=>{if(W.skills[k]==null)W.skills[k]=-1});PSY.forEach(([k])=>{if(W.psy[k]==null)W.psy[k]=-1});
  D.W=W;D.psyGains=[];// [disc, newLevel]
  const restricted=psyRestricted(c);const myDisc=psyDiscOf(c);
  D.isPsychic=isPsy(c);D.restricted=restricted;D.myDisc=myDisc;
  const addPoints=(isP,key,pts)=>{ // focus bonus: 3 points toward a skill, ignoring level minimums
    const map=isP?W.psy:W.skills;pts+=num(W.credit[key]);
    while(map[key]<4){const cost=map[key]+2;if(pts>=cost){map[key]+=1;pts-=cost;if(isP)D.psyGains.push([key,map[key]])}else break}
    W.credit[key]=pts;if(!pts)delete W.credit[key];
  };
  // ---- focus
  D.focusEligible=FOCUS_LEVELS.includes(L);
  if(D.focusEligible){
    const f=lu.focus;
    if(f.mode==="raise"){
      const e=W.foci.find(x=>x.id===f.entry);const def=e?resolveFocus(e):null;
      if(!e)issue("focus","Choose which focus to raise.");
      else if(num(e.level,1)>=2||!def.l2)issue("focus",(def.name||"That focus")+" can't go higher.");
      else{e.level=2;D.focusText=def.name+" → level 2"}
    }else if(f.mode==="new"){
      const def=focusDef(f.key);
      if(!def)issue("focus","Choose a new focus.");
      else{
        const dup=W.foci.some(x=>x.key===f.key&&(f.key!=="specialist"||x.skill===f.skill));
        if(dup)issue("focus","You already have "+def.name+(f.key==="specialist"?" for that skill":"")+". Raise it instead.");
        if(f.key==="psychic_training"&&!D.isPsychic)issue("focus","Psychic Training needs the Psychic class or Partial Psychic.");
        if(f.key==="wild_psychic"&&D.isPsychic)issue("focus","Psychics can't take Wild Psychic Talent.");
        let sk=def.skill;
        if(sk&&specOptions(sk)){sk=f.skill;if(!sk)issue("focus",def.name+": choose its bonus skill.")}
        if(f.key==="psychic_training"&&restricted&&sk&&sk!==myDisc)issue("focus","Partial Psychics can only train their own discipline.");
        W.foci.push({id:rid(),key:f.key,name:def.name,level:1,skill:(f.key==="specialist"||specOptions(def.skill))?(f.skill||""):"",text:f.note||""});
        if(sk&&(SKILL[sk]||PSYK[sk]))addPoints(!!PSYK[sk],sk,3);
        D.focusText=def.name+" level 1"+(sk&&(SKILL[sk]||PSYK[sk])?" (+3 points toward "+specName(sk)+")":"");
      }
    }else issue("focus","Pick a new focus or raise one you have.");
  }
  // ---- skill points
  const gTot=3+num(c.spSaved),eTot=(hasPartialC(c,"Expert")?1:0)+num(c.spSavedExpert);
  let g=gTot,e=eTot,gPsy=0;D.gTot=gTot;D.eTot=eTot;
  D.spendResults=lu.spends.map(sp=>{
    const r={...sp,ok:false};
    const pay=(cost,mundaneNoncombat,psychic)=>{
      let fromE=0;if(mundaneNoncombat){fromE=Math.min(e,cost)}
      const fromG=cost-fromE;if(fromG>g){r.err="Not enough points";return false}
      e-=fromE;g-=fromG;if(psychic)gPsy+=fromG;r.cost=cost;return true;
    };
    if(sp.t==="skill"||sp.t==="psy"){
      const isP=sp.t==="psy";const map=isP?W.psy:W.skills;const next=map[sp.k]+1;
      if(next>4){r.err="Already level-4";return r}
      if(L<SKILL_MIN_LEVEL[next]){r.err="Needs character level "+SKILL_MIN_LEVEL[next];return r}
      if(isP&&restricted&&myDisc&&sp.k!==myDisc){r.err="Partial Psychics can only raise "+PSYK[myDisc].name;return r}
      if(isP&&!D.isPsychic){r.err="Only psychics can learn psychic skills";return r}
      const cr=num(W.credit[sp.k]);const cost=Math.max(0,next+1-cr);
      if(!pay(cost,!isP&&!isCombatSkill(sp.k),isP))return r;
      if(cr)delete W.credit[sp.k];
      map[sp.k]=next;r.ok=true;r.desc=specName(sp.k)+"-"+next;if(isP)D.psyGains.push([sp.k,next]);
    }else if(sp.t==="attr"){
      if(W.boosts>=5){r.err="Max five boosts";return r}
      if(L<BOOST_MIN_LEVEL[W.boosts]){r.err="Boost #"+(W.boosts+1)+" needs level "+BOOST_MIN_LEVEL[W.boosts];return r}
      if(num(W.attrs[sp.k],10)>=18){r.err="Already 18";return r}
      if(!pay(W.boosts+1,false,false))return r;
      W.boosts+=1;W.attrs[sp.k]=num(W.attrs[sp.k],10)+1;r.ok=true;r.desc="+1 "+sp.k.toUpperCase();
    }else if(sp.t==="tech"){
      const T=(TECHS[sp.d]||[]).find(x=>x[0]===sp.k);
      if(!T){r.err="Unknown technique";return r}
      if(W.psy[sp.d]<T[1]){r.err="Needs "+PSYK[sp.d].name+"-"+T[1];return r}
      if(W.techs.some(x=>x.name===sp.k)){r.err="Already known";return r}
      if(!pay(T[1],false,true))return r;
      W.techs.push({disc:sp.d,name:sp.k});r.ok=true;r.desc=sp.k;
    }
    return r;
  });
  D.spendResults.filter(r=>!r.ok).forEach(r=>issue("skills",(r.desc||specName(r.k)||r.k)+": "+r.err+". Remove it from the list."));
  D.gLeft=g;D.eLeft=e;
  if(D.isPsychic&&gPsy<1&&g<1)issue("skills","Psychics must put at least 1 skill point into psychic skills or techniques (or save one for later).");
  // ---- free techniques for each psychic level gained
  D.freeNeeded=D.psyGains.map(([d,lv])=>{
    const slot=d+":"+lv;const pick=lu.freeTechs[slot];
    const opts=(TECHS[d]||[]).filter(t=>t[1]<=lv&&!W.techs.some(x=>x.name===t[0])&&!Object.entries(lu.freeTechs).some(([s,n])=>s!==slot&&n===t[0]));
    if(pick&&!(TECHS[d]||[]).some(t=>t[0]===pick&&t[1]<=lv))return {slot,d,lv,opts,pick:""};
    return {slot,d,lv,opts,pick};
  });
  D.freeNeeded.forEach(f=>{if(f.pick)W.techs.push({disc:f.d,name:f.pick});else if(f.opts.length)issue("skills",PSYK[f.d].name+" reached level-"+f.lv+": pick your free technique.")});
  return D;
}

function renderLevelUp(){

  if(!c){S.view="sheet";return renderSheet()}

  const iss=D.issues[st]||[];

}
function luOverview(c,lu,D){

  <div class="calc" style="max-width:520px">
    <div><span>Hit points</span><span>re-roll ${D.L}d6${D.con?" "+sgn(D.con)+" each":""}${D.warrior?" + "+2*D.L:""}</span></div>
    <div><span>Attack bonus</span><span>${sgn(D.R.bab)} → ${sgn(c.class==="Warrior"?D.L:Math.floor(D.L/2)+(hasPartialC(c,"Warrior")&&c.class==="Adventurer"?(D.L>=5?2:1):0))}</span></div>
    <div><span>Saving throws</span><span>all improve by 1 (Physical ${sv(D.R.save.physical)})</span></div>

    <div><span>New focus</span><span>${D.focusEligible?"Yes, at level "+D.L:"No (next at level "+(FOCUS_LEVELS.find(x=>x>D.L)||"—")+")"}</span></div>
    ${D.isPsychic?`<div><span>Psychic</span><span>a free technique for each psychic skill level gained</span></div>`:""}

  <div class="wnote"><b>How skill points work:</b> raising a skill costs its new level + 1 (level-0 costs 1, level-1 costs 2, level-2 costs 3…). Level-2 needs character level 3, level-3 needs 6, level-4 needs 9. Attribute boosts cost 1, 2, 3, 4, then 5 points. Unspent points are saved for later.</div>`;
}
function luHp(c,lu,D){
  return wh("Hit points","Roll "+D.L+"d6 and add your CON modifier ("+sgn(D.con)+") to each die; no die can go below 1."+(D.warrior?" Warrior training adds "+2*D.L+".":"")+" If the total beats your current maximum ("+D.oldMax+"), you take it. Otherwise your maximum goes up by 1.")+

function readPortrait(file){
  return new Promise((res,rej)=>{
    if(!file||!/^image\//.test(file.type)){rej(new Error("Choose an image file."));return}
    const url=URL.createObjectURL(file);const img=new Image();
    img.onload=()=>{try{const s=Math.min(img.naturalWidth,img.naturalHeight);const cv=document.createElement("canvas");cv.width=cv.height=256;
      const ctx=cv.getContext("2d");ctx.fillStyle="#222";ctx.fillRect(0,0,256,256);
      ctx.drawImage(img,(img.naturalWidth-s)/2,(img.naturalHeight-s)/2,s,s,0,0,256,256);
      URL.revokeObjectURL(url);res(cv.toDataURL("image/jpeg",0.82))}catch(e){rej(e)}};
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("That image couldn't be read."))};
    img.src=url;
  });
}

function renderNPCs(){

  <div class="comp"><div class="frame clist"><div style="padding:8px 10px"><input id="npc-q" class="inp" placeholder="Search NPCs" value="${esc(S.npcQ||"")}"></div>
    ${list.length?list.map(p=>{const n=S.docs[p];return `<button class="citem ${p===sel?"on":""}" data-act="npc-sel" data-doc="${esc(p)}"><b>${esc(n.name||"NPC")}</b>${n.shared?`<span class="tag on">shared</span>`:""}<span class="isub">${esc(n.kind||"")} · HP ${num(n.hp?.cur)}/${num(n.hp?.max)} · AC ${num(n.ac)}</span></button>`}).join(""):`<p class="hint" style="padding:0 14px">${gm?"No NPCs yet. Make one above.":"Nothing shared yet."}</p>`}</div>
  <div class="frame">${sel?npcStatBlock(sel):`<div class="empty" style="margin:12px">${gm?"Create an NPC to see its stat block.":"Select an NPC."}</div>`}</div></div>`;

Object.assign(RULES,{
  ship_cp:{t:"Command Points",p:["Each turn the ship starts at 0 Command Points (CP). Department heads earn CP with Do Your Duty (+1) or Above and Beyond, and spend them on department actions like firing guns.","A department head can take as many actions as there are points to pay for them, and doesn't need permission to spend them. Unspent points are lost when the ship's turn ends.","Haywire Systems crises make the ship start each turn at −2 CP. NPC ships just get a fixed number each turn: 4 for fighters and civilians, 5 for military and pirates, 6 for elite crews, 7 for the very best."]},
  ship_dept:{t:"Departments",p:["Every ship has five departments: bridge, gunnery, engineering, comms and captain. Each PC heads one, ideally the one that suits their skills. One PC can head several.","On the ship's turn, the captain sets the order departments act in. Each head picks actions from their own department's list or the general list, never both in the same turn.","A PC heading several departments acts in only one of them each turn. The others automatically Do Your Duty (+1 CP). A PC who's no good in space combat can run the NPC officer of their department instead."]},
  ship_attack:{t:"Ship Attacks",p:["Hit roll: 1d20 + base attack bonus + the better of Int or Dex modifier + Shoot. On a fighter-class ship, Pilot can be used instead of Shoot. Foci like Gunslinger don't apply unless they say so.","If the total meets or beats the target's AC, roll damage plus the better of Int or Dex modifier. The target's Armor is subtracted from the damage, and the weapon's AP cancels that much Armor (never below 0).","If Armor stops all of the damage, the hit can't disable systems. A Warrior's luck can be used once per fight to hit with ship guns, but not to negate a hit against their ship."]},
  ship_crisis:{t:"Crises",p:["Once per round, instead of taking a hit (right after damage is rolled), the ship can accept a Crisis. Any one department head can ask for it. The hit is negated and the GM rolls on the Crisis table.","Continuing crises stay until someone resolves them. Acute crises do something bad if they're not resolved by the end of the next round.","To resolve one, a PC takes Deal With a Crisis, explains what they're doing, and rolls a fitting skill check, usually against difficulty 10 (8 to 12 depending on the plan). Several PCs can try, or help. All crises end when the fight ends."]},
  ship_drill:{t:"Spike Drills",p:["Needs a target within range (drive rating in hexes), one load of fuel, a rutter (course record), and a pilot at the edge of the system. The navigator rolls Int/Pilot; it takes 30 minutes, or one combat round if rushed.","Base difficulty 7. Uncharted course +6; rutter over 5 years old +2, 1 to 5 years +1, under a year +0, under a month −2; +1 per 2 full hexes; trimming the course +2; rushed +2. At 6 or less, the drill is automatic.","Transit takes 6 days per hex, divided by the drive rating. Trimming the course counts the drive as 1 higher for speed (not range). On a failure, roll 3d6 on the mishap table."]},
  ship_insys:{t:"In-System Travel",p:["Moving within a region takes 6 hours; moving between regions takes 48 hours. Both are divided by the spike drive rating. No Pilot checks are needed in normal conditions.","Bold navigators can trim the course with a difficulty 9 Pilot check to count the drive as 1 higher. On a failure, the trip takes twice as long."]},
  ship_sensors:{t:"Sensors and Pursuit",p:["Detection lock: in the same region, the observer wins an opposed Int/Program check against the ship's comms officer. Observer: fighter +0, frigate +1, cruiser +2, capital +3, minor outpost +2, major station +4, planet +5, passive sensors −2. The target's comms officer rolls Avoid detection: Int/Program plus fighter +3, frigate +2, cruiser +1, capital +0, station −2, +2 if avoiding population centers, +2 with Emissions dampers. If the observer loses or ties, the target stays hidden and the observer can try again in 24 hours.","Scanning: ask one question, then roll Int/Program against difficulty 8. Each later question the same day is +1 harder; a failure ends questions for the day.","Pursuit: both pilots roll opposed Int/Pilot, adding their spike drive ratings. If the pursuer wins or ties, they force an engagement. If the pursued wins, it gets 6 hours of distance (adjusted by the drive difference)."]},
  ship_maint:{t:"Maintenance and Repair",p:["Every six months a ship needs 5% of its non-crew cost in maintenance. Each period skipped gives −1 to all ship skill checks and hit rolls. At −4, the ship has a 10% chance per month of breaking down entirely.","Repairing hit points costs 1,000 credits per point, up to the engineer's Fix skill in points each day. A disabled system can be jury-rigged for a tenth of its cost (one day per 25,000 credits); a jury-rigged system disabled again is destroyed. Full repair of a disabled system costs a quarter of its price.","Fuel costs 500 credits per load. Repairs made during combat don't need to be redone or paid for afterwards."]}
});


Object.assign(RULES,{
  ship_hp:{t:"Hull Points",p:["How much damage the ship can take. At 0, a fighter-class ship is destroyed with all hands.","A larger ship at 0 is mortally damaged: it can take no actions and explodes in 2d6 minutes unless the chief engineer makes an Int/Fix check against difficulty 10. On a success it becomes a burnt-out hulk with every system destroyed.","Ship hulls ignore small arms and TL3 Heavy weapons. Repairs cost 1,000 credits per point, up to the engineer's Fix skill in points per day. Damage Control can patch hull points during a fight."]},
  ship_ac:{t:"Ship Armor Class",p:["A mix of agility and electronic countermeasures. An attack hits if the gunner's roll meets or beats it.","Evasive Maneuvers adds the pilot's Pilot skill until the ship's next turn. Sensor Ghost adds the comms officer's Program skill. Augmented Plating gives +2, Ablative Hull Compartments +1, and Foxer Drones +2 for a round."]},
  ship_armor:{t:"Ship Armor",p:["Plating and redundant systems. Armor is subtracted from the damage of every hit.","A weapon's AP (armor piercing) rating ignores that many points of Armor, but can't take it below 0 or add damage. Hardened Polyceramic Overlay cuts the AP of attacks against the ship by 5.","If Armor stops all of a hit's damage, that hit can't disable a system. The Armor Loss crisis halves Armor until it's fixed."]},
  ship_speed:{t:"Speed",p:["How nimble the ship is in combat. Speed is added to every Pilot check the ship's pilot makes, in combat or not, including Escape Combat and Pursue Target.","Augmented Plating lowers Speed by 1, and can push it below 0. Boost Engines adds 2 until the ship's next turn. Stations have no Speed and can't maneuver. Over long distances only the spike drive rating matters."]},
  ship_fuel:{t:"Fuel",p:["Each spike drill uses one load of fuel. Most ships hold one load; each Fuel Bunker fitting holds one more. Moving around inside a system uses no meaningful fuel.","Refueling costs 500 credits per load at a starport or refinery. Fuel Scoops let a ship scoop fuel from a gas giant or star. The Fuel Bleed crisis can dump everything but what's needed for in-system travel."]},
  ship_crew:{t:"Crew Stations",p:["Each PC heads one department, ideally the one that fits their skills. One PC can head several, but each turn they act in only one; the others automatically Do Your Duty (+1 CP).","A PC who's no good in space combat can run the NPC officer of their department for the fight. If the ship is too small to have one, the PC can only take general actions.","Stations can be swapped at the start of any turn if the heads involved agree. Rolls here use the character on the station, or the ship's NPC crew skill if the station is empty."]},
  ship_bridge:{t:"Bridge Actions",p:["Escape Combat (4 CP): opposed Int or Dex/Pilot plus Speed against the fastest enemy's. On a win, every enemy ship gains 1 Escape point. When an enemy reaches 3, your ship gets away from that ship.","Evasive Maneuvers (2 CP): Int or Dex/Pilot against difficulty 9. On a success, add your Pilot skill to the ship's AC until its next turn. Once per round.","Pursue Target (3 CP): opposed Int or Dex/Pilot plus Speed against the target's. On a win, take away 1 Escape point the target has on you.","Engine Lock stops all bridge actions until it's resolved."]},
  ship_gunnery:{t:"Gunnery Actions",p:["Fire One Weapon (2 CP): fire one gun. Fire All Guns (3 CP): fire every gun, picking targets as you like. Each gunner can man only one gun a round; the gunnery head spends the points but can name other PCs to roll.","Target Systems (1 CP): your next Fire One Weapon aims at a weapon, engine or fitting the GM says is vulnerable. −4 to hit; damage is halved before Armor. If any gets through, that system is disabled, or the drive loses 1 rating. A disabled system hit again is destroyed.","Target Decalibration stops the guns from firing until it's resolved."]},
  ship_engineering:{t:"Engineering Actions",p:["Boost Engines (2 CP): Int/Fix against difficulty 8. On a success, +2 Speed until the ship's next turn.","Damage Control (3 CP): Int/Fix against difficulty 7. On a success, repair Fix skill × 2 HP on a fighter, × 3 on a frigate, × 4 on a cruiser or × 6 on a capital ship. Each attempt after the first in a fight is +1 harder.","Emergency Repairs (3 CP): Int/Fix against difficulty 8. On a success, a disabled system works again, or a damaged drive gains back 1 rating. Destroyed systems can't be fixed this way."]},
  ship_comms:{t:"Comms Actions",p:["Crash Systems (2 CP): opposed Int/Program against a target ship. On a win, it starts its next turn with a Command Point penalty equal to your Program skill.","Defeat ECM (2 CP): opposed Int/Program against a target ship. On a win, your ship's attacks on it this round get a hit bonus of twice your Program skill.","Sensor Ghost (2 CP): Int/Program against difficulty 9. On a success, add your Program skill to the ship's AC until its next turn. Once per round."]},
  ship_captain:{t:"Captain Actions",p:["Into the Fire (0 CP): accept a Crew Lost crisis and gain your Lead skill + 1 in Command Points. Once per round.","Keep It Together (0 CP): as an Instant, negate a successful enemy hit and roll a Crisis instead. Once per round. This doesn't count against the ship's one voluntary Crisis per round.","Support Department (0 CP): pick a department. One of its actions this turn costs 2 fewer CP. Once per round.","The captain also sets the order the departments act in, though the heads don't have to follow orders."]},
  ship_general:{t:"General Actions",p:["Anyone can take these, but they're exclusive: take one and you do nothing else that turn.","Do Your Duty (0 CP): the ship gains 1 CP. Name something useful you're doing, and not the same thing two rounds in a row.","Above and Beyond (0 CP): explain how you're helping, then roll a skill check the GM agrees with against difficulty 9. Success: gain your skill level + 1 CP. Failure: lose 1 CP.","Deal With a Crisis (0 CP): explain your plan and roll a fitting skill, usually against 10 (8 to 12 depending on the plan). Success resolves the crisis. You can also use it to help someone else's attempt, or to spend a scene doing something else aboard."]},
  ship_weapq:{t:"Ship Weapon Qualities",p:["AP: ignores that many points of the target's Armor.","Ammo: each shot uses a round. One mass of space holds that many rounds, doubled for each hull class above the weapon's minimum. Mounting the weapon includes one load.","Clumsy: −4 to hit fighter-class ships.","Flak: against fighter-class ships, roll hit and damage twice and keep the better.","Cloud: automatically targets every fighter that attacked the ship in the past round, with one hit roll each. No effect on anything bigger than a fighter."]},
  ship_drive:{t:"Spike Drive",p:["The drive's rating is how many hexes the ship can drill in one jump. Transit takes 6 days per hex divided by the rating, and in-system trips are divided by it too.","Targeted shots and the System Damage crisis knock the rating down by 1. Below drive-0 it's destroyed. Emergency Repairs can restore 1 rating at a time. A System Drive fitting replaces the spike drive: the ship can't drill at all."]}

const shipPaths=()=>Object.keys(S.docs).filter(p=>p.startsWith("ships/")).sort((a,b)=>num(!!S.docs[a].npc)-num(!!S.docs[b].npc)||String(S.docs[a].name).localeCompare(String(S.docs[b].name)));
const clsIdx=c=>Math.max(0,SHIP_CLASSES.indexOf(c));
const CLS_STAR=[1,10,25,100],CLS_HASH=[1,2,3,4];
const money=v=>v>=1e6?(Math.round(v/1e5)/10)+"m":v>=1e3?(Math.round(v/100)/10)+"k":String(Math.round(v));
const hullOf=s=>SHIP_HULLS.find(h=>h[0]===(s&&s.hull))||SHIP_HULLS[2];
function fitCost(f,ci){return {cost:f[1]*(f[2]?CLS_STAR[ci]:1),power:f[3]*(f[4]?CLS_HASH[ci]:1),mass:f[5]*(f[6]?CLS_HASH[ci]:1)}}
function defCost(d,ci){return {cost:d[1]*CLS_STAR[ci],power:d[2],mass:d[3]*CLS_HASH[ci]}}
function driveCost(r,ci){const d=SHIP_DRIVES[Math.max(0,Math.min(5,r-1))];return {cost:d[1]*CLS_STAR[ci],power:d[2]*CLS_HASH[ci],mass:d[3]*CLS_HASH[ci],cls:d[4]}}
function weapAmmoMax(w,ci,extra){const W=SHIP_WEAPONS.find(x=>x[0]===w);if(!W||!W[11])return 0;return W[11]*Math.pow(2,Math.max(0,ci-clsIdx(W[7])))*(1+num(extra))}

// Build totals for a ship design (used by the sheet and the wizard)
function shipDesign(d){
  const H=hullOf(d);const ci=clsIdx(H[11]);
  let cost=H[1],power=0,mass=0,hard=0;const issues=[];
  const sysDrive=(d.fittings||[]).some(f=>f.name==="System drive");
  const drive=sysDrive?0:Math.max(1,num(d.drive,1));
  if(!sysDrive&&drive>1){const dc=driveCost(drive,ci);cost+=dc.cost;power+=dc.power;mass+=dc.mass;if(ci<clsIdx(dc.cls))issues.push("Drive-"+drive+" needs a "+dc.cls+" hull or larger")}
  (d.weapons||[]).forEach(w=>{const W=SHIP_WEAPONS.find(x=>x[0]===w.name);if(!W)return;cost+=W[1]+num(w.extraAmmo)*0;power+=W[4];mass+=W[5]+num(w.extraAmmo);hard+=W[6];if(ci<clsIdx(W[7]))issues.push(W[0]+" needs a "+W[7]+" hull")});
  (d.defenses||[]).forEach(x=>{const D=SHIP_DEFENSES.find(y=>y[0]===x.name);if(!D)return;const c=defCost(D,ci);cost+=c.cost;power+=c.power;mass+=c.mass;if(ci<clsIdx(D[4]))issues.push(D[0]+" needs a "+D[4]+" hull")});
  (d.fittings||[]).forEach(x=>{const F=SHIP_FITTINGS.find(y=>y[0]===x.name);if(!F)return;const q=Math.max(1,num(x.qty,1));const c=fitCost(F,ci);cost+=c.cost*q;power+=c.power*q;mass+=c.mass*q;if(ci<clsIdx(F[7]))issues.push(F[0]+" needs a "+F[7]+" hull")});
  const qty=n=>(d.fittings||[]).filter(f=>f.name===n).reduce((s,f)=>s+Math.max(1,num(f.qty,1)),0);
  const has=n=>(d.defenses||[]).some(x=>x.name===n);
  const cargo=qty("Cargo space")*[2,20,200,2000][ci];
  return {H,ci,cls:H[11],cost,power,mass,hard,powerMax:H[8],massMax:H[9],hardMax:H[10],issues,drive,sysDrive,cargo,
    fuelMax:sysDrive?0:1+qty("Fuel bunkers"),crewMax:H[6]*Math.pow(2,qty("Extended life support")),crewMin:H[5],
    hpMax:H[4]+(has("Ablative Hull Compartments")?20:0),acBase:H[7]+(has("Augmented Plating")?2:0)+(has("Ablative Hull Compartments")?1:0),
    speedBase:H[2]==null?null:H[2]-(has("Augmented Plating")?1:0),armorBase:H[3],maint:Math.round(cost*0.05)};
}
function shipCompute(s){
  const D=shipDesign(s);const tmp=s.tmp||{};const cr=s.crises||[];
  const armorLoss=cr.filter(c=>c.type==="Armor Loss").length;
  let armor=D.armorBase;for(let i=0;i<armorLoss;i++)armor=Math.floor(armor/2);
  const sysOf=id=>(s.sys||{})[id]||"ok";
  return {...D,hpMax:D.hpMax+num(s.hpBonus),ac:D.acBase+num(tmp.ac),acNote:[tmp.evasive?"Evasive +"+tmp.evasive:"",tmp.ghost?"Sensor Ghost +"+tmp.ghost:"",tmp.foxer?"Foxer +2":""].filter(Boolean),
    speed:D.speedBase==null?null:D.speedBase+num(tmp.speed),armor,drive:Math.max(0,D.drive-num(s.driveDmg)),driveFull:D.drive,
    pen:-Math.max(0,num(s.maintSkipped)),haywire:cr.filter(c=>c.type==="Haywire Systems").length,engineLock:cr.some(c=>c.type==="Engine Lock"),
    decal:cr.some(c=>c.type==="Target Decalibration"),sysOf};
}

// Who acts for a department: a party character or the ship's NPC crew
function shipRoller(s,dept){
  const p=(s.roles||{})[dept];
  if(p&&S.docs[p]&&!S.docs[p].npc){const c=S.docs[p];return {pc:true,path:p,c,R:compute(c),name:c.name||"Unnamed"}}
  return {pc:false,name:(s.name||"Ship")+" crew",skill:num(s.crewSkill,1)};
}
function shipCanAct(sp,dept){
  if(S.offline||S.isGM)return true;const s=S.docs[sp];if(!s||s.npc)return false;
  const r=shipRoller(s,dept);if(r.pc)return isMine(r.path);
  return !!myPath();
}
function shipCanAny(sp){if(S.offline||S.isGM)return true;const s=S.docs[sp];if(!s||s.npc)return false;return DEPTS.some(([k])=>shipCanAct(sp,k))}
function shipEmit(sp,r,label,lines){
  const s=S.docs[sp];const lbl=r.pc?(s.name||"Ship")+" · "+label:label;
  if(s.npc){npcRoll({name:s.name||"Enemy ship"},lbl,lines);return}
  const rec={ts:Date.now(),by:S.me||"",ship:sp.slice(sp.indexOf("/")+1),sheet:r.pc&&r.path.startsWith("sheets/")?r.path.slice(7):"",char:r.pc?String(r.name):String(s.name||"Ship"),player:r.pc?String(r.c.player||""):"",label:lbl,lines};
  showRoll(rec);
  if(S.db&&!S.offline)S.db.collection("rolls").add(clone(rec)).catch(()=>toastMsg("Your roll didn't post to the shared game log.",true));
  else{S.rolls.unshift({id:rid(),...rec});S.rolls=S.rolls.slice(0,60);render()}
}
const bestOf=(R,attrs)=>attrs.reduce((b,a)=>R.mod[a]>R.mod[b]?a:b,attrs[0]);
// A ship skill check. attrs like ["int","dex"]; returns {total, ok}
function shipCheck(sp,dept,{attrs=["int"],skill,diff=null,label,extra=[],note="",opposed=false,skillOverride,result}={}){
  const s=S.docs[sp];const C=shipCompute(s);const r=shipRoller(s,dept);
  const dice=[{v:rand(6),s:6},{v:rand(6),s:6}];let parts=[];
  if(r.pc){const sk=skillOverride||skill;const a=bestOf(r.R,attrs);const lv=r.R.skills[sk]??-1;
    parts=[{l:(SKILL[sk]?.name||sk)+(lv<0?" (untrained)":""),v:lv},{l:a.toUpperCase(),v:r.R.mod[a]},...r.R.br("skillChecks")]}
  else parts=[{l:"Crew skill",v:r.skill}];
  if(C.pen)parts.push({l:"Missed maintenance",v:C.pen});
  parts.push(...extra);
  const total=dice.reduce((a,d)=>a+d.v,0)+parts.reduce((a,p)=>a+p.v,0);
  const ok=diff!=null?total>=diff:null;
  const lines=[{name:r.name,dice,parts,total,verdict:diff!=null?(ok?["ok","Success"]:["no","Failure"]):null,note:[opposed?"Opposed roll":"",diff!=null?"vs difficulty "+diff:"",note].filter(Boolean).join(" · ")}];

function shipSkillLv(s,dept,sk){const r=shipRoller(s,dept);return r.pc?Math.max(0,r.R.skills[sk]??-1):Math.max(0,num(s.crewSkill,1))}
function shipSpend(sp,cost,dept){

const effCost=(s,cost,dept)=>(s.tmp||{}).support===dept&&cost>0?Math.max(0,cost-2):cost;
// Gunnery: separate hit and damage rolls, like a character's weapon
function shipHitParts(s,C){

  if(r.pc){const a=bestOf(r.R,["int","dex"]);if(C.ci===0&&(r.R.skills.pilot??-1)>(r.R.skills.shoot??-1))sk="pilot";const lv=r.R.skills[sk]??-1;
    parts=[{l:"Attack bonus",v:r.R.bab},{l:a.toUpperCase(),v:r.R.mod[a]},{l:SKILL[sk].name+(lv<0?" (untrained)":""),v:lv}];dmgMod=r.R.mod[a]}
  else parts=[{l:"Crew gunnery",v:num(s.npcHit,num(s.crewSkill,1)+2)}];
  if(C.pen)parts.push({l:"Missed maintenance",v:C.pen});
  if(num((s.tmp||{}).hit))parts.push({l:"Defeat ECM",v:num(s.tmp.hit)});

function shipHit(sp,wid){
  const s=S.docs[sp];const C=shipCompute(s);const w=(s.weapons||[]).find(x=>x.id===wid);const W=w&&SHIP_WEAPONS.find(x=>x[0]===w.name);if(!W)return;
  const tmp=s.tmp||{};const targeted=num(tmp.targetSys)>0;const tgt=S.shipTgt||{};const tac=num(tgt.ac,0);
  const H=shipHitParts(s,C);const parts=[...H.parts];
  if(targeted)parts.push({l:"Targeting a system",v:-4});
  if(/Clumsy/.test(W[10])&&tgt.fighter)parts.push({l:"Clumsy vs fighter",v:-4});
  const d20={v:rand(20),s:20};const hit=d20.v+parts.reduce((a,p)=>a+p.v,0);
  const t2={...(S.docs[sp].tmp||{})};if(targeted){t2.targetSys=num(t2.targetSys)-1;t2.targeted={...(t2.targeted||{}),[wid]:true}}else if(t2.targeted&&t2.targeted[wid]){const x={...t2.targeted};delete x[wid];t2.targeted=x}
  setField(sp,"tmp",t2);
  if(W[11]){const mx=weapAmmoMax(w.name,C.ci,w.extraAmmo);const am=(s.ammo||{})[wid];setField(sp,"ammo",{...(s.ammo||{}),[wid]:Math.max(0,(am==null?mx:num(am))-1)})}
  shipEmit(sp,H.r,w.name+" hit"+(targeted?" (targeting a system)":""),[{name:"Hit",dice:[d20],parts,total:hit,verdict:tac?(hit>=tac?["ok","Hit"]:["no","Miss"]):null,note:tac?"vs AC "+tac:"Compare to the target's AC"}]);
}
function shipDmg(sp,wid){
  const s=S.docs[sp];const C=shipCompute(s);const w=(s.weapons||[]).find(x=>x.id===wid);const W=w&&SHIP_WEAPONS.find(x=>x[0]===w.name);if(!W)return;
  if(W[3]==="Special"){toastMsg("Nuclear missiles don't roll ship damage.",true);return}
  const H=shipHitParts(s,C);const tgt=S.shipTgt||{};const tarm=tgt.armor==null?null:num(tgt.armor);const targeted=!!((s.tmp||{}).targeted||{})[wid];
  const p=parseDice(W[3]);const rr=rollGroups(p);let raw=rr.sum+p.flat+H.dmgMod;
  const dparts=[...(p.flat?[{l:"Weapon",v:p.flat}]:[]),...(H.dmgMod?[{l:"Int/Dex",v:H.dmgMod}]:[])];
  const notes=[W[9]?"AP "+W[9]:"",W[10]].filter(Boolean);
  let total=raw;if(targeted){total=Math.ceil(raw/2);notes.push("halved for a targeted shot ("+raw+" → "+total+")")}
  const ap=Math.max(0,W[9]-((S.shipTgt||{}).hpo?5:0));if(ap!==W[9])notes.push("AP "+W[9]+" − 5 (overlay) = "+ap);
  if(tarm!=null){const eff=Math.max(0,tarm-ap);const fin=Math.max(0,total-eff);notes.push("after Armor "+tarm+(ap?" − AP "+ap+" = "+eff:"")+": "+fin+" gets through"+(targeted&&fin>0?", system disabled":""))}
  if(targeted){const t2={...(S.docs[sp].tmp||{})};const x={...(t2.targeted||{})};delete x[wid];t2.targeted=x;setField(sp,"tmp",t2)}
  shipEmit(sp,H.r,w.name+" damage",[{name:"Damage",dice:rr.dice,parts:dparts,total,note:notes.join(" · ")}]);
}

    case "ship-trim":{if(!need("bridge"))return true;const C=shipCompute(s);shipCheck(sp,"bridge",{attrs:["int"],skill:"pilot",diff:9,label:"Trim the course (in-system)",extra:C.speed?[{l:"Speed",v:C.speed}]:[],note:"success: count the drive as "+(C.drive+1)+" · failure: the trip takes twice as long"});render();return true}
    case "ship-detect":{if(!need("comms"))return true;const own=[0,1,2,3][shipCompute(s).ci];const passive=$("#sen-passive")?.checked;
      shipCheck(sp,"comms",{attrs:["int"],skill:"program",label:"Detection lock",opposed:true,extra:[{l:"Our hull",v:own},...(passive?[{l:"Passive sensors",v:-2}]:[])],note:"vs the target's Avoid detection roll (their comms Int/Program + their hull bonus). Win to get a lock; a tie or loss and they stay hidden."});render();return true}
    case "ship-hide":{if(!need("comms"))return true;const own=[3,2,1,0][shipCompute(s).ci];const damp=(s.fittings||[]).some(f=>f.name==="Emissions dampers");const avoid=$("#sen-avoid")?.checked;
      shipCheck(sp,"comms",{attrs:["int"],skill:"program",label:"Avoid detection",opposed:true,extra:[{l:"Our hull",v:own},...(damp?[{l:"Emissions dampers",v:2}]:[]),...(avoid?[{l:"Avoiding population centers",v:2}]:[])],note:"vs the observer's Int/Program + their modifier. A tie or win keeps you hidden."});render();return true}
    case "ship-scan":{if(!need("comms"))return true;const n=num(s.scanQ);const res=shipCheck(sp,"comms",{attrs:["int"],skill:"program",diff:8+n,label:"Scan question "+(n+1),note:"a failure ends questions for today"});
      setField(sp,"scanQ",res.ok?n+1:0);render();return true}
    case "ship-chase":{if(!need("bridge"))return true;const C=shipCompute(s);shipCheck(sp,"bridge",{attrs:["int"],skill:"pilot",label:"Pursuit (long range)",opposed:true,extra:[{l:"Drive rating",v:C.drive},...(C.speed?[{l:"Speed",v:C.speed}]:[])],note:"vs the other pilot's Int/Pilot + drive. Pursuer wins ties."});render();return true}
  }

}

function shipRollMishap(sp){

function shipDrillCalc(s){
  const T=s.trip||{};const C=shipCompute(s);const hexes=Math.max(1,num(T.hexes,1));
  const rut={uncharted:6,old:2,mid:1,year:0,month:-2}[T.rutter||"year"]??0;
  const nav=!!T.familiar&&(s.fittings||[]).some(f=>f.name==="Advanced nav computer");
  const diff=7+rut+Math.floor(hexes/2)+(T.trim?2:0)+(T.rushed?2:0);
  const eff=Math.max(1,C.drive+(T.trim?1:0));const days=6*hexes/eff;
  const regulator=!!T.familiar&&(s.fittings||[]).some(f=>f.name==="Drill course regulator");
  return {hexes,diff,auto:diff<=6||regulator,nav,days,time:"Transit "+(Math.round(days*10)/10)+" days"+(T.trim?" (trimmed)":"")+(regulator?" · Drill course regulator: automatic":""),rut};
}

    const free=tmp.fireAll&&!(tmp.fired||{})[w.id];const hitCost=free?0:effCost(s,2,"gunnery");const dead=st!=="ok";const noAmmo=mx&&cur<=0;

      <td class="num">${mx?`${cur}/${mx}`:"—"}</td></tr>`}).join("");
  const gun=`${C.decal?`<div class="notice">Target Decalibration: the guns can't fire until it's resolved.</div>`:""}
    <div class="tgtbox"><span class="lbl"><button class="rword" data-act="rule" data-key="ship_attack">Target</button></span><label>AC <input class="inp" id="tgt-ac" type="number" value="${esc(tgt.ac??"")}" placeholder="?" data-shiptgt="ac"></label><label>Armor <input class="inp" id="tgt-arm" type="number" value="${esc(tgt.armor??"")}" placeholder="?" data-shiptgt="armor"></label><label class="chk"><input type="checkbox" data-act="ship-tgt" ${tgt.fighter?"checked":""}> Fighter</label></div>
    ${(s.weapons||[]).length?`<div class="tbl-wrap"><table class="shipguns"><thead><tr><th><button class="rword" data-act="rule" data-key="ship_weapq">Weapon</button></th><th><button class="rword" data-act="rule" data-key="ship_attack">Hit</button></th><th>Damage</th><th>Ammo</th></tr></thead><tbody>${weapRows}</tbody></table></div>`:`<p class="hint">No weapons mounted.</p>`}

  </div>`;
}

function budgetBar(l,used,max){const over=used>max;const pct=Math.min(100,Math.round(100*used/Math.max(1,max)));return `<div class="bud ${over?"over":""}"><div class="budl"><span>${l}</span><b>${Math.round(used*10)/10} / ${max}</b></div><div class="bar"><i style="width:${pct}%"></i></div></div>`}
function shipTravelTab(sp,s,C){

        ${(s.fittings||[]).some(f=>f.name==="Advanced nav computer"||f.name==="Drill course regulator")?`<label class="chk"><input type="checkbox" ${tin("familiar")} ${T.familiar?"checked":""}> Familiar course</label>`:""}
      </div>

      <div class="sact"><button class="btn" data-act="ship-chase" data-doc="${esc(sp)}" ${shipCanAct(sp,"bridge")?"":"disabled"}>Long-range pursuit</button><span class="hint">Opposed Pilot + drive rating.</span></div></div>

  if(w.step===0){
    body=`<div class="field"><span class="lbl">Ship name</span><input class="inp" data-sw="name" value="${esc(w.name||"")}" placeholder="e.g. Grendel"></div>
    <div class="hulls">${SHIP_HULLS.map(h=>`<button class="hull ${w.hull===h[0]?"on":""}" data-act="sw-hull" data-v="${esc(h[0])}"><b>${h[0]}</b><span class="tag">${h[11]}</span><div class="hint">${money(h[1])} cr · HP ${h[4]} · AC ${h[7]} · Armor ${h[3]} · Speed ${h[2]??"—"}</div><div class="hint">Power ${h[8]} · Mass ${h[9]} · Hardpoints ${h[10]} · Crew ${h[5]}/${h[6]}</div></button>`).join("")}</div>
    ${D.H[2]==null?"":`<div class="field" style="max-width:320px"><span class="lbl">Spike drive</span><select class="inp" data-sw="drive">${SHIP_DRIVES.map(d=>{const dc=driveCost(d[0],ci);const ok=ci>=clsIdx(d[4]);return `<option value="${d[0]}" ${num(w.drive,1)===d[0]?"selected":""} ${ok?"":"disabled"}>Drive-${d[0]}${d[0]>1?` (${money(dc.cost)} cr, power ${dc.power}, mass ${dc.mass})`:" (included)"}${ok?"":" · needs "+d[4]}</option>`}).join("")}</select></div>`}`;
  }else if(w.step===1){
    body=`<div class="picklist">${SHIP_WEAPONS.map(W=>{const okC=ci>=clsIdx(W[7]);const ok=okC&&fits(0,W[4],W[5],W[6]);
      return `<div class="pickrow ${okC?"":"na"}"><div><b>${W[0]}</b> <span class="tag">${W[7]}+</span><div class="hint">${W[3]} dmg${W[9]?" · AP "+W[9]:""}${W[10]?" · "+W[10]:""}${W[11]?" · Ammo "+W[11]+" ("+money(W[2])+" each)":""}</div><div class="hint">${money(W[1])} cr · Power ${W[4]} · Mass ${W[5]} · Hardpoints ${W[6]}</div></div>
      <button class="btn sm" data-act="sw-add" data-k="weapons" data-v="${esc(W[0])}" ${ok?"":"disabled"} title="${okC?ok?"":"Not enough power, mass or hardpoints":"Needs a "+W[7]+" hull"}">Add</button></div>`}).join("")}</div>`;
  }else if(w.step===2){
    body=`<div class="picklist">${SHIP_DEFENSES.map(X=>{const c=defCost(X,ci);const okC=ci>=clsIdx(X[4]);const have=(w.defenses||[]).some(d=>d.name===X[0]);const ok=okC&&!have&&fits(0,c.power,c.mass);
      return `<div class="pickrow ${okC?"":"na"}"><div><b>${X[0]}</b> <span class="tag">${X[4]}+</span><div class="hint">${esc(X[5])}</div><div class="hint">${money(c.cost)} cr · Power ${c.power} · Mass ${c.mass}</div></div>
      <button class="btn sm" data-act="sw-add" data-k="defenses" data-v="${esc(X[0])}" ${ok?"":"disabled"}>${have?"Added":"Add"}</button></div>`}).join("")}</div>`;
  }else if(w.step===3){
    body=`<div class="picklist">${SHIP_FITTINGS.map(F=>{const c=fitCost(F,ci);const okC=ci>=clsIdx(F[7]);const ok=okC&&fits(0,c.power,c.mass);const q=(w.fittings||[]).filter(f=>f.name===F[0]).reduce((a,f)=>a+num(f.qty,1),0);
      return `<div class="pickrow ${okC?"":"na"}"><div><b>${F[0]}</b> <span class="tag">${F[7]}+</span>${q?` <span class="tag on">×${q}</span>`:""}<div class="hint">${esc(F[8])}</div><div class="hint">${c.cost?money(c.cost)+" cr":F[0]==="Cargo space"?"Free":"Special"} · Power ${c.power} · Mass ${c.mass}</div></div>
      <button class="btn sm" data-act="sw-add" data-k="fittings" data-v="${esc(F[0])}" ${ok?"":"disabled"}>Add</button></div>`}).join("")}</div>`;
  }else{
    body=`<div class="grid2">
      <div class="field"><span class="lbl">Crew aboard</span><input class="inp" type="number" min="${D.crewMin}" max="${D.crewMax}" data-sw="crew" value="${num(w.crew,D.crewMin)}"><span class="hint">Min ${D.crewMin}, max ${D.crewMax}. Three are needed for a safe drill.</span></div>
      <div class="field"><span class="lbl">NPC crew skill</span><input class="inp" type="number" min="-1" max="4" data-sw="crewSkill" value="${num(w.crewSkill,1)}"><span class="hint">Used for any station no character is on. The book uses +1 for civilian crews, +2 military, +3 elite.</span></div>
      ${S.isGM||S.offline?`<label class="chk"><input type="checkbox" data-sw="npc" ${w.npc?"checked":""}> NPC ship (only you see it)</label>${w.npc?"":`<label class="chk"><input type="checkbox" data-sw="hidden" ${w.hidden?"checked":""}> Hide from players for now (no spoilers)</label>`}`:""}
      ${w.npc?`<div class="field"><span class="lbl">Command Points per turn</span><select class="inp" data-sw="npcCP">${[[4,"4: fighters and civilians"],[5,"5: military or pirates"],[6,"6: native spacers, elite warships"],[7,"7: the finest crews in space"]].map(([v,l])=>`<option value="${v}" ${num(w.npcCP,4)===v?"selected":""}>${l}</option>`).join("")}</select></div>
      <div class="field"><span class="lbl">Gunnery hit bonus</span><input class="inp" type="number" data-sw="npcHit" value="${esc(w.npcHit??num(w.crewSkill,1)+2)}"><span class="hint">The book's example ships list this next to each gun.</span></div>`:""}
    </div>
    <div class="swsum"><div><span class="lbl">Hull</span><b>${D.H[0]}</b></div><div><span class="lbl">HP</span><b>${D.hpMax}</b></div><div><span class="lbl">AC</span><b>${D.acBase}</b></div><div><span class="lbl">Armor</span><b>${D.armorBase}</b></div><div><span class="lbl">Speed</span><b>${D.speedBase??"—"}</b></div><div><span class="lbl">Drive</span><b>${D.sysDrive?"System":D.drive}</b></div><div><span class="lbl">Fuel loads</span><b>${D.fuelMax}</b></div><div><span class="lbl">Cargo</span><b>${D.cargo} t</b></div></div>
    ${D.issues.length?`<div class="notice">${D.issues.map(esc).join("<br>")}</div>`:""}
    ${D.power>D.powerMax||D.mass>D.massMax||D.hard>D.hardMax?`<div class="notice">Over budget: remove something to finish.</div>`:""}`;
  }
  const chosen=w.step>=1&&w.step<=3?(()=>{const k=["","weapons","defenses","fittings"][w.step];const arr=w[k]||[];return arr.length?`<div class="frame"><div class="frame-h"><span>On this ship</span></div><div class="frame-b">${arr.map((x,i)=>`<div class="pickrow"><div><b>${esc(x.name)}</b>${k==="fittings"&&num(x.qty,1)>1?" ×"+num(x.qty,1):""}${k==="weapons"&&weapAmmoMax(x.name,ci,0)?`<div class="hint">Ammo ${weapAmmoMax(x.name,ci,x.extraAmmo)} <button class="iconbtn" data-act="sw-ammo" data-i="${i}" data-d="-1" ${num(x.extraAmmo)?"":"disabled"}>−</button><button class="iconbtn" data-act="sw-ammo" data-i="${i}" data-d="1" ${freeM>=1?"":"disabled"} title="Extra magazine: 1 mass">+</button></div>`:""}</div><button class="iconbtn" data-act="sw-rm" data-k="${k}" data-i="${i}" aria-label="Remove">×</button></div>`).join("")}</div></div>`:""})():"";
  const over=D.power>D.powerMax||D.mass>D.massMax||D.hard>D.hardMax||D.issues.length;
  return `<div class="swiz"><h2 class="pagetitle">${w.editing?"Refit ":"New ship"}${w.editing?esc(w.name||""):""}</h2>
    <nav class="swsteps">${steps.map((l,i)=>`<button class="${i===w.step?"on":""}" data-act="sw-step" data-v="${i}">${i+1}. ${l}</button>`).join("")}</nav>
    ${bar}<div class="frame"><div class="frame-b">${body}</div></div>${chosen}
    <div class="swnav"><button class="btn" data-act="sw-cancel">Cancel</button><span style="flex:1"></span>${w.step>0?`<button class="btn" data-act="sw-step" data-v="${w.step-1}">Back</button>`:""}${w.step<4?`<button class="btn pri" data-act="sw-step" data-v="${w.step+1}">Next</button>`:`<button class="btn pri" data-act="sw-finish" ${over?"disabled":""}>${w.editing?"Save refit":"Create ship"}</button>`}</div></div>`;
}
function swAct(act,t){
  const w=S.sw;if(!w)return false;
  switch(act){
    case "sw-step":w.step=Math.max(0,Math.min(4,num(t.dataset.v)));render();window.scrollTo(0,0);return true;
    case "sw-hull":w.hull=t.dataset.v;const D=swDesign();if(D.H[2]==null)w.drive=1;w.crew=Math.max(num(w.crew,1),D.crewMin);render();return true;
    case "sw-add":{const k=t.dataset.k;const n=t.dataset.v;w[k]=w[k]||[];if(k==="fittings"){const ex=w[k].find(f=>f.name===n);if(ex)ex.qty=num(ex.qty,1)+1;else w[k].push({id:rid(),name:n,qty:1})}else w[k].push({id:rid(),name:n});render();return true}
    case "sw-rm":{const k=t.dataset.k;const i=num(t.dataset.i);const arr=w[k]||[];if(k==="fittings"&&num(arr[i].qty,1)>1)arr[i].qty--;else arr.splice(i,1);render();return true}
    case "sw-ammo":{const x=(w.weapons||[])[num(t.dataset.i)];if(x)x.extraAmmo=Math.max(0,num(x.extraAmmo)+num(t.dataset.d));render();return true}
    case "sw-cancel":S.view=w.editing?"ships":"ships";S.sw=null;render();return true;
    case "sw-finish":{const D=swDesign();if(D.power>D.powerMax||D.mass>D.massMax||D.hard>D.hardMax||D.issues.length)return true;
      const data={name:(w.name||"").trim()||"Unnamed ship",hull:w.hull,drive:D.sysDrive?0:num(w.drive,1),weapons:w.weapons||[],defenses:w.defenses||[],fittings:w.fittings||[],crew:Math.max(D.crewMin,Math.min(D.crewMax,num(w.crew,D.crewMin))),crewSkill:num(w.crewSkill,1),npc:!!w.npc,npcCP:num(w.npcCP,4),npcHit:w.npc?num(w.npcHit,num(w.crewSkill,1)+2):null};
      if(w.editing){const sp=w.editing;const s=S.docs[sp];if(!s)return true;Object.entries(data).forEach(([k,v])=>setField(sp,k,v));const C=shipCompute(S.docs[sp]);if(num(s.hp,C.hpMax)>C.hpMax)setField(sp,"hp",C.hpMax);if(num(s.fuel,C.fuelMax)>C.fuelMax)setField(sp,"fuel",C.fuelMax);toastMsg("Refit saved.");S.shipSel=sp}
      else{const path=(S.offline?"ships/local-":"ships/")+rid();createDoc(path,{...data,hp:D.hpMax,fuel:D.fuelMax,cp:0,crises:[],roles:{},tmp:{},sys:{},ammo:{},escape:0,shared:!data.npc&&!w.hidden,notes:"",createdAt:Date.now()});if(S.offline)S.exists[path]=true;S.shipSel=path;toastMsg("Ship created.")}
      S.shipMode=data.npc?"npc":"party";S.shipFull=false;S.sw=null;S.view="ships";S.shipTab="combat";render();return true}
  }
  return false;
}

const GEN={"atmosphere": [[2, 2, "Corrosive, damaging to foreign objects"], [3, 3, "Inert gas, useless for respiration"], [4, 4, "Airless or thin to the point of suffocation"], [5, 9, "Breathable mix"], [10, 10, "Thick, but breathable with a pressure mask"], [11, 11, "Invasive, penetrating suit seals"], [12, 12, "Both corrosive and invasive in its effects"]], "temperature": [[2, 2, "Frozen, locked in perpetual ice"], [3, 3, "Cold, dominated by glaciers and tundra"], [4, 5, "Variable cold with temperate places"], [6, 8, "Temperate, Earthlike in its ranges"], [9, 10, "Variable warm, with temperate places"], [11, 11, "Warm, tropical and hotter in places"], [12, 12, "Burning, intolerably hot on its surface"]], "biosphere": [[2, 2, "Remnant biosphere"], [3, 3, "Microbial life forms exist"], [4, 5, "No native biosphere"], [6, 8, "Human-miscible biosphere"], [9, 10, "Immiscible biosphere"], [11, 11, "Hybrid biosphere"], [12, 12, "Engineered biosphere"]], "population": [[2, 2, "Failed colony"], [3, 3, "Outpost"], [4, 5, "Fewer than a million inhabitants"], [6, 8, "Several million inhabitants"], [9, 10, "Hundreds of millions of inhabitants"], [11, 11, "Billions of inhabitants"], [12, 12, "Alien inhabitants"]], "techlevel": [[2, 2, "TL0, neolithic-level technology"], [3, 3, "TL1, medieval technology"], [4, 5, "TL2, early Industrial Age tech"], [6, 8, "TL4, modern postech"], [9, 10, "TL3, tech like that of present-day Earth"], [11, 11, "TL4+, postech with specialties"], [12, 12, "TL5, pretech with surviving infrastructure"]], "reaction": [[2, 2, "Hostile", "Reacting as negatively as is plausible"], [3, 5, "Negative", "Unfriendly and unhelpful"], [6, 8, "Neutral", "Reacting predictably or warily"], [9, 11, "Positive", "Potentially cooperative with the PCs"], [12, 12, "Friendly", "As helpful as is plausible to be"]], "tags": [{"n": 1, "name": "Abandoned Colony", "desc": "The world once hosted a colony, whether human or otherwise, until some crisis or natural disaster drove the i
