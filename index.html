<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>SWN Party Sheets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,400;0,500;0,700;1,400;1,500&family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
<script>var THEMES={light:["Light",0],dark:["Dark",1],forest:["Forest",1],midnight:["Midnight",1],ocean:["Ocean Waves",0],synth:["Synth",1],pink:["Pop Pink",0],silky:["Silky Smooth",0],galaxy:["✦ Galaxy ✦",1]};
function applyTheme(t){if(!THEMES[t])t="light";var r=document.documentElement;r.dataset.theme=t;r.dataset.tone=THEMES[t][1]?"dark":"light"}
try{applyTheme(localStorage.getItem("swn.theme")||(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"))}catch(e){applyTheme("light")}</script>
<style>
:root{
  /* Layout: D&D Beyond-style sheet — dark header band, framed attribute row with HP box, saves/skills columns, combat strip + tabbed panel. Light page, red frames. */
  --ink:#e7e4dd; --sky:#d9dde3; --card:#ffffff; --panel:#ffffff; --panel-2:#f7f5f0; --raised:#eeeae2; --line:#cfc8ba; --line-soft:#e6e1d6;
  --text:#1d1d1f; --muted:#5f5f63; --faint:#9a958c;
  --accent:#c53131; --accent-ink:#ffffff; --accent-soft:rgba(197,49,49,.08); --ring:var(--ring); --accent-line:var(--accent-line); --head1:#232325; --head2:#1b1b1d; --topbg:#141416;
  --dark:#1f1f21; --dark-2:#2b2b2e; --dark-line:#45454a;
  --info:#2c7a94; --good:#2e8a4f; --bad:#c53131; --warn:#b7791f;
  --display:"Roboto Condensed","Arial Narrow",sans-serif; --body:"Roboto",system-ui,sans-serif; --mono:"Roboto Mono",ui-monospace,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;color:var(--text);font-family:var(--body);font-size:14px;line-height:1.45}
html{background:var(--ink);min-height:100%}
body{background:linear-gradient(180deg,var(--sky) 0,var(--ink) 420px) no-repeat,var(--ink);min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--info);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
.lbl{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--text)}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:8px 18px;background:var(--topbg);color:#eee;border-bottom:1px solid #000;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.04em;text-transform:uppercase;color:#fff}
.brand .mark{width:24px;height:24px}
.nav{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.topbar{transition:transform .22s ease}
body.tbhide .topbar{transform:translateY(-100%)}
@media (min-width:641px){.topbar .nav{order:3;flex:1 0 100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:thin;padding-bottom:2px}.topbar .nav .chip{flex:0 0 auto}.navrest{margin-left:auto}}
.chip{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border:1px solid var(--dark-line);background:var(--dark-2);color:#eee;border-radius:4px;font-family:var(--display);font-weight:700;white-space:nowrap}
.chip:hover{border-color:#777}
.chip.on{border-color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}
.chip .av{width:24px;height:24px;border-radius:3px;display:grid;place-items:center;background:#3a3a3e;font-size:12px}
.chip .hpmini{width:34px;height:4px;border-radius:2px;background:#444;overflow:hidden}
.chip .hpmini i{display:block;height:100%;background:var(--good)}
.navbtn{padding:6px 12px;border:1px solid transparent;background:none;border-radius:3px;font-family:var(--display);font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:14px;color:#bbb}
.navbtn:hover{color:#fff}
.navbtn.on{color:#fff;border-color:var(--dark-line)}
.role{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.06em;padding:4px 10px;border-radius:3px;border:1px solid var(--dark-line);color:#ccc;text-transform:uppercase}
.role.gm{color:#fff;border-color:var(--accent);background:var(--accent)}

.notice{margin:12px 18px 0;padding:10px 14px;border:1px solid var(--line);border-left:4px solid var(--warn);background:var(--card);border-radius:4px;color:var(--muted)}
.notice b{color:var(--text)}
main{padding:0 18px 120px;max-width:1400px;margin:0 auto}
main.wide{max-width:none;padding-bottom:24px}

/* framed box */
.frame{position:relative;background:var(--panel);border:2px solid var(--accent);border-radius:10px;box-shadow:inset 0 0 0 3px var(--card),inset 0 0 0 4px var(--ring),0 1px 2px rgba(0,0,0,.08)}
.frame-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px 6px}
.frame-h h3{font-size:15px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.frame-b{padding:8px 14px 12px}
.frame-f{display:flex;align-items:center;justify-content:center;gap:6px;padding:4px 14px 10px;font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.03em;text-transform:uppercase}
.frame-f .iconbtn{width:20px;height:20px;font-size:11px;border-radius:50%;color:var(--faint)}

/* header band */
.sheethead{margin:0 -18px 16px;padding:18px 18px 22px;background:linear-gradient(180deg,var(--head1),var(--head2));color:#fff;border-bottom:3px solid #111}
.sheethead-in{max-width:1364px;margin:0 auto;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px;align-items:center}
.portrait{width:88px;height:88px;border-radius:4px;display:grid;place-items:center;font-family:var(--display);font-size:38px;font-weight:700;background:linear-gradient(160deg,#4a4a50,#2a2a2e);border:3px solid var(--accent);color:#fff;box-shadow:0 0 0 1px #000}
.cname{font-family:var(--display);font-size:38px;font-weight:700;line-height:1.05;color:#fff}
.cname input{font-family:var(--display);font-size:34px;font-weight:700;background:transparent;border:0;border-bottom:1px dashed #666;width:100%;max-width:460px;padding:0;color:#fff}
.csub{color:#aaa;margin-top:2px;display:flex;flex-wrap:wrap;gap:2px 12px;font-size:15px}
.csub b{color:#ddd;font-weight:500}
.sheethead .inp,.sheethead select.inp{background:#2b2b2e;border-color:#4a4a50;color:#fff}
.sheethead .lbl{color:#aaa}
.sheethead .hint{color:#999}
.xp{margin-top:10px;display:flex;align-items:center;gap:10px;max-width:440px;font-family:var(--display);font-size:11px;color:#bbb;font-weight:700}
.xpbar{flex:1;height:3px;background:#444;border-radius:2px;overflow:hidden}
.xpbar i{display:block;height:100%;background:#ddd}
.bactions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 12px;border:1px solid var(--line);background:var(--card);border-radius:3px;font-family:var(--display);font-weight:700;letter-spacing:.03em;text-transform:uppercase;font-size:13px;color:var(--text)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.08);color:#fff}
.btn.ghost{background:none}
.btn.sm{padding:4px 8px;font-size:12px}
.btn.danger{color:var(--bad);border-color:var(--accent-line)}
.btn.on{border-color:var(--accent);color:var(--accent)}
.btn.dk{background:transparent;color:#fff;border-color:#555;padding:9px 16px;font-size:15px}
.btn.dk:hover{border-color:var(--accent);color:#fff;background:var(--accent-soft)}
.btn.dk.on{border-color:var(--accent);background:var(--accent)}
.iconbtn{width:26px;height:26px;display:inline-grid;place-items:center;border:1px solid var(--line);background:var(--card);border-radius:3px;padding:0;font-weight:700;line-height:1;color:var(--text)}
.iconbtn:hover{border-color:var(--accent);color:var(--accent)}
.topbar .btn{background:transparent;color:#eee;border-color:var(--dark-line)}
.topbar .btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}

/* top row */
.toprow{display:grid;grid-template-columns:repeat(6,minmax(0,1fr)) minmax(0,1fr) minmax(0,1fr) minmax(0,2.3fr);gap:12px;margin-bottom:22px;align-items:stretch}
.attr{position:relative;text-align:center;padding:8px 6px 26px;background:var(--card);border:2px solid var(--accent);border-radius:12px 12px 16px 16px;box-shadow:inset 0 0 0 3px var(--card),inset 0 0 0 4px var(--ring)}
.attr .lbl{display:block;font-size:12px;cursor:help;color:var(--text)}
.attr .lbl:hover{color:var(--accent)}
.attr .mod{font-family:var(--display);font-size:34px;font-weight:400;line-height:1.2;margin:4px auto 0;width:78%;border:1px solid var(--line);border-radius:6px;background:var(--card)}
.attr .score{position:absolute;left:50%;bottom:-14px;transform:translateX(-50%);min-width:56px;height:30px;padding:0 10px;display:grid;place-items:center;background:var(--card);border:2px solid var(--accent);border-radius:50%/50%;font-family:var(--display);font-weight:700;font-size:20px;box-shadow:inset 0 0 0 2px var(--card),inset 0 0 0 3px var(--ring)}
.attr .score input{width:38px;text-align:center;background:transparent;border:0;padding:0;font-weight:700;font-family:var(--display);font-size:18px}
.attr .boost{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--info)}
.stat{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px 6px;background:var(--card);border:2px solid var(--accent);border-radius:12px;box-shadow:inset 0 0 0 3px var(--card),inset 0 0 0 4px var(--ring)}
.stat .lbl{cursor:help;background:none;border:0;padding:0;font-size:13px}
.stat .lbl:hover{color:var(--accent)}
.stat .big{font-family:var(--display);font-size:38px;font-weight:500;line-height:1.05}
.stat .foot{font-family:var(--display);font-weight:700;font-size:13px;text-transform:uppercase}
.stat .rollbtn{margin-top:2px}
.hpbox{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center;padding:10px 14px;background:var(--card);border:2px solid var(--accent);border-radius:12px;box-shadow:inset 0 0 0 3px var(--card),inset 0 0 0 4px var(--ring)}
.hpctl{display:grid;gap:4px}
.hpctl input{width:100%;text-align:center;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:3px}
.hpctl .btn{padding:3px 6px;font-size:11px}
.hpctl .h{color:var(--good);border-color:var(--good)}
.hpctl .h:hover{background:var(--good);color:#fff}
.hpctl .d{color:var(--bad);border-color:var(--bad)}
.hpctl .d:hover{background:var(--bad);color:#fff}
.hpnums{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;text-align:center;gap:4px}
.hpnums .lbl{color:var(--muted);font-size:13px}
.hpnums .big{font-family:var(--display);font-size:42px;font-weight:500;line-height:1}
.hpnums .sl{font-size:34px;color:var(--faint);font-weight:300;line-height:1}
.hpnums input{width:64px;text-align:center;font-family:var(--display);font-size:34px;border:1px solid var(--line);border-radius:4px;padding:0}
.hpfoot{text-align:center;font-family:var(--display);font-weight:700;font-size:15px;text-transform:uppercase;margin-top:4px;background:none;border:0;width:100%;cursor:help}
.hpfoot:hover{color:var(--accent)}
.hpbar{height:5px;background:var(--line-soft);border-radius:3px;overflow:hidden;margin-top:6px}
.hpbar i{display:block;height:100%;background:var(--good);transition:width .3s}
.pipline{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}
.pipline i{width:10px;height:10px;border:1px solid var(--faint);border-radius:2px}
.pipline i.f{background:var(--warn);border-color:var(--warn)}
.pipline i.p{background:var(--bad);border-color:var(--bad)}
.pipline i.e{background:var(--info);border-color:var(--info)}

/* combat strip */
.cstrip{display:grid;grid-template-columns:110px minmax(0,1fr) minmax(0,1fr) minmax(0,1.2fr);gap:12px;margin-bottom:14px;align-items:stretch}
.ac{display:grid;place-items:center;background:none;border:0;cursor:help;padding:0;position:relative}
.ac svg{width:110px;height:auto}
.ac .ovr-badge{position:absolute;top:2px;right:0}
.ibox{background:var(--card);border:2px solid var(--accent);border-radius:10px;box-shadow:inset 0 0 0 3px var(--card),inset 0 0 0 4px var(--ring);padding:10px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.ibox .lbl{background:none;border:0;padding:0;text-align:left;cursor:help;font-size:14px}
.ibox .lbl:hover{color:var(--accent)}
.ibox .big{font-family:var(--display);font-size:28px;font-weight:500;line-height:1}
.ibox .big small{font-size:16px;color:var(--muted)}
.ibox .row{display:flex;align-items:center;gap:6px;justify-content:space-between}
.ibox p{margin:0;color:var(--muted);font-size:13px}

/* body grid */
.body{display:grid;grid-template-columns:260px 300px minmax(0,1fr);gap:14px;align-items:start}
.stack{display:grid;gap:14px}
.saves{display:grid;grid-template-columns:1fr;gap:8px}
.save{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:4px 4px 4px 14px;background:var(--card);border:1px solid var(--line);border-radius:999px}
.save .lbl{cursor:help;font-size:14px;background:none;border:0;padding:0}
.save .lbl:hover{color:var(--accent)}
.viewonly .rollbtn,.viewonly [data-act=snap],.viewonly [data-act=missdmg],.viewonly [data-act=total-def],.viewonly .ropts button:not([data-act=rule]),.viewonly .ropts select,.viewonly .ropts input{opacity:.45;pointer-events:none;cursor:not-allowed}
.rollbtn{min-width:46px;padding:3px 8px;border:1px solid var(--line);background:var(--card);border-radius:4px;font-family:var(--display);font-size:18px;font-weight:500;font-variant-numeric:tabular-nums;text-align:center;color:var(--text)}
.rollbtn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.save .rollbtn{border-radius:999px}
.rollbtn.tgt::before{content:"≥ ";color:var(--faint);font-size:13px}
.skills{list-style:none;margin:0;padding:0}
.skhead{display:grid;grid-template-columns:34px 36px 1fr 52px;gap:6px;padding:0 2px 4px;font-family:var(--display);font-weight:700;font-size:11px;color:var(--muted);text-transform:uppercase}
.skills li{display:grid;grid-template-columns:34px 36px 1fr 52px;align-items:center;gap:6px;padding:3px 2px;border-bottom:1px solid var(--line-soft)}
.skills li:last-child{border-bottom:0}
.prof{display:flex;align-items:center;gap:3px}
.sklv{display:inline-grid;place-items:center;width:26px;height:22px;border-radius:5px;font-family:var(--display);font-weight:700;font-size:14px;line-height:1;border:1.5px solid var(--accent);color:var(--accent);background:transparent}
.sklv.lvu{border:1.5px dashed var(--faint);color:var(--faint);font-weight:400}
.sklv.lv0{border-color:var(--muted);color:var(--text)}
.sklv.lv1{background:color-mix(in srgb,var(--accent) 22%,transparent)}
.sklv.lv2{background:color-mix(in srgb,var(--accent) 50%,transparent);color:#fff}
.sklv.lv3,.sklv.lv4{background:var(--accent);color:#fff}
.sklegend{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-top:8px;font-size:11px;color:var(--muted)}
.sklegend .sklv{width:20px;height:18px;font-size:11px}
.sklegend .sklv.lvu{margin-right:2px}.sklegend .sklv.lv0{margin-left:8px}
.prof .dot{width:10px;height:10px;border-radius:50%;border:1px solid var(--faint);background:var(--card)}
.prof .dot.f{background:#222;border-color:#222}
.prof small{font-family:var(--display);font-weight:700;font-size:11px;color:var(--muted)}
.sname{background:none;border:0;padding:0;text-align:left;cursor:help;font-family:var(--display);font-size:16px}
.sname:hover{color:var(--accent)}
.sattr{font-size:13px;color:var(--faint);font-family:var(--display);font-weight:700}
.skedit{display:flex;align-items:center;gap:2px;grid-column:1 / 3}
.skedit .iconbtn{width:20px;height:20px;font-size:12px}
.untr{color:var(--muted)}
.ropts{display:grid;gap:8px}
.ropts .grp{display:flex;align-items:center;justify-content:space-between;gap:6px}
.ropts select{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:3px 6px}
.toggle{display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
.toggle input{accent-color:var(--accent)}

.enc .row{display:flex;justify-content:space-between;align-items:center;margin:4px 0;font-family:var(--display);font-size:15px}
.meter{height:6px;background:var(--line-soft);border-radius:3px;overflow:hidden;margin-bottom:8px}
.meter i{display:block;height:100%;background:var(--info)}
.meter i.over{background:var(--bad)}

/* tabs */
.tabs{display:flex;gap:4px;padding:6px 14px 0;overflow-x:auto}
.tab{padding:10px 8px;background:none;border:0;border-bottom:3px solid transparent;font-family:var(--display);font-weight:700;letter-spacing:.02em;text-transform:uppercase;font-size:17px;color:var(--muted);white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.on{color:var(--text);border-bottom-color:var(--accent)}
.tabbody{padding:12px 16px 16px}
.sect{margin-bottom:18px}
.sect>.lbl{display:block;margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid var(--line-soft);color:var(--accent);font-size:15px}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-family:var(--display);font-weight:700;font-size:13px;text-transform:uppercase;color:var(--text);text-align:left;padding:6px;border-bottom:1px solid var(--line-soft)}
td{padding:8px 6px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
tr:last-child td{border-bottom:0}
.iname{background:none;border:0;padding:0;text-align:left;font-family:var(--display);font-size:17px;font-style:italic;cursor:pointer}
.iname:hover{color:var(--accent)}
.isub{display:block;font-size:12px;color:var(--muted);font-style:normal;font-family:var(--body)}
.tag{display:inline-block;font-family:var(--display);font-weight:700;font-style:normal;font-size:11px;letter-spacing:.03em;text-transform:uppercase;padding:1px 6px;border-radius:3px;border:1px solid var(--line);color:var(--muted);margin-left:6px;vertical-align:2px}
.tag.hb{color:#fff;background:var(--accent);border-color:var(--accent)}
.tag.gm{color:var(--warn);border-color:rgba(183,121,31,.6)}
.sheethead .tag.gm{color:#f3c26b}
.tag.on{color:var(--good);border-color:rgba(46,138,79,.5)}
.feature{padding:10px 12px;background:var(--panel-2);border:1px solid var(--line-soft);border-left:3px solid var(--accent);border-radius:3px;margin-bottom:8px}
.feature h4{margin:0 0 4px;font-family:var(--display);font-size:17px;font-weight:700}
.feature p{margin:0;color:var(--muted);white-space:pre-wrap}
.empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:4px;background:var(--card)}

/* forms */
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field .lbl{font-size:11px;color:var(--muted)}
.inp,select.inp,textarea.inp{width:100%;background:var(--card);border:1px solid var(--line);border-radius:3px;padding:5px 7px;min-width:0}
textarea.inp{resize:vertical;min-height:70px}
.inp.n{width:64px;text-align:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.modrow{display:grid;grid-template-columns:1fr 70px 26px;gap:6px;margin-bottom:6px}
.hint{font-size:12px;color:var(--muted)}
.ovr-badge{font-family:var(--display);font-size:10px;font-weight:700;letter-spacing:.06em;color:#fff;background:var(--warn);border-radius:3px;padding:0 4px;margin-left:4px;vertical-align:2px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(20,20,22,.4);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--card);border-left:3px solid var(--accent);z-index:41;display:flex;flex-direction:column;box-shadow:-20px 0 40px rgba(0,0,0,.25)}
.drawer-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--dark);color:#fff}
.drawer-h h2{font-size:24px;font-weight:700}
.drawer-h .iconbtn{background:transparent;color:#fff;border-color:#555}
.drawer-body{padding:16px;overflow-y:auto;flex:1}
.drawer-body p{margin:0 0 10px;color:var(--text)}
.calc{margin:12px 0;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.calc div{display:flex;justify-content:space-between;padding:6px 10px;border-bottom:1px solid var(--line-soft)}
.calc div:last-child{border-bottom:0;background:var(--panel-2);font-weight:700}
.calc span:last-child{font-variant-numeric:tabular-nums}

/* log */
.logbtn{position:fixed;right:18px;bottom:18px;z-index:30;display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--dark);color:#fff;border:1px solid #000;border-radius:999px;font-family:var(--display);font-weight:700;letter-spacing:.04em;text-transform:uppercase;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.logbtn:hover{background:var(--accent)}
.logbtn .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.log{position:fixed;right:18px;bottom:70px;width:min(360px,calc(100% - 36px));max-height:min(560px,calc(100% - 140px));z-index:30;display:flex;flex-direction:column;background:var(--card);border:2px solid var(--accent);border-radius:8px;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.log .frame-h{background:var(--dark);color:#fff;border-radius:6px 6px 0 0;padding:8px 12px}
.log .frame-h .iconbtn,.log .frame-h .btn{background:transparent;color:#fff;border-color:#555}
.log-list{overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:6px;flex:1}
.entry{padding:8px 10px;background:var(--panel-2);border:1px solid var(--line-soft);border-radius:4px}
.entry .who{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.entry .who b{color:var(--text);font-weight:700}
.entry .what{font-family:var(--display);font-weight:700;margin-top:2px}
.line{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:3px}
.line .f{font-family:var(--mono);font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.line .t{font-family:var(--display);font-size:24px;font-weight:700;min-width:38px;text-align:right}
.verdict{font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:3px}
.verdict.ok{color:#fff;background:var(--good)}
.verdict.no{color:#fff;background:var(--bad)}
.verdict.crit{color:#fff;background:#7a3cc5}
.die{display:inline-block;padding:0 4px;border-radius:2px;background:var(--card);border:1px solid var(--line);color:var(--text);margin-right:2px}
.die.drop{opacity:.4;text-decoration:line-through}
.die.max{color:var(--good);border-color:var(--good)}
.die.min{color:var(--bad);border-color:var(--bad)}
.log-f{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line-soft)}
.log-f input{flex:1;background:var(--card);border:1px solid var(--line);border-radius:3px;padding:5px 8px}

/* toasts */
#toasts{position:fixed;right:18px;bottom:70px;z-index:50;display:flex;flex-direction:column;gap:8px;pointer-events:none;width:min(320px,calc(100% - 36px))}
.toast{pointer-events:auto;background:var(--card);border:2px solid var(--accent);border-radius:8px;padding:10px 12px;box-shadow:0 12px 40px rgba(0,0,0,.3);animation:pop .22s ease-out}
.toast.err{border-color:var(--bad);background:#fff5f5}
.toast .what{font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:14px;color:var(--accent)}
.toast .line .t{font-size:32px}
@keyframes pop{from{transform:translateY(12px) scale(.97);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}.hpbar i{transition:none}}

/* party / compendium */
.pagetitle{font-size:28px;font-weight:700;margin:18px 0 12px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.pcard{padding:14px;background:var(--card);border:2px solid var(--accent);border-radius:10px;box-shadow:inset 0 0 0 3px var(--card),inset 0 0 0 4px var(--ring);display:flex;flex-direction:column;gap:8px}
.pcard .top{display:flex;gap:10px;align-items:center}
.pcard .top .av{width:44px;height:44px;border-radius:4px;display:grid;place-items:center;background:var(--dark);color:#fff;border:2px solid var(--accent);font-family:var(--display);font-weight:700;font-size:18px}
.pcard h3{font-size:20px;font-weight:700}
.pstats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.pstats div{background:var(--panel-2);border:1px solid var(--line-soft);border-radius:4px;padding:4px}
.pstats b{display:block;font-family:var(--display);font-size:20px}
.comp{display:grid;grid-template-columns:320px minmax(0,1fr);gap:14px;align-items:start}
.clist{max-height:70vh;overflow-y:auto;padding:6px 0}
.citem{display:block;width:100%;text-align:left;padding:9px 14px;background:none;border:0;border-bottom:1px solid var(--line-soft)}
.citem:hover{background:var(--panel-2)}
.citem.on{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.citem b{font-family:var(--display);font-size:16px}
.welcome{max-width:640px;margin:40px auto;padding:28px;text-align:center}
.welcome h1{font-size:34px;font-weight:700;margin-bottom:8px}
.welcome p{color:var(--muted)}

.invsec{margin-bottom:14px;border:1px solid var(--line-soft);border-radius:8px;padding:8px 12px;background:var(--card)}
.invsec.over{border-color:var(--bad)}
.invsec.over .invh .hint{color:var(--bad)}
.invh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding-bottom:4px;border-bottom:1px solid var(--line-soft)}
.invh .lbl{font-size:16px;color:var(--accent)}
.rdy{width:18px;height:18px;accent-color:var(--accent);cursor:pointer}
.shockv{font-family:var(--display);font-size:17px}
.rollbtn.snap{font-size:13px;color:var(--muted)}
.actgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.actbox{border:1px solid var(--line-soft);border-radius:8px;padding:10px 12px;background:var(--panel-2)}
.actbox h4{margin:0 0 2px;font-family:var(--display);font-size:17px}
.actbox ul{margin:6px 0 0;padding-left:18px}
.actbox li{margin:3px 0;font-size:13px}
.portrait.hasimg,.av.hasimg{padding:0;overflow:hidden}
.portrait img,.av img{width:100%;height:100%;object-fit:cover;display:block}
.portrait-edit{position:relative;cursor:pointer;display:block}
.portrait-edit .pcam{position:absolute;right:-6px;bottom:-6px;width:28px;height:28px;border-radius:50%;background:var(--accent);display:grid;place-items:center;font-size:14px;border:2px solid var(--head2)}
.portrait-edit:hover .portrait{filter:brightness(1.1)}
.btn.dk.lvlready{border-color:#f3c26b;color:#f3c26b;box-shadow:0 0 0 2px rgba(243,194,107,.25)}
.ludice{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin-bottom:10px}
.pools{display:flex;gap:12px;flex-wrap:wrap}
.pool{padding:10px 14px;border:2px solid var(--accent);border-radius:8px;background:var(--card);display:flex;flex-direction:column}
.atgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.atbox{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:6px 10px;border:1px solid var(--line-soft);border-radius:6px;background:var(--card)}
.techlist{display:grid;gap:6px}
.techrow{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line-soft);border-radius:6px;background:var(--card)}
.techrow.have{opacity:.6}
.wport{display:flex;align-items:center;gap:14px;margin-top:12px}
.wport .portrait{width:72px;height:72px;font-size:28px;color:#fff}
.npcmake{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.4fr) 90px auto;gap:10px;align-items:end}
.npcname{font-family:var(--display);font-size:24px;font-weight:700}
.npchp{display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding:10px 12px;border:2px solid var(--accent);border-radius:10px;margin-bottom:12px}
.npchp>div:first-child{min-width:160px}
.npcgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.npcrolls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.entry.npcentry{border-left:3px solid var(--warn);background:#fffaf0}
@media (max-width:820px){.npcmake{grid-template-columns:1fr 1fr}}
.encstage{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:6px 10px;border-radius:6px;font-size:13px;background:#eef8f1;border:1px solid #b6e0c4}
.encstage b{font-family:var(--display);font-size:14px}
.encstage.s1{background:#fff7e6;border-color:#f3c88b}
.encstage.s2{background:#fdecec;border-color:#f0a8a8}
.encstage.s3{background:var(--bad);border-color:var(--bad);color:#fff}
.credbox{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 14px;margin-bottom:14px;border:2px solid var(--accent);border-radius:10px;background:var(--card)}
.credamt{font-family:var(--display);font-size:30px;font-weight:700;line-height:1}
.credctl{display:flex;gap:6px;align-items:center}
.eslots{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0}
.eslot{width:22px;height:22px;border:2px solid var(--info);border-radius:5px;background:var(--card);padding:0;display:inline-block}
.eslot.used{background:var(--info)}
.eslot.torch{border-color:#e8590c;border-style:dashed}.eslot.torch.used{background:#e8590c;border-style:solid}
.torchrow{display:flex;align-items:center;gap:4px 8px;flex-wrap:wrap;margin-top:6px;font-size:12px}
.torchrow .hint{font-size:12px}
.torchbtn{color:#c2410c;border-color:#e8590c}
.torchpick{margin-top:6px}.torchpick>div{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
button.eslot:hover{box-shadow:0 0 0 2px rgba(44,122,148,.25)}
.fxlayer{position:fixed;inset:0;pointer-events:none;z-index:55;overflow:hidden}
.fxdie{position:absolute;left:0;top:0;width:92px;height:92px;display:grid;place-items:center;background:var(--accent);color:#fff;font-family:var(--display);font-weight:800;font-size:34px;will-change:transform,opacity;filter:drop-shadow(0 8px 12px rgba(0,0,0,.35))}
.fxdie span{transform:translateY(1px)}
.fxdie.d6{border-radius:12px}
.fxdie.d20{clip-path:polygon(50% 0,94% 25%,94% 75%,50% 100%,6% 75%,6% 25%)}
.fxdie.d4{clip-path:polygon(50% 4%,98% 92%,2% 92%)}
.fxdie.d4 span{transform:translateY(14px);font-size:28px}
.fxdie.d8{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.fxdie.d10{clip-path:polygon(50% 0,100% 42%,82% 100%,18% 100%,0 42%)}
.fxdie.d12{clip-path:polygon(50% 0,98% 35%,80% 100%,20% 100%,2% 35%)}
.fxdie.drop{opacity:.55}
.fxdie.landed{background:var(--accent);box-shadow:none;outline:none}
.fxdie.landed span{animation:fxpop .35s ease-out}
@keyframes fxpop{0%{transform:scale(1.7)}100%{transform:scale(1)}}
:root[data-theme="galaxy"] .fxdie{background:linear-gradient(135deg,#b86cff,#5ee7ff);color:#0a0520;filter:drop-shadow(0 0 12px rgba(94,231,255,.8))}
.fxdie{--dl:color-mix(in srgb,var(--accent) 55%,#fff);--dd:color-mix(in srgb,var(--accent) 60%,#000);background:radial-gradient(circle at 30% 24%,rgba(255,255,255,.5),rgba(255,255,255,0) 38%),linear-gradient(150deg,var(--dl) 0%,var(--accent) 48%,var(--dd) 100%)}
.fxdie::before,.fxdie::after{content:"";position:absolute;inset:0;pointer-events:none}
.fxdie span{position:relative;z-index:1;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.fxdie.d6{box-shadow:inset 0 -6px 0 rgba(0,0,0,.22),inset 0 5px 0 rgba(255,255,255,.28),inset -5px 0 0 rgba(0,0,0,.12);border-radius:16%}
.fxdie.d20::before{background:rgba(255,255,255,.18);clip-path:polygon(50% 18%,82% 70%,18% 70%)}
.fxdie.d20::after{background:linear-gradient(200deg,rgba(0,0,0,0) 55%,rgba(0,0,0,.25));clip-path:polygon(18% 70%,82% 70%,94% 75%,50% 100%,6% 75%)}
.fxdie.d4::before{background:rgba(0,0,0,.2);clip-path:polygon(50% 4%,98% 92%,50% 70%)}
.fxdie.d8::before{background:linear-gradient(90deg,rgba(255,255,255,.14) 50%,rgba(0,0,0,.2) 50%)}
.fxdie.d10::before{background:rgba(0,0,0,.2);clip-path:polygon(50% 0,100% 42%,82% 100%,50% 72%)}
.fxdie.d12::before{background:rgba(255,255,255,.16);clip-path:polygon(50% 22%,74% 40%,65% 72%,35% 72%,26% 40%)}
.fxdie.landed{background:radial-gradient(circle at 30% 24%,rgba(255,255,255,.5),rgba(255,255,255,0) 38%),linear-gradient(150deg,var(--dl) 0%,var(--accent) 48%,var(--dd) 100%)}
:root[data-theme="galaxy"] .fxdie,:root[data-theme="galaxy"] .fxdie.landed{background:radial-gradient(circle at 30% 24%,rgba(255,255,255,.55),rgba(255,255,255,0) 38%),linear-gradient(150deg,#d9a8ff 0%,#8f6bff 45%,#2fb8e0 100%);color:#fff}
/* wizard */
.wiz{display:grid;grid-template-columns:220px minmax(0,1fr);gap:14px;align-items:start}
.wsteps{padding:8px;display:flex;flex-direction:column;gap:2px;position:sticky;top:64px}
.wstep{display:flex;align-items:center;gap:8px;text-align:left;padding:8px 10px;border:0;background:none;border-radius:6px;font-family:var(--display);font-weight:700;font-size:15px;color:var(--muted)}
.wstep:hover{background:var(--panel-2);color:var(--text)}
.wstep.on{background:var(--accent);color:#fff}
.wstep.skip{opacity:.45}
.wnum{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;background:var(--raised);color:var(--muted);flex:none}
.wstep.on .wnum{background:var(--card);color:var(--accent)}
.wh{font-size:28px;font-weight:700;margin-bottom:4px}
.wlead{color:var(--muted);margin:0 0 14px;max-width:70ch}
.wnav{display:flex;justify-content:space-between;align-items:center;padding:10px 20px 16px;border-top:1px solid var(--line-soft)}
.wnav .btn[disabled]{opacity:.4;cursor:default}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:12px;flex-wrap:wrap}
.seg button{padding:8px 14px;border:0;background:var(--card);font-family:var(--display);font-weight:700;font-size:14px;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:#fff}
.wtable td{vertical-align:middle}
.big2{font-family:var(--display);font-size:22px;font-weight:700}
.rollpair{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
.bggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.clsgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.bgcard{display:flex;flex-direction:column;gap:3px;text-align:left;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:8px}
.bgcard:hover{border-color:var(--accent)}
.bgcard.on{border:2px solid var(--accent);background:var(--accent-soft);padding:9px 11px}
.bgn{font-family:var(--display);font-weight:700;font-size:17px}
.trow{display:flex;gap:10px;padding:2px 0;border-bottom:1px solid var(--line-soft)}
.trow span:first-child{width:18px;color:var(--faint);font-family:var(--display);font-weight:700}
.rollrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 10px;background:var(--panel-2);border:1px solid var(--line-soft);border-radius:6px}
.grants{display:grid;gap:6px}
.grant{display:grid;grid-template-columns:170px 120px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 10px;background:var(--card);border:1px solid var(--line-soft);border-left:3px solid var(--good);border-radius:4px}
.grant.need{border-left-color:var(--warn);background:#fffaf0}
.gsrc{font-size:12px;color:var(--muted)}
.gspec{font-family:var(--display);font-weight:700}
.gres{font-family:var(--display);font-weight:700;color:var(--good)}
.gfix{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.wnote{margin-top:14px;padding:10px 12px;background:var(--panel-2);border:1px solid var(--line-soft);border-radius:6px;font-size:13px;color:var(--muted)}
.wnote b{color:var(--text)}
.wissues{margin-top:14px;padding:10px 12px;background:#fff7ed;border:1px solid #f3c88b;border-left:4px solid var(--warn);border-radius:6px;font-size:13px}
.wok{margin-top:6px;padding:10px 12px;background:#eef8f1;border:1px solid #b6e0c4;border-left:4px solid var(--good);border-radius:6px}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:700;text-decoration:underline}
@media (max-width:820px){.wiz{grid-template-columns:1fr}.wsteps{position:static;flex-direction:row;overflow-x:auto}.wstep{white-space:nowrap}.grant{grid-template-columns:1fr}}

@media (max-width:1240px){
  .toprow{grid-template-columns:repeat(4,minmax(0,1fr));row-gap:24px}
  .toprow .hpbox{grid-column:span 2}
  .body{grid-template-columns:250px minmax(0,1fr)}
  .body .col-actions{grid-column:1 / -1}
}
@media (max-width:820px){
  .toprow{grid-template-columns:repeat(3,minmax(0,1fr))}
  .toprow .hpbox{grid-column:1 / -1}
  .body{grid-template-columns:minmax(0,1fr)}
  .body>.stack,.col-actions{min-width:0}
  .cstrip{grid-template-columns:100px 1fr}
  .cstrip .ibox{grid-column:auto}
  .sheethead-in{grid-template-columns:auto 1fr}
  .bactions{grid-column:1 / -1;justify-content:flex-start}
  .comp{grid-template-columns:1fr}
  .grid4{grid-template-columns:1fr 1fr}
}
@media (max-width:420px){
  main{padding:0 16px 120px}
  .sheethead{margin:0 -16px 16px}
  .grid3,.grid2{grid-template-columns:1fr}
  .cname{font-size:28px}
  .portrait{width:64px;height:64px;font-size:28px}
}

/* ---------- ships ---------- */
.shiplist{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:16px 0 12px}
.shiplist .chip{background:var(--topbg);color:#eee;border:1px solid var(--dark-line)}
.shiplist .chip.on{border-color:var(--accent)}
.shipicon{display:flex;align-items:center;justify-content:center;font-size:40px;color:#fff}
.shiptop{display:grid;grid-template-columns:minmax(260px,1.6fr) repeat(5,minmax(0,1fr));gap:12px;margin:16px 0}
.shipstat{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px 8px;gap:4px}
.shipstat .lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.shipstat .big{font-family:var(--display);font-size:34px;font-weight:700;line-height:1}
.shipstat .big small{font-size:16px;color:var(--muted)}
.shipstat .hint{font-size:11px}
.cpctl{display:flex;gap:4px}
.cpbox .big{color:var(--accent)}
.shiphp{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:center;padding:12px}
.shiphp .hpnums{font-family:var(--display);font-size:34px;text-align:center}
.shipbody{display:grid;grid-template-columns:320px minmax(0,1fr);gap:14px;align-items:start}
.shipbody .stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.col-panel{min-width:0}
.roles{display:flex;flex-direction:column;gap:8px}
.rolerow{display:grid;grid-template-columns:96px 1fr;gap:2px 8px;align-items:center}
.rolerow .rlbl{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:13px}
.rolerow .hint{grid-column:2;font-size:11px}
.deptsect{border-top:1px solid var(--line-soft);padding-top:10px;margin-top:10px}
.deptsect:first-of-type{border-top:0;margin-top:0}
.deptttl{display:flex;gap:10px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.deptttl .duty{display:inline-flex;gap:6px;align-items:center}
.deptttl .lbl{font-size:15px;color:var(--accent)}
.sact{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin:6px 0}
.sact>.btn{display:inline-flex;align-items:center;gap:8px;min-width:170px;justify-content:space-between}
.sact>.btn.off,.sact>.btn:disabled{opacity:.45;cursor:not-allowed}
.sact>.hint{flex:1;min-width:200px}
.sact .pick{display:flex;gap:6px;flex-wrap:wrap;flex-basis:100%;padding-left:2px}
.sact .pick .inp{width:auto;padding:4px 6px;font-size:13px}

/* roll modifiers: hover or tap to see where they came from */
.pmod{position:relative;cursor:help;border-bottom:1px dotted transparent;white-space:nowrap}
.pmod:hover,.pmod:focus{border-bottom-color:currentColor;outline:none}
.pmod:hover::after,.pmod:focus::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#1b1b1e;color:#fff;font-size:12px;font-weight:600;letter-spacing:0;text-transform:none;white-space:nowrap;padding:4px 8px;border-radius:5px;z-index:50;pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.pmod:hover::before,.pmod:focus::before{content:"";position:absolute;bottom:calc(100% + 1px);left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:#1b1b1e;z-index:50}

  .actref>summary::-webkit-details-marker{display:none}
  .actref>summary::after{content:" ▾"}
  .actref[open]>summary::after{content:" ▴"}
  .actref[open] .mshow{display:none}
  .col-actions .frame,.col-actions{min-width:0}
  .cstrip{grid-template-columns:96px minmax(0,1fr);gap:10px}
  .cstrip>*:nth-child(n+3){grid-column:1 / -1}

  .tabs{padding:4px 8px 0}
  .tab{font-size:14px;padding:10px 6px}

  .invtbl thead{display:none}
  .invtbl,.invtbl tbody{display:block}
  .invtbl tr.invrow{display:grid;grid-template-columns:30px minmax(0,1fr) auto auto;grid-template-areas:"rdy name name act" "rdy qty enc act";gap:4px 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line-soft)}
  .invtbl td{display:block;padding:0;border:0;width:auto!important}
  .invtbl td:nth-child(1){grid-area:rdy}.invtbl td:nth-child(2){grid-area:name}
  .invtbl td:nth-child(3){grid-area:qty;display:flex;align-items:center;gap:6px}.invtbl td:nth-child(3)::before{content:"Qty";font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .invtbl td:nth-child(3) .inp{width:64px}
  .invtbl td:nth-child(4){grid-area:enc}.invtbl td:nth-child(4)::before{content:"Enc ";font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .invtbl td:nth-child(5){grid-area:act;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
  .atktbl thead{display:none}
  .atktbl,.atktbl tbody{display:block}
  .atktbl tr.atkrow{display:grid;grid-template-columns:auto 1fr;grid-template-areas:"name name" "hit dmg" "shock ammo";gap:6px 10px;padding:10px 2px;border-bottom:1px solid var(--line-soft)}
  .atktbl td{display:block;padding:0;border:0}
  .atktbl .c-name{grid-area:name}.atktbl .c-hit{grid-area:hit}.atktbl .c-dmg{grid-area:dmg;justify-self:start}
  .atktbl .c-shock{grid-area:shock;align-self:center;font-size:13px}.atktbl .c-ammo{grid-area:ammo;justify-self:start;align-self:center}
  .atktbl .c-shock:has(.hint:only-child),.atktbl .c-ammo:has(.hint:only-child){display:none}
  .atktbl .c-shock::before{content:"Shock ";color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}

  .rollbtn{min-height:40px;min-width:48px}
  .btn.sm,.iconbtn{min-height:34px;min-width:34px}
  .skills .rollbtn{min-height:36px}

  .log{left:0;right:0;bottom:0;width:100%;max-height:72vh;border-radius:14px 14px 0 0;border-width:2px 0 0}
  .log .frame-h{border-radius:12px 12px 0 0}
  .logbtn.open{display:none}
  .logbtn{right:12px;bottom:12px;padding:12px 16px}
  .drawer{width:100%;border-left:0}
  #toasts{left:12px;right:12px;width:auto}
}

const CLASS_ABIL = {

const RULES = {
  attr:{t:"Attributes",p:["Attributes range from 3 to 18. Rolls use the attribute's modifier, not the score: 3 is −2, 4–7 is −1, 8–13 is +0, 14–17 is +1, and 18 is +2.","Modifiers apply to skill checks, attack and damage rolls, and saving throws."]},
  str:{t:"Strength",p:["Physical prowess, melee combat, carrying gear, brute force.","Used for STR weapons, the Physical save, and how many items you can carry."]},
  dex:{t:"Dexterity",p:["Speed, evasion, manual dexterity, reaction time, combat initiative.","Used for most ranged weapons, Armor Class, initiative, and the Evasion save."]},
  con:{t:"Constitution",p:["Hardiness, enduring injury, resisting toxins, going without food or sleep.","Used for hit points, the Physical save, and your maximum system strain (equal to your CON score)."]},
  int:{t:"Intelligence",p:["Memory, reasoning, technical skills, general education.","Used for the Evasion save and many technical skill checks."]},
  wis:{t:"Wisdom",p:["Noticing things, making judgments, reading situations, intuition.","Used for the Mental save and psychic Effort."]},
  cha:{t:"Charisma",p:["Commanding, charming, attracting attention, being taken seriously.","Used for the Mental save and most social skill checks."]},
  skillcheck:{t:"Skill Checks",p:["Roll 2d6 and add your skill level and the most applicable attribute modifier. If the total equals or beats the difficulty, you succeed.","Difficulty 6: a simple task, but more than your background would usually expect. 8: a significant challenge for a competent professional. 10: too hard for anyone but a skilled expert. 12: only a true master could do it reliably. 14+: even a master will probably fail.","Without even level-0 in the skill, take −1. Very good or bad circumstances can add up to +2 or −2.","The GM may call for a different attribute than usual; use Skill attribute in Roll Options."]},
  skilllevels:{t:"Skill Levels",p:["Level-0: basic competence. Level-1: an experienced professional. Level-2: a veteran expert. Level-3: a master, likely one of the best on the planet. Level-4: one of the best in the sector.","Untrained skills count as −1. No starting character has a skill above level-1."]},
  keep3:{t:"3d6, keep best 2",p:["Some foci let you roll 3d6 and drop the lowest die on checks with a particular skill. Turn this on before rolling when it applies."]},
  attack:{t:"Attack Rolls",p:["Roll 1d20 and add your attack bonus, your Shoot, Stab, or Punch skill, and the weapon's attribute modifier (the better one if two are listed). Energy weapons add +1. If the total equals or beats the target's Armor Class, you hit.","Without even level-0 in the combat skill, take −2.","Damage is the weapon's damage dice plus the same attribute modifier. Punch attacks also add your Punch skill."]},
  torch:{t:"Torching",p:["Psychics can push past their limits by torching. It's an Instant action, once per round, that gives a free point of Effort for the rest of the scene, even over your maximum.","Every time you torch, roll a d6. On a 1 or 2, lose 1 point of Wisdom. On a 3 or 4, lose 1 Constitution. On a 5, lose 1 point from an attribute you choose. On a 6, no harm is done. The loss is permanent; nothing known can heal it.","A psychic whose Wisdom drops below 3 goes violently insane and becomes a feral psychic. Below 3 in any other attribute, they're dead or no longer playable. Untrained psychics torch every time they use their powers."]},
  shock:{t:"Shock",p:["Many melee weapons have a Shock score, like 2/AC 15. If you miss a target whose AC is equal to or less than that number, they still take the Shock damage, plus your attribute modifier and any other damage bonuses.","A hit never does less damage than its Shock would on a miss."]},
  bab:{t:"Attack Bonus",p:["Your attack bonus is half your level, rounded down. Warriors use their full level.","Partial Warriors add +1 at 1st level and another +1 at 5th."]},
  saves:{t:"Saving Throws",p:["Roll 1d20. If you equal or beat the save, you resist. A natural 20 always succeeds.","Each save is 16 minus your level, minus the better of two attribute modifiers (so 15 minus the modifier at 1st level).","Physical (STR or CON): poison, disease, exhaustion. Evasion (DEX or INT): dodging sudden perils and explosions. Mental (WIS or CHA): psychic influence and mind-bending technology.","Bonuses to a save lower its target number."]},
  ac:{t:"Armor Class",p:["To hit you, an enemy rolls 1d20 plus their attack bonus and must equal or beat your AC. Your AC is your armor's AC (10 with none) plus your DEX modifier.","Suits of armor don't stack; the sheet uses your best Readied armor. A Readied shield gives base AC 13, or +1 if your armor is already that good."]},
  hp:{t:"Hit Points",p:["Hit points show how close you are to being defeated.","At 1st level, roll 1d6 + CON modifier (minimum 1). Warriors and Partial Warriors add 2. When you level up you re-roll; the level-up wizard handles it.","At 0 HP from a lethal attack you're mortally wounded and die after six rounds unless someone stabilizes you (Int/Heal or Dex/Heal: difficulty 10 plus the rounds since you fell, 8 with a medkit, 6 with a Lazarus patch). Stabilized characters regain 1 HP after ten minutes.","If you're hurt but not mortally wounded, you regain your level in hit points after each night's peaceful rest."]},
  strain:{t:"System Strain",p:["System strain measures the stress on your body from psionic healing, cybernetic implants, and powerful drugs. Your maximum is your CON score.","If something would push your strain past your CON, it simply doesn't work on you.","Installed cyberware adds permanent strain. Other strain drops by 1 after each night of rest, if you're well-fed and not sick."]},
  effort:{t:"Effort",p:["Psychics use Effort to power their techniques. Max Effort = 1 + your highest psychic skill + the better of your WIS or CON modifiers.","Each use of a power commits one point. Depending on the power, it stays committed while the power is active, for the scene, or for the rest of the day, then returns. A good night's rest refreshes all Effort.","On the sheet, click a box to mark a point spent and click it again when it returns. Night's rest refreshes them all.","Torching: once per round, as an Instant, a psychic can gain a free point of Effort for the rest of the scene, even over their maximum. Each torch rolls a d6: 1–2 lose 1 Wisdom, 3–4 lose 1 Constitution, 5 lose 1 point from an attribute you choose, 6 no harm. The loss is permanent. Wisdom below 3 makes the psychic feral; any other attribute below 3 ends the character. Torched points show dashed orange and vanish at the end of the scene or on a night's rest."]},
  init:{t:"Initiative",p:["At the start of combat, everyone rolls 1d8 + DEX modifier. Actors go from high to low, and PCs win ties. Initiative isn't re-rolled each round."]},
  enc:{t:"Encumbrance",p:["You can have Readied items up to half your STR score, rounded down. Readied items are worn, in hand, or in sheaths, holsters and belt pouches.","You can have Stowed items up to your full STR score. Getting a Stowed item out in a hurry takes your Main Action.","Up to 2 extra Readied or 4 extra Stowed items makes you Lightly Encumbered: movement drops from 10 to 7 meters per round. Up to 2 more Readied or 4 more Stowed beyond that makes you Heavily Encumbered: 5 meters per round.","Worn armor counts as Readied; normal clothes don't. Very small items in small numbers don't count. Small items can be bundled (about 6 power cells or 3 magazines per item), but getting into a bundle takes an extra round.","Stored items are left on the ship or at home and don't count."]},
  xp:{t:"Experience & Levels",p:["XP to reach each level: 2nd 3, 3rd 6, 4th 12, 5th 18, 6th 27, 7th 39, 8th 54, 9th 72, 10th 93.","A successful session usually earns about 3 XP."]},
  foci:{t:"Foci",p:["A focus is an extra knack, perk, or aptitude. Most have two levels, and level 2 includes everything from level 1.","Everyone starts with one focus level. Experts and Warriors (and their partial versions) get a bonus level. You gain another at levels 2, 5, 7, and 10."]},
  mods:{t:"Item & Effect Bonuses",p:["Readied items, installed cyberware, foci, and active effects apply their bonuses automatically.","On a weapon, Attack and Damage bonuses apply only to that weapon. On anything else, they apply to all your attacks.","Save bonuses lower the save's target number. Attribute bonuses raise the score, which can change the modifier."]},

function rand(sides){const a=new Uint32Array(1);crypto.getRandomValues(a);return 1+(a[0]%sides)}
function parseDice(str){
  const out={groups:[],flat:0};const s=String(str||"").replace(/\s+/g,"").toLowerCase();
  const re=/([+-]?)(\d*)d(\d+)|([+-]?)(\d+)/g;let m;
  while((m=re.exec(s))){
    if(m[3]){const n=Math.min(num(m[2]||1,1),50),sd=Math.min(num(m[3],6),1000);out.groups.push({n,s:sd,neg:m[1]==="-"})}
    else if(m[5]){out.flat+=(m[4]==="-"?-1:1)*num(m[5])}
  }
  return out;
}
function rollGroups(p){
  const dice=[];let sum=0;
  p.groups.forEach(g=>{for(let i=0;i<g.n;i++){const v=rand(g.s);dice.push({v,s:g.s});sum+=g.neg?-v:v}});
  return {dice,sum};
}

function setPathV(obj,path,v){const ks=path.split(".");let o=obj;for(let i=0;i<ks.length-1;i++){if(o[ks[i]]==null)o[ks[i]]=/^\d+$/.test(ks[i+1])?[]:{};o=o[ks[i]]}o[ks[ks.length-1]]=v}
function ago(ts){const s=Math.max(0,(Date.now()-ts)/1000);if(s<60)return "just now";if(s<3600)return Math.floor(s/60)+"m ago";if(s<86400)return Math.floor(s/3600)+"h ago";return Math.floor(s/86400)+"d ago"}

const hbFociPaths = ()=>Object.keys(S.docs).filter(p=>p.startsWith("foci/")).sort((a,b)=>String(S.docs[a].name).localeCompare(String(S.docs[b].name)));
const hbPaths = ()=>Object.keys(S.docs).filter(p=>p.startsWith("homebrew/")&&!p.startsWith("homebrew/_")).sort((a,b)=>String(S.docs[a].name).localeCompare(String(S.docs[b].name)));

// Rolling and using a sheet: the GM, or the player who claimed it (even if the GM locked editing).
function canUse(path){
  if(!path||!S.docs[path])return false;
  if(S.offline||S.isGM)return true;
  const d=S.docs[path];
  if(d.npc||!/^sheets\//.test(path))return false;
  return isMine(path);
}
const pathOf=c=>c?Object.keys(S.docs).find(p=>S.docs[p]===c)||null:null;
function canEdit(path){
  if(!path||!S.docs[path]||S.denied[path])return false;
  if(S.offline)return true;
  if(S.isGM)return true;
  const d=S.docs[path];
  if(path.startsWith("homebrew/")||path.startsWith("foci/")||path.startsWith("npcs/"))return false;
  if(d.locked)return false;
  return isMine(path);
}

/* ================= SAVE QUEUE ================= */
const Q = {}; // path -> {dirty:Set, timer, inflight, inflightKeys:Set}
function q(path){return Q[path]||(Q[path]={dirty:new Set,timer:null,inflight:false,inflightKeys:new Set})}
function markDirty(path,key){
  if(S.offline||path.startsWith("local/"))return;
  const e=q(path);e.dirty.add(key);clearTimeout(e.timer);e.timer=setTimeout(()=>flush(path),550);
}
async function flush(path){
  const e=q(path);if(e.inflight){e.timer=setTimeout(()=>flush(path),300);return}
  if(!e.dirty.size||!S.db)return;
  const keys=[...e.dirty];e.dirty.clear();e.inflight=true;e.inflightKeys=new Set(keys);
  const d=S.docs[path];

  const wDmg=(w.mods||[]).filter(m=>m.target==="damage").reduce((s,m)=>s+num(m.value),0);

  const shockFlat=dmgParts.reduce((s,p)=>s+p.v,0)+(sk==="stab"&&hasFocus(R,"armsman")&&lv>0?lv:0);

}

function lineHtml(l){
  const f=(l.dice.length?diceHtml(l.dice):"")+l.parts.map(p=>p.ov!=null||!p.v?"":` <span class="pmod" tabindex="0" data-tip="${esc(p.l)} ${sgn(p.v)}">${p.v<0?"−":"+"} ${Math.abs(p.v)}</span>`).join("");
  const tip=l.parts.map(p=>p.l+" "+sgn(p.v)).join(", ");
  return `<div class="line"><div><div class="lbl">${esc(l.name)}${l.note?` · <span style="text-transform:none;letter-spacing:0;font-weight:500">${esc(l.note)}</span>`:""}</div><div class="f" aria-label="${esc(tip)}">${f||"&nbsp;"}</div>${l.verdict?`<span class="verdict ${l.verdict[0]}">${esc(l.verdict[1])}</span>`:""}</div><div class="t num">${num(l.total)}</div></div>`;
}
function showToast(rec){
  const el=document.createElement("div");el.className="toast";
  el.innerHTML=`<div class="what">${esc(rec.char?rec.char+" · ":"")}${esc(rec.label)}</div>${(rec.lines||[]).map(lineHtml).join("")}`;
  $("#toasts").appendChild(el);setTimeout(()=>el.remove(),6500);
  while($("#toasts").children.length>3)$("#toasts").firstChild.remove();
}
function toastMsg(msg,err){
  const el=document.createElement("div");el.className="toast"+(err?" err":"");el.innerHTML=`<div>${esc(msg)}</div>`;
  $("#toasts").appendChild(el);setTimeout(()=>el.remove(),7000);
}

/* ================= RENDER HELPERS ================= */
function inp(doc,path,{type="text",cls="inp",ph="",live=false,blank=false,dis=false,min,max,attrs=""}={}){
  const v=getPath(S.docs[doc],path);
  return `<input id="${fid(doc,path)}" class="${cls}" type="${type}" data-doc="${esc(doc)}" data-path="${esc(path)}" ${type==="number"?"data-num":""} ${blank?'data-blank="null"':""} ${live?"data-live":""} value="${esc(v??"")}" placeholder="${esc(ph)}" ${dis?"disabled":""} ${min!=null?`min="${min}"`:""} ${max!=null?`max="${max}"`:""} ${attrs}>`;
}
function sel(doc,path,opts,{cls="inp",dis=false}={}){
  const v=getPath(S.docs[doc],path);
  return `<select id="${fid(doc,path)}" class="${cls}" data-doc="${esc(doc)}" data-path="${esc(path)}" ${dis?"disabled":""}>${opts.map(o=>{const[val,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(val)}" ${String(v)===String(val)?"selected":""}>${esc(l)}</option>`}).join("")}</select>`;
}
function ta(doc,path,{ph="",rows=4,dis=false}={}){
  const v=getPath(S.docs[doc],path);
  return `<textarea id="${fid(doc,path)}" class="inp" rows="${rows}" data-doc="${esc(doc)}" data-path="${esc(path)}" data-live placeholder="${esc(ph)}" ${dis?"disabled":""}>${esc(v??"")}</textarea>`;
}
function chk(doc,path,label,{dis=false}={}){
  const v=getPath(S.docs[doc],path);
  return `<label class="toggle"><input id="${fid(doc,path)}" type="checkbox" data-doc="${esc(doc)}" data-path="${esc(path)}" ${v?"checked":""} ${dis?"disabled":""}>${esc(label)}</label>`;
}
const ovBadge=(R,k)=>R.ov[k]?`<span class="ovr-badge" title="Set by the GM">GM</span>`:"";
function nameOf(id){return ""}

    <button class="navbtn ${S.view==="compendium"?"on":""}" data-act="view" data-v="compendium">Compendium</button>
    ${S.me||S.offline?`<button class="btn pri sm" data-act="wiz-open">+ New character</button>`:""}
    ${S.isGM||S.offline?`<button class="navbtn ${S.view==="generators"?"on":""}" data-act="view" data-v="generators">Generators</button><button class="navbtn ${S.view==="initiative"?"on":""}" data-act="view" data-v="initiative">Initiative</button><button class="navbtn ${S.view==="mechs"||S.view==="mechwiz"?"on":""}" data-act="view" data-v="mechs">Mechs</button>`:""}
    ${shipNav()?`<button class="navbtn ${S.view==="ships"||S.view==="shipwiz"?"on":""}" data-act="view" data-v="ships">Ships</button>`:""}<button class="navbtn ${S.view==="sector"?"on":""}" data-act="view" data-v="sector">Sector</button>

    const tot=group==="psy"?null:lv+R.mod[(a||"int").toLowerCase()]+R.sum("skillChecks")+num(S.opts.sit);
    const left=E?`<span class="skedit"><button class="iconbtn" data-act="skill" data-g="${group}" data-k="${k}" data-d="-1" aria-label="Lower ${name}">−</button><span class="num" style="min-width:18px;text-align:center">${base}</span><button class="iconbtn" data-act="skill" data-g="${group}" data-k="${k}" data-d="1" aria-label="Raise ${name}">+</button></span>`
      :`<span class="sklv lv${lv<0?"u":Math.min(4,lv)}" title="${lv<0?"Untrained: −1 to checks":"Level "+lv}">${lv<0?"–":lv}</span><span class="sattr">${group==="psy"?"":esc(a)}</span>`;
    return `<li>${left}
      <button class="sname ${lv<0?"untr":""}" data-act="rule" data-key="skill_${k}">${esc(name)}${lv!==base?` <span class="tag hb" title="Changed by items">${sgn(lv-base)}</span>`:""}</button>
      ${group==="psy"?`<span class="num" style="text-align:center;font-family:var(--display);font-size:17px">${lv<0?"—":lv}</span>`:`<button class="rollbtn" data-act="roll-skill" data-skill="${k}" title="Roll 2d6 ${sgn(tot)}">${sgn(tot)}</button>`}</li>`;
  };
  const skills=`<div class="frame"><div class="frame-b" style="padding-top:12px">
    <div class="skhead"><span>Level</span><span>${E?"":"Attr"}</span><span>Skill</span><span style="text-align:center">Bonus</span></div>
    <ul class="skills">${SKILLS.map(s=>skillRow(s[0],s[1],"skills",s[2])).join("")}</ul>
    ${R.psychic||E?`<div class="lbl" style="margin:14px 0 4px;color:var(--info)">Psychic disciplines</div><ul class="skills">${PSY.map(s=>skillRow(s[0],s[1],"psy","")).join("")}</ul>`:""}
  </div><div class="frame-f"><button class="rword" data-act="rule" data-key="skilllevels">Skills</button></div></div>`;

  const tabs=[["actions","Actions"],["inventory","Inventory"],["features","Features & Foci"],["notes","Notes"]];
  if(S.isGM||S.offline)tabs.push(["gm","GM Tools"]);
  if(!tabs.find(t=>t[0]===S.tab))S.tab="actions";
  const tabBody={actions:()=>renderActions(path,c,R,can),inventory:()=>renderInventory(path,c,R,can),features:()=>renderFeatures(path,c,R,E),notes:()=>renderNotes(path,c,can),gm:()=>renderGM(path,c,R)}[S.tab]();
  const panel=`<div class="frame"><div class="tabs" role="tablist">${tabs.map(t=>`<button class="tab ${S.tab===t[0]?"on":""}" role="tab" aria-selected="${S.tab===t[0]}" data-act="tab" data-tab="${t[0]}">${t[1]}</button>`).join("")}</div><div class="tabbody">${tabBody}</div></div>`;

  const mv=`<div class="mvitals"><div class="mv-row">
      <button class="mv-name" data-act="mjump" data-to="top">${esc(c.name||"Unnamed")}</button>
      <div class="mv-hp">${can?`<button class="mv-b" data-act="hp-step" data-d="-1" aria-label="Lose 1 HP">−</button>`:""}<span class="mv-hpv" style="color:${hpCol}"><b>${num(c.hp?.cur)}</b>/${R.hpMax}<small>HP</small></span>${can?`<button class="mv-b" data-act="hp-step" data-d="1" aria-label="Gain 1 HP">+</button>`:""}</div>
      <span class="mv-stat"><b>${R.ac}</b><small>AC</small></span><span class="mv-stat"><b>${R.strainCur}</b><small>Strain</small></span>${R.effortMax?`<span class="mv-stat"><b>${Math.max(0,R.effortMax-R.effortUsed)}</b><small>Effort</small></span>`:""}
    </div><div class="mv-hpbar"><i style="width:${hpPct}%;background:${hpCol}"></i></div>
    <nav class="mv-jump">${[["actions","Combat"],["saves","Saves"],["skills","Skills"],["inventory","Gear"],["features","Foci"],["notes","Notes"]].map(([k,l])=>`<button data-act="mjump" data-to="${k}" class="${["actions","inventory","features","notes"].includes(k)&&S.tab===k?"on":""}">${l}</button>`).join("")}</nav></div>`;
  return `<div class="${canUse(path)?"":"viewonly"}" style="display:contents">${mv}${head}<section class="toprow">${attrs}${babBox}${initBox}${hpBox}</section>
    <section class="body"><div class="stack s-left"><div id="m-saves" class="manchor">${saves}</div>${ropts}${enc}</div><div class="stack s-skills"><div id="m-skills" class="manchor">${skills}</div></div>
    <div class="stack col-actions"><div class="cstrip">${acSvg}${strainBox}${thirdBox}${condBox}</div><div id="m-panel" class="manchor">${panel}</div></div></section></div>`;
}

function renderActions(path,c,R,can){
  const weapons=R.items.map((w,i)=>({w,i})).filter(x=>x.w.type==="weapon");
  weapons.push({w:unarmedWeapon(R),i:"unarmed"});
  const rows=weapons.map(({w,i})=>{const W=weaponStats(c,R,w);const real=i!=="unarmed";return `<tr class="atkrow">
    <td class="c-name">${real?`<button class="iname" data-act="item" data-i="${i}">`:`<span class="iname" style="cursor:default">`}${esc(w.name||"Weapon")}${w.linked?`<span class="tag hb">Homebrew</span>`:""}${w.energy?`<span class="tag" title="Energy weapons get +1 to hit">Energy</span>`:""}${w.burst?`<span class="tag" title="Can fire in burst mode">Burst</span>`:""}${real&&!isActive(w)?`<span class="tag" title="Stowed weapons take a Main Action to ready">Stowed</span>`:""}${real?`</button>`:`</span>`}<span class="isub">${esc(SKILL[W.sk]?.name||W.sk)} · ${esc(W.best.toUpperCase())}${w.range?" · "+esc(w.range)+" m":""}${W.missDmg?" · "+W.missDmg+" on a miss":""}</span></td>
    <td class="c-hit" style="white-space:nowrap"><button class="rollbtn" data-act="attack" data-i="${i}" title="Roll 1d20 ${sgn(W.atk)} to hit">${sgn(W.atk+(S.opts.burst&&w.burst?2:0))}</button> <button class="rollbtn snap" data-act="snap" data-i="${i}" title="Snap Attack: Instant, spends your next Main Action, −4 to hit">Snap ${sgn(W.atk-4+(S.opts.burst&&w.burst?2:0))}</button></td>
    <td class="c-dmg"><button class="rollbtn" data-act="damage" data-i="${i}" title="Roll damage only">${esc(W.dmgText)}</button></td>
    <td class="c-shock">${W.shock?`<span class="shockv" title="Damage dealt on a miss if the target's AC is low enough">${W.shock.dmg}/${W.shock.ac>=99?"any AC":"AC "+W.shock.ac}</span>`:`<span class="hint">—</span>`}${W.missDmg?` <button class="rollbtn" data-act="missdmg" data-i="${i}" title="Unmodified damage on a miss">miss ${W.missDmg}</button>`:""}</td>
    <td class="num c-ammo">${real&&num(w.mag)>0?`${can?`<button class="iconbtn" data-act="ammo" data-i="${i}" data-d="-1" aria-label="Use ammo">−</button> `:""}${num(w.ammo)}/${num(w.mag)}${can?` <button class="btn sm ghost" data-act="reload" data-i="${i}">Reload</button>`:""}`:`<span class="hint">—</span>`}</td></tr>`}).join("");
  const anyBurst=weapons.some(x=>x.w.burst);
  return `<div class="sect"><span class="lbl">Attacks <button class="hint rword" style="text-transform:none;letter-spacing:0" data-act="rule" data-key="attack">how attacks work</button></span>
    <div class="tbl-wrap"><table class="atktbl"><thead><tr><th>Weapon</th><th>Hit</th><th>Damage</th><th>Shock</th><th>Ammo</th></tr></thead><tbody>${rows}</tbody></table></div>
    ${anyBurst?`<label class="toggle" style="margin-top:8px"><input type="checkbox" id="opt-burst" data-opt="burst" ${S.opts.burst?"checked":""}>Burst fire (+2 to hit and damage, uses 3 rounds)</label>`:""}
    <p class="hint">Hit rolls the d20; Damage rolls damage. Shock is the damage a melee weapon still deals on a miss, if the target's AC is at or below the number. <button class="hint rword" data-act="rule" data-key="shock">More on Shock</button></p>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px">${can?`<button class="btn ${R.totalDefense?"on":""}" data-act="total-def">${R.totalDefense?"Total Defense ON (+2 AC)":"Take Total Defense"}</button>`:R.totalDefense?`<span class="tag on">Total Defense</span>`:""}<span class="hint">Instant: spends your Main Action. +2 AC and immune to melee Shock until your next turn. Turn it off when your turn comes.</span></div></div>
    <details class="sect actref" ${S.actRefOpen??!window.matchMedia("(max-width:640px)").matches?"open":""}><summary class="lbl" data-act="actref">Combat actions <span class="hint mshow" style="text-transform:none;letter-spacing:0">tap to show</span></summary>
      <div class="actgrid">
        <div class="actbox"><h4>Main Action <span class="tag">one per turn</span></h4><p class="hint">Most of your six-second round. You can trade it for a second Move.</p>
          <ul><li><b>Melee Attack</b>: hit an adjacent foe with a Readied weapon. Shock on a miss.</li><li><b>Ranged Attack</b>: fire or throw a Readied weapon. With an armed enemy in melee range you can't fire two-handed guns, and one-handed ones take −4.</li><li><b>Use a Skill</b>: something quick, like stabilizing an ally or running a prepared hack.</li><li><b>Ready or Stow an Item</b>: draw a stowed weapon, dig something out of your pack.</li><li><b>Reload</b>: swap in a Readied magazine or power cell.</li><li><b>Fighting Withdrawal</b>: disengage from melee so you can move away without free attacks.</li></ul></div>
        <div class="actbox"><h4>Move Action <span class="tag">one per turn</span></h4><p class="hint">About 10 meters. Can't be split around your Main Action.</p>
          <ul><li><b>Run</b>: 10 m (half when climbing, swimming, rough terrain, or prone).</li><li><b>Stand Up</b> from prone.</li><li><b>Pick Up an Item</b> with a free hand; it ends up Readied.</li><li><b>Club Up a Weapon</b>: grip a gun to use as a club (or switch back).</li><li><b>Hold an Action</b>: delay your other actions and trigger them later as Instants.</li></ul></div>
        <div class="actbox"><h4>On Turn <span class="tag">any number, your turn</span></h4><p class="hint">Fast, simple things done alongside everything else.</p>
          <ul><li><b>Go Prone</b>: −2 to hit you from range, but adjacent foes get +2.</li><li><b>Draw a Readied item.</b></li><li><b>Speak</b> a few words, <b>drop</b> or <b>activate</b> a simple device.</li></ul></div>
        <div class="actbox"><h4>Instant <span class="tag">any number, any time</span></h4><p class="hint">Even on someone else's turn, or after dice are rolled.</p>
          <ul><li><b>Snap Attack</b>: attack out of turn at −4 to hit. Spends your upcoming Main Action. Use the Snap button above.</li><li><b>Total Defense</b>: +2 AC and immune to melee Shock until your next turn. Spends your Main Action (can't if already used).</li><li><b>Drop an Item</b> to free your hands.</li>${c.class==="Warrior"?`<li><b>Warrior's luck</b>: once per scene, negate a hit against you or turn your miss into a hit.</li>`:""}${R.psychic||R.effortMax>0?`<li>Some psychic techniques are Instant; check each one's description.</li>`:""}</ul></div>
      </div></details>`;
}

function renderFeatures(path,c,R,E){

    ${E&&techOpts.length?`<div style="display:flex;gap:6px;align-items:center"><select id="tech-pick" class="inp" style="max-width:320px"><option value="">Add a level-1 technique…</option>${techOpts.map(o=>`<option value="${esc(o[0])}">${esc(o[1])}</option>`).join("")}</select><button class="btn sm" data-act="tech-add">Add</button></div>`:""}</div>`:"";
  const eff=(c.effects||[]).filter(f=>f.active);

    ${techHtml}
    <div class="sect"><span class="lbl">Other features</span>${E?ta(path,"features",{ph:"Background perks, ship role, anything else…",rows:5}):c.features?`<div class="feature"><p>${esc(c.features)}</p></div>`:`<p class="hint">Nothing here yet.</p>`}</div>
    <div class="sect"><span class="lbl">Active effects</span>${eff.length?eff.map(f=>`<div class="feature"><h4>${esc(f.name||"Effect")}</h4><p>${(f.mods||[]).map(m=>esc(TARGET_NAME[m.target]||m.target)+" "+sgn(m.value)).join(", ")||"No bonuses"}</p></div>`).join(""):`<p class="hint">None. Your GM can add conditions and temporary bonuses.</p>`}</div>`;

function renderGM(path,c,R){
  const ovs=[["ac","Armor Class",R.b.ac],["bab","Attack bonus",R.b.bab],["init","Initiative bonus",R.b.init],["hpMax","Max HP",R.b.hpMax],["save_physical","Physical save",R.b.save_physical],["save_evasion","Evasion save",R.b.save_evasion],["save_mental","Mental save",R.b.save_mental],["strainMax","Max strain",R.b.strainMax],["effortMax","Max Effort",R.b.effortMax||[]],["readied","Readied limit",R.b.readied],["stowed","Stowed limit",R.b.stowed]];
  const autoOf=parts=>(parts||[]).filter(p=>!p.ov&&p.v!=null).reduce((s,p)=>s+p.v,0);
  const hb=hbPaths();

function itemSummary(it){
  const bits=[];
  if(it.type==="weapon"){bits.push("Damage "+(it.dmg||"—"));if(it.shock)bits.push("Shock "+it.shock);if(it.range)bits.push("Range "+it.range);if(num(it.mag))bits.push("Mag "+it.mag);bits.push((it.attr||"DEX")+" · "+(SKILL[it.skill]?.name||"Shoot"))}

function restPreview(c){

  const r={effortMax:R.effortMax,effortLeft:R.effortLeft,strainBefore:R.strainCur,hpBefore:cur};
  const temp=num(c.strain?.temp);r.strainDrop=temp>0;r.strainAfter=Math.max(0,temp-1);r.strainAfterTotal=R.strainPerm+r.strainAfter;

function itemPickOpts(blank,weaponsOnly){
  const hb=hbPaths().filter(p=>!weaponsOnly||S.docs[p].type==="weapon");
  const groups={};bookItems().forEach(it=>{if(weaponsOnly&&it.type!=="weapon")return;(groups[it.group]=groups[it.group]||[]).push(it)});
  return `<option value="">${esc(blank)}</option>${hb.length?`<optgroup label="Homebrew">${hb.map(p=>`<option value="hb:${esc(p.split("/")[1])}">${esc(S.docs[p].name)} (${esc(S.docs[p].type||"gear")})</option>`).join("")}</optgroup>`:""}${Object.entries(groups).map(([g,l])=>`<optgroup label="Rulebook: ${esc(g)}">${l.map(it=>`<option value="bk:${esc(it.bk)}">${esc(it.name)}${it.dmg?" ("+esc(it.dmg)+")":it.ac?" (AC "+it.ac+")":""}</option>`).join("")}</optgroup>`).join("")}`;
}
function pickedItem(v){
  if(v.startsWith("hb:")){const d=S.docs["homebrew/"+v.slice(3)];return d?{...clone(d),hb:v.slice(3)}:null}
  if(v.startsWith("bk:")){const it=bookItems().find(x=>x.bk===v.slice(3));return it?clone(it):null}
  return S.docs["homebrew/"+v]?{...clone(S.docs["homebrew/"+v]),hb:v}:null;
}
function addPicked(c,p,v){
  if(v.startsWith("hb:"))return addHb(c,p,v.slice(3));
  if(!v.startsWith("bk:"))return addHb(c,p,v);
  const it=pickedItem(v);if(!it)return;
  const inv=c.inventory||[];
  const e={id:rid(),type:it.type,name:it.name,qty:1,location:it.type==="gear"?"stowed":"readied",enc:num(it.enc),cost:num(it.cost),tl:num(it.tl),mods:[],description:it.description||""};
  if(it.type==="weapon")Object.assign(e,{dmg:it.dmg,range:it.range||"",mag:num(it.mag),ammo:num(it.mag),attr:it.attr,skill:it.skill,shock:it.shock||"",energy:!!it.energy,burst:!!it.burst});
  if(it.type==="armor"||it.type==="shield")e.ac=num(it.ac);
  inv.push(e);setField(p,"inventory",inv);
}
function addHb(c,p,id){
  const hb=S.docs["homebrew/"+id];if(!hb)return;
  const inv=c.inventory||[];
  inv.push({id:rid(),hb:id,name:hb.name,qty:1,location:hb.type==="gear"?"stowed":"readied",ammo:num(hb.mag)});
  setField(p,"inventory",inv);
}

function gearItem(key,qty){
  const t=G[key];const it={id:rid(),qty:1,location:"stowed",mods:[],description:"",...clone(t)};
  const q=qty||1;
  if(t.bundle&&q>1){it.qty=q;it.enc=Math.ceil(q/t.bundle);it.encFixed=true}else it.qty=q;
  if(t.type==="weapon"){it.location="readied";it.ammo=num(t.mag);it.shock=t.shock||"";it.range=t.range||"";it.mag=num(t.mag)}
  if(t.type==="armor"||t.type==="shield")it.location="readied";
  delete it.bundle;
  return it;
}

const ARRAY_VALUES=[14,12,11,10,9,7];
const WSTEPS=[["concept","Concept"],["attributes","Attributes"],["background","Background"],["skills","Background Skills"],["class","Class"],["foci","Foci"],["hobby","Bonus Skill"],["psychic","Psychic Powers"],["hp","Hit Points"],["equipment","Equipment"],["review","Review & Create"]];
function newWiz(){return {step:0,name:"",player:"",homeworld:"",species:"Human",goal:"",
  attrMethod:"roll",rolls:{},rollDice:{},swap14:"",arrayAssign:{},
  bg:"",bgMethod:"quick",freeChoice:"",freeAlt:"",quickChoice:{},quickAlt:{},picks:[{idx:"",choice:"",alt:""},{idx:"",choice:"",alt:""}],
  rollsBg:[{table:"learning",value:null,choice:"",alt:"",a:"",b:""},{table:"learning",value:null,choice:"",alt:"",a:"",b:""},{table:"growth",value:null,choice:"",alt:"",a:"",b:""}],
  cls:"",partials:["",""],foci:[],anyFocus:false,hobby:{choice:""},psy:{picks:["",""],tech:""},ptTech:"",
  hp:{die:null},equip:{mode:"package",pkg:"",d1:null,d2:null}}}
function loadWiz(){try{const v=localStorage.getItem("swn.wiz");if(v){const w=JSON.parse(v);return Object.assign(newWiz(),w)}}catch(e){}return newWiz()}
function saveWiz(){try{localStorage.setItem("swn.wiz",JSON.stringify(S.wiz))}catch(e){}}
function wget(p){return getPath(S.wiz,p)}
