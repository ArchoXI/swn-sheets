of ships and structures thrown together when the need for seagoing life become apparent to the locals.", "E": "Pirate city lord, Mer-human raider chieftain, Hostile landsman noble, Enemy city saboteur", "F": "City navigator, Scout captain, Curious mer-human, Hard-pressed ship-city engineer", "C": "The seas are not water, The fish schools have vanished and the city faces starvation, Terrible storms drive the city into the glacial regions, Suicide ships ram the city’s hull", "T": "Giant pearls with mysterious chemical properties, Buried treasure, Vital repair materials", "P": "Bridge of the city, Storm-tossed sea, A bridge fashioned of many small boats."}, {"n": 81, "name": "Sealed Menace", "desc": "Something on this planet has the potential to create enormous havoc for the inhabitants if it is not kept safely contained by its keepers. Whether a massive seismic fault line suppressed by pretech terraforming technology, a disease that has to be quarantined within hours of discovery, or an ancient alien relic that requires regular upkeep in order to prevent planetary catastrophe, the menace is a constant shadow on the fearful populace.", "E": "Hostile outsider bent on freeing the menace, Misguided fool who thinks he can use it, Reckless researcher who thinks he can fix it", "F": "Keeper of the menace, Student of its nature, Victim of the menace", "C": "The menace would bring great wealth along with destruction, The menace is intelligent, The natives don’t all believe in the menace", "T": "A key to unlock the menace, A precious byproduct of the menace, The secret of the menace’s true nature", "P": "Guarded fortress containing the menace, Monitoring station, Scene of a prior outbreak of the menace"}, {"n": 82, "name": "Secret Masters", "desc": "The world is actually run by a hidden cabal, acting through their catspaws in the visible government. For one reason or another, this group finds it imperative that they not be identified by outsiders, and in some cases even the planet’s own government may not realize that they’re actually being manipulated by hidden masters.", "E": "An agent of the cabal, Government official who wants no questions asked, Willfully blinded local", "F": "Paranoid conspiracy theorist, Machiavellian gamesman within the cabal, Interstellar investigator", "C": "The secret masters have a benign reason for wanting secrecy, The cabal fights openly amongst itself, The cabal is recruiting new members", "T": "A dossier of secrets on a government official, A briefcase of unmarked credit notes, The identity of a cabal member", "P": "Smoke-filled room, Shadowy alleyway, Secret underground bunker"}, {"n": 83, "name": "Sectarians", "desc": "The world is torn by violent disagreement between sectarians of a particular faith. Each views the other as a damnable heresy in need of extirpation. Local government may be able to keep open war from breaking out, but the poisonous hatred divides communities. The nature of the faith may be religious, or it may be based on some secular ideology.", "E": "Paranoid believer, Native convinced the party is working for the other side, Absolutist ruler", "F": "Reformist clergy, Local peacekeeping official, Offworld missionary, Exhausted ruler", "C": "The conflict has more than two sides, The sectarians hate each other for multiple reasons, The sectarians must cooperate or else life on this world is imperiled, The sectarians hate outsiders more than they hate each other, The differences in sects are incomprehensible to an outsider", "T": "Ancient holy book, Incontrovertible proof, Offering to a local holy man", "P": "Sectarian battlefield, Crusading temple, Philosopher’s salon, Bitterly divided village"}, {"n": 84, "name": "Seismic Instability", "desc": "The local land masses are remarkably unstable, and regular earthquakes rack the surface. Local construction is either advanced enough to sway and move with the vibrations or primitive enough that it is easily rebuilt. Severe volcanic activity may be part of the instability.", "E": "Earthquake cultist, Hermit seismologist, Burrowing native life form, Earthquake-inducing saboteur", "F": "Experimental construction firm owner, Adventurous volcanologist, Geothermal prospector", "C": "The earthquakes are caused by malfunctioning pretech terraformers, They’re caused by alien technology, They’re restrained by alien technology that is being plundered by offworlders, The earthquakes are used to generate enormous amounts of energy.", "T": "Earthquake generator, Earthquake suppressor, Mineral formed at the core of the world, Earthquake-proof building schematics", "P": "Volcanic caldera, Village during an earthquake, Mud slide, Earthquake opening superheated steam fissures"}, {"n": 85, "name": "Shackled World", "desc": "This world is being systematically contained by an outside power. Some ancient autonomous defense grid, robot law enforcement, alien artifact, or other force is preventing the locals from developing certain technology, or using certain devices, or perhaps from developing interstellar flight. This limit may or may not apply to offworlders; in the former case, the PCs may have to figure out a way to beat the shackles simply to escape the world.", "E": "Passionless jailer-AI, Paranoid military grid AI, Robot overlord, Enigmatic alien master", "F": "Struggling local researcher, Offworlder trapped here, Scientist with a plan to break the chains", "C": "The shackles come off for certain brief windows of time, The locals think the shackles are imposed by God, An outside power greatly profits from the shackles, The rulers are exempt from the shackles", "T": "Keycode to bypass the shackle, Tech shielded from the shackle, Exportable version of the shackle that can affect other worlds", "P": "Grim high-tech control center, Factory full of workaround tech, Temple to the power or entity that imposed the shackle"}, {"n": 86, "name": "Societal Despair", "desc": "The world’s dominant society has lost faith in itself. Whether through some all-consuming war, great catastrophe, overwhelming outside culture, or religious collapse, the natives no longer believe in their old values, and search desperately for something new. Fierce conflict often exists between the last believers in the old dispensation and the nihilistic or searching disciples of the new age.", "E": "Zealot who blames outsiders for the decay, Nihilistic warlord, Offworlder looking to exploit the local despair", "F": "Struggling messenger of a new way, Valiant paragon of a fading tradition, Local going through the motions of serving a now-irrelevant role", "C": "A massive war discredited all the old values, Outside powers are working to erode societal confidence for their own benefit, A local power is profiting greatly from the despair, The old ways were meant to aid survival on this world and their passing is causing many new woes", "T": "Relic that would inspire a renaissance, Art that would inspire new ideas, Priceless artifact of a now-scorned belief", "P": "Empty temple, Crowded den of obliviating vice, Smoky hall full of frantic speakers"}, {"n": 87, "name": "Sole Supplier", "desc": "Some extremely important resource is exported from this world and this world alone. It’s unlikely that the substance is critical for building spike drives unless this world is also the first to begin interstellar flight, but it may be critical to other high-tech processes or devices. The locals make a large amount of money off this trade and control of it is of critical importance to the planet’s rulers, and potentially to outside powers.", "E": "Resource oligarch, Ruthless smuggler, Resource-controlling warlord, Foreign agent seeking to subvert local government", "F": "Doughty resource miner, Researcher trying to synthesize the stuff, Small-scale resource producer, Harried starport trade overseer", "C": "The substance is slow poison to process, The substance is created by hostile alien natives, The substance is very easy to smuggle in usable amounts, Only the natives have the genes or tech to extract it effectively", "T": "Cache of processed resource, Trade permit to buy a load of it, A shipment of nigh-undetectably fake substance", "P": "Bustling resource extraction site, Opulent palace built with resource money, Lazy town square where everyone lives on resource payments"}, {"n": 88, "name": "Taboo Treasure", "desc": "The natives here produce something that is both fabulously valuable and strictly forbidden elsewhere in the sector. It may be a lethally addictive drug, forbidden gengineering tech, vat-grown “perfect slaves”, or a useful substance that can only be made through excruciating human suffering. This treasure is freely traded on the world, but bringing it elsewhere is usually an invitation to a long prison stay or worse.", "E": "Maker of a vile commodity, Smuggler for a powerful offworlder, Depraved offworlder here for “fun”, Local warlord who controls the treasure", "F": "Reformer seeking to end its use, Innovator trying to repurpose the treasure in innocent ways, Wretched addict unwillingly prey to the treasure", "C": "The treasure is extremely hard to smuggle, Its use visibly marks a user, The natives consider it for their personal use only,", "T": "Load of the forbidden good, Smuggling tech that could hide the good perfectly, Blackmail data on offworld buyers of the good", "P": "Den where the good is used, Market selling the good to locals and a few outsiders, Factory or processing area where the good is created"}, {"n": 89, "name": "Terraform Failure", "desc": "This world was marginal for human habitation when it was discovered, but the Mandate or the early government put in pretech terraforming engines to correct its more extreme qualities. The terraforming did not entirely work, either failing of its own or suffering the destruction of the engines during the Silence. The natives are only partly adapted to the world’s current state, and struggle with the environment.", "E": "Brutal ruler who cares only for their people, Offworlder trying to loot the damaged engines, Warlord trying to seize limited habitable land", "F": "Local trying to fix the engines, Offworlder student of the engines, World-wise native survivor", "C": "The engines produced too much of something instead of too little, The engines were hijacked by aliens with different preferences, It was discovered that an Earth-like environment would eventually cause a catastrophic disaster", "T": "Parts to repair or restore the engines, Lootable pretech fragments, Valuable local tech devised to cope with the world", "P": "Zone of tolerable gravity or temperature, Native settlement built to cope with the environment, Massive ruined terraforming engine"}, {"n": 90, "name": "Theocracy", "desc": "The planet is ruled by the priesthood of the predominant religion or ideology. The rest of the locals may or may not be terribly pious, but the clergy have the necessary military strength, popular support or control of resources to maintain their rule. Alternative faiths or incompatible ideologies are likely to be both illegal and socially unacceptable.", "E": "Decadent priest-ruler, Zealous inquisitor, Relentless proselytizer, True Believer", "F": "Heretic, Offworld theologian, Atheistic merchant, Desperate commoner", "C": "The theocracy actually works well, The theocracy is decadent and hated by the common folk, The theocracy is divided into mutually hostile sects, The theocracy is led by aliens", "T": "Precious holy text, Martyr’s bones, Secret church records, Ancient church treasures", "P": "Glorious temple, Austere monastery, Academy for ideological indoctrination, Decadent pleasure-cathedral"}, {"n": 91, "name": "Tomb World", "desc": "Tomb worlds are planets that were once inhabited by humans before the Silence. The sudden collapse of the jump gate network and the inability to bring in the massive food supplies required by the planet resulted in starvation, warfare, and death. Most tomb worlds are naturally hostile to human habitation and could not raise sufficient crops to maintain life. The few hydroponic facilities were usually destroyed in the fighting, and all that is left now are ruins, bones, and silence.", "E": "Demented survivor tribe chieftain, Avaricious scavenger, Automated defense system, Native predator", "F": "Scavenger Fleet captain, Archaeologist, Salvaging historian, Xenophilic native survivor", "C": "The ruins are full of booby-traps left by the final inhabitants, The world’s atmosphere quickly degrades anything in an opened building, A handful of desperate natives survived the Silence, The structures are unstable and collapsing", "T": "Lost pretech equipment, Tech caches, Stores of unused munitions, Ancient historical data", "P": "Crumbling hive-city, City square carpeted in bones, Ruined hydroponic facility, Cannibal tribe’s lair, Dead orbital jump gate"}, {"n": 92, "name": "Trade Hub", "desc": "This world is a major crossroads for local interstellar trade. It is well-positioned at the nexus of several short-drill trade routes, and has facilities for easy transfer of valuable cargoes and the fueling and repairing of starships. The natives are accustomed to outsiders, and a polyglot mass of people from every nearby world can be found trading here.", "E": "Cheating merchant, Thieving dockworker, Commercial spy, Corrupt customs official", "F": "Rich tourist, Hardscrabble free trader, Merchant prince in need of catspaws, Friendly spaceport urchin", "C": "An outworlder faction schemes to seize the trade hub, Saboteurs seek to blow up a rival’s warehouses, Enemies are blockading the trade routes, Pirates lace the hub with spies", "T": "Voucher for a warehouse’s contents, Insider trading information, Case of precious offworld pharmaceuticals, Box of legitimate tax stamps indicating customs dues have been paid.", "P": "Raucous bazaar, Elegant restaurant, Spaceport teeming with activity, Foggy street lined with warehouses"}, {"n": 93, "name": "Tyranny", "desc": "The local government is brutal and indifferent to the will of the people. Laws may or may not exist, but the only one that matters is the whim of the rulers on any given day. Their minions swagger through the streets while the common folk live in terror of their appetites. The only people who stay wealthy are friends and servants of the ruling class.", "E": "Debauched autocrat, Sneering bully-boy, Soulless government official, Occupying army officer", "F": "Conspiring rebel, Oppressed merchant, Desperate peasant, Inspiring religious leader", "C": "The tyrant rules with vastly superior technology, The tyrant is a figurehead for a cabal of powerful men and women, The people are resigned to their suffering, The tyrant is hostile to “meddlesome outworlders”.", "T": "Plundered wealth, Beautiful toys of the elite, Regalia of rulership", "P": "Impoverished village, Protest rally massacre, Decadent palace, Religious hospital for the indigent"}, {"n": 94, "name": "Unbraked AI", "desc": "Artificial intelligences are costly and difficult to create, requiring a careful sequence of “growth stages” in order to bring them to sentience before artificial limits on cognition speed and learning development are installed. These “brakes” prevent runaway cognition metastasis. This world has an “unbraked AI” on it, probably with a witting or unwitting corps of servants. Unbraked AIs are quite insane, but they learn and reason with a speed impossible for humans, and can demonstrate a truly distressing subtlety.", "E": "AI Cultist, Maltech researcher, Government official dependent on the AI", "F": "Perimeter agent, AI researcher, Braked AI", "C": "The AI’s presence is unknown to the locals, The locals depend on the AI for some vital service, The AI appears to be harmless, The AI has fixated on the group’s ship’s computer, The AI wants transport offworld", "T": "The room-sized AI core itself, Maltech research files, Perfectly tabulated blackmail on government officials, Pretech computer circuitry", "P": "Municipal computing banks, Cult compound, Repair center, Ancient hardcopy library"}, {"n": 95, "name": "Urbanized Surface", "desc": "The world’s land area is covered with buildings that extend downward for multiple levels. Such worlds either have a population in the trillions, extremely little land area, or are largely-abandoned due to some past catastrophe. Agriculture and resource extraction are part of the urban complex, and there may be an advanced maintenance system that may not be entirely under the control of present natives.", "E": "Maintenance AI that hates outsiders, Tyrant of a habitation block, Deep-dwelling prophet who considers “the sky” a blasphemy to be quelled", "F": "Local yearning for wild spaces, Grubby urchin of the underlevels, Harried engineer trying to maintain ancient works, Grizzled hab cop", "C": "The urban blocks are needed to survive the environment, The blocks were part of an ancient device of world-spanning size, The blocks require constant maintenance to avoid dangerous types of decay", "T": "Massively efficient power source, Map of the secret ways of a zone, Passkey into restricted hab block areas", "P": "Giant hab block now devoid of inhabitants, Chemical-reeking underway, Seawater mine full of salt and massive flowing channels"}, {"n": 96, "name": "Utopia", "desc": "Natural and social conditions on this world have made it a paradise for its inhabitants, a genuine utopia of happiness and fulfillment. This is normally the result of drastic human engineering, including brain-gelding, neurochemical control, personality curbs, or complete “humanity” redefinitions. Even so, the natives are extremely happy with their lot, and may wish to extend that joy to poor, sad outsiders.", "E": "Compassionate neurotherapist, Proselytizing native missionary to outsiders, Brutal tyrant who rules through inexorable happiness", "F": "Deranged malcontent, Bloody-handed guerrilla leader of a rebellion of madmen, Outsider trying to find a way to reverse the utopian changes", "C": "The natives really are deeply and contentedly happy with their altered lot, The utopia produces something that attracts others, The utopia works on converting outsiders through persuasion and generosity, The utopia involves some sacrifice that’s horrifying to non-members", "T": "Portable device that applies the utopian change, Plans for a device that would destroy the utopia, Goods created joyfully by the locals", "P": "Plaza full of altered humans, Social ritual site, Secret office where “normal” humans rule"}, {"n": 97, "name": "Warlords", "desc": "The world is plagued by warlords. Numerous powerful men and women control private armies sufficiently strong to cow whatever local government may exist. On the lands they claim, their word is law. Most spend their time oppressing their own subjects and murderously pillaging those of their neighbors. Most like to wrap themselves in the mantle of ideology, religious fervor, or an ostensibly legitimate right to rule.", "E": "Warlord, Avaricious lieutenant, Expensive assassin, Aspiring minion", "F": "Vengeful commoner, Government military officer, Humanitarian aid official, Village priest", "C": "The warlords are willing to cooperate to fight mutual threats, The warlords favor specific religions or races over others, The warlords are using substantially more sophisticated tech than others, Some of the warlords are better rulers than the government", "T": "Weapons cache, Buried plunder, A warlord’s personal battle harness, Captured merchant shipping", "P": "Gory battlefield, Burnt-out village, Barbaric warlord palace, Squalid refugee camp"}, {"n": 98, "name": "Xenophiles", "desc": "The natives of this world are fast friends with a particular alien race. The aliens may have saved the planet at some point in the past, or awed the locals with superior tech or impressive cultural qualities. The aliens might even be the ruling class on the planet.", "E": "Offworld xenoph /* ================= GM GENERATORS (Deluxe Edition tables) ================= */
const dN=n=>1+Math.floor(Math.random()*n);
const pickN=(arr,n)=>{const i=dN(n||arr.length)-1;return {n:i+1,text:arr[i]}};
const pick10=arr=>{const v=dN(10);return {n:v,text:arr[Math.ceil(v/2)-1]}}; // d10 read in pairs (1-2, 3-4…)
const range2d6=t=>{const a=dN(6),b=dN(6),v=a+b;return {n:v,text:t.find(r=>v>=r[0]&&v<=r[1])[2]}};
const GL=(k,label,die,r,extra={})=>({k,label,die,n:r.n,text:r.text,...extra});

const GENS={
  world:{group:"World",title:"World",icon:"🪐",desc:"A planet with name, two tags, and its basic stats.",

      const t1=dN(100);let t2=dN(100);while(t2===t1)t2=dN(100);
      return [{k:"name",label:"Name",die:"",n:"",text:nm.text,note:cu.culture+" place names"},
        tagLine("tag1",t1),tagLine("tag2",t2),
        GL("atmo","Atmosphere","2d6",range2d6(GEN.atmosphere)),GL("temp","Temperature","2d6",range2d6(GEN.temperature)),

function tagLine(k,n){const t=GEN.tags.find(x=>x.n===n)||GEN.tags[n-1];return {k,label:k==="tag1"?"Tag":"Tag",die:"d100",n:n===100?"00":n,text:t.name,tag:t.n}}
function reactionLine(){const a=dN(6),b=dN(6),v=a+b;const r=GEN.reaction.find(x=>v>=x[0]&&v<=x[1]);return {k:"reaction",label:"Reaction",die:"2d6",n:v,text:r[2]+": "+r[3].toLowerCase()}}
function poiLines(p){const P=GEN.poi[p-1];return [{k:"point",label:"A point…",die:"d8",n:p,text:P.point},GL("occ","Occupied by","d10",pick10(P.occ)),GL("sit","Situation","d10",pick10(P.sit))]}
function conflictLines(c){const C=GEN.conflict[c-1];return [{k:"type",label:"Conflict",die:"d8",n:c,text:C.type},GL("sit","Overall situation","d10",pick10(C.a)),GL("focus","Specific focus","d10",pick10(C.b))]}
function hazardLines(h){const H=GEN.hazard[h-1];return [{k:"type",label:"Hazard type",die:"d8",n:h,text:H.type},GL("ex","Specific example","d10",pick10(H.a)),GL("danger","Possible danger","d10",pick10(H.b))]}

function genLoad(){try{S.genHist=JSON.parse(localStorage.getItem("swn.gen")||"[]")}catch(e){S.genHist=[]}}
function genSave(){try{localStorage.setItem("swn.gen",JSON.stringify((S.genHist||[]).slice(0,40)))}catch(e){}}
function genText(r){return r.title+"\n"+r.lines.map(l=>{let s=l.label+": "+l.text+(l.note?" ("+l.note+")":"");if(l.tag){const t=GEN.tags.find(x=>x.n===l.tag);s+="\n   "+t.desc+"\n   Enemies: "+t.E+"\n   Friends: "+t.F+"\n   Complications: "+t.C+"\n   Things: "+t.T+"\n   Places: "+t.P}return s}).join("\n")}

function genAct(act,t){
  if(!(S.isGM||S.offline))return true;
  if(S.genHist==null)genLoad();
  const id=t.dataset.id;const r=id?(S.genHist||[]).find(x=>x.id===id):null;
  switch(act){
    case "gen-roll":{const g=GENS[t.dataset.g];if(!g)return true;const res={id:rid(),g:t.dataset.g,title:g.title,icon:g.icon,ts:Date.now(),lines:g.make()};
      if(t.dataset.parent){const par=(S.genHist||[]).find(x=>x.id===t.dataset.parent);if(par){par.subs=[...(par.subs||[]),res];genSave();render();return true}}
      S.genTab="roll";S.genHist=[res,...(S.genHist||[])];genSave();render();const fc=document.querySelector(".gcard");if(fc)fc.scrollIntoView({behavior:"smooth",block:"start"});return true}
    case "gen-line":{const host=findGen(id);if(!host)return true;const g=GENS[host.g];const k=t.dataset.k;
      if(k==="type"||k==="point"){host.lines=(host.g==="adventure"?[...conflictLines(dN(8)),...host.lines.slice(3)]:host.g==="hazard"?hazardLines(dN(8)):poiLines(dN(8)))}
      else{const fn=g.reroll[k];if(!fn)return true;const nl=fn(host.lines);if(nl)host.lines=host.lines.map(l=>l.k===k?nl:l)}
      genSave();render();return true}
    case "gen-again":{const host=findGen(id);if(!host)return true;host.lines=GENS[host.g].make();host.subs=[];host.ts=Date.now();genSave();render();return true}
    case "gen-x":{S.genHist=(S.genHist||[]).filter(x=>x.id!==id).map(x=>({...x,subs:(x.subs||[]).filter(s=>s.id!==id)}));genSave();render();return true}
    case "gen-pin":{const host=findGen(id);if(host){host.pin=!host.pin;genSave();render()}return true}
    case "gen-copy":{const host=findGen(id);if(!host)return true;const txt=genText(host)+((host.subs||[]).length?"\n\n"+host.subs.map(genText).join("\n\n"):"");
      (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toastMsg("Copied.")).catch(()=>toastMsg("Couldn't copy on this device.",true));return true}
    case "gen-clear":{if(S.confirm!=="gen-clear"){S.confirm="gen-clear";render();return true}S.confirm=null;S.genHist=(S.genHist||[]).filter(x=>x.pin);genSave();render();return true}
    case "gen-tag":{S.genTagOpen={...(S.genTagOpen||{}),[t.dataset.key]:!((S.genTagOpen||{})[t.dataset.key])};render();return true}
    case "gen-tab":{S.genTab=t.dataset.v;render();return true}
    case "gen-tagview":{S.genTagView=num(t.dataset.n);render();return true}
  }
  return false;
}
function findGen(id){for(const x of S.genHist||[]){if(x.id===id)return x;for(const s of x.subs||[])if(s.id===id)return s}return null}

function genCard(r,isSub){
  const open=S.genTagOpen||{};
  const rows=r.lines.map(l=>{const key=r.id+":"+l.k;const t=l.tag?GEN.tags.find(x=>x.n===l.tag):null;
    return `<div class="gline"><span class="glbl">${esc(l.label)}</span>${l.die?`<span class="gdie" title="Rolled ${esc(String(l.n))} on ${esc(l.die)}">${esc(l.die)} <b>${esc(String(l.n))}</b></span>`:`<span class="gdie"></span>`}
      <span class="gtext">${t?`<button class="rword gtag" data-act="gen-tag" data-key="${esc(key)}">${esc(l.text)} <span class="hint">${open[key]?"▴":"▾"}</span></button>`:esc(l.text)}${l.note?` <span class="hint">· ${esc(l.note)}</span>`:""}</span>
      ${GENS[r.g].reroll&&(GENS[r.g].reroll[l.k]||l.k==="type"||l.k==="point")?`<button class="iconbtn" data-act="gen-line" data-id="${esc(r.id)}" data-k="${esc(l.k)}" title="Re-roll this line">↻</button>`:`<span></span>`}
      ${t&&open[key]?`<div class="gtagbody">${tagBody(t)}</div>`:""}</div>`}).join("");
  const extras=!isSub&&GENS[r.g].extras?`<div class="gextras">${GENS[r.g].extras.map(([g,l])=>`<button class="btn sm" data-act="gen-roll" data-g="${g}" data-parent="${esc(r.id)}">${l}</button>`).join("")}</div>`:"";
  const subs=(r.subs||[]).map(s=>genCard(s,true)).join("");
  return `<div class="${isSub?"gsub":"frame gcard"}"><div class="ghead"><span class="gicon">${r.icon||""}</span><b>${esc(r.title)}</b>${isSub?"":`<span class="hint">${ago(r.ts)}</span>`}<span style="flex:1"></span>
    ${isSub?"":`<button class="btn sm ghost" data-act="gen-pin" data-id="${esc(r.id)}" title="Pinned results stay when you clear">${r.pin?"★ Pinned":"☆ Pin"}</button><button class="btn sm ghost" data-act="gen-copy" data-id="${esc(r.id)}">Copy</button><button class="btn sm ghost" data-act="gen-again" data-id="${esc(r.id)}">Re-roll all</button>`}
    <button class="iconbtn" data-act="gen-x" data-id="${esc(r.id)}" title="Remove">×</button></div>
    <div class="glines">${rows}</div>${subs}${extras}</div>`;
}
function tagBody(t){return `<p>${esc(t.desc)}</p><dl class="gtagdl"><dt>Enemies</dt><dd>${esc(t.E)}</dd><dt>Friends</dt><dd>${esc(t.F)}</dd><dt>Complications</dt><dd>${esc(t.C)}</dd><dt>Things</dt><dd>${esc(t.T)}</dd><dt>Places</dt><dd>${esc(t.P)}</dd></dl>`}

function renderGenerators(){
  if(!(S.isGM||S.offline))return `<div class="empty">Only the GM can use the generators.</div>`;
  if(S.genHist==null)genLoad();
  const tab=S.genTab||"roll";
  const groups=["World","Adventures","Encounters","NPCs"];
  const side=groups.map(g=>`<div class="ggroup"><div class="lbl">${g}</div>${Object.entries(GENS).filter(([k,v])=>v.group===g).map(([k,v])=>`<button class="gbtn" data-act="gen-roll" data-g="${k}"><span class="gicon">${v.icon}</span><span><b>${esc(v.title)}</b><span class="hint">${esc(v.desc)}</span></span></button>`).join("")}</div>`).join("")
    +`<div class="ggroup"><div class="lbl">Name culture</div><select class="inp" id="gen-culture"><option value="">Random</option>${GEN.names.map((c,i)=>`<option value="${i}" ${String(S.genCulture??"")===String(i)?"selected":""}>${c.culture}</option>`).join("")}</select><p class="hint" style="margin:4px 0 0">Used by NPC and Names.</p></div>`;
  const hist=S.genHist||[];
  const main=tab==="tags"?renderTagBrowser():hist.length?hist.map(r=>genCard(r)).join(""):`<div class="empty">Pick a generator on the left. Results stay here on this device until you remove them.</div>`;
  return `<div class="genpage"><div class="genhead"><h1 class="pagetitle" style="margin:0">Generators</h1><span class="hint">GM only · tables from the Deluxe Edition</span><span style="flex:1"></span>
    <nav class="gtabs"><button class="${tab==="roll"?"on":""}" data-act="gen-tab" data-v="roll">Results</button><button class="${tab==="tags"?"on":""}" data-act="gen-tab" data-v="tags">World tag list</button></nav>
    ${tab==="roll"&&hist.length?`<button class="btn sm ghost" data-act="gen-clear">${S.confirm==="gen-clear"?"Clear unpinned?":"Clear"}</button>`:""}</div>
    <div class="genbody"><aside class="genside">${side}</aside><section class="genmain">${main}</section></div></div>`;
}
function renderTagBrowser(){
  const q=(S.genTagQ||"").toLowerCase();const sel=S.genTagView||0;
  const list=GEN.tags.filter(t=>!q||t.name.toLowerCase().includes(q)||t.desc.toLowerCase().includes(q));
  const t=GEN.tags.find(x=>x.n===sel);
  return `<div class="tagbrowse"><div class="taglist"><input class="inp" id="gen-tagq" placeholder="Search tags…" value="${esc(S.genTagQ||"")}">
    <div class="tagitems">${list.map(x=>`<button class="${x.n===sel?"on":""}" data-act="gen-tagview" data-n="${x.n}"><span class="hint">${x.n===100?"00":x.n}</span> ${esc(x.name)}</button>`).join("")}</div></div>
    <div class="frame tagdetail">${t?`<h2>${esc(t.name)} <span class="hint">d100: ${t.n===100?"00":t.n}</span></h2>${tagBody(t)}`:`<p class="hint">Pick a tag to read it.</p>`}</div></div>`;
}

Object.assign(RULES,{
  mech_armor:{t:"Mech Armor",p:["Suits use Armor like vehicles do: it's subtracted from the damage of each hit, but Heavy weapons, explosives and similar brutal tools ignore it.","Light and heavy mechs are immune to ordinary small arms. Only TL4 Heavy weapons (and things like heavy shaped charges or artillery) can hurt them, and they subtract their Armor from that damage.","A weapon's AP ignores that many points of Armor, but can't do more than reduce it to 0. Hardened Polyceramic Overlay cuts attackers' AP by 5; Vanguard Plating by 15 (they don't stack). Psi weapons ignore Armor except MES Shunt Channels."]},

const mechPaths=()=>Object.keys(S.docs).filter(p=>p.startsWith("mechs/")).sort((a,b)=>String(S.docs[a].name).localeCompare(String(S.docs[b].name)));
const mechHull=m=>MECH_HULLS.find(h=>h[0]===(m&&m.hull))||MECH_HULLS[0];
const mcIdx=c=>Math.max(0,MECH_CLASSES.indexOf(c));
function mfCost(F,ci){return {cost:F[1]*MC_COST[ci],power:F[2]*(F[3]?MC_HASH[ci]:1),mass:F[4]*(F[5]?MC_HASH[ci]:1)}}
function mwDmg(W,ci){return /\/class/.test(W[2])?(ci+1)+W[2].replace(/^1|\/class/g,""):W[2]}
function mechDesign(m){
  const H=mechHull(m);const ci=mcIdx(H[10]);const psi=H[11]==="Psi";let cost=H[1],power=0,mass=0,hard=0;const issues=[];
  (m.weapons||[]).forEach(w=>{const W=MECH_WEAPONS.find(x=>x[0]===w.name);if(!W)return;cost+=W[1]*(w.tl4?2:1);power+=W[3];mass+=W[4];hard+=W[5];
    if(ci<mcIdx(W[7]))issues.push(W[0]+" needs a "+W[7]+" hull");if(/Psi/.test(W[8])&&!psi)issues.push(W[0]+" needs a psimech")});
  (m.defenses||[]).forEach(x=>{const D=MECH_DEFENSES.find(y=>y[0]===x.name);if(!D)return;const c=mfCost(D,ci);cost+=c.cost;power+=c.power;mass+=c.mass;if(ci<mcIdx(D[6]))issues.push(D[0]+" needs a "+D[6]+" hull")});
  (m.fittings||[]).forEach(x=>{const F=MECH_FITTINGS.find(y=>y[0]===x.name);if(!F)return;const q=Math.max(1,num(x.qty,1));const c=mfCost(F,ci);cost+=c.cost*q;power+=c.power*q;mass+=c.mass*q;
    if(ci<mcIdx(F[6]))issues.push(F[0]+" needs a "+F[6]+" hull");if(F[7]&&!psi)issues.push(F[0]+" needs a psimech")});
  const has=n=>(m.defenses||[]).some(x=>x.name===n);const fq=n=>(m.fittings||[]).filter(f=>f.name===n).reduce((s,f)=>s+Math.max(1,num(f.qty,1)),0);
  return {H,ci,cls:H[10],type:H[11],psi,cost,power,mass,hard,powerMax:H[7]+num(m.bonusPM),massMax:H[8]+num(m.bonusPM),hardMax:H[9],issues,
    hpMax:H[5]+(has("Redundant Systems Buffer")?20:0),acBase:H[6],speedBase:H[3]-(has("Augmented ECM Projector")?1:0),armor:H[4],
    apRed:has("Vanguard Plating")?15:has("Hardened Polyceramic Overlay")?5:0,ecm:has("Augmented ECM Projector"),cells:fq("Ammunition Cells"),escapePod:fq("Escape Pod")>0,maint:H[2]};
}
function mechPilot(m){const id=m.ownerSheet;const p=id?"sheets/"+id:null;if(p&&S.docs[p]){const c=S.docs[p];return {path:p,c,R:compute(c)}}return null}
function mechStyle(m,P){if(!P)return {lv:0};const f=(P.c.foci||[]).find(x=>x.key==="mech_pilot");if(!f)return {lv:0};const lv=num(f.level,1)>=2?2:1;return {lv,style:m.style||"",bonus:lv}}
function mechCompute(m){
  const D=mechDesign(m);const P=mechPilot(m);const st=mechStyle(m,P);
  const pen=-Math.max(0,num(m.penalty));
  return {...D,P,st,pen,ac:D.acBase+(st.style==="defensive"?st.bonus:0),speed:D.speedBase+(st.style==="swift"?st.bonus:0),hit:st.style==="aggressive"?st.bonus:0};
}
function mechCanUse(mp){if(S.offline||S.isGM)return true;const m=S.docs[mp];return !!(m&&m.ownerSheet&&isMine("sheets/"+m.ownerSheet))}
function mechWeapParts(m,C,W){
  const P=C.P;const melee=/Melee/.test(W[8]);const psi=/Psi/.test(W[8]);let parts=[],mod=0;
  if(P){const R=P.R;const attrs=psi?["wis","con"]:["int","dex"];const a=attrs.reduce((b,x)=>R.mod[x]>R.mod[b]?x:b,attrs[0]);
    const skills=melee?["punch","stab"]:psi?["shoot","telekinesis","telepathy","biopsionics","metapsionics","precognition","teleportation"]:["shoot"];
    const sk=skills.reduce((b,x)=>(R.skills[x]??-1)>(R.skills[b]??-1)?x:b,skills[0]);const lv=R.skills[sk]??-1;
    parts=[{l:"Attack bonus",v:R.bab},{l:a.toUpperCase(),v:R.mod[a]},{l:(SKILL[sk]?.name||sk)+(lv<0?" (untrained)":""),v:lv}];mod=R.mod[a]}
  else{parts=[{l:"Pilot",v:num(m.npcHit,3)}];mod=num(m.npcDmg,1)}
  if(C.hit)parts.push({l:"Aggressive style",v:C.hit});
  if(C.pen)parts.push({l:"Overdue maintenance",v:C.pen});
  return {parts,mod,bonus:parts.reduce((s,p)=>s+p.v,0)};
}
function mechEmit(mp,label,lines){
  const m=S.docs[mp];const C=mechCompute(m);
  if(C.P&&!m.npc){const c=C.P.c;emitRoll(c,(m.name||"Mech")+" · "+label,lines);return}
  npcRoll({name:m.name||"Mech"},label,lines);
}
function mechHit(mp,wid){
  const m=S.docs[mp];const C=mechCompute(m);const w=(m.weapons||[]).find(x=>x.id===wid);const W=w&&MECH_WEAPONS.find(x=>x[0]===w.name);if(!W)return;
  if((m.ammoOut||{})[wid]){toastMsg("That gun is out of ammo until the next maintenance.",true);return}
  const X=mechWeapParts(m,C,W);const d={v:rand(20),s:20};const tot=d.v+X.bonus;
  mechEmit(mp,(w.tl4?"TL4 ":"")+w.name+" hit",[{name:"Hit",dice:[d],parts:X.parts,total:tot,note:[W[8],W[6]!=="Melee"?"Range "+W[6]:""].filter(Boolean).join(" · ")}]);
}
function mechDmg(mp,wid){
  const m=S.docs[mp];const C=mechCompute(m);const w=(m.weapons||[]).find(x=>x.id===wid);const W=w&&MECH_WEAPONS.find(x=>x[0]===w.name);if(!W)return;
  const X=mechWeapParts(m,C,W);const p=parseDice(mwDmg(W,C.ci));const rr=rollGroups(p);const tot=rr.sum+p.flat+X.mod;
  mechEmit(mp,(w.tl4?"TL4 ":"")+w.name+" damage",[{name:"Damage",dice:rr.dice,parts:X.mod?[{l:"Attribute",v:X.mod}]:[],total:tot,note:[W[8],/Melee/.test(W[8])?"No Shock":""].filter(Boolean).join(" · ")}]);
}

/* ---------- actions ---------- */
function mechAct(act,t){
  const mp=t.dataset.doc;const m=mp?S.docs[mp]:null;const gm=S.isGM||S.offline;
  const can=()=>{if(!mechCanUse(mp)){toastMsg("Only the GM or this mech's pilot can do that.",true);return false}return true};
  switch(act){
    case "mech-hit":if(m&&can())mechHit(mp,t.dataset.id);return true;
    case "mech-dmg":if(m&&can())mechDmg(mp,t.dataset.id);return true;
    case "mech-hp":{if(!m||!can())return true;const C=mechCompute(m);const amt=Math.max(0,num($(t.dataset.inp)?.value,0));if(!amt){toastMsg("Type an amount first.",true);return true}
      const nv=Math.max(0,Math.min(C.hpMax,num(m.hp,C.hpMax)+num(t.dataset.d)*amt));setField(mp,"hp",nv);if(nv===0)toastMsg("The mech is down. The pilot makes a Physical save to escape.",true);render();return true}
    case "mech-style":{if(!m||!can())return true;setField(mp,"style",t.dataset.v===m.style?"":t.dataset.v);render();return true}
    case "mech-pen":{if(!m||!can())return true;setField(mp,"penalty",Math.max(0,Math.min(10,num(m.penalty)+num(t.dataset.d))));render();return true}
    case "mech-maint":{if(!m||!can())return true;if(S.confirm!=="mech-maint:"+mp){S.confirm="mech-maint:"+mp;render();return true}S.confirm=null;
      const C=mechCompute(m);setField(mp,"penalty",0);setField(mp,"fights",0);setField(mp,"ammoOut",{});setField(mp,"cellsUsed",0);toastMsg("Maintenance done ("+C.maint.toLocaleString()+" credits). Ammo refilled, penalty cleared.");render();return true}
    case "mech-ammo-check":{if(!m||!can())return true;const C=mechCompute(m);const P=C.P;const diff=6+num(m.fights);let cells=Math.max(0,C.cells-num(m.cellsUsed));
      const guns=(m.weapons||[]).filter(w=>{const W=MECH_WEAPONS.find(x=>x[0]===w.name);return W&&/Ammo/.test(W[8])&&!(m.ammoOut||{})[w.id]});
      if(!guns.length){toastMsg("No ammo-using guns that still have ammo.",true);return true}
      const out={...(m.ammoOut||{})};let used=num(m.cellsUsed);const lines=[];
      guns.forEach(w=>{const dice=[{v:rand(6),s:6},{v:rand(6),s:6}];let parts;
        if(P){const R=P.R;const lv=R.skills.shoot??-1;parts=[{l:"Shoot"+(lv<0?" (untrained)":""),v:lv},{l:"WIS",v:R.mod.wis}]}else parts=[{l:"Pilot",v:num(m.npcHit,3)-2}];
        if(C.pen)parts.push({l:"Overdue maintenance",v:C.pen});
        const tot=dice[0].v+dice[1].v+parts.reduce((s,p)=>s+p.v,0);let ok=tot>=diff;let note="vs "+diff;
        if(!ok&&cells>0){cells--;used++;ok=true;note+=" · failed, but an Ammunition Cell covers it"}
        if(!ok)out[w.id]=true;
        lines.push({name:w.name,dice,parts,total:tot,verdict:ok?["ok","Still has ammo"]:["no","Out of ammo"],note})});
      setField(mp,"ammoOut",out);setField(mp,"fights",num(m.fights)+1);setField(mp,"cellsUsed",used);
      mechEmit(mp,"After-fight ammo check",lines);render();return true}
    case "mech-escape":{if(!m||!can())return true;const C=mechCompute(m);const P=C.P;if(!P){toastMsg("No pilot assigned.",true);return true}
      const R=P.R;const t1=R.save.physical;const roll=()=>{const d={v:rand(20),s:20};return {d,ok:d.v===20||d.v>=t1}};
      let r=roll();const lines=[{name:"Physical save",dice:[r.d],parts:[],total:r.d.v,verdict:r.ok?["ok","Escaped"]:["no","Failed"],note:"needs "+t1+"+"}];
      if(!r.ok&&C.escapePod){r=roll();lines.push({name:"Escape Pod reroll",dice:[r.d],parts:[],total:r.d.v,verdict:r.ok?["ok","Escaped"]:["no","Mortally wounded"],note:"needs "+t1+"+"})}
      const hp=num(P.c.hp?.cur);lines.push({name:r.ok?"Escapes":"Mortally wounded",dice:[],parts:[],total:r.ok?Math.ceil(hp/4):0,note:r.ok?"Escapes with a quarter of current HP, rounded up ("+hp+" → "+Math.ceil(hp/4)+")":"Needs biopsionics or a lazarus patch quickly"});
      emitRoll(P.c,(m.name||"Mech")+" destroyed: escape",lines);return true}
    case "mech-new":if(!gm)return true;S.mw={step:0,name:"",hull:"Shock Suit",weapons:[],defenses:[],fittings:[],ownerSheet:t.dataset.owner||"",npc:false,npcHit:3,npcDmg:1};S.view="mechwiz";render();return true;
    case "mech-tpl":{if(!gm||!S.mw)return true;const T=MECH_TEMPLATES[num(t.dataset.i)];const one=x=>Array.isArray(x)?x:[x,0];
      Object.assign(S.mw,{name:S.mw.name||T[0],hull:T[1],weapons:T[2].map(x=>{const [n,tl]=one(x);return {id:rid(),name:n,...(tl?{tl4:true}:{})}}),defenses:T[3].map(n=>({id:rid(),name:n})),fittings:T[4].map(x=>{const [n,q]=one(x);return {id:rid(),name:n,qty:q||1}})});render();return true}
    case "mech-refit":if(!gm||!m)return true;S.mw={step:0,editing:mp,...clone({name:m.name,hull:m.hull,weapons:m.weapons||[],defenses:m.defenses||[],fittings:m.fittings||[],ownerSheet:m.ownerSheet||"",npc:!!m.npc,npcHit:m.npcHit??3,npcDmg:m.npcDmg??1,bonusPM:m.bonusPM||0})};S.view="mechwiz";render();return true;
    case "mech-del":{if(!gm||!m)return true;if(S.confirm!=="mech-del:"+mp){S.confirm="mech-del:"+mp;render();return true}S.confirm=null;deleteDoc(mp);toastMsg("Mech deleted.");render();return true}
    case "mech-dup":{if(!gm||!m)return true;const path=(S.offline?"mechs/local-":"mechs/")+rid();const C=mechCompute(m);createDoc(path,{...clone(m),name:(m.name||"Mech")+" 2",ownerSheet:"",assigned:false,hp:C.hpMax,ammoOut:{},fights:0,penalty:0,cellsUsed:0,style:"",createdAt:Date.now()});if(S.offline)S.exists[path]=true;render();return true}
    // wizard
    case "mw-step":S.mw.step=Math.max(0,Math.min(4,num(t.dataset.v)));render();window.scrollTo(0,0);return true;
    case "mw-hull":S.mw.hull=t.dataset.v;render();return true;
    case "mw-add":{const k=t.dataset.k,n=t.dataset.v;S.mw[k]=S.mw[k]||[];if(k==="fittings"){const ex=S.mw[k].find(f=>f.name===n);if(ex)ex.qty=num(ex.qty,1)+1;else S.mw[k].push({id:rid(),name:n,qty:1})}else S.mw[k].push({id:rid(),name:n});render();return true}
    case "mw-rm":{const k=t.dataset.k,i=num(t.dataset.i);const a=S.mw[k]||[];if(k==="fittings"&&num(a[i].qty,1)>1)a[i].qty--;else a.splice(i,1);render();return true}
    case "mw-tl4":{const w=(S.mw.weapons||[])[num(t.dataset.i)];if(w)w.tl4=!w.tl4;render();return true}
    case "mw-cancel":S.mw=null;S.view="mechs";render();return true;
    case "mw-finish":{const w=S.mw;const D=mechDesign(w);if(D.power>D.powerMax||D.mass>D.massMax||D.hard>D.hardMax||D.issues.length)return true;
      const data={name:(w.name||"").trim()||"Unnamed mech",hull:w.hull,weapons:w.weapons||[],defenses:w.defenses||[],fittings:w.fittings||[],ownerSheet:w.npc?"":(w.ownerSheet||""),assigned:!w.npc&&!!w.ownerSheet,npc:!!w.npc,npcHit:num(w.npcHit,3),npcDmg:num(w.npcDmg,1),bonusPM:num(w.bonusPM)};
      if(w.editing){const mp2=w.editing;Object.entries(data).forEach(([k,v])=>setField(mp2,k,v));const C=mechCompute(S.docs[mp2]);if(num(S.docs[mp2].hp,C.hpMax)>C.hpMax)setField(mp2,"hp",C.hpMax);toastMsg("Mech saved.")}
      else{const path=(S.offline?"mechs/local-":"mechs/")+rid();createDoc(path,{...data,hp:D.hpMax,ammoOut:{},fights:0,penalty:0,cellsUsed:0,style:"",notes:"",createdAt:Date.now()});if(S.offline)S.exists[path]=true;toastMsg("Mech created"+(data.assigned?" and added to "+(S.docs["sheets/"+data.ownerSheet]?.name||"the character")+"'s inventory.":"."))}
      S.mw=null;S.view="mechs";render();return true}
  }
  return false;
}

/* ---------- mech block (inventory and GM page) ---------- */
function mechBlock(mp,opt={}){
  const m=S.docs[mp];const C=mechCompute(m);const can=mechCanUse(mp);const gm=S.isGM||S.offline;const id=mp.slice(mp.indexOf("/")+1);
  const hp=num(m.hp,C.hpMax);const pct=Math.max(0,Math.min(100,Math.round(100*hp/Math.max(1,C.hpMax))));const col=pct>50?"var(--good)":pct>25?"var(--warn)":"var(--bad)";
  const rw=(k,txt)=>`<button class="rword" data-act="rule" data-key="${k}">${txt}</button>`;
  const rows=(m.weapons||[]).map(w=>{const W=MECH_WEAPONS.find(x=>x[0]===w.name)||[];const X=mechWeapParts(m,C,W);const out=(m.ammoOut||{})[w.id];

    return `<div class="pickrow ${okC?"":"na"}"><div><b>${F[0]}</b> <span class="tag">${F[6]}+</span>${F[7]?` <span class="tag">psimech</span>`:""}${q?` <span class="tag on">×${q}</span>`:""}<div class="hint">${esc(F[9])}</div><div class="hint">${money(c.cost)} cr · Power ${c.power} · Mass ${c.mass}</div></div><button class="btn sm" data-act="mw-add" data-k="fittings" data-v="${esc(F[0])}" ${ok?"":"disabled"}>${!F[8]&&q?"Added":"Add"}</button></div>`}).join("")}</div>`}
  else{const chars=sheetPaths().filter(p=>!S.docs[p].npc&&p.startsWith("sheets/"));
    body=`<div class="grid2">

  const over=D.power>D.powerMax||D.mass>D.massMax||D.hard>D.hardMax||D.issues.length;

/* ================= GM INITIATIVE TRACKER (private) ================= */
const INI_P="gmprivate/initiative";
function iniDoc(){return S.docs[INI_P]||{round:1,turn:null,list:[]}}
function iniSave(d){S.docs[INI_P]=d;if(S.db&&!S.offline)S.db.doc(INI_P).set(clone(d)).catch(err=>{console.warn(err);toastMsg("Couldn't save the initiative tracker.",true)})}
function iniEdit(fn){const d=clone(iniDoc());fn(d);iniSave(d);render()}
const iniKind=ref=>ref?.startsWith("sheets/")?"pc":ref?.startsWith("npcs/")?"npc":ref?.startsWith("ships/")?"ship":"custom";
function iniInfo(e){
  const doc=e.ref?S.docs[e.ref]:null;
  if(e.ref&&!doc)return {name:e.name+" (deleted)",hp:null};
  if(e.kind==="pc"){const R=compute(doc);return {name:doc.name||"Unnamed",sub:doc.player||"PC",bonus:R.init,twice:R.initTwice,hp:num(doc.hp?.cur),max:R.hpMax}}
  if(e.kind==="npc")return {name:doc.name||"NPC",sub:"NPC",bonus:num(e.bonus),hp:num(doc.hp?.cur),max:num(doc.hp?.max)};
  if(e.kind==="ship"){const C=shipCompute(doc);return {name:doc.name||"Ship",sub:doc.npc?"NPC ship":"Party ship",bonus:num(e.bonus),hp:num(doc.hp),max:C.hpMax}}
  return {name:e.name||"Enemy",sub:"Custom",bonus:num(e.bonus),hp:e.hp==null||e.hp===""?null:num(e.hp),max:e.max==null||e.max===""?null:num(e.max)};
}
function iniRollOne(e){const I=iniInfo(e);const a=rand(8);let v=a,txt="1d8 ("+a+")";
  if(I.twice){const b=rand(8);v=Math.max(a,b);txt="1d8 twice ("+a+", "+b+", Alert)"}
  e.init=v+num(I.bonus);e.rollTxt=txt+" "+sgn(num(I.bonus))+" = "+e.init}
function iniSort(d){d.list.sort((a,b)=>num(b.init,-99)-num(a.init,-99)||(a.kind==="pc"?0:1)-(b.kind==="pc"?0:1)||num(iniInfo(b).bonus)-num(iniInfo(a).bonus))}
function iniSetHp(e,v){const I=iniInfo(e);if(I.hp==null&&e.kind!=="custom")return;
  const cl=x=>Math.max(0,I.max!=null&&I.max>0?Math.min(I.max,x):x);
  if(e.kind==="pc"||e.kind==="npc")setField(e.ref,"hp.cur",cl(v));
  else if(e.kind==="ship")setField(e.ref,"hp",cl(v));
  else iniEdit(d=>{const x=d.list.find(y=>y.id===e.id);if(x)x.hp=cl(v)});}
function iniAct(act,t){
  if(!(S.isGM||S.offline))return true;
  const id=t.dataset.id;
  switch(act){
    case "ini-add":{const ref=$("#ini-pick")?.value;if(!ref){toastMsg("Pick someone to add.",true);return true}
      if(iniDoc().list.some(e=>e.ref===ref)){toastMsg("Already in the order.",true);return true}
      iniEdit(d=>d.list.push({id:rid(),ref,kind:iniKind(ref),name:S.docs[ref]?.name||"",bonus:0,init:null}));return true}
    case "ini-party":iniEdit(d=>{sheetPaths().filter(p=>!S.docs[p].npc&&!d.list.some(e=>e.ref===p)).forEach(p=>d.list.push({id:rid(),ref:p,kind:"pc",name:S.docs[p].name||"",init:null}))});return true;
    case "ini-custom":{const name=($("#ini-cname")?.value||"").trim()||"Enemy";const n=Math.max(1,Math.min(20,num($("#ini-ccount")?.value,1)));
      const bonus=num($("#ini-cbonus")?.value,0);const hpv=$("#ini-chp")?.value;const hp=hpv===""||hpv==null?null:num(hpv);
      iniEdit(d=>{for(let i=1;i<=n;i++)d.list.push({id:rid(),kind:"custom",name:n>1?name+" "+i:name,bonus,hp,max:hp,init:null})});
      ["#ini-cname","#ini-chp"].forEach(s=>{const el=$(s);if(el)el.value=""});return true}
    case "ini-roll":iniEdit(d=>{const e=d.list.find(x=>x.id===id);if(e)iniRollOne(e)});return true;
    case "ini-rollall":iniEdit(d=>{d.list.forEach(e=>{if(t.dataset.all||e.init==null)iniRollOne(e)});iniSort(d);d.round=1;d.turn=d.list[0]?.id||null});return true;
    case "ini-sort":iniEdit(iniSort);return true;
    case "ini-next":case "ini-prev":iniEdit(d=>{const L=d.list.filter(e=>!e.out);if(!L.length)return;let i=L.findIndex(e=>e.id===d.turn);
      if(act==="ini-next"){if(i<0){d.turn=L[0].id;return}i++;if(i>=L.length){i=0;d.round=num(d.round,1)+1}}
      else{if(i<0){d.turn=L[L.length-1].id;return}i--;if(i<0){if(num(d.round,1)>1){i=L.length-1;d.round--}else i=0}}
      d.turn=L[i].id});return true;
    case "ini-up":case "ini-down":iniEdit(d=>{const i=d.list.findIndex(e=>e.id===id);const j=act==="ini-up"?i-1:i+1;if(i<0||j<0||j>=d.list.length)return;[d.list[i],d.list[j]]=[d.list[j],d.list[i]]});return true;
    case "ini-here":iniEdit(d=>{d.turn=id});return true;
    case "ini-out":iniEdit(d=>{const e=d.list.find(x=>x.id===id);if(e)e.out=!e.out});return true;
    case "ini-del":iniEdit(d=>{if(d.turn===id){const i=d.list.findIndex(e=>e.id===id);const L=d.list.filter(e=>e.id!==id);d.turn=L.length?L[Math.min(i,L.length-1)].id:null}d.list=d.list.filter(e=>e.id!==id)});return true;
    case "ini-hp":{const e=iniDoc().list.find(x=>x.id===id);if(!e)return true;const I=iniInfo(e);iniSetHp(e,num(I.hp)+num(t.dataset.d));render();return true}
    case "ini-reset":if(S.confirm!==act){S.confirm=act;render();return true}S.confirm=null;iniEdit(d=>{d.round=1;d.turn=null;d.list.forEach(e=>{e.init=null;e.rollTxt="";e.out=false})});toastMsg("New fight: everyone's initiative cleared.");return true;
    case "ini-clear":if(S.confirm!==act){S.confirm=act;render();return true}S.confirm=null;iniEdit(d=>{d.round=1;d.turn=null;d.list=[]});return true;
    case "ini-open":{const e=iniDoc().list.find(x=>x.id===id);if(!e||!S.docs[e.ref])return true;
      if(e.kind==="pc"){S.view="sheet";S.sel=e.ref}else if(e.kind==="npc"){S.view="npcs"}else if(e.kind==="ship"){S.view="ships";S.shipSel=e.ref;S.shipMode=S.docs[e.ref].npc?"npc":"party";S.shipFull=true}
      render();window.scrollTo(0,0);return true}
  }
  return false;
}
function iniChange(el){const id=el.dataset.id;const k=el.dataset.ini;const e=iniDoc().list.find(x=>x.id===id);if(!e)return;
  if(k==="hp"){iniSetHp(e,num(el.value));render();return}

const SEC_R=46,SEC_H=Math.sqrt(3)*46;

function secSvg(d){

    if(!start)return;const dx=e.clientX-start.x,dy=e.clientY-start.y;if(!window._secMoved&&Math.hypot(dx,dy)<5)return;window._secMoved=true;svg.classList.add("dragging");

  const up=e=>{P.delete(e.pointerId);if(P.size<2)pinch=null;if(!P.size){start=null;secEl()?.classList.remove("dragging")}};
  window.addEventListener("pointerup",up);window.addEventListener("pointercancel",up);
  document.addEventListener("dblclick",e=>{const hx=e.target.closest&&e.target.closest("#secsvg [data-hex]");if(!hx)return;e.preventDefault();S.secSel=hx.dataset.hex;render();secZoomTo(hx.dataset.hex)});
})();

    <button class="btn sm" data-act="sec-addpl" data-hex="${k}">+ Add planet</button>
    <label><span class="lbl">Notes (players can see)</span>${ta(SEC_P,pre+"note",{rows:3,ph:"What the party knows"})}</label>
    ${gmd?`<label><span class="lbl">GM notes (only you)</span>${ta(SEC_G,"notes."+k,{rows:3,ph:"Secrets, plans, spoilers"})}</label>`:""}
    <div class="secrow"><button class="btn" data-act="sec-view" data-hex="${k}">View system</button><button class="btn ${here?"":"pri"}" data-act="sec-party" data-hex="${k}" style="flex:1">${here?"Remove party marker":"Move party here"}</button></div>
  </div></div>`;
}

        <button class="btn sm" data-act="sec-icon">Upload icon</button>${d.partyIcon?`<button class="btn sm" data-act="sec-icon-reset">Use default</button>`:""}<input type="file" id="sec-iconfile" accept="image/*" hidden></div>
      <label><span class="lbl">Marker name</span>${inp(SEC_P,"partyLabel",{ph:"Party"})}</label>

/* ================= DICE ANIMATION ================= */
const FX={running:false,last:0,layer:null};
function fxEnabled(){
  try{if(localStorage.getItem("swn.dicefx")==="off")return false}catch(e){}
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)return false;
  return true;
}
function fxShape(s){return s===20?"d20":s===4?"d4":s===8?"d8":s===10?"d10":s===12?"d12":"d6"}
// Show a roll: animate dice (if allowed), then show the toast.
function showRoll(rec){
  const dice=((rec.lines||[]).find(l=>l.dice&&l.dice.length)||{}).dice||[];
  const now=Date.now();
  const skip=!fxEnabled()||document.hidden||FX.running||now-FX.last<900||!dice.length||typeof Element.prototype.animate!=="function";
  if(skip){showToast(rec);return}
  FX.running=true;FX.last=now;
  if(!FX.layer){FX.layer=document.createElement("div");FX.layer.className="fxlayer";FX.layer.setAttribute("aria-hidden","true");document.body.appendChild(FX.layer)}
  const show=dice.slice(0,4);const W=window.innerWidth,H=window.innerHeight;const size=W<600?70:92;
  const landY=H*0.42,spread=Math.min(size*1.55,W/(show.length+1.5));
  const startX=W+60;const centerX=W*0.5;
  const els=show.map((d,i)=>{
    const el=document.createElement("div");el.className="fxdie "+fxShape(d.s)+(d.drop?" drop":"");
    el.style.width=el.style.height=size+"px";
    const n=document.createElement("span");n.textContent=String(1+Math.floor(Math.random()*d.s));el.appendChild(n);
    FX.layer.appendChild(el);
    const endX=centerX+(i-(show.length-1)/2)*spread-size/2,endY=landY+(i%2?18:-10);
    const sy=H*(0.25+Math.random()*0.35);const spin=(Math.random()<.5?-1:1)*(Math.random()<.5?720:1080)+(Math.random()*16-8);
    el.animate([
      {transform:`translate(${startX}px,${sy}px) rotate(0deg) scale(.7)`,opacity:0},
      {opacity:1,offset:.1},
      {transform:`translate(${(startX+endX)/2}px,${Math.min(sy,endY)-70}px) rotate(${spin*0.6}deg) scale(1)`,offset:.55},
      {transform:`translate(${endX}px,${endY}px) rotate(${spin}deg) scale(1)`,opacity:1}
    ],{duration:850+i*90,easing:"cubic-bezier(.2,.7,.3,1)",fill:"forwards"});
    return {el,n,d,end:850+i*90};
  });
  // flicker numbers while tumbling (one timer for all dice)
  const t0=performance.now();
  const tick=()=>{const t=performance.now()-t0;let live=false;
    els.forEach(o=>{if(t<o.end-60){live=true;o.n.textContent=String(1+Math.floor(Math.random()*o.d.s))}else if(!o.done){o.done=true;o.n.textContent=String(o.d.v);o.el.classList.add("landed")}});
    if(live)setTimeout(tick,70);};
  tick();
  const total=Math.max(...els.map(o=>o.end));
  setTimeout(()=>{showToast(rec)},total);
  setTimeout(()=>{els.forEach(o=>{const a=o.el.animate([{opacity:1},{opacity:0}],{duration:350,fill:"forwards"});a.onfinish=()=>o.el.remove()});FX.running=false},total+900);
}

/* ================= BOOT ================= */
async function gmSubmit(){
  const k=($("#gm-pass")?.value||"").trim();
  if(!/^[A-Za-z0-9_-]{6,64}$/.test(k)){toastMsg("Use at least 6 letters, numbers, dashes or underscores.",true);return}
  if(!S.db||!S.me){toastMsg("Not connected yet. Try again in a moment.",true);return}
  try{
    if(S.setupDone===false){
      if(($("#gm-pass2")?.value||"").trim()!==k){toastMsg("The two passcodes don't match.",true);return}
      const b=S.db.batch();
      b.set(S.db.doc("config/setup"),{done:true,at:Date.now()});
      b.set(S.db.doc("gmKeys/"+k),{at:Date.now()});
      b.set(S.db.doc("gms/"+S.me),{key:k,at:Date.now()});
      await b.commit();S.setupDone=true;
    }else{
      await S.db.doc("gms/"+S.me).set({key:k,at:Date.now()});
    }
    S.isGM=true;S.drawer=null;toastMsg("GM tools unlocked on this device. Reloading…");render();setTimeout(()=>location.reload(),900);
  }catch(err){toastMsg(err&&err.code==="permission-denied"?"That passcode didn't work.":"Couldn't reach the database. Try again.",true)}
}
function startPreview(){
  S.offline=true;S.loading=false;S.isGM=true;
  const ex=exampleCharacter();S.docs["local/example"]=ex;S.exists["local/example"]=true;S.current="local/example";
  S.docs["homebrew/local-ex1"]={name:"Kestrel Mk II Pistol",type:"weapon",dmg:"1d8",attr:"DEX",skill:"shoot",range:"50/150",mag:8,enc:1,cost:350,tl:4,description:"Example homebrew sidearm with a smart-grip. +1 to hit.",mods:[{target:"attack",value:1}]};
  S.docs["homebrew/local-ex2"]={name:"Neural Reflex Wiring",type:"cyber",strain:1,enc:0,cost:15000,tl:5,description:"Example homebrew cyberware.",mods:[{target:"initiative",value:2},{target:"save:evasion",value:1}]};
  render();
}
render();
(async function boot(){
  if(!window.firebase){startPreview();return}
  let db;
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    db=firebase.firestore();
    const cred=await firebase.auth().signInAnonymously();
    S.me=cred.user.uid;
  }catch(e){console.error(e);startPreview();toastMsg("Couldn't connect to the party database, so this is a preview. Check that Anonymous sign-in is turned on in Firebase.",true);return}
  S.db=db;
  try{const g=await db.doc("gms/"+S.me).get();S.isGM=g.exists}catch(e){}
  try{const st=await db.doc("config/setup").get();S.setupDone=st.exists}catch(e){S.setupDone=null}
  render();
  const slowTimer=setTimeout(()=>{S.slow=true;render()},10000);
  let pending=4;const done=snap=>{if(snap&&snap.metadata&&!snap.metadata.fromCache){clearTimeout(slowTimer);S.slow=false}if(pending>0&&--pending===0)S.loading=false};
  const onErr=err=>{clearTimeout(slowTimer);S.loading=false;console.error(err);toastMsg(err&&err.code==="permission-denied"?"The database refused access. Check that the security rules were published.":"Lost the live connection to the party data. Reload the page to reconnect.",true);render()};
  const watch=(coll)=>db.collection(coll).onSnapshot(snap=>{
    const seen=new Set();
    snap.docs.forEach(d=>{const p=coll+"/"+d.id;seen.add(p);mergeRemote(p,d.data());
      if(coll==="sheets"&&S.isGM&&d.data().hidden===undefined&&!(S._bf||(S._bf={}))[p]){S._bf[p]=1;db.doc(p).update({hidden:false}).catch(()=>{})}});
    Object.keys(S.docs).forEach(p=>{if(p.startsWith(coll+"/")&&!seen.has(p)&&S.exists[p]&&!(Q[p]&&Q[p].inflight)){delete S.docs[p];delete S.exists[p]}});
    done(snap);render();
  },onErr);
  const qSeen={};
  const watchQ=(coll,q,key=coll,first)=>q.onSnapshot(snap=>{const seen=new Set();snap.docs.forEach(d=>{const p=coll+"/"+d.id;seen.add(p);mergeRemote(p,d.data())});qSeen[key]=seen;if(first){first(snap);first=null}
    const all=new Set();Object.values(qSeen).forEach(x=>x.forEach(p=>all.add(p)));
    Object.keys(S.docs).forEach(p=>{if(p.startsWith(coll+"/")&&!all.has(p)&&S.exists[p]&&!(Q[p]&&Q[p].inflight)){delete S.docs[p];delete S.exists[p]}});render()},err=>{console.warn(key,err);if(first){first(null);first=null}});
  if(S.isGM){watch("sheets")}
  else{let got=false;const once=snap=>{if(!got){got=true;done(snap)}};
    watchQ("sheets",db.collection("sheets").where("hidden","==",false),"sheets-visible",once);
    watchQ("sheets",db.collection("sheets").where("owners","array-contains",S.me),"sheets-mine")}
  watch("homebrew");watch("foci");
  try{db.doc(SEC_P).onSnapshot(d=>{if(d.exists){mergeRemote(SEC_P,d.data());S.exists[SEC_P]=true}else if(S.isGM&&!S.docs[SEC_P])createDoc(SEC_P,secDefault());render()},err=>console.warn("sector",err));
    if(S.isGM)db.doc(SEC_G).onSnapshot(d=>{if(d.exists){mergeRemote(SEC_G,d.data());S.exists[SEC_G]=true}else if(!S.docs[SEC_G])createDoc(SEC_G,{notes:{}});render()},err=>console.warn("sector notes",err))}catch(e){console.warn(e)}
  if(S.isGM)try{db.doc(INI_P).onSnapshot(d=>{if(d.exists){S.docs[INI_P]=d.data()}render()},err=>console.warn("initiative",err))}catch(e){console.warn(e)}
  if(S.isGM)watchQ("mechs",db.collection("mechs"));else watchQ("mechs",db.collection("mechs").where("assigned","==",true),"mechs-assigned");
  if(S.isGM)watchQ("ships",db.collection("ships"));else watchQ("ships",db.collection("ships").where("shared","==",true),"ships-shared");
  if(S.isGM){watchQ("npcs",db.collection("npcs"));db.collection("npcrolls").orderBy("ts","desc").limit(60).onSnapshot(snap=>{S.npcRolls=snap.docs.map(d=>({id:d.id,...d.data()}));render()},err=>console.warn("npcrolls",err))}
  else{watchQ("npcs",db.collection("npcs").where("shared","==",true),"npcs-shared");watchQ("npcs",db.collection("npcs").where("companion","==",true),"npcs-comp")}
  db.collection("rolls").orderBy("ts","desc").limit(60).onSnapshot(snap=>{
    const before=new Set(S.rolls.map(r=>r.id));const first=!S.rollsInit;S.rollsInit=true;
    S.rolls=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(!first){snap.docChanges().forEach(ch=>{if(ch.type==="added"&&!before.has(ch.doc.id)){const r=ch.doc.data();if(r&&r.by!==S.me&&Date.now()-num(r.ts)<15000)showRoll(r)}})}
    done(snap);render();
  },onErr);
})();
setInterval(()=>{if(S.logOpen)render()},30000);
</script>
