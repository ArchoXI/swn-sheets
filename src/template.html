      const sk=k.slice(6);const s=SKILL[sk]||PSYK[sk];title=s?.name||sk;
      body=`<p>${esc(s?.text||"")}</p>`;
      if(R&&SKILL[sk]){const lv=R.skills[sk];const a=(S.opts.attr==="auto"?SKILL[sk].attr:S.opts.attr).toLowerCase();const parts=[{l:"Skill level"+(lv<0?" (untrained)":""),v:lv},{l:a.toUpperCase()+" modifier",v:R.mod[a]},...R.br("skillChecks"),...sitPart()];
        body+=`<div class="lbl" style="margin-top:12px">Your bonus on 2d6</div>${calcHtml(parts,sgn(parts.reduce((s,p)=>s+p.v,0)))}`}
      if(R&&PSYK[sk])body+=`<p class="hint">Your level: ${R.psy[sk]<0?"not learned":R.psy[sk]}</p>`;
      body+=RULES.skillcheck.p.map(x=>`<p class="hint">${esc(x)}</p>`).join("");
    }else if(k.startsWith("save_")){
      const s=k.slice(5);title=s[0].toUpperCase()+s.slice(1)+" save";
      body=RULES.saves.p.map(x=>`<p>${esc(x)}</p>`).join("");
      if(R)body+=`<div class="lbl" style="margin-top:12px">Your target number</div>${calcHtml(R.b["save_"+s],R.save[s])}`;
    }else if(k==="item"){
    }else{
      const r=RULES[k]||{t:k,p:[]};title=r.t;body=r.p.map(x=>`<p>${esc(x)}</p>`).join("");
      if(R){
        const map={ac:["ac",R.ac],bab:["bab",sgn(R.bab)],init:["init",sgn(R.init)],hp:["hpMax",R.hpMax],strain:["strainMax",R.strainMax],effort:["effortMax",R.effortMax]};
        if(map[k]&&R.b[map[k][0]])body+=`<div class="lbl" style="margin-top:12px">How yours is calculated</div>${calcHtml(R.b[map[k][0]],map[k][1])}`;
        if(k==="strain")body+=`<p class="hint">Right now: ${R.strainPerm} permanent from cyberware + ${R.strainTemp} temporary.</p>`;
        if(k==="enc")body+=`<div class="lbl" style="margin-top:12px">Your limits</div>${calcHtml(R.b.readied,R.readiedLimit)}${calcHtml(R.b.stowed,R.stowedLimit)}`;
        if(ATTRS.find(a=>a[0]===k)){const parts=[{l:"Base score",v:num(cur.c.attrs?.[k],10)},...R.br(k)];body+=`<div class="lbl" style="margin-top:12px">Your score</div>${calcHtml(parts,R.score[k]+" ("+sgn(R.mod[k])+")")}`+RULES.attr.p.map(x=>`<p class="hint">${esc(x)}</p>`).join("")}
      }
    }
  }else if(d.kind==="delete"){
    const c=S.docs[d.path];if(!c){S.drawer=null;return ""}
    const fw=firstWord(c.name);const ok=String(S.delText||"").trim().toLowerCase()===fw.toLowerCase();
    title="Delete character";
    body=`<p>This permanently deletes <b>${esc(c.name||"this character")}</b> for everyone: stats, inventory, notes and picture. It can't be undone.</p>
      <p>To confirm, type <b>${esc(fw)}</b> below.</p>
      <input id="del-confirm" class="inp" autocomplete="off" placeholder="${esc(fw)}" value="${esc(S.delText||"")}">
      <div style="display:flex;gap:8px;margin-top:12px"><button class="btn danger" data-act="del-sheet" ${ok?"":"disabled"}>Delete ${esc(c.name||"character")}</button><button class="btn" data-act="drawer-close">Cancel</button></div>`;
  }else if(d.kind==="gm"){
    const setup=S.setupDone===false;title=setup?"Set up GM access":"GM login";
    body=setup?`<p>No GM passcode exists yet. Pick one now. Anyone who enters it gets full GM control, so keep it to yourself.</p>`:`<p>Enter the GM passcode to unlock GM tools on this device.</p>`;
    body+=`<form data-form="gm" style="display:grid;gap:8px"><input id="gm-pass" class="inp" type="password" autocomplete="off" placeholder="Passcode (letters, numbers, - or _, 6+ characters)" aria-label="GM passcode">${setup?`<input id="gm-pass2" class="inp" type="password" autocomplete="off" placeholder="Type it again" aria-label="Confirm passcode">`:""}<button class="btn pri" type="submit">${setup?"Create passcode and become GM":"Unlock GM tools"}</button></form>
      <p class="hint" style="margin-top:10px">GM access is remembered on this browser. On a new device or browser, log in again with the same passcode.</p>`;
  }else if(d.kind==="item"&&cur){
    const i=d.i;const e=(cur.c.inventory||[])[i];if(!e){S.drawer=null;return ""}
    const it=R.items[i];const can=canEdit(cur.path);title=it.name||"Item";
    if(it.linked){
      body=`<p class="hint">${esc(itemSummary(it))}</p><p style="white-space:pre-wrap">${esc(it.description||"")}</p>
        ${(it.mods||[]).length?`<div class="lbl">Bonuses</div><div class="calc">${it.mods.map(m=>`<div><span>${esc(TARGET_NAME[m.target]||m.target)}</span><span>${sgn(m.value)}</span></div>`).join("")}</div>`:""}
        <p class="hint">This is a homebrew item. Its stats come from the compendium${S.isGM?"; edit it there to update every copy":""}.</p>
        ${can?`<div class="grid2">${num(it.mag)>0?`<div class="field"><span class="lbl">Ammo loaded</span>${inp(cur.path,"inventory."+i+".ammo",{type:"number",min:0})}</div>`:""}</div><div class="field" style="margin-top:8px"><span class="lbl">Your notes</span>${ta(cur.path,"inventory."+i+".notes",{rows:3})}</div>`:""}
        ${S.isGM?`<button class="btn sm" style="margin-top:10px" data-act="hb-goto" data-doc="homebrew/${esc(it.hb)}">Edit in compendium</button>`:""}`;
    }else{
      body=can?itemFields(cur.path,"inventory."+i+".",false)+(it.type==="weapon"?`<div class="field" style="margin-top:8px;max-width:140px"><span class="lbl">Ammo loaded</span>${inp(cur.path,"inventory."+i+".ammo",{type:"number",min:0})}</div>`:"")
        :`<p class="hint">${esc(itemSummary(it))}</p><p style="white-space:pre-wrap">${esc(it.description||"")}</p>${(it.mods||[]).length?`<div class="calc">${it.mods.map(m=>`<div><span>${esc(TARGET_NAME[m.target]||m.target)}</span><span>${sgn(m.value)}</span></div>`).join("")}</div>`:""}`;
    }
    if(it.type==="weapon"){const W=weaponStats(cur.c,R,it);body+=`<div class="lbl" style="margin-top:14px">To-hit with this weapon</div>${calcHtml(W.atkParts,sgn(W.atk))}<div class="lbl">Damage bonus</div>${calcHtml(W.dmgParts,sgn(W.dflat))}`}
  }
  return `<div class="scrim" data-act="drawer-close"></div><aside class="drawer" role="dialog" aria-label="${esc(title)}"><div class="drawer-h"><h2>${esc(title)}</h2><button class="iconbtn" data-act="drawer-close" aria-label="Close">×</button></div><div class="drawer-body">${body}</div></aside>`;
}

/* ================= LOG ================= */
function renderLog(){
  const btn=`<button class="logbtn" data-act="log-toggle"><span class="dot"></span>Game log</button>`;
  if(!S.logOpen)return btn;
  const all=(S.isGM||S.offline)?[...S.rolls,...S.npcRolls.map(r=>({...r,_npc:true}))].sort((a,b)=>num(b.ts)-num(a.ts)):S.rolls;
  const list=all.slice(0,60).map(r=>`<div class="entry ${r._npc?"npcentry":""}"><div class="who"><span><b>${esc(r.char||"Someone")}</b>${r.player?" · "+esc(r.player):""}${r._npc?` <span class="tag">GM only</span>`:""}</span><span>${ago(num(r.ts))}</span></div><div class="what">${esc(r.label)}</div>${(r.lines||[]).map(lineHtml).join("")}${r._npc?`<button class="btn sm ghost" style="margin-top:4px" data-act="npc-reveal" data-id="${esc(r.id)}">Show to players</button>`:""}</div>`).join("");
  return `<aside class="log" aria-label="Game log"><div class="frame-h"><h3>Game log</h3><span style="display:flex;gap:6px">${S.isGM&&S.rolls.length?`<button class="btn sm ghost" data-act="clear-log">${S.confirm==="log"?"Click again":"Clear"}</button>`:""}<button class="iconbtn" data-act="log-toggle" aria-label="Close log">×</button></span></div>
    <div class="log-list">${list||`<div class="empty">No rolls yet. Click any number with a box around it on a sheet.</div>`}</div>
    <form class="log-f" data-form="custom"><input id="custom-roll" placeholder="Roll dice, e.g. 2d6+1" aria-label="Custom roll" autocomplete="off"><button class="btn pri sm" type="submit">Roll</button></form></aside>${btn}`;
}

/* ================= MAIN RENDER ================= */
function render(){
  const a=document.activeElement;const fidA=a&&a.id;let ss=null,se=null;try{if(a&&a.selectionStart!=null){ss=a.selectionStart;se=a.selectionEnd}}catch(e){}
  const db=document.querySelector(".drawer-body");const dScroll=db?db.scrollTop:0;
  const ll=document.querySelector(".log-list");const lScroll=ll?ll.scrollTop:0;
  if(S.view==="sheet"&&(!S.current||!S.docs[S.current])){const ps=sheetPaths();S.current=myPath()||ps[0]||null}
  const notes=[];
  if(S.offline)notes.push(`<div class="notice"><b>Preview mode.</b> Nothing here is saved. The live party database didn't load.</div>`);
  if(S.slow&&!S.offline)notes.push(`<div class="notice"><b>Can't reach the saved sheets yet.</b> What you see may be out of date. The page keeps trying on its own.</div>`);
  if(S.view==="create"&&!S.wiz)S.wiz=loadWiz();
  const main=S.view==="party"?renderParty():S.view==="compendium"?renderCompendium():S.view==="npcs"?renderNPCs():S.view==="create"?renderWizard():S.view==="levelup"&&S.lu?renderLevelUp():renderSheet();
  $("#app").innerHTML=renderTop()+notes.join("")+`<main>${main}</main>`+renderDrawer()+renderLog();
  if(fidA){const el=document.getElementById(fidA);if(el&&el!==document.activeElement){el.focus({preventScroll:true});try{if(ss!=null)el.setSelectionRange(ss,se)}catch(e){}}}
  const db2=document.querySelector(".drawer-body");if(db2)db2.scrollTop=dScroll;
  const ll2=document.querySelector(".log-list");if(ll2)ll2.scrollTop=lScroll;
  resolveNames();
}
function resolveNames(){}

/* ================= EVENTS ================= */
document.addEventListener("input",e=>{const el=e.target;if(el.id==="del-confirm"){S.delText=el.value;render();return}if(el.id==="npc-q"){S.npcQ=el.value;render();return}if(el.dataset&&el.dataset.lu&&el.dataset.lulive!==undefined){luInput(el,true);return}if(el.dataset&&el.dataset.w&&el.dataset.wlive!==undefined){wizInput(el,true);return}if(el.dataset&&el.dataset.path&&el.dataset.live!==undefined)applyInput(el)});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset&&el.dataset.lu){luInput(el,false);return}
  if(el.dataset&&(el.dataset.portrait||el.dataset.wportrait!==undefined)&&el.files&&el.files[0]){
    readPortrait(el.files[0]).then(url=>{if(el.dataset.portrait){if(!canEdit(el.dataset.portrait))return;setField(el.dataset.portrait,"portrait",url);toastMsg("Picture updated.")}else wset("portrait",url);render()}).catch(err=>toastMsg(err.message||"Couldn't use that image.",true));return}
  if(el.dataset&&el.dataset.w){wizInput(el,false);return}
  if(el.id==="w_bgnum"){const v=num(el.value,0);if(v>=1&&v<=20){wset("bg",BG_ORDER[v-1]);render()}return}
  if(el.dataset&&el.dataset.opt){const k=el.dataset.opt;S.opts[k]=el.type==="checkbox"?el.checked:(k==="diff"?num(el.value):el.value);render();return}
  if(el.dataset&&el.dataset.path){applyInput(el);render()}
});
document.addEventListener("submit",e=>{if(e.target.dataset.form==="gm"){e.preventDefault();gmSubmit();return}if(e.target.dataset.form==="custom"){e.preventDefault();const v=$("#custom-roll").value.trim();if(v){doCustom(v);$("#custom-roll").value=""}}});
const firstWord=n=>String(n||"").trim().split(/\s+/)[0]||"delete";
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target&&e.target.id==="del-confirm"){const b=document.querySelector('[data-act="del-sheet"]:not([disabled])');if(b)b.click();return}if(e.key==="Escape"&&S.drawer){S.drawer=null;render()}});
function applyInput(el){
  const doc=el.dataset.doc,path=el.dataset.path;if(!canEdit(doc))return;
  let v;
  if(el.type==="checkbox")v=el.checked;
  else if(el.dataset.num!==undefined){v=el.value===""?(el.dataset.blank==="null"?null:0):num(el.value)}
  else if(el.tagName==="SELECT"&&/\.level$/.test(path))v=num(el.value,1);
  else v=el.value;
  setField(doc,path,v);
}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]");if(!t)return;
  const act=t.dataset.act;const cur=currentChar();
  const keepConfirm=["inv-remove","del-sheet","hb-del","hbf-del","clear-log","wreset"].includes(act);
  if(!keepConfirm)S.confirm=null;
  if(act[0]==="w"&&act!=="wiz-open"&&S.wiz&&wizAction(act,t))return;
  if(act.startsWith("lu")&&act!=="lu-open"&&S.lu&&luAction(act,t))return;
  if(act.startsWith("npc-")&&npcAct(act,t))return;
  const edit=fn=>{if(!cur||!canEdit(cur.path))return;fn(cur.c,cur.path);render()};
  switch(act){
    case "view":S.view=t.dataset.v;S.drawer=null;render();break;
    case "open":S.view="sheet";S.current=t.dataset.doc;S.drawer=null;S.edit=false;try{localStorage.setItem("swn.current",S.current)}catch(e){}render();window.scrollTo({top:0});break;
    case "edit-toggle":S.edit=!S.edit;render();break;

    case "roll-skill":doSkill(t.dataset.skill);break;
    case "roll-save":doSave(t.dataset.save);break;
    case "roll-init":doInit();break;
    case "attack":doAttack(t.dataset.i,"hit");break;
    case "damage":doAttack(t.dataset.i,"dmg");break;
    case "snap":doAttack(t.dataset.i,"snap");break;
    case "missdmg":doAttack(t.dataset.i,"miss");break;
    case "opt-sit":S.opts.sit=Math.max(-10,Math.min(10,num(S.opts.sit)+num(t.dataset.d)));render();break;
    case "hp":edit((c,p)=>{const amt=Math.abs(num($("#hp-amt")?.value));if(!amt)return;const R=compute(c);const v=Math.max(0,Math.min(R.hpMax,num(c.hp?.cur)+num(t.dataset.sign)*amt));setField(p,"hp.cur",v)});break;
    case "strain":edit((c,p)=>{const R=compute(c);setField(p,"strain.temp",Math.max(0,Math.min(Math.max(0,R.strainMax-R.strainPerm),num(c.strain?.temp)+num(t.dataset.d))))});break;
    case "effort":edit((c,p)=>{const R=compute(c);const k=t.dataset.k;const other=num(c.effort?.[k==="scene"?"day":"scene"]);setField(p,"effort."+k,Math.max(0,Math.min(R.effortMax-other,num(c.effort?.[k])+num(t.dataset.d))))});break;
    case "skill":edit((c,p)=>{const g=t.dataset.g,k=t.dataset.k;setField(p,g+"."+k,Math.max(-1,Math.min(4,num(c[g]?.[k],-1)+num(t.dataset.d))))});break;
    case "ammo":edit((c,p)=>{const i=num(t.dataset.i);setField(p,"inventory."+i+".ammo",Math.max(0,num(c.inventory[i].ammo)+num(t.dataset.d)))});break;
    case "reload":edit((c,p)=>{const i=num(t.dataset.i);const R=compute(c);setField(p,"inventory."+i+".ammo",num(R.items[i].mag))});break;

    case "ready-toggle":edit((c,p)=>{const i=num(t.dataset.i);const cur=c.inventory[i].location||"stowed";setField(p,"inventory."+i+".location",cur==="readied"?"stowed":"readied")});break;

    case "hbf-sel":S.compFSel=t.dataset.doc;render();break;
    case "hbf-new":{const p=S.offline?"foci/local-"+rid():"foci/"+rid();createDoc(p,{name:"New focus",type:"noncombat",skill:"",d:"",l1:"",l2:"",mods1:[],mods2:[],createdAt:Date.now()});if(S.offline)S.exists[p]=true;S.compFSel=p;render();break}
    case "hbf-del":{const p=t.dataset.doc;if(S.confirm!=="hbf"+p){S.confirm="hbf"+p;render();break}S.confirm=null;deleteDoc(p);S.compFSel=null;render();break}
    case "tech-add":edit((c,p)=>{const v=$("#tech-pick")?.value;if(!v)return;const [disc,name]=v.split("|");const ts=c.techniques||[];if(!ts.some(x=>x.name===name))ts.push({disc,name});setField(p,"techniques",ts)});break;
    case "tech-remove":edit((c,p)=>{const ts=c.techniques||[];ts.splice(num(t.dataset.j),1);setField(p,"techniques",ts)});break;
    case "claim":{if(!cur||!S.me)break;const owners=[...(cur.c.owners||[])];if(owners.includes(S.me))break;owners.push(S.me);
      S.db.doc(cur.path).update({owners}).then(()=>{cur.c.owners=owners;S.edit=true;render()}).catch(err=>toastMsg(err&&err.code==="permission-denied"?"You can't claim that sheet. It may be locked or an NPC.":"Couldn't claim the sheet. Try again.",true));break}
    case "release":{if(!cur||!S.isGM)break;setField(cur.path,"owners",[]);render();break}
    case "gm-login":S.drawer={kind:"gm"};render();break;
    case "gm-submit":gmSubmit();break;
    case "clear-log":{if(S.confirm!=="log"){S.confirm="log";render();break}S.confirm=null;const ids=S.rolls.map(r=>r.id);S.rolls=[];render();(async()=>{for(const id of ids){try{await S.db.doc("rolls/"+id).delete()}catch(e){}}})();break}
  }
});
function itemPickOpts(blank,weaponsOnly){
  const hb=hbPaths().filter(p=>!weaponsOnly||S.docs[p].type==="weapon");
  const groups={};bookItems().forEach(it=>{if(weaponsOnly&&it.type!=="weapon")return;(groups[it.group]=groups[it.group]||[]).push(it)});
  return `<option value="">${esc(blank)}</option>${hb.length?`<optgroup label="Homebrew">${hb.map(p=>`<option value="hb:${esc(p.split("/")[1])}">${esc(S.docs[p].name)} (${esc(S.docs[p].type||"gear")})</option>`).join("")}</optgroup>`:""}${Object.entries(groups).map(([g,l])=>`<optgroup label="Rulebook: ${esc(g)}">${l.map(it=>`<option value="bk:${esc(it.bk)}">${esc(it.name)}${it.dmg?" ("+esc(it.dmg)+")":it.ac?" (AC "+it.ac+")":""}</option>`).join("")}</optgroup>`).join("")}`;
}
function pickedItem(v){
  if(v.startsWith("hb:")){const d=S.docs["homebrew/"+v.slice(3)];return d?{...clone(d),hb:v.slice(3)}:null}
  if(v.startsWith("bk:")){const it=bookItems().find(x=>x.bk===v.slice(3));return it?clone(it):null}
  return S.docs["homebrew/"+v]?{...clone(S.docs["homebrew/"+v]),hb:v}:null;
}
function addPicked(c,p,v){
  if(v.startsWith("hb:"))return addHb(c,p,v.slice(3));
  if(!v.startsWith("bk:"))return addHb(c,p,v);
  const it=pickedItem(v);if(!it)return;
  const inv=c.inventory||[];
  const e={id:rid(),type:it.type,name:it.name,qty:1,location:it.type==="gear"?"stowed":"readied",enc:num(it.enc),cost:num(it.cost),tl:num(it.tl),mods:[],description:it.description||""};
  if(it.type==="weapon")Object.assign(e,{dmg:it.dmg,range:it.range||"",mag:num(it.mag),ammo:num(it.mag),attr:it.attr,skill:it.skill,shock:it.shock||"",energy:!!it.energy,burst:!!it.burst});
  if(it.type==="armor"||it.type==="shield")e.ac=num(it.ac);
  inv.push(e);setField(p,"inventory",inv);
}
function addHb(c,p,id){
  const hb=S.docs["homebrew/"+id];if(!hb)return;
  const inv=c.inventory||[];
  inv.push({id:rid(),hb:id,name:hb.name,qty:1,location:hb.type==="gear"?"stowed":"readied",ammo:num(hb.mag)});
  setField(p,"inventory",inv);
}

/* ================= BOOT ================= */
async function gmSubmit(){
  const k=($("#gm-pass")?.value||"").trim();
  if(!/^[A-Za-z0-9_-]{6,64}$/.test(k)){toastMsg("Use at least 6 letters, numbers, dashes or underscores.",true);return}
  if(!S.db||!S.me){toastMsg("Not connected yet. Try again in a moment.",true);return}
  try{
    if(S.setupDone===false){
      if(($("#gm-pass2")?.value||"").trim()!==k){toastMsg("The two passcodes don't match.",true);return}
      const b=S.db.batch();
      b.set(S.db.doc("config/setup"),{done:true,at:Date.now()});
      b.set(S.db.doc("gmKeys/"+k),{at:Date.now()});
      b.set(S.db.doc("gms/"+S.me),{key:k,at:Date.now()});
      await b.commit();S.setupDone=true;
    }else{
      await S.db.doc("gms/"+S.me).set({key:k,at:Date.now()});
    }
    S.isGM=true;S.drawer=null;toastMsg("GM tools unlocked on this device.");render();
  }catch(err){toastMsg(err&&err.code==="permission-denied"?"That passcode didn't work.":"Couldn't reach the database. Try again.",true)}
}
function startPreview(){
  S.offline=true;S.loading=false;S.isGM=true;
  const ex=exampleCharacter();S.docs["local/example"]=ex;S.exists["local/example"]=true;S.current="local/example";
  S.docs["homebrew/local-ex1"]={name:"Kestrel Mk II Pistol",type:"weapon",dmg:"1d8",attr:"DEX",skill:"shoot",range:"50/150",mag:8,enc:1,cost:350,tl:4,description:"Example homebrew sidearm with a smart-grip. +1 to hit.",mods:[{target:"attack",value:1}]};
  S.docs["homebrew/local-ex2"]={name:"Neural Reflex Wiring",type:"cyber",strain:1,enc:0,cost:15000,tl:5,description:"Example homebrew cyberware.",mods:[{target:"initiative",value:2},{target:"save:evasion",value:1}]};
  render();
}
render();
(async function boot(){
  if(!window.firebase){startPreview();return}
  let db;
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    db=firebase.firestore();
    const cred=await firebase.auth().signInAnonymously();
    S.me=cred.user.uid;
  }catch(e){console.error(e);startPreview();toastMsg("Couldn't connect to the party database, so this is a preview. Check that Anonymous sign-in is turned on in Firebase.",true);return}
  S.db=db;
  try{const g=await db.doc("gms/"+S.me).get();S.isGM=g.exists}catch(e){}
  try{const st=await db.doc("config/setup").get();S.setupDone=st.exists}catch(e){S.setupDone=null}
  render();
  const slowTimer=setTimeout(()=>{S.slow=true;render()},10000);
  let pending=4;const done=snap=>{if(snap&&snap.metadata&&!snap.metadata.fromCache){clearTimeout(slowTimer);S.slow=false}if(pending>0&&--pending===0)S.loading=false};
  const onErr=err=>{clearTimeout(slowTimer);S.loading=false;console.error(err);toastMsg(err&&err.code==="permission-denied"?"The database refused access. Check that the security rules were published.":"Lost the live connection to the party data. Reload the page to reconnect.",true);render()};
  const watch=(coll)=>db.collection(coll).onSnapshot(snap=>{
    const seen=new Set();
    snap.docs.forEach(d=>{const p=coll+"/"+d.id;seen.add(p);mergeRemote(p,d.data())});
    Object.keys(S.docs).forEach(p=>{if(p.startsWith(coll+"/")&&!seen.has(p)&&S.exists[p]&&!(Q[p]&&Q[p].inflight)){delete S.docs[p];delete S.exists[p]}});
    done(snap);render();
  },onErr);
  watch("sheets");watch("homebrew");watch("foci");
  const watchQ=(coll,q)=>q.onSnapshot(snap=>{const seen=new Set();snap.docs.forEach(d=>{const p=coll+"/"+d.id;seen.add(p);mergeRemote(p,d.data())});
    Object.keys(S.docs).forEach(p=>{if(p.startsWith(coll+"/")&&!seen.has(p)&&S.exists[p]&&!(Q[p]&&Q[p].inflight)){delete S.docs[p];delete S.exists[p]}});render()},err=>console.warn("npcs",err));
  if(S.isGM){watchQ("npcs",db.collection("npcs"));db.collection("npcrolls").orderBy("ts","desc").limit(60).onSnapshot(snap=>{S.npcRolls=snap.docs.map(d=>({id:d.id,...d.data()}));render()},err=>console.warn("npcrolls",err))}
  else watchQ("npcs",db.collection("npcs").where("shared","==",true));
  db.collection("rolls").orderBy("ts","desc").limit(60).onSnapshot(snap=>{
    const before=new Set(S.rolls.map(r=>r.id));const first=!S.rollsInit;S.rollsInit=true;
    S.rolls=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(!first){snap.docChanges().forEach(ch=>{if(ch.type==="added"&&!before.has(ch.doc.id)){const r=ch.doc.data();if(r&&r.by!==S.me&&Date.now()-num(r.ts)<15000)showToast(r)}})}
    done(snap);render();
  },onErr);
})();
setInterval(()=>{if(S.logOpen)render()},30000);
</script>
