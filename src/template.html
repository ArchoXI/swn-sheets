<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SWN Party Sheets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,400;0,500;0,700;1,400;1,500&family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem("swn.theme");document.documentElement.dataset.theme=t||(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}catch(e){document.documentElement.dataset.theme="light"}</script>
<style>
:root{
  /* Layout: D&D Beyond-style sheet — dark header band, framed attribute row with HP box, saves/skills columns, combat strip + tabbed panel. Light page, red frames. */
  --ink:#e7e4dd; --sky:#d9dde3; --card:#ffffff; --panel:#ffffff; --panel-2:#f7f5f0; --raised:#eeeae2; --line:#cfc8ba; --line-soft:#e6e1d6;
  --text:#1d1d1f; --muted:#5f5f63; --faint:#9a958c;
  --accent:#c53131; --accent-ink:#ffffff; --accent-soft:rgba(197,49,49,.08);
  --dark:#1f1f21; --dark-2:#2b2b2e; --dark-line:#45454a;
  --info:#2c7a94; --good:#2e8a4f; --bad:#c53131; --warn:#b7791f;
  --display:"Roboto Condensed","Arial Narrow",sans-serif; --body:"Roboto",system-ui,sans-serif; --mono:"Roboto Mono",ui-monospace,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;color:var(--text);font-family:var(--body);font-size:14px;line-height:1.45}
body{background:linear-gradient(180deg,var(--sky) 0,var(--ink) 420px,var(--ink) 100%);min-height:100%;background-color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--info);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
.lbl{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--text)}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:8px 18px;background:#141416;color:#eee;border-bottom:1px solid #000;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.04em;text-transform:uppercase;color:#fff}
.brand .mark{width:24px;height:24px}
.nav{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.chip{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border:1px solid var(--dark-line);background:var(--dark-2);color:#eee;border-radius:4px;font-family:var(--display);font-weight:700;white-space:nowrap}
.chip:hover{border-color:#777}
.chip.on{border-color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}
.chip .av{width:24px;height:24px;border-radius:3px;display:grid;place-items:center;background:#3a3a3e;font-size:12px}
.chip .hpmini{width:34px;height:4px;border-radius:2px;background:#444;overflow:hidden}
.chip .hpmini i{display:block;height:100%;background:var(--good)}
.navbtn{padding:6px 12px;border:1px solid transparent;background:none;border-radius:3px;font-family:var(--display);font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:14px;color:#bbb}
.navbtn:hover{color:#fff}
.navbtn.on{color:#fff;border-color:var(--dark-line)}
.role{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.06em;padding:4px 10px;border-radius:3px;border:1px solid var(--dark-line);color:#ccc;text-transform:uppercase}
.role.gm{color:#fff;border-color:var(--accent);background:var(--accent)}

.notice{margin:12px 18px 0;padding:10px 14px;border:1px solid var(--line);border-left:4px solid var(--warn);background:var(--card);border-radius:4px;color:var(--muted)}
.notice b{color:var(--text)}
main{padding:0 18px 120px;max-width:1400px;margin:0 auto}

/* framed box */
.frame{position:relative;background:var(--panel);border:2px solid var(--accent);border-radius:10px;box-shadow:inset 0 0 0 3px var(--card),inset 0 0 0 4px rgba(197,49,49,.28),0 1px 2px rgba(0,0,0,.08)}
.frame-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px 6px}
.frame-h h3{font-size:15px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.frame-b{padding:8px 14px 12px}
.frame-f{display:flex;align-items:center;justify-content:center;gap:6px;padding:4px 14px 10px;font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.03em;text-transform:uppercase}
.frame-f .iconbtn{width:20px;height:20px;font-size:11px;border-radius:50%;color:var(--faint)}

/* header band */
.sheethead{margin:0 -18px 16px;padding:18px 18px 22px;background:linear-gradient(180deg,#232325,#1b1b1d);color:#fff;border-bottom:3px solid #111}
.sheethead-in{max-width:1364px;margin:0 auto;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px;align-items:center}
.portrait{width:88px;height:88px;border-radius:4px;display:grid;place-items:center;font-family:var(--display);font-size:38px;font-weight:700;background:linear-gradient(160deg,#4a4a50,#2a2a2e);border:3px solid var(--accent);color:#fff;box-shadow:0 0 0 1px #000}
.cname{font-family:var(--display);font-size:38px;font-weight:700;line-height:1.05;color:#fff}
.cname input{font-family:var(--display);font-size:34px;font-weight:700;background:transparent;border:0;border-bottom:1px dashed #666;width:100%;max-width:460px;padding:0;color:#fff}
.csub{color:#aaa;margin-top:2px;display:flex;flex-wrap:wrap;gap:2px 12px;font-size:15px}
.csub b{color:#ddd;font-weight:500}
.sheethead .inp,.sheethead select.inp{background:#2b2b2e;border-color:#4a4a50;color:#fff}
.sheethead .lbl{color:#aaa}
.sheethead .hint{color:#999}
.xp{margin-top:10px;display:flex;align-items:center;gap:10px;max-width:440px;font-family:var(--display);font-size:11px;color:#bbb;font-weight:700}
.xpbar{flex:1;height:3px;background:#444;border-radius:2px;overflow:hidden}
.xpbar i{display:block;height:100%;background:#ddd}
.bactions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 12px;border:1px solid var(--line);background:var(--card);border-radius:3px;font-family:var(--display);font-weight:700;letter-spacing:.03em;text-transform:uppercase;font-size:13px;color:var(--text)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.08);color:#fff}
.btn.ghost{background:none}
.btn.sm{padding:4px 8px;font-size:12px}
.btn.danger{color:var(--bad);border-color:rgba(197,49,49,.5)}
.btn.on{border-color:var(--accent);color:var(--accent)}
.btn.dk{background:transparent;color:#fff;border-color:#555;padding:9px 16px;font-size:15px}
.btn.dk:hover{border-color:var(--accent);color:#fff;background:rgba(197,49,49,.15)}
.btn.dk.on{border-color:var(--accent);background:var(--accent)}
.iconbtn{width:26px;height:26px;display:inline-grid;place-items:center;border:1px solid var(--line);background:var(--card);border-radius:3px;padding:0;font-weight:700;line-height:1;color:var(--text)}
.iconbtn:hover{border-color:var(--accent);color:var(--accent)}
.topbar .btn{background:transparent;color:#eee;border-color:var(--dark-line)}
.topbar .btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}

/* top row */
.toprow{display:grid;grid-template-columns:repeat(6,minmax(0,1fr)) minmax(0,1fr) minmax(0,1fr) minmax(0,2.3fr);gap:12px;margin-bottom:22px;align-items:stretch}
.attr{position:relative;text-align:center;padding:8px 6px 26px;background:var(--card);border:2px solid var(--accent);border-radius:12px 12px 16px 16px;box-shadow:inset 0 0 0 3px var(--card),inset 0 0 0 4px rgba(197,49,49,.28)}
.attr .lbl{display:block;font-size:12px;cursor:help;color:var(--text)}
.attr .lbl:hover{color:var(--accent)}
.attr .mod{font-family:var(--display);font-size:34px;font-weight:400;line-height:1.2;margin:4px auto 0;width:78%;border:1px solid var(--line);border-radius:6px;background:var(--card)}
.attr .score{position:absolute;left:50%;bottom:-14px;transform:translateX(-50%);min-width:56px;height:30px;padding:0 10px;display:grid;place-items:center;background:var(--card);border:2px solid var(--accent);border-radius:50%/50%;font-family:var(--display);font-weight:700;font-size:20px;box-shadow:inset 0 0 0 2px var(--card),inset 0 0 0 3px rgba(197,49,49,.28)}
.attr .score input{width:38px;text-align:center;background:transparent;border:0;padding:0;font-weight:700;font-family:var(--display);font-size:18px}
.attr .boost{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--info)}
.stat{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px 6px;background:var(--card);border:2px solid var(--accent);border-radius:12px;box-shadow:inset 0 0 0 3px var(--card),inset 0 0 0 4px rgba(197,49,49,.28)}
.stat .lbl{cursor:help;background:none;border:0;padding:0;font-size:13px}
.stat .lbl:hover{color:var(--accent)}
.stat .big{font-family:var(--display);font-size:38px;font-weight:500;line-height:1.05}
.stat .foot{font-family:var(--display);font-weight:700;font-size:13px;text-transform:uppercase}
.stat .rollbtn{margin-top:2px}
.hpbox{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center;padding:10px 14px;background:var(--card);border:2px solid var(--accent);border-radius:12px;box-shadow:inset 0 0 0 3px var(--card),inset 0 0 0 4px rgba(197,49,49,.28)}
.hpctl{display:grid;gap:4px}
.hpctl input{width:100%;text-align:center;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:3px}
.hpctl .btn{padding:3px 6px;font-size:11px}
.hpctl .h{color:var(--good);border-color:var(--good)}
.hpctl .h:hover{background:var(--good);color:#fff}
.hpctl .d{color:var(--bad);border-color:var(--bad)}
.hpctl .d:hover{background:var(--bad);color:#fff}
.hpnums{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;text-align:center;gap:4px}
.hpnums .lbl{color:var(--muted);font-size:13px}
.hpnums .big{font-family:var(--display);font-size:42px;font-weight:500;line-height:1}
.hpnums .sl{font-size:34px;color:var(--faint);font-weight:300;line-height:1}
.hpnums input{width:64px;text-align:center;font-family:var(--display);font-size:34px;border:1px solid var(--line);border-radius:4px;padding:0}
.hpfoot{text-align:center;font-family:var(--display);font-weight:700;font-size:15px;text-transform:uppercase;margin-top:4px;background:none;border:0;width:100%;cursor:help}
.hpfoot:hover{color:var(--accent)}
.hpbar{height:5px;background:var(--line-soft);border-radius:3px;overflow:hidden;margin-top:6px}
.hpbar i{display:block;height:100%;background:var(--good);transition:width .3s}
.pipline{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}
.pipline i{width:10px;height:10px;border:1px solid var(--faint);border-radius:2px}
.pipline i.f{background:var(--warn);border-color:var(--warn)}
.pipline i.p{background:var(--bad);border-color:var(--bad)}
.pipline i.e{background:var(--info);border-color:var(--info)}

/* combat strip */
.cstrip{display:grid;grid-template-columns:110px minmax(0,1fr) minmax(0,1fr) minmax(0,1.2fr);gap:12px;margin-bottom:14px;align-items:stretch}
.ac{display:grid;place-items:center;background:none;border:0;cursor:help;padding:0;position:relative}
.ac svg{width:110px;height:auto}
.ac .ovr-badge{position:absolute;top:2px;right:0}
.ibox{background:var(--card);border:2px solid var(--accent);border-radius:10px;box-shadow:inset 0 0 0 3px var(--card),inset 0 0 0 4px rgba(197,49,49,.28);padding:10px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.ibox .lbl{background:none;border:0;padding:0;text-align:left;cursor:help;font-size:14px}
.ibox .lbl:hover{color:var(--accent)}
.ibox .big{font-family:var(--display);font-size:28px;font-weight:500;line-height:1}
.ibox .big small{font-size:16px;color:var(--muted)}
.ibox .row{display:flex;align-items:center;gap:6px;justify-content:space-between}
.ibox p{margin:0;color:var(--muted);font-size:13px}

/* body grid */
.body{display:grid;grid-template-columns:260px 300px minmax(0,1fr);gap:14px;align-items:start}
.stack{display:grid;gap:14px}
.saves{display:grid;grid-template-columns:1fr;gap:8px}
.save{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:4px 4px 4px 14px;background:var(--card);border:1px solid var(--line);border-radius:999px}
.save .lbl{cursor:help;font-size:14px;background:none;border:0;padding:0}
.save .lbl:hover{color:var(--accent)}
.rollbtn{min-width:46px;padding:3px 8px;border:1px solid var(--line);background:var(--card);border-radius:4px;font-family:var(--display);font-size:18px;font-weight:500;font-variant-numeric:tabular-nums;text-align:center;color:var(--text)}
.rollbtn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.save .rollbtn{border-radius:999px}
.rollbtn.tgt::before{content:"≥ ";color:var(--faint);font-size:13px}
.skills{list-style:none;margin:0;padding:0}
.skhead{display:grid;grid-template-columns:30px 36px 1fr 52px;gap:6px;padding:0 2px 4px;font-family:var(--display);font-weight:700;font-size:11px;color:var(--muted);text-transform:uppercase}
.skills li{display:grid;grid-template-columns:30px 36px 1fr 52px;align-items:center;gap:6px;padding:3px 2px;border-bottom:1px solid var(--line-soft)}
.skills li:last-child{border-bottom:0}
.prof{display:flex;align-items:center;gap:3px}
.prof .dot{width:10px;height:10px;border-radius:50%;border:1px solid var(--faint);background:var(--card)}
.prof .dot.f{background:#222;border-color:#222}
.prof small{font-family:var(--display);font-weight:700;font-size:11px;color:var(--muted)}
.sname{background:none;border:0;padding:0;text-align:left;cursor:help;font-family:var(--display);font-size:16px}
.sname:hover{color:var(--accent)}
.sattr{font-size:13px;color:var(--faint);font-family:var(--display);font-weight:700}
.skedit{display:flex;align-items:center;gap:2px;grid-column:1 / 3}
.skedit .iconbtn{width:20px;height:20px;font-size:12px}
.untr{color:var(--muted)}
.ropts{display:grid;gap:8px}
.ropts .grp{display:flex;align-items:center;justify-content:space-between;gap:6px}
.ropts select{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:3px 6px}
.toggle{display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
.toggle input{accent-color:var(--accent)}

.enc .row{display:flex;justify-content:space-between;align-items:center;margin:4px 0;font-family:var(--display);font-size:15px}
.meter{height:6px;background:var(--line-soft);border-radius:3px;overflow:hidden;margin-bottom:8px}
.meter i{display:block;height:100%;background:var(--info)}
.meter i.over{background:var(--bad)}

/* tabs */
.tabs{display:flex;gap:4px;padding:6px 14px 0;overflow-x:auto}
.tab{padding:10px 8px;background:none;border:0;border-bottom:3px solid transparent;font-family:var(--display);font-weight:700;letter-spacing:.02em;text-transform:uppercase;font-size:17px;color:var(--muted);white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.on{color:var(--text);border-bottom-color:var(--accent)}
.tabbody{padding:12px 16px 16px}
.sect{margin-bottom:18px}
.sect>.lbl{display:block;margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid var(--line-soft);color:var(--accent);font-size:15px}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-family:var(--display);font-weight:700;font-size:13px;text-transform:uppercase;color:var(--text);text-align:left;padding:6px;border-bottom:1px solid var(--line-soft)}
td{padding:8px 6px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
tr:last-child td{border-bottom:0}
.iname{background:none;border:0;padding:0;text-align:left;font-family:var(--display);font-size:17px;font-style:italic;cursor:pointer}
.iname:hover{color:var(--accent)}
.isub{display:block;font-size:12px;color:var(--muted);font-style:normal;font-family:var(--body)}
.tag{display:inline-block;font-family:var(--display);font-weight:700;font-style:normal;font-size:11px;letter-spacing:.03em;text-transform:uppercase;padding:1px 6px;border-radius:3px;border:1px solid var(--line);color:var(--muted);margin-left:6px;vertical-align:2px}
.tag.hb{color:#fff;background:var(--accent);border-color:var(--accent)}
.tag.gm{color:var(--warn);border-color:rgba(183,121,31,.6)}
.sheethead .tag.gm{color:#f3c26b}
.tag.on{color:var(--good);border-color:rgba(46,138,79,.5)}
.feature{padding:10px 12px;background:var(--panel-2);border:1px solid var(--line-soft);border-left:3px solid var(--accent);border-radius:3px;margin-bottom:8px}
.feature h4{margin:0 0 4px;font-family:var(--display);font-size:17px;font-weight:700}
.feature p{margin:0;color:var(--muted);white-space:pre-wrap}
.empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:4px;background:var(--card)}

/* forms */
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field .lbl{font-size:11px;color:var(--muted)}
.inp,select.inp,textarea.inp{width:100%;background:var(--card);border:1px solid var(--line);border-radius:3px;padding:5px 7px;min-width:0}
textarea.inp{resize:vertical;min-height:70px}
.inp.n{width:64px;text-align:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.modrow{display:grid;grid-template-columns:1fr 70px 26px;gap:6px;margin-bottom:6px}
.hint{font-size:12px;color:var(--muted)}
.ovr-badge{font-family:var(--display);font-size:10px;font-weight:700;letter-spacing:.06em;color:#fff;background:var(--warn);border-radius:3px;padding:0 4px;margin-left:4px;vertical-align:2px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(20,20,22,.4);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--card);border-left:3px solid var(--accent);z-index:41;display:flex;flex-direction:column;box-shadow:-20px 0 40px rgba(0,0,0,.25)}
.drawer-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--dark);color:#fff}
.drawer-h h2{font-size:24px;font-weight:700}
.drawer-h .iconbtn{background:transparent;color:#fff;border-color:#555}
.drawer-body{padding:16px;overflow-y:auto;flex:1}
.drawer-body p{margin:0 0 10px;color:#333}
.calc{margin:12px 0;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.calc div{display:flex;justify-content:space-between;padding:6px 10px;border-bottom:1px solid var(--line-soft)}
.calc div:last-child{border-bottom:0;background:var(--panel-2);font-weight:700}
.calc span:last-child{font-variant-numeric:tabular-nums}

/* log */
.logbtn{position:fixed;right:18px;bottom:18px;z-index:30;display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--dark);color:#fff;border:1px solid #000;border-radius:999px;font-family:var(--display);font-weight:700;letter-spacing:.04em;text-transform:uppercase;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.logbtn:hover{background:var(--accent)}
.logbtn .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.log{position:fixed;right:18px;bottom:70px;width:min(360px,calc(100% - 36px));max-height:min(560px,calc(100% - 140px));z-index:30;display:flex;flex-direction:column;background:var(--card);border:2px solid var(--accent);border-radius:8px;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.log .frame-h{background:var(--dark);color:#fff;border-radius:6px 6px 0 0;padding:8px 12px}
.log .frame-h .iconbtn,.log .frame-h .btn{background:transparent;color:#fff;border-color:#555}
.log-list{overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:6px;flex:1}
.entry{padding:8px 10px;background:var(--panel-2);border:1px solid var(--line-soft);border-radius:4px}
.entry .who{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.entry .who b{color:var(--text);font-weight:700}
.entry .what{font-family:var(--display);font-weight:700;margin-top:2px}
.line{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:3px}
.line .f{font-family:var(--mono);font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.line .t{font-family:var(--display);font-size:24px;font-weight:700;min-width:38px;text-align:right}
.verdict{font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:3px}
.verdict.ok{color:#fff;background:var(--good)}
.verdict.no{color:#fff;background:var(--bad)}
.verdict.crit{color:#fff;background:#7a3cc5}
.die{display:inline-block;padding:0 4px;border-radius:2px;background:var(--card);border:1px solid var(--line);color:var(--text);margin-right:2px}
.die.drop{opacity:.4;text-decoration:line-through}
.die.max{color:var(--good);border-color:var(--good)}
.die.min{color:var(--bad);border-color:var(--bad)}
.log-f{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line-soft)}
.log-f input{flex:1;background:var(--card);border:1px solid var(--line);border-radius:3px;padding:5px 8px}

/* toasts */
#toasts{position:fixed;right:18px;bottom:70px;z-index:50;display:flex;flex-direction:column;gap:8px;pointer-events:none;width:min(320px,calc(100% - 36px))}
.toast{pointer-events:auto;background:var(--card);border:2px solid var(--accent);border-radius:8px;padding:10px 12px;box-shadow:0 12px 40px rgba(0,0,0,.3);animation:pop .22s ease-out}
.toast.err{border-color:var(--bad);background:#fff5f5}
.toast .what{font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:14px;color:var(--accent)}
.toast .line .t{font-size:32px}
@keyframes pop{from{transform:translateY(12px) scale(.97);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}.hpbar i{transition:none}}

/* party / compendium */
.pagetitle{font-size:28px;font-weight:700;margin:18px 0 12px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.pcard{padding:14px;background:var(--card);border:2px solid var(--accent);border-radius:10px;box-shadow:inset 0 0 0 3px var(--card),inset 0 0 0 4px rgba(197,49,49,.28);display:flex;flex-direction:column;gap:8px}
.pcard .top{display:flex;gap:10px;align-items:center}
.pcard .top .av{width:44px;height:44px;border-radius:4px;display:grid;place-items:center;background:var(--dark);color:#fff;border:2px solid var(--accent);font-family:var(--display);font-weight:700;font-size:18px}
.pcard h3{font-size:20px;font-weight:700}
.pstats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.pstats div{background:var(--panel-2);border:1px solid var(--line-soft);border-radius:4px;padding:4px}
.pstats b{display:block;font-family:var(--display);font-size:20px}
.comp{display:grid;grid-template-columns:320px minmax(0,1fr);gap:14px;align-items:start}
.clist{max-height:70vh;overflow-y:auto;padding:6px 0}
.citem{display:block;width:100%;text-align:left;padding:9px 14px;background:none;border:0;border-bottom:1px solid var(--line-soft)}
.citem:hover{background:var(--panel-2)}
.citem.on{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.citem b{font-family:var(--display);font-size:16px}
.welcome{max-width:640px;margin:40px auto;padding:28px;text-align:center}
.welcome h1{font-size:34px;font-weight:700;margin-bottom:8px}
.welcome p{color:var(--muted)}

.invsec{margin-bottom:14px;border:1px solid var(--line-soft);border-radius:8px;padding:8px 12px;background:var(--card)}
.invsec.over{border-color:var(--bad)}
.invsec.over .invh .hint{color:var(--bad)}
.invh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding-bottom:4px;border-bottom:1px solid var(--line-soft)}
.invh .lbl{font-size:16px;color:var(--accent)}
.rdy{width:18px;height:18px;accent-color:var(--accent);cursor:pointer}
.shockv{font-family:var(--display);font-size:17px}
.rollbtn.snap{font-size:13px;color:var(--muted)}
.actgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.actbox{border:1px solid var(--line-soft);border-radius:8px;padding:10px 12px;background:var(--panel-2)}
.actbox h4{margin:0 0 2px;font-family:var(--display);font-size:17px}
.actbox ul{margin:6px 0 0;padding-left:18px}
.actbox li{margin:3px 0;font-size:13px}
.portrait.hasimg,.av.hasimg{padding:0;overflow:hidden}
.portrait img,.av img{width:100%;height:100%;object-fit:cover;display:block}
.portrait-edit{position:relative;cursor:pointer;display:block}
.portrait-edit .pcam{position:absolute;right:-6px;bottom:-6px;width:28px;height:28px;border-radius:50%;background:var(--accent);display:grid;place-items:center;font-size:14px;border:2px solid #1b1b1d}
.portrait-edit:hover .portrait{filter:brightness(1.1)}
.btn.dk.lvlready{border-color:#f3c26b;color:#f3c26b;box-shadow:0 0 0 2px rgba(243,194,107,.25)}
.ludice{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin-bottom:10px}
.pools{display:flex;gap:12px;flex-wrap:wrap}
.pool{padding:10px 14px;border:2px solid var(--accent);border-radius:8px;background:var(--card);display:flex;flex-direction:column}
.atgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.atbox{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:6px 10px;border:1px solid var(--line-soft);border-radius:6px;background:var(--card)}
.techlist{display:grid;gap:6px}
.techrow{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line-soft);border-radius:6px;background:var(--card)}
.techrow.have{opacity:.6}
.wport{display:flex;align-items:center;gap:14px;margin-top:12px}
.wport .portrait{width:72px;height:72px;font-size:28px;color:#fff}
.npcmake{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.4fr) 90px auto;gap:10px;align-items:end}
.npcname{font-family:var(--display);font-size:24px;font-weight:700}
.npchp{display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding:10px 12px;border:2px solid var(--accent);border-radius:10px;margin-bottom:12px}
.npchp>div:first-child{min-width:160px}
.npcgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.npcrolls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.entry.npcentry{border-left:3px solid var(--warn);background:#fffaf0}
@media (max-width:820px){.npcmake{grid-template-columns:1fr 1fr}}
.encstage{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:6px 10px;border-radius:6px;font-size:13px;background:#eef8f1;border:1px solid #b6e0c4}
.encstage b{font-family:var(--display);font-size:14px}
.encstage.s1{background:#fff7e6;border-color:#f3c88b}
.encstage.s2{background:#fdecec;border-color:#f0a8a8}
.encstage.s3{background:var(--bad);border-color:var(--bad);color:#fff}
/* wizard */
.wiz{display:grid;grid-template-columns:220px minmax(0,1fr);gap:14px;align-items:start}
.wsteps{padding:8px;display:flex;flex-direction:column;gap:2px;position:sticky;top:64px}
.wstep{display:flex;align-items:center;gap:8px;text-align:left;padding:8px 10px;border:0;background:none;border-radius:6px;font-family:var(--display);font-weight:700;font-size:15px;color:var(--muted)}
.wstep:hover{background:var(--panel-2);color:var(--text)}
.wstep.on{background:var(--accent);color:#fff}
.wstep.skip{opacity:.45}
.wnum{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;background:var(--raised);color:var(--muted);flex:none}
.wstep.on .wnum{background:var(--card);color:var(--accent)}
.wh{font-size:28px;font-weight:700;margin-bottom:4px}
.wlead{color:var(--muted);margin:0 0 14px;max-width:70ch}
.wnav{display:flex;justify-content:space-between;align-items:center;padding:10px 20px 16px;border-top:1px solid var(--line-soft)}
.wnav .btn[disabled]{opacity:.4;cursor:default}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:12px;flex-wrap:wrap}
.seg button{padding:8px 14px;border:0;background:var(--card);font-family:var(--display);font-weight:700;font-size:14px;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:#fff}
.wtable td{vertical-align:middle}
.big2{font-family:var(--display);font-size:22px;font-weight:700}
.rollpair{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
.bggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.clsgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.bgcard{display:flex;flex-direction:column;gap:3px;text-align:left;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:8px}
.bgcard:hover{border-color:var(--accent)}
.bgcard.on{border:2px solid var(--accent);background:var(--accent-soft);padding:9px 11px}
.bgn{font-family:var(--display);font-weight:700;font-size:17px}
.trow{display:flex;gap:10px;padding:2px 0;border-bottom:1px solid var(--line-soft)}
.trow span:first-child{width:18px;color:var(--faint);font-family:var(--display);font-weight:700}
.rollrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 10px;background:var(--panel-2);border:1px solid var(--line-soft);border-radius:6px}
.grants{display:grid;gap:6px}
.grant{display:grid;grid-template-columns:170px 120px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 10px;background:var(--card);border:1px solid var(--line-soft);border-left:3px solid var(--good);border-radius:4px}
.grant.need{border-left-color:var(--warn);background:#fffaf0}
.gsrc{font-size:12px;color:var(--muted)}
.gspec{font-family:var(--display);font-weight:700}
.gres{font-family:var(--display);font-weight:700;color:var(--good)}
.gfix{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.wnote{margin-top:14px;padding:10px 12px;background:var(--panel-2);border:1px solid var(--line-soft);border-radius:6px;font-size:13px;color:var(--muted)}
.wnote b{color:var(--text)}
.wissues{margin-top:14px;padding:10px 12px;background:#fff7ed;border:1px solid #f3c88b;border-left:4px solid var(--warn);border-radius:6px;font-size:13px}
.wok{margin-top:6px;padding:10px 12px;background:#eef8f1;border:1px solid #b6e0c4;border-left:4px solid var(--good);border-radius:6px}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:700;text-decoration:underline}
@media (max-width:820px){.wiz{grid-template-columns:1fr}.wsteps{position:static;flex-direction:row;overflow-x:auto}.wstep{white-space:nowrap}.grant{grid-template-columns:1fr}}

@media (max-width:1240px){
  .toprow{grid-template-columns:repeat(4,minmax(0,1fr));row-gap:24px}
  .toprow .hpbox{grid-column:span 2}
  .body{grid-template-columns:250px minmax(0,1fr)}
  .body .col-actions{grid-column:1 / -1}
}
@media (max-width:820px){
  .toprow{grid-template-columns:repeat(3,minmax(0,1fr))}
  .toprow .hpbox{grid-column:1 / -1}
  .body{grid-template-columns:1fr}
  .cstrip{grid-template-columns:100px 1fr}
  .cstrip .ibox{grid-column:auto}
  .sheethead-in{grid-template-columns:auto 1fr}
  .bactions{grid-column:1 / -1;justify-content:flex-start}
  .comp{grid-template-columns:1fr}
  .grid4{grid-template-columns:1fr 1fr}
}
@media (max-width:420px){
  main{padding:0 16px 120px}
  .sheethead{margin:0 -16px 16px}
  .grid3,.grid2{grid-template-columns:1fr}
  .cname{font-size:28px}
  .portrait{width:64px;height:64px;font-size:28px}
}

/* dark theme */
:root[data-theme="dark"]{
  --ink:#131418; --sky:#1a1c21; --card:#1c1e24; --panel:#1c1e24; --panel-2:#24272e; --raised:#2d3139; --line:#3b404a; --line-soft:#2b2f37;
  --text:#e9e9ec; --muted:#a6a9b0; --faint:#737780;
  --accent:#e05555; --accent-soft:rgba(224,85,85,.16);
  --info:#5db6cf; --good:#52c27e; --bad:#ef6767; --warn:#e2a83f;
  color-scheme:dark;
}
:root[data-theme="dark"] .frame,:root[data-theme="dark"] .attr,:root[data-theme="dark"] .stat,:root[data-theme="dark"] .hpbox,:root[data-theme="dark"] .ibox,:root[data-theme="dark"] .pcard,:root[data-theme="dark"] .attr .score{box-shadow:inset 0 0 0 3px var(--card),inset 0 0 0 4px rgba(224,85,85,.3)}
:root[data-theme="dark"] .notice{background:var(--card)}
:root[data-theme="dark"] .grant.need,:root[data-theme="dark"] .entry.npcentry{background:#2a2418}
:root[data-theme="dark"] .wissues{background:#2a2418;border-color:#6b5223}
:root[data-theme="dark"] .wok{background:#18291f;border-color:#2f5a3e}
:root[data-theme="dark"] .toast.err{background:#2c1a1a}
:root[data-theme="dark"] .encstage{background:#18291f;border-color:#2f5a3e}
:root[data-theme="dark"] .encstage.s1{background:#2a2418;border-color:#6b5223}
:root[data-theme="dark"] .encstage.s2{background:#2c1a1a;border-color:#6e2f2f}
:root[data-theme="dark"] .encstage.s3{background:var(--bad);color:#fff}
:root[data-theme="dark"] .acsvg .sh{fill:var(--card)}
:root[data-theme="dark"] .acsvg .tx{fill:var(--text)}
:root[data-theme="dark"] .acsvg .lb{fill:var(--muted)}
:root[data-theme="dark"] .prof .dot{background:transparent}
:root[data-theme="dark"] .prof .dot.f{background:var(--text);border-color:var(--text)}
:root[data-theme="dark"] .scrim{background:rgba(0,0,0,.6)}
.themebtn{width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--dark-line);background:transparent;color:#eee;border-radius:4px;font-size:15px;padding:0}
.themebtn:hover{border-color:#888}

function attrMod(s){s=num(s,10);if(s<=3)return -2;if(s<=7)return -1;if(s<=13)return 0;if(s<=17)return 1;return 2}
function rand(sides){const a=new Uint32Array(1);crypto.getRandomValues(a);return 1+(a[0]%sides)}
function parseDice(str){
  const out={groups:[],flat:0};const s=String(str||"").replace(/\s+/g,"").toLowerCase();
  const re=/([+-]?)(\d*)d(\d+)|([+-]?)(\d+)/g;let m;
  while((m=re.exec(s))){
    if(m[3]){const n=Math.min(num(m[2]||1,1),50),sd=Math.min(num(m[3],6),1000);out.groups.push({n,s:sd,neg:m[1]==="-"})}
    else if(m[5]){out.flat+=(m[4]==="-"?-1:1)*num(m[5])}
  }
  return out;
}
function rollGroups(p){
  const dice=[];let sum=0;
  p.groups.forEach(g=>{for(let i=0;i<g.n;i++){const v=rand(g.s);dice.push({v,s:g.s});sum+=g.neg?-v:v}});
  return {dice,sum};
}

function getPath(obj,path){return path.split(".").reduce((o,k)=>o==null?undefined:o[k],obj)}
function setPathV(obj,path,v){const ks=path.split(".");let o=obj;for(let i=0;i<ks.length-1;i++){if(o[ks[i]]==null)o[ks[i]]=/^\d+$/.test(ks[i+1])?[]:{};o=o[ks[i]]}o[ks[ks.length-1]]=v}
function ago(ts){const s=Math.max(0,(Date.now()-ts)/1000);if(s<60)return "just now";if(s<3600)return Math.floor(s/60)+"m ago";if(s<86400)return Math.floor(s/3600)+"h ago";return Math.floor(s/86400)+"d ago"}

function canEdit(path){
  if(!path||!S.docs[path]||S.denied[path])return false;

/* ================= SAVE QUEUE ================= */
const Q = {}; // path -> {dirty:Set, timer, inflight, inflightKeys:Set}
function q(path){return Q[path]||(Q[path]={dirty:new Set,timer:null,inflight:false,inflightKeys:new Set})}
function markDirty(path,key){
  if(S.offline||path.startsWith("local/"))return;
  const e=q(path);e.dirty.add(key);clearTimeout(e.timer);e.timer=setTimeout(()=>flush(path),550);
}
async function flush(path){
  const e=q(path);if(e.inflight){e.timer=setTimeout(()=>flush(path),300);return}
  if(!e.dirty.size||!S.db)return;
  const keys=[...e.dirty];e.dirty.clear();e.inflight=true;e.inflightKeys=new Set(keys);
  const d=S.docs[path];
  try{
    if(!d){await S.db.doc(path).delete()}
    else if(S.exists[path]){const patch={};keys.forEach(k=>patch[k]=clone(d[k]===undefined?null:d[k]));patch.updatedAt=Date.now();await S.db.doc(path).update(patch)}
    else{await S.db.doc(path).set({...clone(d),updatedAt:Date.now()});S.exists[path]=true}
  }catch(err){
    if(err&&err.code==="permission-denied"){S.denied[path]=true;toastMsg("Couldn't save that change. You don't have permission to edit this sheet. Ask your GM to check your share access.",true);render()}
    else if(err&&err.code==="resource-exhausted"){toastMsg("The free database limit for today was hit. Try again later.",true)}
    else{keys.forEach(k=>e.dirty.add(k));e.timer=setTimeout(()=>flush(path),1500+Math.random()*1000)}
  }finally{e.inflight=false;e.inflightKeys=new Set}
}
function setField(path,field,v){
  const d=S.docs[path];if(!d)return;setPathV(d,field,v);markDirty(path,field.split(".")[0]);
}
async function createDoc(path,data){
  S.docs[path]=data;
  if(S.offline||!S.db){return}
  try{await S.db.doc(path).set(clone(data));S.exists[path]=true}
  catch(err){toastMsg(err&&err.code==="permission-denied"?"You don't have permission to create that.":"Couldn't save. Try again in a moment.",true);delete S.docs[path];render()}
}
async function deleteDoc(path){
  delete S.docs[path];delete S.exists[path];
  if(S.offline||!S.db||path.startsWith("local/"))return;
  try{await S.db.doc(path).delete()}catch(err){toastMsg("Couldn't delete that.",true)}
}
function mergeRemote(path,data){
  const e=Q[path];const local=S.docs[path];
  const merged=clone(data);
  if(e&&local){[...e.dirty,...e.inflightKeys].forEach(k=>{merged[k]=clone(local[k])})}
  S.docs[path]=merged;S.exists[path]=true;
}

function resolveItem(entry){
  if(entry&&entry.hb){
    const hb=S.docs["homebrew/"+entry.hb];
    if(hb){const r={...clone(hb),id:entry.id,hb:entry.hb,linked:true};["qty","location","equipped","ammo","notes"].forEach(k=>{if(entry[k]!==undefined)r[k]=entry[k]});return r}
    return {...entry,name:(entry.name||"Removed item")+" (removed from compendium)",mods:[],missing:true};
  }
  return entry||{};
}
const isPsy = c=>c.class==="Psychic"||(c.class==="Adventurer"&&(c.partials||[]).includes("Psychic"));
const hasOv = (c,k)=>c.overrides&&c.overrides[k]!==null&&c.overrides[k]!==undefined&&c.overrides[k]!==""&&Number.isFinite(Number(c.overrides[k]));
function resolveFocus(e){
  if(!e)return null;
  const lvl=Math.max(1,Math.min(2,num(e.level,1)));
  if(e.key&&e.key.startsWith("hb:")){
    const f=S.docs["foci/"+e.key.slice(3)];
    if(!f)return {...e,level:lvl,name:(e.name||"Focus")+" (removed)",d:"",l1:"",l2:"",mods:[],hb:true};
    const mods=[...(f.mods1||[]),...(lvl>=2?(f.mods2||[]):[])];
    return {...e,level:lvl,name:f.name||"Homebrew focus",d:f.d||"",l1:f.l1||"",l2:f.l2||"",type:f.type,mods,hb:true};
  }
  const def=FOCI[e.key];
  if(!def)return {...e,level:lvl,name:e.name||"Custom focus",d:"",l1:"",l2:"",mods:[],custom:true};
  return {...e,level:lvl,name:def.name+(e.skill&&e.key==="specialist"?" ("+specName(e.skill)+")":""),d:def.d,l1:def.l1,l2:def.l2,type:def.type,mods:[]};
}
const hasFocus=(R,k,l=1)=>R.foci.some(f=>f.key===k&&f.level>=l);
const isActive=i=>i.type==="cyber"||(i.location||"stowed")==="readied";
function compute(c){
  const items=(c.inventory||[]).map(resolveItem);
  const mods=[];
  const lvl=Math.max(1,Math.min(20,num(c.level,1)));
  items.forEach(i=>{if(!isActive(i))return;(i.mods||[]).forEach(m=>{if(i.type==="weapon"&&(m.target==="attack"||m.target==="damage"))return;mods.push({target:m.target,value:num(m.value),src:i.name||"Item"})})});
  (c.effects||[]).forEach(f=>{if(!f.active)return;(f.mods||[]).forEach(m=>mods.push({target:m.target,value:num(m.value),src:(f.name||"Effect")}))});
  const foci=(c.foci||[]).map(resolveFocus).filter(f=>f&&(f.key||f.name||f.text));
  foci.forEach(f=>{
    (f.mods||[]).forEach(m=>mods.push({target:m.target,value:num(m.value),src:f.name}));
    if(f.key==="die_hard")mods.push({target:"hpMax",value:2*lvl,src:"Die Hard (+2 per level)"});
    if(f.key==="psychic_training")mods.push({target:"effortMax",value:1,src:"Psychic Training"});
  });
  const list=t=>mods.filter(m=>m.target===t&&m.value);
  const sum=t=>list(t).reduce((a,m)=>a+m.value,0);
  const br=t=>list(t).map(m=>({l:m.src,v:m.value}));
  const R={items,mods,list,sum,br,foci,score:{},mod:{},skills:{},psy:{},b:{},ov:{}};
  ATTRS.forEach(([k])=>{R.score[k]=num(c.attrs?.[k],10)+sum(k);R.mod[k]=attrMod(R.score[k])});
  R.level=lvl;
  SKILLS.forEach(([k])=>R.skills[k]=num(c.skills?.[k],-1)+sum("skill:"+k));
  PSY.forEach(([k])=>R.psy[k]=num(c.psy?.[k],-1)+sum("skill:"+k));
  const ovr=(key,auto,parts)=>{if(hasOv(c,key)){R.ov[key]=true;R.b[key]=[...parts,{l:"GM override",v:null,ov:Number(c.overrides[key])}];return Number(c.overrides[key])}R.b[key]=parts;return auto};
  // attack bonus
  const pw=c.class==="Adventurer"&&(c.partials||[]).includes("Warrior");
  let bab, babParts;
  if(c.class==="Warrior"){bab=lvl;babParts=[{l:"Warrior: equals level",v:lvl}]}
  else{bab=Math.floor(lvl/2);babParts=[{l:"Half level, rounded down",v:bab}];if(pw){const x=lvl>=5?2:1;bab+=x;babParts.push({l:"Partial Warrior",v:x})}}
  R.bab=ovr("bab",bab,babParts);
  // saves (target numbers)
  const save=(key,a,b)=>{
    const best=a?(R.mod[a]>=R.mod[b]?a:b):null;
    const parts=[{l:"Base",v:16},{l:"Level",v:-lvl}];
    if(best)parts.push({l:"Better of "+a.toUpperCase()+"/"+b.toUpperCase()+" ("+best.toUpperCase()+")",v:-R.mod[best]});
    br("save:"+key).forEach(p=>parts.push({l:p.l,v:-p.v}));br("save:all").forEach(p=>parts.push({l:p.l,v:-p.v}));
    return ovr("save_"+key,parts.reduce((s,p)=>s+p.v,0),parts);
  };
  R.save={physical:save("physical","str","con"),evasion:save("evasion","dex","int"),mental:save("mental","wis","cha")};
  // AC: best of worn armor or Ironhide, then shield, DEX, bonuses
  const armor=items.filter(i=>isActive(i)&&i.type==="armor").sort((a,b)=>num(b.ac)-num(a.ac))[0];
  let base=armor?{l:"Armor: "+(armor.name||"armor"),v:num(armor.ac,10)}:{l:"No armor",v:10};
  if(hasFocus(R,"ironhide")){const ih=15+Math.ceil(lvl/2);if(ih>base.v)base={l:"Ironhide (15 + half level)",v:ih}}
  const acParts=[base];
  const shield=items.find(i=>isActive(i)&&i.type==="shield");
  if(shield){const sb=num(shield.ac,13);if(base.v>=sb)acParts.push({l:(shield.name||"Shield")+" (+1)",v:1});else acParts.push({l:(shield.name||"Shield")+" (raises base to "+sb+")",v:sb-base.v})}
  acParts.push({l:"DEX modifier",v:R.mod.dex},...br("ac"));
  if(c.totalDefense)acParts.push({l:"Total Defense (until your next turn)",v:2});
  R.totalDefense=!!c.totalDefense;
  R.ac=ovr("ac",acParts.reduce((s,p)=>s+p.v,0),acParts);
  // HP
  const hpParts=[{l:"Rolled max HP",v:num(c.hp?.max)},...br("hpMax")];
  R.hpMax=ovr("hpMax",hpParts.reduce((s,p)=>s+p.v,0),hpParts);
  // strain
  const stParts=[{l:"CON score",v:R.score.con},...br("strainMax")];
  R.strainMax=ovr("strainMax",stParts.reduce((s,p)=>s+p.v,0),stParts);
  R.strainPerm=items.filter(i=>i.type==="cyber").reduce((s,i)=>s+num(i.strain)*Math.max(1,num(i.qty,1)),0);
  R.strainTemp=num(c.strain?.temp);R.strainCur=R.strainPerm+R.strainTemp;
  // effort
  R.psychic=isPsy(c);
  if(R.psychic){
    const hi=Math.max(0,...Object.values(R.psy));
    const parts=[{l:"Base",v:1},{l:"Highest psychic skill",v:hi},{l:"Better of WIS/CON",v:Math.max(R.mod.wis,R.mod.con)}];
    if(R.psy.metapsionics>=1)parts.push({l:"Metapsionics core (level-1+)",v:R.psy.metapsionics>=3?2:1});
    parts.push(...br("effortMax"));
    R.effortMax=Math.max(1,ovr("effortMax",parts.reduce((s,p)=>s+p.v,0),parts));
  }else if(hasFocus(R,"wild_psychic")){
    const v=hasFocus(R,"wild_psychic",2)?2:1;R.effortMax=ovr("effortMax",v,[{l:"Wild Psychic Talent",v}]);
  }else R.effortMax=0;
  // init
  const inParts=[{l:"DEX modifier",v:R.mod.dex},...br("initiative")];
  R.init=ovr("init",inParts.reduce((s,p)=>s+p.v,0),inParts);
  R.initTwice=hasFocus(R,"alert");
  // encumbrance
  const rParts=[{l:"Half STR score, rounded down",v:Math.floor(R.score.str/2)},...br("readied")];
  const sParts=[{l:"STR score",v:R.score.str},...br("stowed")];
  R.readiedLimit=ovr("readied",rParts.reduce((s,p)=>s+p.v,0),rParts);
  R.stowedLimit=ovr("stowed",sParts.reduce((s,p)=>s+p.v,0),sParts);
  const encOf=loc=>items.filter(i=>i.type!=="cyber"&&(i.location||"stowed")===loc).reduce((s,i)=>s+(i.encFixed?num(i.enc):num(i.enc)*Math.max(0,num(i.qty,1))),0);
  R.readied=encOf("readied");R.stowed=encOf("stowed");
  {const ro=R.readied-R.readiedLimit,so=R.stowed-R.stowedLimit;
   const st=o=>o<=0?0:o;const rs=ro<=0?0:ro<=2?1:ro<=4?2:3;const ss=so<=0?0:so<=4?1:so<=8?2:3;
   R.encStage=Math.max(rs,ss);R.move=[10,7,5,0][R.encStage];
   R.encLabel=["Unencumbered","Lightly Encumbered","Heavily Encumbered","Overloaded"][R.encStage];}
  // xp
  R.nextXp=XP_TABLE[lvl]??null;R.prevXp=XP_TABLE[lvl-1]??0;
  return R;
}
function unarmedWeapon(R){
  const p=R.skills.punch;
  const w={id:"unarmed",type:"weapon",name:"Unarmed attack",dmg:"1d2",attr:"STR/DEX",skill:"punch",shock:"",mods:[],equipped:true,virtual:true};
  if(hasFocus(R,"unarmed_combatant")){w.dmg=p<=0?"1d6":p===1?"1d8":p===2?"1d10":p===3?"1d12":"1d12+1";if(p>=1)w.shock=p+"/15";w.name="Unarmed attack (Unarmed Combatant)"}
  return w;
}
function weaponStats(c,R,w){
  const attrs=String(w.attr||"DEX").split("/").map(s=>s.trim().toLowerCase()).filter(a=>R.mod[a]!==undefined);
  if(!attrs.length)attrs.push("dex");
  let best=attrs[0];attrs.forEach(a=>{if(R.mod[a]>R.mod[best])best=a});
  const am=R.mod[best];
  const sk=w.skill||"shoot";const lv=R.skills[sk]??-1;const sb=lv<0?-2:lv;
  const wAtk=(w.mods||[]).filter(m=>m.target==="attack").reduce((s,m)=>s+num(m.value),0);
  const wDmg=(w.mods||[]).filter(m=>m.target==="damage").reduce((s,m)=>s+num(m.value),0);
  const atkParts=[{l:"Attack bonus",v:R.bab},{l:(SKILL[sk]?.name||sk)+(lv<0?" (untrained)":" "+lv),v:sb},{l:best.toUpperCase()+" modifier",v:am}];
  if(w.energy)atkParts.push({l:"Energy weapon (no recoil)",v:1});
  if(wAtk)atkParts.push({l:"Weapon bonus",v:wAtk});
  R.br("attack").forEach(p=>atkParts.push(p));
  const dmgParts=[{l:best.toUpperCase()+" modifier",v:am}];
  if(wDmg)dmgParts.push({l:"Weapon bonus",v:wDmg});
  R.br("damage").forEach(p=>dmgParts.push(p));
  const skillDmg=[];
  if(sk==="punch"&&lv>0)skillDmg.push({l:"Punch skill",v:lv});
  if(sk==="shoot"&&hasFocus(R,"gunslinger")&&lv>0)skillDmg.push({l:"Gunslinger (Shoot skill)",v:lv});
  if(sk==="stab"&&hasFocus(R,"armsman")&&lv>0)skillDmg.push({l:"Armsman (Stab skill)",v:lv});
  const dflat=[...dmgParts,...skillDmg].reduce((s,p)=>s+p.v,0);
  const shockFlat=dmgParts.reduce((s,p)=>s+p.v,0)+(sk==="stab"&&hasFocus(R,"armsman")&&lv>0?lv:0);
  let shock=null;const m=/(\d+)\s*\/\s*(?:ac\s*)?(\d+)/i.exec(String(w.shock||""));
  const melee=sk==="stab"||sk==="punch";
  if(m){
    let sv=num(m[1]),sac=num(m[2]);const notes=[];
    if(melee&&hasFocus(R,"shocking_assault",2)){sv+=2;notes.push("Shocking Assault +2")}
    if(melee&&(hasFocus(R,"shocking_assault")||hasFocus(R,"close_combatant",2))){sac=99;notes.push("any AC")}
    shock={dmg:Math.max(0,sv+shockFlat),ac:sac,notes};
  }
  const p=parseDice(String(w.dmg||"1d6"));const flatTotal=p.flat+dflat;
  const dmgText=p.groups.map(g=>(g.neg?"-":"")+g.n+"d"+g.s).join("+").replace("+-","-")+(flatTotal?(flatTotal>0?"+":"−")+Math.abs(flatTotal):"");
  let missDmg=null;
  if(sk==="shoot"&&hasFocus(R,"gunslinger",2))missDmg="1d4";
  if(sk==="stab"&&hasFocus(R,"armsman",2))missDmg="1d4";
  if(sk==="punch"&&hasFocus(R,"unarmed_combatant",2))missDmg="1d6";
  return {atkParts:atkParts,dmgParts:[...dmgParts,...skillDmg],dflat,dmgText:dmgText||String(flatTotal),shock,best,sk,lv,missDmg,atk:atkParts.reduce((s,p)=>s+p.v,0)};
}

/* ================= ROLLING ================= */
function currentChar(){const p=S.current;return p&&S.docs[p]?{path:p,c:S.docs[p]}:null}
function sitPart(){return S.opts.sit?[{l:"Situational",v:num(S.opts.sit)}]:[]}
function skillDiceCount(R,key){
  let n=S.opts.keep3?3:2;const why=[];
  R.foci.forEach(f=>{if(f.key==="specialist"&&f.skill===key){const k=f.level>=2?4:3;if(k>n){n=k;why.push("Specialist")}}});
  if(key==="heal"&&hasFocus(R,"healer")&&n<3){n=3;why.push("Healer")}
  return {n,why};
}
function doSkill(key){
  const cur=currentChar();if(!cur)return;const {c}=cur;const R=compute(c);
  const sk=SKILL[key];const lv=R.skills[key];
  const attr=(S.opts.attr==="auto"?sk.attr:S.opts.attr).toLowerCase();
  const {n,why}=skillDiceCount(R,key);const dice=[];for(let i=0;i<n;i++)dice.push({v:rand(6),s:6});
  const order=dice.map((d,i)=>i).sort((a,b)=>dice[a].v-dice[b].v);order.slice(0,n-2).forEach(i=>dice[i].drop=true);
  const parts=[{l:sk.name+(lv<0?" (untrained)":""),v:lv},{l:attr.toUpperCase(),v:R.mod[attr]},...R.br("skillChecks"),...sitPart()];
  const total=dice.filter(d=>!d.drop).reduce((s,d)=>s+d.v,0)+parts.reduce((s,p)=>s+p.v,0);
  const diff=num(S.opts.diff);
  const note=[n>2?n+"d6 keep best 2"+(why.length?" ("+why.join(", ")+")":""):"",diff?"vs difficulty "+diff:""].filter(Boolean).join(" · ");
  emitRoll(c,sk.name+" check",[{name:"Check",dice,parts,total,verdict:diff?(total>=diff?["ok","Success"]:["no","Failure"]):null,note}]);
}
function doSave(key){
  const cur=currentChar();if(!cur)return;const {c}=cur;const R=compute(c);
  const t=R.save[key];const d={v:rand(20),s:20};const parts=sitPart();
  const total=d.v+parts.reduce((s,p)=>s+p.v,0);
  emitRoll(c,key[0].toUpperCase()+key.slice(1)+" save",[{name:"Save",dice:[d],parts,total,verdict:(d.v===20||total>=t)?["ok",d.v===20?"Natural 20: saved":"Saved"]:["no","Failed"],note:"needs "+t+"+"}]);
}
function doInit(){
  const cur=currentChar();if(!cur)return;const {c}=cur;const R=compute(c);
  const dice=[{v:rand(8),s:8}];
  if(R.initTwice){dice.push({v:rand(8),s:8});if(dice[0].v<dice[1].v)dice[0].drop=true;else dice[1].drop=true}
  const kept=dice.find(d=>!d.drop).v;
  const parts=R.ov.init?[{l:"GM override",v:R.init},...sitPart()]:[...R.b.init.filter(p=>!p.ov),...sitPart()];
  emitRoll(c,"Initiative",[{name:"Initiative",dice,parts,total:kept+parts.reduce((s,p)=>s+p.v,0),note:R.initTwice?"Alert: rolled twice, kept the best":""}]);
}
function weaponAt(R,i){return i==="unarmed"?unarmedWeapon(R):R.items[num(i,-1)]}
function doAttack(i,mode){
  const cur=currentChar();if(!cur)return;const {c}=cur;const R=compute(c);
  const w=weaponAt(R,i);if(!w)return;const W=weaponStats(c,R,w);
  const burst=S.opts.burst&&w.burst;const nm=w.name||"Weapon";
  if(mode==="hit"||mode==="snap"){
    const d={v:rand(20),s:20};const crit=d.v===20,fumble=d.v===1;
    const parts=[...W.atkParts,...(burst?[{l:"Burst fire",v:2}]:[]),...(mode==="snap"?[{l:"Snap Attack",v:-4}]:[]),...sitPart()];
    const total=d.v+parts.reduce((s,p)=>s+p.v,0);
    emitRoll(c,nm+(burst?" burst":"")+(mode==="snap"?" snap attack":" to hit"),[{name:"To hit",dice:[d],parts,total,verdict:null,note:"vs target AC"}]);
    if(burst&&!w.virtual&&canEdit(cur.path)&&num(i,-1)>=0&&num(c.inventory[num(i)]?.ammo)>0){setField(cur.path,"inventory."+num(i)+".ammo",Math.max(0,num(c.inventory[num(i)].ammo)-3));render()}
    return;
  }
  if(mode==="dmg"){
    const p=parseDice(w.dmg||"1d6");const r=rollGroups(p);
    const dparts=[...(p.flat?[{l:"Weapon",v:p.flat}]:[]),...W.dmgParts,...(burst?[{l:"Burst fire",v:2}]:[])];
    let t=Math.max(0,r.sum+dparts.reduce((s,x)=>s+x.v,0));const floor=W.shock&&t<W.shock.dmg;if(floor)t=W.shock.dmg;
    emitRoll(c,nm+" damage",[{name:"Damage",dice:r.dice,parts:dparts,total:t,note:floor?"raised to the Shock value":""}]);return;
  }
  if(mode==="shock"&&W.shock){emitRoll(c,nm+" Shock",[{name:"Shock",dice:[],parts:[],total:W.shock.dmg,note:"on a miss vs AC "+(W.shock.ac>=99?"any":W.shock.ac+" or lower")}]);return}
  if(mode==="miss"&&W.missDmg){const mp=parseDice(W.missDmg);const mr=rollGroups(mp);emitRoll(c,nm+" miss damage",[{name:"Miss damage",dice:mr.dice,parts:[],total:mr.sum,note:"unmodified"}])}
}
function doCustom(expr){
  const p=parseDice(expr);if(!p.groups.length&&!p.flat){toastMsg("Type dice like 2d6+1 or 1d20.",true);return}
  const r=rollGroups(p);const cur=currentChar();
  emitRoll(cur?cur.c:null,expr,[{name:"Roll",dice:r.dice,parts:p.flat?[{l:"Flat",v:p.flat}]:[],total:r.sum+p.flat}]);
}
function emitRoll(c,label,lines){
  const rec={ts:Date.now(),by:S.me||"",char:c?String(c.name||""):"",player:c?String(c.player||""):"",label,lines};
  showToast(rec);
  if(S.db&&!S.offline){
    S.db.collection("rolls").add(clone(rec)).then(()=>pruneLog()).catch(err=>{toastMsg("Your roll didn't post to the shared game log. Check your connection.",true)});
  }else{S.rolls.unshift({id:rid(),...rec});S.rolls=S.rolls.slice(0,60);render()}
}
let pruneCount=0;
async function pruneLog(){
  if(!S.isGM||++pruneCount%8!==0)return;
  try{const snap=await S.db.collection("rolls").orderBy("ts","desc").limit(400).get();
    const old=snap.docs.slice(150);for(const d of old.slice(0,40)){await S.db.doc("rolls/"+d.id).delete()}}catch(e){}
}

function diceHtml(dice){return dice.map(d=>`<span class="die ${d.drop?"drop":""} ${d.v===d.s&&d.s>2?"max":""} ${d.v===1?"min":""}">${d.v}</span>`).join("")}
function lineHtml(l){
  const f=(l.dice.length?diceHtml(l.dice):"")+l.parts.map(p=>p.ov!=null||!p.v?"":` ${p.v<0?"−":"+"} ${Math.abs(p.v)}`).join("");
  const tip=l.parts.map(p=>p.l+" "+sgn(p.v)).join(", ");
  return `<div class="line"><div><div class="lbl">${esc(l.name)}${l.note?` · <span style="text-transform:none;letter-spacing:0;font-weight:500">${esc(l.note)}</span>`:""}</div><div class="f" title="${esc(tip)}">${f||"&nbsp;"}</div>${l.verdict?`<span class="verdict ${l.verdict[0]}">${esc(l.verdict[1])}</span>`:""}</div><div class="t num">${num(l.total)}</div></div>`;
}
function showToast(rec){
  const el=document.createElement("div");el.className="toast";
  el.innerHTML=`<div class="what">${esc(rec.char?rec.char+" · ":"")}${esc(rec.label)}</div>${(rec.lines||[]).map(lineHtml).join("")}`;

  const hpBox=`<div class="hpbox">
    ${can?`<div class="hpctl"><button class="btn sm h" data-act="hp" data-sign="1">Heal</button><input id="hp-amt" type="number" min="0" aria-label="Amount"><button class="btn sm d" data-act="hp" data-sign="-1">Damage</button></div>`:`<div></div>`}
    <div><div class="hpnums"><span class="lbl">Current</span><span></span><span class="lbl">Max${ovBadge(R,"hpMax")}</span>
      <span class="big num">${num(c.hp?.cur)}</span><span class="sl">/</span><span class="big num">${E?inp(path,"hp.max",{type:"number",cls:"",min:0,attrs:'title="Rolled max HP"'}):R.hpMax}</span></div>
      <div class="hpbar"><i style="width:${hpPct}%;background:${hpCol}"></i></div>
      <button class="hpfoot" data-act="rule" data-key="hp">${num(c.hp?.cur)<=0?`<span style="color:var(--bad)">Mortally wounded</span>`:"Hit Points"}</button></div>
  </div>`;

  const acSvg=`<button class="ac" data-act="rule" data-key="ac" aria-label="Armor Class ${R.ac}"><svg class="acsvg" viewBox="0 0 100 112"><path class="sh" d="M50 4 L92 18 L88 62 Q82 92 50 108 Q18 92 12 62 L8 18 Z" fill="#fff" stroke="#c53131" stroke-width="3"/><path d="M50 11 L85 23 L81 61 Q76 86 50 100 Q24 86 19 61 L15 23 Z" fill="none" stroke="#c53131" stroke-opacity=".35" stroke-width="1"/><text x="50" y="36" text-anchor="middle" font-family="Roboto Condensed,Arial Narrow,sans-serif" font-weight="700" font-size="12" fill="#5f5f63" class="lb">ARMOR</text><text x="50" y="72" text-anchor="middle" font-family="Roboto Condensed,Arial Narrow,sans-serif" font-weight="700" font-size="36" fill="#1d1d1f" class="tx">${R.ac}</text><text x="50" y="88" text-anchor="middle" font-family="Roboto Condensed,Arial Narrow,sans-serif" font-weight="700" font-size="12" fill="#5f5f63" class="lb">CLASS</text></svg>${R.ov.ac?`<span class="ovr-badge">GM</span>`:""}${R.totalDefense?`<span class="ovr-badge" style="background:var(--good);top:auto;bottom:4px;right:auto;left:0;position:absolute" title="Total Defense">+2 Total Defense</span>`:""}</button>`;
  const strainPips=Array.from({length:Math.max(R.strainMax,0)},(_,i)=>`<i class="${i<R.strainPerm?"p":i<R.strainCur?"f":""}"></i>`).join("");
  const effUsed=num(c.effort?.scene)+num(c.effort?.day);
  const effPips=Array.from({length:R.effortMax},(_,i)=>`<i class="${i<effUsed?"":"e"}"></i>`).join("");
  const strainBox=`<div class="ibox"><div class="row">${L("strain","System Strain"+ovBadge(R,"strainMax"))}${can?`<span><button class="iconbtn" data-act="strain" data-d="-1" aria-label="Less strain">−</button> <button class="iconbtn" data-act="strain" data-d="1" aria-label="More strain">+</button></span>`:""}</div><span class="big num">${R.strainCur}<small> / ${R.strainMax}</small></span><div class="pipline" style="justify-content:flex-start" title="Red: permanent from cyberware. Amber: temporary.">${strainPips}</div></div>`;
  const thirdBox=R.effortMax>0?`<div class="ibox"><div class="row">${L("effort","Effort"+ovBadge(R,"effortMax"))}<span class="big num">${Math.max(0,R.effortMax-effUsed)}<small> / ${R.effortMax}</small></span></div><div class="pipline" style="justify-content:flex-start">${effPips}</div>${can?`<div class="row" style="justify-content:flex-start;gap:4px"><span class="hint">Scene</span><button class="iconbtn" data-act="effort" data-k="scene" data-d="-1">−</button><button class="iconbtn" data-act="effort" data-k="scene" data-d="1">+</button><span class="hint">Day</span><button class="iconbtn" data-act="effort" data-k="day" data-d="-1">−</button><button class="iconbtn" data-act="effort" data-k="day" data-d="1">+</button></div>`:""}</div>`
    :`<div class="ibox"><span class="lbl" style="cursor:default">${esc(className(c))}</span>${classAbilities(c).filter(x=>x.short).map(x=>`<p>${esc(x.short)}</p>`).join("")}</div>`;
  const eff=(c.effects||[]).filter(f=>f.active);
  const condBox=`<div class="ibox">${L("mods","Effects & Conditions")}${eff.length?eff.map(f=>`<p><b style="color:var(--text)">${esc(f.name||"Effect")}</b> ${(f.mods||[]).map(m=>esc(TARGET_NAME[m.target]||m.target)+" "+sgn(m.value)).join(", ")}</p>`).join(""):`<p>None active</p>`}</div>`;

  const saves=`<div class="frame"><div class="frame-b" style="padding-top:14px"><div class="saves">
    ${["physical","evasion","mental"].map(k=>`<div class="save"><button class="lbl" data-act="rule" data-key="save_${k}">${k}${ovBadge(R,"save_"+k)}</button><button class="rollbtn tgt" data-act="roll-save" data-save="${k}" title="Roll 1d20, need ${R.save[k]} or more">${R.save[k]}</button></div>`).join("")}
  </div><p class="hint" style="margin:8px 0 0;text-align:center">Roll 1d20, meet or beat the number</p></div><div class="frame-f">Saving Throws <button class="iconbtn" data-act="rule" data-key="saves" aria-label="Saving throw rules">?</button></div></div>`;

  const ropts=`<div class="frame"><div class="frame-b ropts" style="padding-top:14px">
    <div class="grp"><span class="hint">Situational mod</span><span style="display:flex;align-items:center;gap:4px"><button class="iconbtn" data-act="opt-sit" data-d="-1">−</button><span class="num" style="min-width:26px;text-align:center;font-family:var(--display);font-size:17px">${sgn(S.opts.sit)}</span><button class="iconbtn" data-act="opt-sit" data-d="1">+</button></span></div>
    <div class="grp"><label class="hint" for="opt-diff">Difficulty</label><select id="opt-diff" data-opt="diff"><option value="0">None</option>${[6,7,8,9,10,11,12,13,14].map(n=>`<option value="${n}" ${S.opts.diff==n?"selected":""}>${n}${n===6?" simple":n===8?" significant":n===10?" expert":n===12?" master":n===14?" near impossible":""}</option>`).join("")}</select></div>
    <div class="grp"><label class="hint" for="opt-attr">Skill attribute</label><select id="opt-attr" data-opt="attr"><option value="auto">Usual</option>${ATTRS.map(a=>`<option value="${a[0].toUpperCase()}" ${S.opts.attr===a[0].toUpperCase()?"selected":""}>${a[0].toUpperCase()}</option>`).join("")}</select></div>
    <label class="toggle"><input type="checkbox" id="opt-keep3" data-opt="keep3" ${S.opts.keep3?"checked":""}>3d6, keep best 2</label>
  </div><div class="frame-f">Roll Options <button class="iconbtn" data-act="rule" data-key="skillcheck" aria-label="How checks work">?</button></div></div>`;

  const enc=`<div class="frame enc"><div class="frame-b" style="padding-top:14px">
    <div class="row"><span>Readied</span><span class="num">${R.readied} / ${R.readiedLimit}${ovBadge(R,"readied")}</span></div><div class="meter"><i class="${R.readied>R.readiedLimit?"over":""}" style="width:${Math.min(100,R.readiedLimit?R.readied/R.readiedLimit*100:100)}%"></i></div>
    <div class="row"><span>Stowed</span><span class="num">${R.stowed} / ${R.stowedLimit}${ovBadge(R,"stowed")}</span></div><div class="meter"><i class="${R.stowed>R.stowedLimit?"over":""}" style="width:${Math.min(100,R.stowedLimit?R.stowed/R.stowedLimit*100:100)}%"></i></div>
    <div class="encstage s${R.encStage}"><b>${R.encLabel}</b><span>${R.encStage<3?"Move "+R.move+" m per round":"Too much to carry. Drop or store something."}</span></div>
  </div><div class="frame-f">Encumbrance <button class="iconbtn" data-act="rule" data-key="enc" aria-label="Encumbrance rules">?</button></div></div>`;

  const skillRow=(k,name,group,attrLbl)=>{
    const lv=group==="psy"?R.psy[k]:R.skills[k];const base=num(c[group]?.[k],-1);
    const a=(S.opts.attr==="auto"?attrLbl:S.opts.attr);
    const tot=group==="psy"?null:lv+R.mod[(a||"int").toLowerCase()]+R.sum("skillChecks")+num(S.opts.sit);
    const left=E?`<span class="skedit"><button class="iconbtn" data-act="skill" data-g="${group}" data-k="${k}" data-d="-1" aria-label="Lower ${name}">−</button><span class="num" style="min-width:18px;text-align:center">${base}</span><button class="iconbtn" data-act="skill" data-g="${group}" data-k="${k}" data-d="1" aria-label="Raise ${name}">+</button></span>`
      :`<span class="prof" title="${lv<0?"Untrained":"Level "+lv}"><span class="dot ${lv>=0?"f":""}"></span>${lv>0?`<small>${lv}</small>`:""}</span><span class="sattr">${group==="psy"?"":esc(a)}</span>`;
    return `<li>${left}
      <button class="sname ${lv<0?"untr":""}" data-act="rule" data-key="skill_${k}">${esc(name)}${lv!==base?` <span class="tag hb" title="Changed by items">${sgn(lv-base)}</span>`:""}</button>
      ${group==="psy"?`<span class="num" style="text-align:center;font-family:var(--display);font-size:17px">${lv<0?"—":lv}</span>`:`<button class="rollbtn" data-act="roll-skill" data-skill="${k}" title="Roll 2d6 ${sgn(tot)}">${sgn(tot)}</button>`}</li>`;
  };
  const skills=`<div class="frame"><div class="frame-b" style="padding-top:12px">
    <div class="skhead"><span>${E?"Level":"Prof"}</span><span>${E?"":"Mod"}</span><span>Skill</span><span style="text-align:center">Bonus</span></div>
    <ul class="skills">${SKILLS.map(s=>skillRow(s[0],s[1],"skills",s[2])).join("")}</ul>
    ${R.psychic||E?`<div class="lbl" style="margin:14px 0 4px;color:var(--info)">Psychic disciplines</div><ul class="skills">${PSY.map(s=>skillRow(s[0],s[1],"psy","")).join("")}</ul>`:""}
  </div><div class="frame-f">Skills <button class="iconbtn" data-act="rule" data-key="skilllevels" aria-label="Skill level rules">?</button></div></div>`;

  const tabs=[["actions","Actions"],["inventory","Inventory"],["features","Features & Foci"],["notes","Notes"]];
  if(S.isGM||S.offline)tabs.push(["gm","GM Tools"]);
  if(!tabs.find(t=>t[0]===S.tab))S.tab="actions";
  const tabBody={actions:()=>renderActions(path,c,R,can),inventory:()=>renderInventory(path,c,R,can),features:()=>renderFeatures(path,c,R,E),notes:()=>renderNotes(path,c,can),gm:()=>renderGM(path,c,R)}[S.tab]();
  const panel=`<div class="frame"><div class="tabs" role="tablist">${tabs.map(t=>`<button class="tab ${S.tab===t[0]?"on":""}" role="tab" aria-selected="${S.tab===t[0]}" data-act="tab" data-tab="${t[0]}">${t[1]}</button>`).join("")}</div><div class="tabbody">${tabBody}</div></div>`;

  return `${head}<section class="toprow">${attrs}${babBox}${initBox}${hpBox}</section>
    <section class="body"><div class="stack">${saves}${ropts}${enc}</div><div class="stack">${skills}</div>
    <div class="stack col-actions"><div class="cstrip">${acSvg}${strainBox}${thirdBox}${condBox}</div>${panel}</div></section>`;
}

function renderActions(path,c,R,can){
  const weapons=R.items.map((w,i)=>({w,i})).filter(x=>x.w.type==="weapon");
  weapons.push({w:unarmedWeapon(R),i:"unarmed"});
  const rows=weapons.map(({w,i})=>{const W=weaponStats(c,R,w);const real=i!=="unarmed";return `<tr>
    <td>${real?`<button class="iname" data-act="item" data-i="${i}">`:`<span class="iname" style="cursor:default">`}${esc(w.name||"Weapon")}${w.linked?`<span class="tag hb">Homebrew</span>`:""}${w.energy?`<span class="tag" title="Energy weapons get +1 to hit">Energy</span>`:""}${w.burst?`<span class="tag" title="Can fire in burst mode">Burst</span>`:""}${real&&!isActive(w)?`<span class="tag" title="Stowed weapons take a Main Action to ready">Stowed</span>`:""}${real?`</button>`:`</span>`}<span class="isub">${esc(SKILL[W.sk]?.name||W.sk)} · ${esc(W.best.toUpperCase())}${w.range?" · "+esc(w.range)+" m":""}${W.missDmg?" · "+W.missDmg+" on a miss":""}</span></td>
    <td style="white-space:nowrap"><button class="rollbtn" data-act="attack" data-i="${i}" title="Roll 1d20 ${sgn(W.atk)} to hit">${sgn(W.atk+(S.opts.burst&&w.burst?2:0))}</button> <button class="rollbtn snap" data-act="snap" data-i="${i}" title="Snap Attack: Instant, spends your next Main Action, −4 to hit">Snap ${sgn(W.atk-4+(S.opts.burst&&w.burst?2:0))}</button></td>
    <td><button class="rollbtn" data-act="damage" data-i="${i}" title="Roll damage only">${esc(W.dmgText)}</button></td>
    <td>${W.shock?`<span class="shockv" title="Damage dealt on a miss if the target's AC is low enough">${W.shock.dmg}/${W.shock.ac>=99?"any AC":"AC "+W.shock.ac}</span>`:`<span class="hint">—</span>`}${W.missDmg?` <button class="rollbtn" data-act="missdmg" data-i="${i}" title="Unmodified damage on a miss">miss ${W.missDmg}</button>`:""}</td>
    <td class="num">${real&&num(w.mag)>0?`${can?`<button class="iconbtn" data-act="ammo" data-i="${i}" data-d="-1" aria-label="Use ammo">−</button> `:""}${num(w.ammo)}/${num(w.mag)}${can?` <button class="btn sm ghost" data-act="reload" data-i="${i}">Reload</button>`:""}`:`<span class="hint">—</span>`}</td></tr>`}).join("");
  const anyBurst=weapons.some(x=>x.w.burst);
  return `<div class="sect"><span class="lbl">Attacks <button class="hint" style="background:none;border:0;cursor:help;text-transform:none;letter-spacing:0" data-act="rule" data-key="attack">how attacks work</button></span>
    <div class="tbl-wrap"><table><thead><tr><th>Weapon</th><th>Hit</th><th>Damage</th><th>Shock</th><th>Ammo</th></tr></thead><tbody>${rows}</tbody></table></div>
    ${anyBurst?`<label class="toggle" style="margin-top:8px"><input type="checkbox" id="opt-burst" data-opt="burst" ${S.opts.burst?"checked":""}>Burst fire (+2 to hit and damage, uses 3 rounds)</label>`:""}
    <p class="hint">Hit rolls the d20; Damage rolls damage. Shock is the damage a melee weapon still deals on a miss, if the target's AC is at or below the number. <button class="hint" style="background:none;border:0;text-decoration:underline;cursor:help" data-act="rule" data-key="shock">More on Shock</button></p>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px">${can?`<button class="btn ${R.totalDefense?"on":""}" data-act="total-def">${R.totalDefense?"Total Defense ON (+2 AC)":"Take Total Defense"}</button>`:R.totalDefense?`<span class="tag on">Total Defense</span>`:""}<span class="hint">Instant: spends your Main Action. +2 AC and immune to melee Shock until your next turn. Turn it off when your turn comes.</span></div></div>
    <div class="sect"><span class="lbl">Combat actions</span>
      <div class="actgrid">
        <div class="actbox"><h4>Main Action <span class="tag">one per turn</span></h4><p class="hint">Most of your six-second round. You can trade it for a second Move.</p>
          <ul><li><b>Melee Attack</b>: hit an adjacent foe with a Readied weapon. Shock on a miss.</li><li><b>Ranged Attack</b>: fire or throw a Readied weapon. With an armed enemy in melee range you can't fire two-handed guns, and one-handed ones take −4.</li><li><b>Use a Skill</b>: something quick, like stabilizing an ally or running a prepared hack.</li><li><b>Ready or Stow an Item</b>: draw a stowed weapon, dig something out of your pack.</li><li><b>Reload</b>: swap in a Readied magazine or power cell.</li><li><b>Fighting Withdrawal</b>: disengage from melee so you can move away without free attacks.</li></ul></div>
        <div class="actbox"><h4>Move Action <span class="tag">one per turn</span></h4><p class="hint">About 10 meters. Can't be split around your Main Action.</p>
          <ul><li><b>Run</b>: 10 m (half when climbing, swimming, rough terrain, or prone).</li><li><b>Stand Up</b> from prone.</li><li><b>Pick Up an Item</b> with a free hand; it ends up Readied.</li><li><b>Club Up a Weapon</b>: grip a gun to use as a club (or switch back).</li><li><b>Hold an Action</b>: delay your other actions and trigger them later as Instants.</li></ul></div>
        <div class="actbox"><h4>On Turn <span class="tag">any number, your turn</span></h4><p class="hint">Fast, simple things done alongside everything else.</p>
          <ul><li><b>Go Prone</b>: −2 to hit you from range, but adjacent foes get +2.</li><li><b>Draw a Readied item.</b></li><li><b>Speak</b> a few words, <b>drop</b> or <b>activate</b> a simple device.</li></ul></div>
        <div class="actbox"><h4>Instant <span class="tag">any number, any time</span></h4><p class="hint">Even on someone else's turn, or after dice are rolled.</p>
          <ul><li><b>Snap Attack</b>: attack out of turn at −4 to hit. Spends your upcoming Main Action. Use the Snap button above.</li><li><b>Total Defense</b>: +2 AC and immune to melee Shock until your next turn. Spends your Main Action (can't if already used).</li><li><b>Drop an Item</b> to free your hands.</li>${c.class==="Warrior"?`<li><b>Warrior's luck</b>: once per scene, negate a hit against you or turn your miss into a hit.</li>`:""}${R.psychic||R.effortMax>0?`<li>Some psychic techniques are Instant; check each one's description.</li>`:""}</ul></div>
      </div></div>`;
}

function renderInventory(path,c,R,can){
  const inv=c.inventory||[];
  const row=(e,i)=>{const it=R.items[i];const loc=e.location||"stowed";return `<tr>
    <td style="width:34px">${it.type==="cyber"?"":`<input type="checkbox" class="rdy" title="Readied" aria-label="Readied" data-act="ready-toggle" data-i="${i}" ${loc==="readied"?"checked":""} ${can&&loc!=="stored"?"":"disabled"}>`}</td>
    <td><button class="iname" data-act="item" data-i="${i}">${esc(it.name||"Item")}${it.linked?`<span class="tag hb">Homebrew</span>`:""}${(it.mods||[]).length?`<span class="tag on">${(it.mods||[]).length} bonus${(it.mods||[]).length>1?"es":""}</span>`:""}</button><span class="isub">${esc((ITEM_TYPES.find(t=>t[0]===it.type)||[0,"Gear"])[1])}${it.type==="armor"?" · AC "+num(it.ac,10):""}${it.type==="shield"?" · shield":""}${it.type==="cyber"?" · strain "+num(it.strain):""}</span></td>
    <td style="width:70px">${can?inp(path,"inventory."+i+".qty",{type:"number",cls:"inp n",min:0}):num(e.qty,1)}</td>
    <td class="num" style="width:44px">${it.type==="cyber"?"—":num(it.enc)}</td>
    <td style="width:${can?"118":"10"}px;text-align:right;white-space:nowrap">${can&&it.type!=="cyber"?`<button class="btn sm ghost" data-act="store-toggle" data-i="${i}" title="${loc==="stored"?"Bring it with you (Stowed)":"Leave it on the ship or at home"}">${loc==="stored"?"Carry":"Store"}</button> `:""}${can?`<button class="iconbtn" data-act="inv-remove" data-i="${i}" aria-label="Remove ${esc(it.name)}">${S.confirm==="inv"+i?"!":"×"}</button>`:""}</td></tr>`};
  const group=f=>inv.map((e,i)=>({e,i})).filter(({e,i})=>f(R.items[i],e.location||"stowed"));
  const sect=(title,sub,list,empty,cls="")=>`<div class="invsec ${cls}"><div class="invh"><span class="lbl">${title}</span><span class="hint">${sub}</span></div>
    ${list.length?`<div class="tbl-wrap"><table><thead><tr><th>Ready</th><th>Item</th><th>Qty</th><th>Enc</th><th></th></tr></thead><tbody>${list.map(({e,i})=>row(e,i)).join("")}</tbody></table></div>`:`<p class="hint" style="margin:6px 0 0">${empty}</p>`}</div>`;
  const ready=group((it,l)=>it.type!=="cyber"&&l==="readied"),stow=group((it,l)=>it.type!=="cyber"&&l==="stowed"),stored=group((it,l)=>it.type!=="cyber"&&l==="stored"),cyber=group(it=>it.type==="cyber");
  const hb=hbPaths();
  return `${can?`<div class="sect" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <select id="hb-pick" class="inp" style="max-width:300px">${itemPickOpts("Add an item…")}</select>
      <button class="btn" data-act="inv-add-hb">Add</button><button class="btn ghost" data-act="inv-add-custom">+ Custom item</button></div>`:""}
    <div class="encstage s${R.encStage}" style="margin-bottom:10px"><b>${R.encLabel}</b><span>${R.encStage<3?"Move "+R.move+" m per round":"Too much to carry. Drop or store something."}</span></div>
    ${sect("Readied",`${R.readied} / ${R.readiedLimit} · worn, in hand, or instantly usable. These count for AC and bonuses.`,ready,"Nothing readied. Check an item below to ready it.",R.readied>R.readiedLimit?"over":"")}
    ${sect("Stowed",`${R.stowed} / ${R.stowedLimit} · packed away. Readying one takes a Main Action in combat.`,stow,"Nothing stowed.",R.stowed>R.stowedLimit?"over":"")}
    ${cyber.length?sect("Cyberware","installed, always active, no encumbrance",cyber,""):""}
    ${stored.length?sect("Stored","left on the ship or at home, not carried",stored,""):""}
    ${S.confirm&&S.confirm.startsWith("inv")?`<p class="hint" style="color:var(--bad)">Click the ! again to remove that item.</p>`:""}
    <p class="hint">Check the box to ready an item; uncheck it to stow it. <button class="hint" style="background:none;border:0;text-decoration:underline;cursor:help" data-act="rule" data-key="enc">Encumbrance rules</button> · <button class="hint" style="background:none;border:0;text-decoration:underline;cursor:help" data-act="rule" data-key="mods">How bonuses apply</button></p>`;
}

function focusSelectOpts(){
  const book=Object.entries(FOCI).map(([k,f])=>[k,f.name]);
  const hb=hbFociPaths().map(p=>["hb:"+p.split("/")[1],(S.docs[p].name||"Homebrew focus")+" (homebrew)"]);
  return [["","Custom (write it yourself)"],...book,...hb];
}
function renderFeatures(path,c,R,E){
  const foci=(c.foci||[]).map((e,j)=>{
    const f=resolveFocus(e);
    if(E){
      const def=e.key&&!e.key.startsWith("hb:")?FOCI[e.key]:null;
      return `<div class="feature"><div class="grid3" style="grid-template-columns:1fr 100px 30px;margin-bottom:6px">${sel(path,"foci."+j+".key",focusSelectOpts())}${sel(path,"foci."+j+".level",[[1,"Level 1"],[2,"Level 2"]])}<button class="iconbtn" data-act="focus-remove" data-j="${j}" aria-label="Remove focus">×</button></div>

function itemSummary(it){
